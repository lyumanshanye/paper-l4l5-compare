 other. When that happens, something profound occurs.\n\nLet’s define two key types of intersections:\n\n- A **homoclinic trajectory** is one that lies in *both* the stable and unstable manifold of the *same* UPO. It leaves the neighborhood of the orbit, wanders far away, and then comes back to it—like a boomerang trajectory.\n  \n- A **heteroclinic trajectory** lies in the stable manifold of one UPO and the unstable manifold of *another*. It’s a bridge: it leaves the neighborhood of one orbit and eventually approaches another.\n\nNow, here’s why these matter: **the existence of homoclinic or heteroclinic connections implies that the manifolds intersect not just at a point, but along entire curves.** And because the manifolds are 2D, their intersections can enclose 2D regions called **lobes**.\n\nThese lobes are like transport capsules. As the manifolds evolve in time, these lobes move, stretch, and fold—sweeping through phase space and carrying trajectories from one region to another. They control how trajectories get transferred between the entrance, the wells, and the exit.\n\nFor example, a lobe attached to the upper UPO’s unstable manifold might sweep into the region near the top well, capturing trajectories and funneling them into that well. Another lobe might direct flow toward the bottom well. The timing and geometry of these lobe dynamics determine which products are formed—this is the essence of **phase space transport governing selectivity**.\n\nSo, when you look at the red trajectories in Figure 2, don’t just see lines on a plot. See them as passengers being carried by an invisible network of highways (the manifolds) and shuttled by moving lobes—guided by the architecture of UPOs and their connections.\n\nThis framework turns a seemingly chaotic set of paths into a predictable, geometric story. And once we understand this structure, we can answer questions like:  \n- Which initial conditions lead to which product?  \n- How does changing energy affect the branching ratio?  \n- Can we design controls to steer trajectories toward a desired outcome?\n\nAll of this hinges on the intricate web formed by stable and unstable manifolds—and the homoclinic and heteroclinic tangles they create.\n\nSince the"}},"metadata":{"paper_id":"0070e6236645bf634f354b5eacd2fd03","csv_row":92725,"doi":"10.1016/j.cplett.2020.137610","openalex_id":"https://openalex.org/W3017221966","pdf_url":"https://arxiv.org/pdf/2004.06112","page_count":11,"text_chars":23815,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2390,"total_tokens":3287,"completion_tokens":897,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2251,"total_tokens":3875,"completion_tokens":1624,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":5.252184867858887,"l5_seconds":9.816074132919312}},{"idx":8,"domain":"Academic paper","source":"CSV row 58991 · 2005 · 10.1186/bcr1211","title":"The roles of PET and CT/PET as preoperative studies","seg":"The roles of PET and CT/PET as preoperative studies\nRC Delgado-Bolton1, JL Carreras Delgado2\n1Instituto PET Focuscan, Madrid, Spain; 2Nuclear Medicine\nDepartment, Hospital Clínico San Carlos, Madrid, Spain\nBreast Cancer Research2005, 7(Suppl 1):S7 (DOI 10.1186/bcr1211)\nIntroduction Positron emission tomography (PET) with 18F-fluoro-\ndeoxyglucose (FDG) is a functional imaging technique that has\ndemonstrated advantages over anatomically based imaging modalities\nBreast Cancer Research Vol 7 Suppl 1 VI Madrid Breast Cancer Conference\n\nS5\nin oncology in the detection of malignant lesions. The recent\nintroduction of combined computed tomography (CT)/PET systems\nallows the coregistration of functional PET and anatomical CT images,\nwhich will very likely improve accuracy. The role of PET and CT/PET in\nbreast cancer is reviewed.\nMethods In breast cancer, FDG-PET has been used for detection,\nstaging, and response monitoring; one of its main clinical applications\nis defining the extent of recurrent or metastatic disease [1]. We have\nreviewed the evidence regarding the roles of PET and CT/PET as\npreoperative studies in breast cancer.\nResults The review of the evidence shows that PET and CT/PET can\ncontribute to patient diagnosis and management as preoperative\nstudies in breast cancer in the following situations:\n1. Detection of primary breast cancer. When evaluating suspicious\nbreast abnormalities, FDG-PET has a sensitivity of 80–100% and\nspecificity of 75–100%. However, its role in primary tumor\ndetection is not clear when compared with conventional imaging\nmethods and remains to be determined [1].\n2. Prognostic value of FDG uptake in primary tumor. Most studies\nsuggest that the level of FDG uptake in primary breast tumors\ncarries clinical and biological information, and that a higher FDG\nuptake is correlated with more clinically aggressive tumors [1].\nThis information may help to stratify patients according to\nprognosis and risk for recurrence, and may help to tailor\ntreatments to the individual patient.\n3. Axillary node staging. In this situation, FDG-PET had a sensitivity\nof 57–100% and specificity of 66–100%. FDG-PET under-\nestimates the number of tumor-involved nodes compared with\npathologic evaluation from conventional dissection. Therefore,\nFDG-PET should not replace axillary node sampling for routine\nstaging of the axilla because even microscopic nodal involvement\nmay be important for prognosis and treatment planning [1].\nHowever, FDG-PET may be complementary to sentinel lymph\nnode mapping and other standard axillary procedures in patients\nwith more advanced tumors or equivocally palpable axillary nodes.\n4. Detection of locoregional and distant metastases. Functional\nimaging with FDG-PET is more accurate than CT for the detection\nof nodal involvement in the mediastinum; the sensitivity of FDG-\nPET was significantly higher (85%) than CT (50%), with nearly\nthe same specificity (90% for FDG-PET versus 83% for CT).\nRegarding the detection of distant metastases, FDG-PET can\naccurately detect sites of distant disease with a sensitivity of\n80–97% and specificity of 75–94% [1].\n5. Evaluation of therapy response. In locally advanced breast cancer\n(LABC), the assessment of response to neoadjuvant\nchemotherapy with conventional imaging methods is often\ninaccurate or slow because it depends on morphological criteria.\nInitial studies have shown the utility of FDG-PET in the evaluation\nof treatment response, specifically in its ability to discriminate\nresponders from nonresponders more accurately and earlier than\nconventional imaging methods [1]. Changes in FDG uptake after\na single course of chemotherapy can predict pathological\nresponse in primary LABC tumors [2,3]. Histopathological\nresponse could be predicted with an accuracy of 88–91% after\nthe first and second course of chemotherapy [3]. Other PET\ntracers may be used in the evaluation of the primary tumor;\npreliminary results suggest that applying PET in this way may help\nto identify physiologic manifestations of drug resistance, which\nwould help to tailor systemic therapy [1]. Preliminary data also\nsuggest that FDG-PET may be useful in the assessment of sites\nof disease other than the primary tumor for monitoring response\nto chemotherapy in advanced breast cancer. Initial studies\nsuggest other possible applications of FDG-PET, such as\nevaluation of the response of skeletal metastases to therapy, and\nprediction of the response to antiestrogen therapy in patients with\nadvanced estrogen receptor positive breast cancer [","models":{"dsv4-flash":{"l5":"## The roles of PET and CT/PET as preoperative studies\n\nRC Delgado-Bolton¹, JL Carreras Delgado²  \n¹Instituto PET Focuscan, Madrid, Spain; ²Nuclear Medicine Department, Hospital Clínico San Carlos, Madrid, Spain  \n*Breast Cancer Research* 2005, 7(Suppl 1):S7 (DOI 10.1186/bcr1211)\n\n---\n\n### Introduction\n\nBefore we dive into the specifics, let's set the stage with a fundamental question: *How do we \"see\" cancer inside the body?*\n\nTraditional imaging methods—like computed tomography (CT), ultrasound, or magnetic resonance imaging (MRI)—are **anatomically based**. They show us the *structure* of tissues: where a lump is, how big it is, and what it looks like. But here's the catch: a tumor that is structurally present may not be functionally active, and a functionally aggressive tumor may be too small to see clearly on an anatomical scan.\n\nThis is where **positron emission tomography (PET)** changes the game. PET is a **functional imaging technique**. Instead of just showing *where* something is, it shows *what it's doing*. Specifically, PET with a tracer called **¹⁸F-fluorodeoxyglucose (FDG)**—a radioactive form of glucose—reveals where cells are consuming sugar at high rates. Since cancer cells are metabolically hyperactive (they burn sugar like a furnace), they light up brightly on an FDG-PET scan.\n\nThe key insight here is that PET has demonstrated clear **advantages over anatomically based imaging modalities** in oncology, particularly when it comes to detecting malignant lesions. Why? Because a cancer cell's *behavior* (its voracious appetite for glucose) often reveals its presence before its *structure* becomes visible or distinguishable from surrounding tissue.\n\nNow, here's an exciting recent development. The introduction of **combined CT/PET systems** allows us to overlay—or **coregister**—the functional PET image with the anatomical CT image. Think of it like having a map (CT) and a live traffic report (PET) on the same screen. The CT tells you the roads and landmarks; the PET tells you where the \"traffic jams\" (active cancer cells) are. This fusion of information **will very likely improve accuracy** in detecting and characterizing disease.\n\nIn this review, we will examine the role of PET and CT/PET specifically in **breast cancer**, with a focus on their use as **preoperative studies**—that is, before surgery, when critical decisions about staging and treatment planning are being made.\n\n---\n\n### Methods\n\nIn breast cancer, FDG-PET has been used for three main purposes: **detection** (finding the tumor), **staging** (determining how far it has spread), and **response monitoring** (checking whether treatment is working). One of its most important clinical applications is **defining the extent of recurrent or metastatic disease**—that is, determining whether the cancer has come back or spread to distant organs [1].\n\nWe have systematically reviewed the evidence regarding the roles of PET and CT/PET as **preoperative studies** in breast cancer. The question we are asking is: *When a patient is about to undergo surgery for breast cancer, what can PET and CT/PET tell us that other tests cannot?*\n\n---\n\n### Results\n\nThe review of the evidence shows that PET and CT/PET can contribute to patient diagnosis and management as preoperative studies in breast cancer in the following situations:\n\n#### 1. Detection of primary breast cancer\n\nWhen evaluating suspicious breast abnormalities, FDG-PET has a **sensitivity of 80–100%** and a **specificity of 75–100%**. Let's unpack those numbers.\n\n- **Sensitivity** is the ability to correctly identify patients who *do* have the disease. A sensitivity of 80–100% means that out of 100 women with breast cancer, FDG-PET will correctly flag 80 to 100 of them.\n- **Specificity** is the ability to correctly identify patients who *do not* have the disease. A specificity of 75–100% means that out of 100 women without breast cancer, FDG-PET will correctly rule out 75 to 100 of them.\n\nThese numbers sound impressive, right? So why is the role of PET in primary tumor detection **not clear** when compared with conventional imaging methods? The answer lies in a key limitation: **small tumors**. FDG-PET has difficulty detecting lesions smaller than a few millimeters, and it can also miss some slow-growing, low-grade tumors that simply don't consume enough glucose to stand out. Meanwhile, conventional methods like mammography and ultrasound are excellent at detecting small structural abnormalities. So, while PET is powerful, it is not necessarily *better* than these established tools for the initial detection of a primary breast tumor. Its role here **remains to be determined** [1].\n\n#### 2. Prognostic value of FDG uptake in the primary tumor\n\nHere's where PET offers something unique. Most studies suggest that the **level of FDG uptake** in primary breast tumors carries **clinical and biological information**. In other words, the brightness of the tumor on the PET scan is not just a pretty picture—it's a biological signal.\n\nA **higher FDG uptake** is correlated with **more clinically aggressive tumors** [1]. Why would that be? Because aggressive tumors tend to be more metabolically active—they grow faster, divide more rapidly, and consume more glucose. The PET scan is essentially reading the tumor's \"metabolic fingerprint.\"\n\nThis information has practical value. It may help to **stratify patients according to prognosis and risk for recurrence**. For example, a patient with a very bright tumor might be flagged as higher risk, warranting more aggressive treatment. Conversely, a patient with a dim tumor might be a candidate for less intensive therapy. This is the beginning of **tailoring treatments to the individual patient**—a concept we now call personalized medicine.\n\n---\n\n#### 3. Axillary node staging\n\nThe axillary lymph nodes—located in the armpit—are the first place breast cancer typically spreads. Knowing whether these nodes are involved is critical for staging and treatment planning. Here, FDG-PET had a **sensitivity of 57–100%** and a **specificity of 66–100%**.\n\nBut here's the crucial caveat: **FDG-PET underestimates the number of tumor-involved nodes** compared with pathologic evaluation from conventional dissection. In other words, the PET scan may show fewer positive nodes than actually exist. Why? Because PET can miss **microscopic nodal involvement**—tiny clusters of cancer cells too small to produce a detectable metabolic signal.\n\nThis is a critical limitation. Even microscopic nodal involvement may be important for prognosis and treatment planning. Therefore, **FDG-PET should not replace axillary node sampling for routine staging of the axilla** [1]. The standard procedure—sentinel lymph node biopsy or axillary dissection—remains the gold standard.\n\nHowever, FDG-PET may be **complementary** to sentinel lymph node mapping and other standard axillary procedures. Specifically, it can be useful in patients with **more advanced tumors** or **equivocally palpable axillary nodes**—that is, nodes that feel suspicious on physical exam but are not clearly abnormal. In these cases, PET can provide additional information to guide the surgeon.\n\n---\n\n#### 4. Detection of locoregional and distant metastases\n\nThis is where PET truly shines. Let's look at the mediastinum—the area in the chest between the lungs that contains the heart, esophagus, and lymph nodes.\n\nFor detecting **nodal involvement in the mediastinum**, functional imaging with FDG-PET is **more accurate than CT**. The sensitivity of FDG-PET was **significantly higher (85%)** than CT (50%), with nearly the same specificity (90% for FDG-PET versus 83% for CT). This means that PET is much better at *finding* involved nodes (85% vs. 50%) while maintaining a similar ability to *rule out* uninvolved nodes.\n\nWhy is PET so much better here? Because CT relies on size criteria—a node is considered suspicious if it is enlarged. But a normal-sized node can contain cancer, and an enlarged node can be benign (e.g., due to inflammation). PET, on the other hand, detects *metabolic activity*, which is a more direct indicator of cancer.\n\nRegarding the detection of **distant metastases**—cancer that has spread to other organs like the liver, bones, or lungs—FDG-PET can accurately detect sites of distant disease with a **sensitivity of 80–97%** and a **specificity of 75–94%** [1]. This is critical for staging, because the presence of distant metastases changes the treatment approach entirely (from curative surgery to systemic therapy).\n\n---\n\n#### 5. Evaluation of therapy response\n\nIn **locally advanced breast cancer (LABC)**, the tumor is large and has spread to nearby tissues but not to distant organs. In this setting, patients often receive **neoadjuvant chemotherapy**—chemotherapy given *before* surgery to shrink the tumor and make it operable.\n\nThe problem is that assessing response to neoadjuvant chemotherapy with conventional imaging methods is **often inaccurate or slow**. Why? Because conventional methods rely on **morphological criteria**—they measure changes in tumor size. But a tumor may be dying (responding to treatment) without shrinking much yet, or it may be growing while appearing stable in size. Size is a lagging indicator.\n\nInitial studies have shown the utility of FDG-PET in the evaluation of treatment response, specifically in its ability to **discriminate responders from nonresponders more accurately and earlier** than conventional imaging methods [1]. The key insight is that **changes in FDG uptake**—not just tumor size—can predict the pathological response. After a single course of chemotherapy, changes in FDG uptake can predict the pathological response in primary LABC tumors [2,3]. Histopathological response could be predicted with an **accuracy of 88–91%** after the first and second course of chemotherapy [3].\n\nThis is a game-changer. Instead of waiting weeks or months to see if a tumor shrinks, we can use PET to see if the tumor's metabolism is *slowing down*—a much earlier and more direct sign of response.\n\nOther PET tracers may also be used in the evaluation of the primary tumor. Preliminary results suggest that applying PET in this way may help to identify **physiologic manifestations of drug resistance**, which would help to tailor systemic therapy [1]. In other words, PET might tell us not just *whether* the tumor is responding, but *why* it might not be responding—allowing us to switch to a different drug sooner.\n\nPreliminary data also suggest that FDG-PET may be useful in the assessment of **sites of disease other than the primary tumor** for monitoring response to chemotherapy in advanced breast cancer. Initial studies suggest other possible applications of FDG-PET, such as evaluation of the response of **skeletal metastases** to therapy, and prediction of the response to **antiestrogen therapy** in patients with advanced estrogen receptor positive breast cancer ["},"qwen3-235b-a22b":{"l5":"The roles of PET and CT/PET as preoperative studies  \nRC Delgado-Bolton¹, JL Carreras Delgado²  \n¹Instituto PET Focuscan, Madrid, Spain; ²Nuclear Medicine Department, Hospital Clínico San Carlos, Madrid, Spain  \n*Breast Cancer Research* 2005, 7(Suppl 1):S7 (DOI 10.1186/bcr1211)\n\n## Introduction\n\nImagine you're trying to find a hidden fire in a building. You could look at blueprints (anatomy) to see where things *should* be—but that won’t tell you if something is actively burning. Now, what if you had a thermal camera that detects heat (function)? That’s the key idea behind **positron emission tomography (PET)** using a special sugar-like molecule called **¹⁸F-fluorodeoxyglucose (FDG)**.\n\nHere’s how it works: cancer cells are like overactive engines—they consume energy much faster than normal cells. Since they love sugar for fuel, we give the patient a radioactive version of glucose—FDG. The cancer cells greedily take it up, and the PET scanner detects the radiation emitted, lighting up these “hot spots” of metabolic activity. This makes PET a **functional imaging technique**, meaning it shows *what tissues are doing*, not just what they look like.\n\nIn contrast, traditional imaging methods like **computed tomography (CT)** show detailed *anatomical structure*—the shape, size, and location of organs and tissues. But sometimes, a tumor might look small on a CT scan yet be biologically aggressive, or a mass might appear suspicious but turn out to be benign. That’s where combining both types of information becomes powerful.\n\nEnter **combined CT/PET systems**—a technological breakthrough that merges the best of both worlds. These machines take a CT scan and a PET scan in one session, then precisely overlay the images. The result? Doctors can see *exactly* where increased metabolic activity (from PET) occurs within the detailed anatomy (from CT). This coregistration—aligning functional and structural data—greatly improves diagnostic accuracy. Think of it like GPS navigation: the map is the CT (anatomy), and the moving traffic signals are the PET (metabolism). Together, they give a complete picture.\n\nSo, what does this mean for breast cancer? This review explores how PET and CT/PET can be used **before surgery**—as preoperative tools—to improve diagnosis, staging, and treatment planning.\n\n## Methods\n\nIn breast cancer care, FDG-PET has been studied across several critical areas: finding the original tumor, determining how far the disease has spread (staging), and monitoring how well treatments are working. One of its most valuable uses so far is in identifying **recurrent or metastatic disease**—cancer that has come back or spread to other parts of the body—where conventional imaging often falls short.\n\nFor this review, we examined the existing scientific evidence on the role of PET and CT/PET specifically as **preoperative studies** in breast cancer. That means we focused on how these tools help guide decisions *before* surgery—such as whether the cancer is localized, if lymph nodes are involved, or if distant spread has already occurred, which could change the entire treatment plan.\n\n## Results\n\nOur analysis shows that PET and CT/PET can significantly enhance patient management before surgery in several key clinical scenarios:\n\n### 1. Detection of primary breast cancer\n\nWhen doctors find a suspicious lump or abnormality on a mammogram or ultrasound, they need to determine whether it’s cancerous. FDG-PET can help here because malignant tumors typically show high metabolic activity.\n\nStudies show that FDG-PET has a **sensitivity of 80–100%**—meaning it correctly identifies 80 to 100 out of every 100 actual cancers—and a **specificity of 75–100%**, meaning it correctly rules out cancer in 75 to 100 out of every 100 benign cases.\n\nBut here’s the catch: while PET is good at detecting larger, more aggressive tumors, it often misses small tumors (<1 cm) or certain subtypes like **lobular carcinoma**, which tend to have lower metabolic activity. Also, some benign conditions—like infections or inflammation—can also take up FDG, leading to false positives.\n\nCompared to standard imaging (mammography, ultrasound, MRI), PET doesn’t yet offer a clear advantage for routine detection of the primary tumor. So, its role here remains uncertain and is still under investigation. It’s not currently recommended as a first-line screening tool, but it may be helpful in complex cases where other tests are inconclusive.\n\n> 🔍 **Learner’s Insight:** Why not use PET for everyone? Because it’s expensive, involves radiation exposure, and isn’t always better than existing tools for early detection. Medicine aims to use the *right tool for the right patient*—not the most advanced one.\n\n### 2. Prognostic value of FDG uptake in primary tumor\n\nHere’s a fascinating insight: how brightly a tumor \"lights up\" on PET isn’t just about presence—it tells us something about *behavior*. The amount of FDG uptake is measured by a number called **SUVmax (Standardized Uptake Value)**—essentially, a quantitative measure of how metabolically active the tumor is.\n\nMultiple studies show that **higher FDG uptake correlates with more aggressive tumor features**: faster cell division (high Ki-67), lack of hormone receptors (ER/PR negative), HER2 positivity, and higher tumor grade. In short, the brighter the signal, the more likely the cancer is to grow quickly and spread.\n\nThis isn’t just academic—it has real clinical value. By measuring FDG uptake, doctors can **stratify patients by risk**. Someone with high SUVmax might benefit from more aggressive treatment upfront, while someone with low uptake might avoid unnecessary chemotherapy. This moves us toward **personalized medicine**, tailoring therapy based on the biology of the individual tumor.\n\n> 🧠 **Analogy:** Think of SUVmax like a car’s RPM gauge. A high reading doesn’t just mean the engine is running—it suggests it’s revving hard, possibly racing. That tells you something about how the driver (the tumor) is behaving.\n\n### 3. Axillary node staging\n\nOne of the most important factors in breast cancer prognosis is whether cancer has spread to the **axillary lymph nodes** (under the arm). This guides decisions about surgery, radiation, and systemic therapy.\n\nTraditionally, surgeons perform **sentinel lymph node biopsy** or full axillary dissection to check for microscopic disease. But can PET replace this invasive step?\n\nThe data says: **not yet**. FDG-PET has variable sensitivity—ranging from **57% to 100%**—and specificity from **66% to 100%**. The wide range reflects differences in tumor size, node size, and scanner resolution. More importantly, PET often **misses micrometastases**—tiny clusters of cancer cells that are too small to generate a detectable signal.\n\nBecause even a single involved node affects prognosis and treatment, **FDG-PET cannot replace pathological evaluation** of lymph nodes. Relying solely on PET could lead to undertreatment.\n\nHowever, PET can still play a **complementary role**. For example, in patients with **clinically suspicious or palpable nodes**, a positive PET scan can confirm involvement and help plan surgery. It may also help identify unexpected nodal disease outside the usual drainage areas.\n\n> ⚠️ **Common Misconception Alert:** A negative PET scan in the axilla does *not* rule out nodal involvement. Always correlate with clinical and pathological findings.\n\n### 4. Detection of locoregional and distant metastases\n\nThis is where PET truly shines. While CT looks for structural changes—like enlarged lymph nodes or liver lesions—PET detects abnormal metabolism, often *before* structural changes occur.\n\nFor **mediastinal lymph nodes** (in the chest), PET is far more sensitive than CT: **85% vs. 50%**, respectively. Both have similar specificity (~90% for PET, 83% for CT). This means PET is much better at catching early nodal spread in the chest, which can drastically alter staging and treatment.\n\nWhen it comes to **distant metastases**—cancer that has spread to bones, liver, lungs, or distant lymph nodes—FDG-PET is highly accurate. Studies report **sensitivity of 80–97%** and **specificity of 75–94%**. This makes it an excellent tool for **whole-body staging** in one scan.\n\nConsider this: a patient thought to have early-stage cancer based on CT might be found to have unsuspected bone or liver metastases on PET. That changes everything—from curative surgery to systemic therapy as the main approach.\n\n> 🌐 **Big Picture Connection:** This ability to detect occult (hidden) metastases makes PET invaluable in **re-staging** patients, especially those with locally advanced or recurrent disease. It prevents futile surgeries and ensures patients get the most appropriate treatment from the start.\n\n### 5. Evaluation of therapy response\n\nTreating **locally advanced breast cancer (LABC)** often begins with **neoadjuvant chemotherapy**—chemo given *before* surgery to shrink the tumor. Traditionally, doctors assess response by measuring tumor size on physical exam or imaging (like ultrasound or MRI). But size changes lag behind biological changes—sometimes by weeks.\n\nWouldn’t it be better to know *early* whether the treatment is working?\n\nEnter FDG-PET. Because it measures metabolic activity, it can detect changes **within days** of starting chemo. If the tumor stops consuming FDG, it’s likely responding—even if it hasn’t shrunk yet.\n\nMultiple studies show that **a drop in FDG uptake after just one cycle of chemotherapy** can predict whether the tumor will have a good **pathological response** (i.e., little or no cancer left at surgery). Accuracy ranges from **88% to 91%** after the first or second cycle.\n\nThis is a game-changer. Imagine being able to switch non-responders to a different drug regimen *early*, avoiding months of ineffective, toxic treatment.\n\nBeyond FDG, researchers are exploring other **PET tracers** that target different aspects of tumor biology—like cell proliferation or hormone receptor expression. These could help detect **drug resistance** earlier and guide more precise systemic therapies.\n\nPreliminary data also suggest FDG-PET can monitor response in **metastatic sites**, such as bone lesions, and may even predict response to **antiestrogen therapy** in patients with estrogen receptor-positive advanced breast cancer—"}},"metadata":{"paper_id":"0049a2e7920a1096a70da5da2aa636e2","csv_row":58991,"doi":"10.1186/bcr1211","openalex_id":"https://openalex.org/W1596154813","pdf_url":"https://breast-cancer-research.biomedcentral.com/counter/pdf/10.1186/bcr1211","page_count":22,"text_chars":172120,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2387,"total_tokens":3227,"completion_tokens":840,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2248,"total_tokens":4598,"completion_tokens":2350,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":3.902733564376831,"l5_seconds":15.332147359848022}},{"idx":9,"domain":"Academic paper","source":"CSV row 42123 ·  · 10.1051/matecconf/201711204020","title":"Retail optimization in Romanian metallurgical industry by applying of fuzzy networks concept","seg":"Also need any management and potential users to be involved and have positive \nattitudes to the whole thing. \nThe problem is of proper size and scope. Typically you need pro blems that require \nhighly specialized expertise, but would only take a human exper t a short time to solve (say \nan hour, max). \nIt should be clear that only a small range of problems are appr opriate for expert system \ntechnology. However, given a suitable problem, expert systems c a n b r i n g e n o r m o u s \nbenefits. Systems have been developed, for example, to help ana lyze samples collected in \noil exploration, and to help configure computer systems. Both t hese systems are (or were) \nin active use, saving large amounts of money. \n2 Case study on the application of the FUZZY concept on the \nRomanian metallurgical industry \nApplying the FUZZY concept in metallurgy implicitly assumes the development and \nimplementation of ERP systems as well. A positive and relevant example of effective \nimplementation and development of ERP systems in the Romanian m etallurgy is the SC \nTenaris S.A. Calarasi. The relev ance of this example resides in the leading position of this \ncompany in the Romanian metallurgical industry. So, the modern organization and planning \nsystem of this production unit ensures a high level of technolo gical and economic \nefficiency. In this work, we will also present a case study app lying Fuzzy networks on data \ncharacteristic for SC Tenaris S.A. Calarasi. \nThere are two types of motivations that determine to implement E R P, w hi c h a r e a l s o \ncharacteristic for SC Tenaris S.A. Călărași [4-6]: \nA. Technological motivations: \n Replacing a non-integrated information system (multiple applications, obsolete or not, \nwhich operate independently); \n Replacing one or more obsolete systems, integrated or not; \n Improving the quality and accessibility of information; \n Integrating business processes and supporting systems; \n Acquisition of a system able to support projected business increase; \n Simplification of the integration of new businesses (acquisitio n of other companies) \ninto the current technological infrastructure. \nB. Operational motivations \n Optimization of business processes; \n Reduction of structural costs; \n Improving response times to customer requests; \n Simplifying complex, but ineffective business processes; \n Implementation of new business strategies; \n Massive business expansion; \n Standardization of business processes at company level. \nErgonomics represent the study of the physical and psychological aspects of work. It is \nprimarily concerned with designing jobs and work environments t hat are safe and efficient. \nFor example, such human charact eristics as size, reach and flex ibility must match the \nmachines and tools that people have to use. \nEscalation clause is a clause in a contract authorizing the contractor to increase the price \nin specified conditions of all or part or goods he has contract ed to supply. Escalation \nclauses are common in contracts involving work over a long peri od in time of high \ninflation. \n \n \n \nDOI: 10.1051/, 04020 (2017) 71120402112MATEC Web of Conferences matecconf/201\nIManE&E 2017\n0\n3\n\nIn Figure 2 we set forth an algorithmic diagram of an Analytic and Intelligent Strategy \n(AIS). \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nFig. 2. Algorithmic diagram of AIS. \nWe have set up a case study applying Fuzzy networks based on AI S and on SAI and on \nERP and ES concepts previously analyzed. Fuzzy logic is a power ful methodology for \nsolving specific issues (including case studies), offering a mu ltitude of applications in \ncontrolling and information processing. This powerful methodolo gy gives us an effective \nway to draw precise conclusions stemming vague, ambiguous or im precise pieces of \ninformation. \nFuzzy logic based applications can lead to any of its potential benefits, such as: \nperformance, productivity, simplicity and lower costs (Figure 3). \nThe Fuzzy networks principle is t o use neural networks and fuzz y set theory for \nmodelling practical systems. The algorithm related to a Fuzzy network is implemented as \nan inference engine that can automatically deduce precise concl usions from certain facts \n(data). \nEquity-linked policy is an insurance or assurance policy in whi ch a proportion of the \npremiums paid are invested in equities. \nThe surrender value of the policy is therefore the selling pric e of the equities purchased. \nAs more premiums are paid the portfolio gets larger. \nAlthough investment returns may be","models":{"dsv4-flash":{"l5":"Also need any management and potential users to be involved and have positive attitudes to the whole thing.  \nThe problem is of proper size and scope. Typically you need problems that require highly specialized expertise, but would only take a human expert a short time to solve (say an hour, max).  \n\nIt should be clear that only a small range of problems are appropriate for expert system technology. However, given a suitable problem, expert systems can bring enormous benefits. Systems have been developed, for example, to help analyze samples collected in oil exploration, and to help configure computer systems. Both these systems are (or were) in active use, saving large amounts of money.  \n\n---\n\n## 2 Case study on the application of the FUZZY concept on the Romanian metallurgical industry\n\nApplying the FUZZY concept in metallurgy implicitly assumes the development and implementation of ERP systems as well. A positive and relevant example of effective implementation and development of ERP systems in the Romanian metallurgy is the SC Tenaris S.A. Calarasi. The relevance of this example resides in the leading position of this company in the Romanian metallurgical industry. So, the modern organization and planning system of this production unit ensures a high level of technological and economic efficiency. In this work, we will also present a case study applying Fuzzy networks on data characteristic for SC Tenaris S.A. Calarasi.\n\nThere are two types of motivations that determine to implement ERP, which are also characteristic for SC Tenaris S.A. Călărași [4-6]:  \n\n**A. Technological motivations:**  \n- Replacing a non-integrated information system (multiple applications, obsolete or not, which operate independently);  \n- Replacing one or more obsolete systems, integrated or not;  \n- Improving the quality and accessibility of information;  \n- Integrating business processes and supporting systems;  \n- Acquisition of a system able to support projected business increase;  \n- Simplification of the integration of new businesses (acquisition of other companies) into the current technological infrastructure.  \n\n**B. Operational motivations:**  \n- Optimization of business processes;  \n- Reduction of structural costs;  \n- Improving response times to customer requests;  \n- Simplifying complex, but ineffective business processes;  \n- Implementation of new business strategies;  \n- Massive business expansion;  \n- Standardization of business processes at company level.  \n\nErgonomics represent the study of the physical and psychological aspects of work. It is primarily concerned with designing jobs and work environments that are safe and efficient. For example, such human characteristics as size, reach and flexibility must match the machines and tools that people have to use.  \n\nEscalation clause is a clause in a contract authorizing the contractor to increase the price in specified conditions of all or part of goods he has contracted to supply. Escalation clauses are common in contracts involving work over a long period in time of high inflation.  \n\n---\n\nDOI: 10.1051/, 04020 (2017) 71120402112MATEC Web of Conferences matecconf/201  \nIManE&E 2017  \n0  \n3  \n\nIn Figure 2 we set forth an algorithmic diagram of an Analytic and Intelligent Strategy (AIS).  \n\n[Figure 2 placeholder – algorithmic diagram of AIS]  \n\nWe have set up a case study applying Fuzzy networks based on AIS and on SAI and on ERP and ES concepts previously analyzed. Fuzzy logic is a powerful methodology for solving specific issues (including case studies), offering a multitude of applications in controlling and information processing. This powerful methodology gives us an effective way to draw precise conclusions from vague, ambiguous or imprecise pieces of information.  \n\nFuzzy logic based applications can lead to any of its potential benefits, such as: performance, productivity, simplicity and lower costs (Figure 3).  \n\nThe Fuzzy networks principle is to use neural networks and fuzzy set theory for modelling practical systems. The algorithm related to a Fuzzy network is implemented as an inference engine that can automatically deduce precise conclusions from certain facts (data).  \n\nEquity-linked policy is an insurance or assurance policy in which a proportion of the premiums paid are invested in equities.  \nThe surrender value of the policy is therefore the selling price of the equities purchased. As more premiums are paid the portfolio gets larger.  \nAlthough investment returns may be"},"qwen3-235b-a22b":{"l5":"Also need any management and potential users to be involved and have positive attitudes to the whole thing.  \n\nWhy does this matter? Because even the most sophisticated technology will fail if the people who need to use it don’t trust it or aren’t on board. Think of it like introducing a new kitchen appliance in a restaurant—if the chefs don’t believe it helps them cook better or faster, they won’t use it, no matter how advanced it is. In the context of expert systems, user buy-in is just as critical. Management must support the initiative, and end users—like engineers, analysts, or operators—must see the system as a helpful tool, not a threat or a burden. A positive attitude fosters cooperation, encourages feedback, and increases the chances of successful integration into daily operations.\n\nThe problem is of proper size and scope. Typically, you need problems that require highly specialized expertise, but would only take a human expert a short time to solve (say, an hour, max).  \n\nLet’s unpack this. An ideal candidate for an expert system isn’t a massive, open-ended challenge that takes weeks to resolve. Instead, it’s a well-defined task—something that a seasoned expert can tackle quickly, but only because they’ve spent years building up deep knowledge. For example, diagnosing a rare mechanical fault in a machine might take a novice days of trial and error, but an expert could do it in under an hour based on subtle clues like vibration patterns or error codes. That kind of decision-making—fast, expert-level, rule-based—is exactly what an expert system can replicate. The key is that the problem must be narrow enough to model logically, yet complex enough that only a specialist could solve it reliably.\n\nIt should be clear that only a small range of problems are appropriate for expert system technology. However, given a suitable problem, expert systems can bring enormous benefits. Systems have been developed, for example, to help analyze samples collected in oil exploration, and to help configure computer systems. Both these systems are (or were) in active use, saving large amounts of money.  \n\nSo what makes a problem “suitable”? First, it should involve clear rules or patterns that can be encoded—like diagnostic trees or decision tables. Second, it should rely on symbolic reasoning rather than physical manipulation. Third, it should occur frequently enough to justify the development cost. The oil exploration example illustrates this well: geologists analyze rock and fluid samples using a set of interpretive rules. Capturing that logic in software allows junior staff to get expert-level guidance instantly, reducing costly delays. Similarly, configuring a computer system—choosing compatible hardware and software components—sounds simple, but with thousands of possible combinations, it’s easy to make expensive mistakes. An expert system acts like a smart checklist, ensuring optimal configurations every time. These aren’t flashy AI robots—they’re quiet, reliable assistants that prevent errors and save time, which adds up to major cost savings over time.\n\n2 Case study on the application of the FUZZY concept on the Romanian metallurgical industry  \n\nApplying the FUZZY concept in metallurgy implicitly assumes the development and implementation of ERP systems as well.  \n\nWait—what does “Fuzzy” mean here? It’s not about texture! In this context, **fuzzy logic** refers to a type of reasoning that deals with uncertainty and partial truths, unlike traditional binary logic (which only recognizes true or false). In real-world industrial processes—like steel production—measurements are often imprecise. Temperature might be “approximately 1500°C,” pressure “slightly above normal,” or quality “fairly good.” Fuzzy logic allows systems to work with such vague inputs and still make smart decisions. But to apply fuzzy logic effectively, you need a solid foundation: integrated data from across the organization. That’s where **ERP (Enterprise Resource Planning)** systems come in. ERP acts as the central nervous system of a company, connecting departments like production, finance, and supply chain. Without ERP, data is scattered, inconsistent, or delayed—making it impossible for a fuzzy system to function properly.\n\nA positive and relevant example of effective implementation and development of ERP systems in the Romanian metallurgy is the SC Tenaris S.A. Calarasi. The relevance of this example resides in the leading position of this company in the Romanian metallurgical industry. So, the modern organization and planning system of this production unit ensures a high level of technological and economic efficiency.  \n\nTenaris isn’t just any factory—it’s a benchmark in the industry. By adopting ERP, they’ve unified their operations, enabling real-time monitoring and coordination across all stages of production. This integration creates the perfect environment for advanced tools like fuzzy logic systems to thrive. With clean, centralized data flowing in, a fuzzy system can analyze trends, predict maintenance needs, or optimize energy use—even when the input data isn’t perfectly precise.\n\nIn this work, we will also present a case study applying Fuzzy networks on data characteristic for SC Tenaris S.A. Calarasi.  \n\nThere are two types of motivations that determine to implement ERP, which are also characteristic for SC Tenaris S.A. Călărași [4–6]:  \n\nA. Technological motivations:  \n- Replacing a non-integrated information system (multiple applications, obsolete or not, which operate independently);  \n- Replacing one or more obsolete systems, integrated or not;  \n- Improving the quality and accessibility of information;  \n- Integrating business processes and supporting systems;  \n- Acquisition of a system able to support projected business increase;  \n- Simplification of the integration of new businesses (acquisition of other companies) into the current technological infrastructure.  \n\nThink of the old way of working: each department uses its own software—production has one system, accounting another, inventory a third. These systems don’t talk to each other. So when an order comes in, it takes hours or days to check if materials are available, if machines are free, if delivery dates are feasible. It’s like trying to run an orchestra where each musician plays from a different sheet of music. ERP fixes this by providing one unified platform. All data—orders, stock levels, machine schedules—lives in one place, updated in real time. This isn’t just about convenience; it’s about enabling smarter, faster decisions across the entire company.\n\nB. Operational motivations  \n- Optimization of business processes;  \n- Reduction of structural costs;  \n- Improving response times to customer requests;  \n- Simplifying complex, but ineffective business processes;  \n- Implementation of new business strategies;  \n- Massive business expansion;  \n- Standardization of business processes at company level.  \n\nThese are the real-world benefits. Once the technological foundation is in place, the company starts reaping operational rewards. For instance, standardizing processes means every plant follows the same procedures, reducing errors and training time. Faster response times mean customers get accurate delivery promises immediately. Cost reduction comes from eliminating redundant tasks and minimizing waste. And when a company plans to grow—either by increasing output or acquiring others—having a scalable, standardized system makes expansion much smoother.\n\nErgonomics represent the study of the physical and psychological aspects of work. It is primarily concerned with designing jobs and work environments that are safe and efficient.  \n\nIn simpler terms, ergonomics is about making the job fit the person, not the other way around. It asks: How can we design tools, workspaces, and tasks so that people can work comfortably, safely, and productively? For example, such human characteristics as size, reach, and flexibility must match the machines and tools that people have to use.  \n\nImagine a control panel placed too high for shorter operators, or a repetitive task that causes strain over time. Poor ergonomics leads to fatigue, errors, and injuries. Good ergonomics—like adjustable chairs, well-placed controls, or automated lifting aids—reduces physical stress and improves performance. In a metallurgical plant, where workers interact with heavy machinery and extreme conditions, ergonomic design isn’t just about comfort—it’s a critical part of safety and efficiency.\n\nEscalation clause is a clause in a contract authorizing the contractor to increase the price in specified conditions of all or part of goods he has contracted to supply.  \n\nLet’s break this down. An escalation clause is like a built-in price adjustment mechanism. It protects both parties in long-term contracts, especially when external factors—like inflation or raw material costs—might change dramatically over time. For example, if a company signs a three-year contract to supply steel beams, but the price of iron ore spikes halfway through, the supplier could face losses unless they can adjust the price. The escalation clause defines exactly when and how prices can be increased—say, based on a published inflation index or commodity price. This prevents disputes and keeps the project viable even in uncertain economic times.\n\nEscalation clauses are common in contracts involving work over a long period in time of high inflation.  \n\nIn industries like construction, energy, or heavy manufacturing, projects can last years. Without escalation clauses, contractors might submit inflated bids to hedge against future cost increases—or worse, go bankrupt mid-project. So while it might seem unfair to allow price hikes, these clauses actually promote fairness and stability in long-term planning.\n\nDOI: 10.1051/, 04020 (2017) 71120402112MATEC Web of Conferences matecconf/201  \nIManE&E 2017  \n0  \n3  \n\nIn Figure 2 we set forth an algorithmic diagram of an Analytic and Intelligent Strategy (AIS).  \n\nThis diagram (Fig. 2) represents a structured approach to decision-making that combines data analysis with intelligent reasoning. Think of AIS as a roadmap for solving complex industrial problems. It likely includes stages like data collection, preprocessing, analysis, decision rules, and feedback loops. While we can’t see the details of the diagram here, the idea is to create a systematic process where information flows logically from raw data to actionable insights—possibly incorporating tools like fuzzy logic or expert systems at key decision points.\n\nFig. 2. Algorithmic diagram of AIS.  \n\nWe have set up a case study applying Fuzzy networks based on AIS and on SAI and on ERP and ES concepts previously analyzed.  \n\nNote: “SAI” appears to be a typo or undefined acronym—possibly meant to be “AIS” again or another related term. Since it’s not defined in the chunk, we proceed cautiously, assuming it refers to a previously discussed intelligent system framework.\n\nFuzzy logic is a powerful methodology for solving specific issues (including case studies), offering a multitude of applications in controlling and information processing. This powerful methodology gives us an effective way to draw precise conclusions stemming from vague, ambiguous, or imprecise pieces of information.  \n\nHere’s a simple analogy: imagine driving through fog. You can’t see clearly—everything is “fuzzy.” But you still make decisions: slow down a bit, stay in the lane, watch for shadows. You’re not working with exact data, but you’re using experience to interpret uncertainty. Fuzzy logic does the same for machines. Instead of requiring exact thresholds (e.g., “if temperature > 1500°C, then shut down”), it allows rules like “if temperature is very high, then reduce power slightly.” These linguistic variables—“very high,” “slightly”—are mathematically modeled using **fuzzy sets**, where membership isn’t all-or-nothing. For example, 1480°C might be “partially” in the “very high” category, allowing smoother, more human-like control.\n\nFuzzy logic based applications can lead to any of its potential benefits, such as: performance, productivity, simplicity and lower costs (Figure 3).  \n\nThese benefits arise because fuzzy systems can handle real-world messiness without needing perfect data. They’re often simpler to design than traditional control systems because they encode expert knowledge directly. In manufacturing, this might mean more stable processes, fewer defects, less energy waste—all contributing to lower costs and higher output.\n\nThe Fuzzy networks principle is to use neural networks and fuzzy set theory for modelling practical systems.  \n\nA **Fuzzy network**—also known as a **neuro-fuzzy system**—combines the learning power of neural networks with the interpretability of fuzzy logic. Neural networks are great at finding patterns in data, but they’re often “black boxes”—hard to understand. Fuzzy systems are transparent (you can see the rules), but they rely on experts to define those rules. A Fuzzy network merges the best of both: it can learn from data like a neural network, but organizes that knowledge into human-readable fuzzy rules. This makes it ideal for industrial applications where both accuracy and explainability matter.\n\nThe algorithm related to a Fuzzy network is implemented as an inference engine that can automatically deduce precise conclusions from certain facts (data).  \n\nAn **inference engine** is the “brain” of the system. It takes input data (e.g., sensor readings), matches them against fuzzy rules (e.g., “if pressure is high and temperature is rising, then risk is high”), and produces an output (e.g., a warning or control action). The process involves several steps: fuzzification (converting crisp numbers into fuzzy values), rule evaluation, aggregation of results, and defuzzification (turning the fuzzy output back into a clear, actionable value). The result? A system that mimics expert judgment—even when the inputs aren’t perfect.\n\nEquity-linked policy is an insurance or assurance policy in which a proportion of the premiums paid are invested in equities.  \n\nIn other words, part of your insurance payment doesn’t just go into a safety fund—it’s used to buy stocks or shares. This means the policy’s value can grow over time based on market performance, unlike traditional policies that offer fixed returns.\n\nThe surrender value of the policy is therefore the selling price of the equities purchased.  \n\nIf you decide to cancel (or “surrender”) the policy early, you don’t get a fixed refund—you get the current market value of the investments made on your behalf. So if the stock market has gone up, you could gain more; if it’s down, you might get less than you paid in.\n\nAs more premiums are paid the portfolio gets larger."}},"metadata":{"paper_id":"0035c9dea1fe80ab0f80d713ab1a2b15","csv_row":42123,"doi":"10.1051/matecconf/201711204020","openalex_id":"https://openalex.org/W2725043007","pdf_url":"https://www.matec-conferences.org/articles/matecconf/pdf/2017/26/matecconf_imane2017_04020.pdf","page_count":6,"text_chars":14592,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2407,"total_tokens":3220,"completion_tokens":813,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2268,"total_tokens":3144,"completion_tokens":876,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":4.4350011348724365,"l5_seconds":4.16643762588501}},{"idx":10,"domain":"Academic paper","source":"CSV row 55307 · 2005 · 10.1017/s0317167100004005","title":"Optimal Check Size and Reversal Rate to Elicit Pattern-reversal MEG Responses","seg":"THE CANADIAN JOURNAL OF NEUROLOGICAL SCIENCES\n222\nconsideration, large checks (low spatial frequency) preferentially\nactivate peripheral retinal cells and anterior striate cortex, hence\npowerful for P100m elicitation. 11,12 In contrast, small-element\npatterns (high spatial frequency) preferentially activate fovea\nretinal cells and posterior striate cortex (occipital pole), and thus\nare relatively suitable for eliciting P100 rather than P100m.\nThe VEF response to checkerboard pattern-reversal\nstimulation in our study is basically a triphasic wave complex\nwith a large second deflection peaking at ~100 ms, compatible\nwith the N75m-P100m-N145m complex demonstrated by earlier\nVEF studies.\n11,13,14 Despite lack of simultaneous EEG recording,\nwe putatively assume that P100m corresponds to P100 VEP\nresponse since it was consistently associated with one earlier ~70\nms and one later ~150 ms opposite deflection. Previous VEF\nstudies using simultaneous EEG recording did not demonstrate\nsignificant latency differences between P100m and P100,\nsuggesting similar cortical activation for both.\n11,13,14 Notably, our\nmean latency of P100m to 30'checks (115.0 ms, see Table 1)\napproximates that (118.8 ms) to 28' checks in one previous VEF\nstudy14 using similar recording conditions.\nIn our study, the P100m responses to small check size (15 ')\nwere characteristic of relatively small amplitudes and delayed\npeak latencies, in line with earlier VEP3,15 and one recent MEG13\nstudy. Based on the assumption of parallel visual processing, 3,16\nretinal ganglion cells most sensitive to the high spatial frequency\nstimuli are mainly localized in fovea areas and are characterized\nby the relatively small receptive fields and small diameter axons.\nThis assumption supported our observation that small checks\nwere less powerful for P100m elicitation by peripheral\nstimulation. The preferential activation of ganglion cells with\nsmall axon and slow conduction may contribute to the latency\nprolongation.\nThe effect of checks > 120'on VEFs was rarely discussed.\nNakamura and colleagues\n13 reported a slightly longer latency\nand smaller amplitude of P100m by 180' than 90' checks.13 In our\nstudy, P100m activation to 180'and 450'checks showed\nconsecutive attenuation compared with that to 120'checks. We\nhad two explanations for this finding. First, the sensitivity to\npattern stimuli decreased when small numbers of pattern cycle\nwas displayed.\n17 Decrease in P100m activation to 180'and 450'\nchecks probably reflected the scarce number of pattern cycles\npresented (five cycles for 180', two cycles for 450') in this study.\nNotably, the optimum 120'checks stimulation encompassed\naround six pattern cycles. This number was intriguingly in line\nwith a color contrast study 18 which demonstrated attenuated\nvisual evoked responses when less than six cycles of isoluminant\nred/green sinusoid gratings were displayed. An alternative\nexplanation for the P100m attenuation by 180' and 450' checks is\nthat the VEF responses to very large checks may not exclusively\nreflect contrast processing. The preferential activation of\nluminance channels at large checks might confound the contrast-\nspecific responses, hence an attenuated VEF magnitude. An\nearlier study on pattern-reversal retinal potentials has shown that\nthe retinal activation by large checks could be confounded by\nnoncontrast specific responses.\n19\nApart from P100 or P100m, check size also affects N75\nresponses. Several VEP studies showed decreased amplitude and\nlatency of N75 when the check size increases. 7,20,21 Moreover,\nN75 or N75m, like P100 or P100m, is also affected by aging 22\nand by contrast level. 14,23 Taken together, further studies\ninvestigating the check size effect upon N75m in VEF response\nshould be intriguing and may help elucidate the\nneurophysiological significance of N75m. In this paper,\nhowever, we did not include this issue, because the stimulus\nparadigm with a wide check size variation did not consistently\nelicit discernible N75m responses (see Figure 1).\nThe ISI effect on P100m has been rarely studied. One\nprevious VEP study reported a latency shortening of 4.8 ms as\nthe ISI increased from 0.25 s to 1 s.\n24 In contrast, our results\nshowed no significant ISI-dependent change in P100m\nactivation. Note the ISI less than 0.16 s was not","models":{"dsv4-flash":{"l5":"THE CANADIAN JOURNAL OF NEUROLOGICAL SCIENCES\n222\n\nLet’s pause to unpack the logic here, because this is a beautiful example of how the visual system is wired for efficiency. The retina is not a uniform camera sensor; it has specialized regions. The **fovea** (the center of your visual field) is packed with small, densely-packed cells that excel at resolving fine details—these are your *high spatial frequency* detectors. In contrast, the **peripheral retina** (the edges of your vision) is dominated by larger, more sensitive cells that are great at detecting big, coarse shapes—your *low spatial frequency* detectors. This anatomical specialization extends all the way to the visual cortex: the *anterior* striate cortex (the front part of the primary visual area) receives input from the periphery, while the *posterior* striate cortex (the occipital pole, at the very back of the brain) processes foveal information.\n\nNow, consider what a **checkerboard pattern-reversal stimulus** does. When you flip a large checkerboard (say, with big squares), you are primarily stimulating the peripheral retina and the anterior striate cortex. This is why large checks are so effective at generating a robust **P100m**—the magnetic counterpart of the well-known P100 visual evoked potential (VEP). Conversely, if you use a pattern with very small checks (high spatial frequency), you are preferentially activating the fovea and the occipital pole. This makes small checks better suited for eliciting the *electrical* P100 (measured on the scalp) than the *magnetic* P100m (measured with MEG), because MEG is more sensitive to the tangential sources in the anterior cortex.\n\nIn our study, the magnetic visual evoked field (VEF) response to a reversing checkerboard was essentially a **triphasic wave complex**—a sequence of three distinct peaks. The second, and largest, of these peaks occurred at roughly 100 milliseconds after the stimulus. This pattern is entirely consistent with the well-established **N75m-P100m-N145m** complex (a negative peak at 75 ms, a positive peak at 100 ms, and a negative peak at 145 ms) that has been documented in earlier VEF research. \n\nYou might wonder: *How can we be sure that our P100m is the same phenomenon as the P100 VEP, if we didn't record EEG simultaneously?* That's a fair question. Our confidence rests on the fact that the P100m was always flanked by an earlier negative deflection at ~70 ms and a later negative deflection at ~150 ms. This exact temporal signature—negative-positive-negative—is the fingerprint of the N75-P100-N145 complex. Moreover, previous studies that *did* record EEG and MEG simultaneously found no significant latency difference between P100m and P100, which strongly suggests that both signals arise from the same cortical activation. As a further point of reference, our mean latency for P100m to 30' checks (115.0 ms, see Table 1) is very close to the 118.8 ms latency reported in a prior VEF study that used similar recording conditions.\n\nNow, let's turn to the effect of *small* checks. When we used 15' checks, the P100m responses were notably small in amplitude and had delayed peak latencies. This aligns perfectly with earlier VEP and MEG studies. Why would this be? The answer lies in the physiology of the retina. The retinal ganglion cells that are most sensitive to high spatial frequency (small checks) are located in the fovea. These cells have two crucial properties: they have relatively **small receptive fields** (they sample a tiny patch of visual space) and they have **small-diameter axons**. Because of their small diameter, these axons conduct electrical signals more slowly than the larger, faster-conducting axons of the peripheral retina. This explains both observations: the small checks are less effective at driving the P100m (because the foveal projection is less prominent in the anterior cortex), and the slower conduction velocity of the foveal ganglion cells contributes to the prolonged latency.\n\nWhat about the effect of very large checks, specifically those larger than 120'? This is a less-explored territory. One study by Nakamura and colleagues found that 180' checks produced a slightly longer latency and smaller amplitude P100m compared to 90' checks. In our study, we observed a *consecutive attenuation* (a progressive decrease) in P100m activation as we moved from 120' to 180' and then to 450' checks. We propose two explanations for this decline.\n\nFirst, consider the concept of **pattern cycles**. A checkerboard pattern is composed of repeating cycles (a light and a dark square). When you make the checks very large, you fit fewer cycles into the same visual field. For instance, in our setup, 180' checks presented only five cycles, and 450' checks presented only two cycles. The visual system seems to require a certain number of cycles to respond robustly. Interestingly, our optimal 120' checks presented about six cycles. This number is remarkably consistent with a color contrast study that showed attenuated visual evoked responses when fewer than six cycles of isoluminant red/green gratings were displayed. It appears that the visual system needs a minimum \"sample size\" of pattern cycles to build a strong response.\n\nOur second explanation is more subtle. The VEF response to very large checks might not be purely a *contrast* response. When checks become very large, they begin to activate **luminance channels**—the pathways that respond to overall brightness changes, not just to the edges between light and dark. This luminance-driven activity could \"contaminate\" the contrast-specific response, diluting the overall VEF magnitude. This idea is supported by an earlier study on pattern-reversal retinal potentials, which showed that large checks could indeed elicit non-contrast-specific retinal activation.\n\nIt's important to remember that check size doesn't just affect the P100m; it also influences the earlier **N75** component. Several VEP studies have shown that as check size increases, the amplitude and latency of N75 decrease. Furthermore, N75 and N75m are also sensitive to aging and to contrast level, just like P100 and P100m. Given these parallels, it would be fascinating to investigate how check size affects N75m in VEF responses. Such a study could help clarify the neurophysiological role of N75m. However, we did not include this analysis in the current paper, because our stimulus paradigm, which varied check size widely, did not consistently produce a clear N75m response (see Figure 1).\n\nFinally, let's consider the effect of the **inter-stimulus interval (ISI)**—the time between successive pattern reversals. This has been rarely studied. One previous VEP study found a latency shortening of 4.8 ms when the ISI was increased from 0.25 s to 1 s. In contrast, our results showed no significant ISI-dependent change in P100m activation. Note that the ISI less than 0.16 s was not"},"qwen3-235b-a22b":{"l5":"## Visual Evoked Field Responses to Checkerboard Pattern-Reversal: The Role of Check Size and Interstimulus Interval\n\nWhen we look at a visual stimulus—like a flickering checkerboard—our brain generates electrical activity that can be measured using techniques such as visual evoked potentials (VEPs) or, in this case, visual evoked fields (VEFs) with magnetoencephalography (MEG). One of the most reliable signals in this response is a large positive wave that peaks around 100 milliseconds after the stimulus appears. In MEG studies, this is called the **P100m**; in EEG, it's known as the **P100**. But what determines how strong or fast this signal is? Two key factors explored in this study are the *size* of the checks in the checkerboard and the *timing* between successive stimuli—the interstimulus interval (ISI).\n\nLet’s start by understanding how **check size** influences brain responses.\n\n### How Check Size Influences Which Brain Cells Respond\n\nImagine the checkerboard you're viewing is made up of alternating black and white squares. The size of these squares—called \"check size\"—determines how detailed the pattern is. Scientists describe this in terms of **spatial frequency**, which is just a fancy way of saying \"how many light-dark transitions occur across a given distance in your visual field.\"\n\n- **Large checks** (e.g., 180' or 450') mean **low spatial frequency**: few transitions, broad patterns.\n- **Small checks** (e.g., 15' or 30') mean **high spatial frequency**: many transitions, fine details.\n\nNow here’s the crucial point: your retina isn’t uniform. Different parts of it are specialized for different jobs.\n\n- The **periphery** of the retina (outside the center) is great at detecting large, coarse patterns—like spotting movement in your side vision.\n- The **fovea**, the very center of your retina, is packed with cells that detect fine detail—like reading small text.\n\nSo when you see **large checks**, they mainly activate cells in the **peripheral retina**. These signals travel to the **anterior (front) part of the striate cortex**—the brain’s primary visual area in the occipital lobe. This pathway turns out to be especially effective at generating the **P100m** response.\n\nOn the flip side, **small checks** (high spatial frequency) fall mostly on the **fovea**, activating foveal retinal cells. These connect to the **posterior (back) striate cortex**, near the occipital pole. While this setup is ideal for sharp vision, it's *less effective* at producing a strong P100m. Instead, it tends to elicit the classic **P100** seen in EEG studies.\n\nThis distinction helps explain why large checks are more powerful for evoking P100m in MEG experiments—they tap into a neural pathway optimized for coarse, peripheral processing.\n\n### What Does the VEF Waveform Look Like?\n\nIn this study, the visual evoked field (VEF) response to reversing checkerboards typically showed a **triphasic wave complex**—that is, three main bends in the signal over time. The most prominent of these is the second deflection, which peaks at about **100 milliseconds**. This pattern matches what earlier studies have labeled the **N75m-P100m-N145m complex**, where:\n\n- **N75m** is a negative wave peaking around 75 ms,\n- **P100m** is a large positive wave at ~100 ms,\n- **N145m** is a later negative wave at ~145 ms.\n\nEven though this study didn’t record EEG simultaneously, the researchers reasonably assume that the **P100m** they measured corresponds directly to the **P100** seen in EEG studies. Why? Because the timing and sequence match: a negative wave before (~70 ms), a big positive peak at ~100 ms, and another negative wave after (~150 ms). Previous studies that *did* record both MEG and EEG found **no significant difference in latency** between P100m and P100, suggesting they arise from the same underlying cortical activity—likely in the primary visual cortex.\n\nSupporting this link, the average P100m latency observed here for **30' checks** was **115.0 ms** (see Table 1), which closely matches the **118.8 ms** reported in a prior MEG study using **28' checks** under similar conditions. This consistency across studies strengthens confidence in the reliability of these measurements.\n\n### Small Checks: Weaker and Slower Responses\n\nWhen the researchers used **smaller checks (15')**, they observed two clear effects:\n\n1. **Smaller amplitude** (weaker signal),\n2. **Delayed peak latency** (slower response).\n\nThis finding isn’t new—it aligns with earlier VEP studies and a recent MEG study. But *why* does this happen?\n\nTo understand this, we need to think about the **retinal ganglion cells**—the neurons in your retina that send visual information to your brain. These cells aren’t all the same. Those most sensitive to **high spatial frequencies** (fine details) are concentrated in the **fovea**. They have two key features:\n\n- **Small receptive fields**: they monitor a tiny patch of visual space,\n- **Small-diameter axons**: their nerve fibers are thin, which means they conduct signals more slowly.\n\nBecause of this, when you present small checks (high spatial frequency), you're primarily activating these **slow-conducting, fovea-centered cells**. That helps explain the **delayed latency** of the P100m response: the signal simply takes longer to reach the brain.\n\nMoreover, because these cells cover a smaller area and respond less vigorously to large-scale contrast changes, the overall **amplitude** of the brain response is reduced. So, even though small checks provide more detail, they’re actually *less efficient* at driving the kind of widespread neural synchronization needed for a strong P100m—especially when the stimulus is presented in the periphery.\n\nThis fits with the idea of **parallel visual processing**: your brain processes different aspects of vision (like detail vs. motion) through separate but simultaneous pathways. Large checks engage the fast, coarse-processing pathway (via peripheral retina), while small checks rely on the slower, detail-oriented foveal pathway.\n\n### What Happens with Very Large Checks (>120')?\n\nInterestingly, the effects of **very large checks**—like 180' or even 450'—haven’t been widely studied. One prior MEG study by Nakamura and colleagues found that **180' checks** produced a slightly **longer latency** and **smaller amplitude** compared to **90' checks**.\n\nIn this study, the results were even more pronounced: P100m responses to **180' and 450' checks** showed **progressive weakening** compared to **120' checks**. That is, bigger wasn’t better—beyond a certain point, increasing check size actually *reduced* the brain’s response.\n\nWhy might this happen? The researchers offer two compelling explanations.\n\n#### Explanation 1: Too Few Pattern Cycles\n\nThink of each black-white pair in the checkerboard as one **cycle** of a visual pattern. The number of complete cycles across the visual field matters. In this experiment:\n\n- **120' checks** provided about **six full cycles**,\n- **180' checks** gave only **five cycles**,\n- **450' checks** had just **two cycles**.\n\nNow, here’s a key insight from vision science: the visual system needs a **minimum number of cycles** to reliably detect a pattern. Studies using colored sine-wave gratings (smoothly varying red/green patterns) have shown that **fewer than six cycles** lead to **weaker visual responses**, even if the contrast is high.\n\nSo, the **optimal response at 120' checks** may not be about size per se, but about hitting that **\"sweet spot\" of six cycles**—enough for the brain to clearly recognize and respond to the repeating pattern. Larger checks fall short in this regard, offering too few cycles to drive a strong response.\n\n#### Explanation 2: Mixing of Visual Channels\n\nThere’s another possibility: very large checks might activate different **visual processing channels** in the brain.\n\nYour visual system has multiple pathways, including:\n\n- **Luminance channels**: sensitive to brightness differences,\n- **Contrast channels**: tuned to edges and pattern changes.\n\nTypically, pattern-reversal stimuli (like flipping a checkerboard) are designed to isolate **contrast-specific responses**. But with **very large checks**, the brain may start interpreting the stimulus more as a **global brightness change** rather than a detailed pattern. This could **activate luminance-sensitive pathways**, which aren’t as effective at generating the typical P100m.\n\nIn other words, the signal becomes \"contaminated\" by non-pattern-specific activity, diluting the contrast-driven response. Supporting this idea, earlier studies on retinal responses have shown that **large checks can evoke non-specific electrical activity** in the retina that isn’t tied to pattern processing.\n\nSo, the attenuation of P100m with very large checks might reflect a shift from **pattern-specific** to **luminance-dominated** processing—a kind of neural \"mismatch\" between what the stimulus intends to probe and what the brain actually responds to.\n\n### Check Size Also Affects Earlier Components: The Case of N75\n\nSo far, we’ve focused on P100m, but check size doesn’t just affect this one wave. It also influences earlier components like **N75** (or N75m in MEG).\n\nMultiple VEP studies have shown that as check size increases:\n\n- **N75 amplitude decreases**,\n- **N75 latency shortens**.\n\nLike P100/P100m, N75m is also modulated by factors like **aging** and **contrast level**, suggesting it reflects meaningful neural processing in the visual cortex.\n\nGiven this, studying how **check size affects N75m** in MEG could provide deeper insight into the early stages of visual processing. However, in this particular study, the researchers chose not to analyze N75m. Why?\n\nBecause when they used a wide range of check sizes, the **N75m response was often too weak or inconsistent to measure reliably** (see Figure 1). Without clear, reproducible signals, drawing firm conclusions would be risky. So while the topic is scientifically interesting, the data limitations prevented further exploration here.\n\n### Does Timing Between Stimuli Matter? The ISI Effect on P100m\n\nFinally, what about the **interstimulus interval (ISI)**—the time between one checkerboard reversal and the next?\n\nThis factor has been understudied in MEG. One earlier VEP study found that when ISI increased from **0.25 seconds to 1 second**, the P100 latency **shortened by 4.8 ms**—suggesting that longer breaks between stimuli allow the brain to respond faster.\n\nBut in this study, **no significant change** in P100m activation was observed across different ISIs. That is, whether stimuli came quickly or slowly, the brain’s response (in terms of latency and amplitude) stayed roughly the same.\n\nNote the ISI less than 0.16 s was not"}},"metadata":{"paper_id":"004540332186a9c9148815699fea3f07","csv_row":55307,"doi":"10.1017/s0317167100004005","openalex_id":"https://openalex.org/W2332568955","pdf_url":"https://www.cambridge.org/core/services/aop-cambridge-core/content/view/BEC26841D25032701626F395E705D717/S0317167100004005a.pdf/div-class-title-optimal-check-size-and-reversal-rate-to-elicit-pattern-reversal-meg-responses-div.pdf","page_count":7,"text_chars":32778,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2389,"total_tokens":3395,"completion_tokens":1006,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2250,"total_tokens":3742,"completion_tokens":1492,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":4.945619583129883,"l5_seconds":10.749931573867798}},{"idx":11,"domain":"Academic paper","source":"CSV row 4338 · 2018 · 10.1007/s40846-018-0428-4","title":"The Impact of the Finite Element Method on Medical Device Design","seg":"The Impact of the Finite Element Method on Medical Device Design\nMark Driscoll1\nPublished online: 6 June 2018 \n© Taiwanese Society of Biomedical Engineering 2018\nOver the last 10 years, medical device design has vastly \nbenefited from the integration of finite element analyses in \nthe product development process. The finite element method \n(FEM) is a numerical method used to solve boundary value \nproblems. This method adopts an approach of computing \nreactions over a discrete number of points across the domain \nof interest. For medical design, this typically translates \ntowards verifying device performance in a virtual domain \nthat is representative of its planned real-life application. A \nuser may leverage results from such an analysis to interpret \ndevice performance and make educated recommendations \nfor improvement and optimization [1–3]. Moreover, predic-\ntions of initial and long-term device performance in vivo \nmay also be derived from FEM results often through a \nmulti scaled and iterative analyses [ 4, 5] which may sub -\nsequently lead to better prepared in vivo studies [ 6, 7]. A \nkey acknowledgement that enables such post-processing \nrealizations is having an experienced user working with an \ninterdisciplinary team. Such a team may then confidently \nnavigate through the many advantages and disadvantages \nput forth by this virtual test platform which continues to \ngrow in popularity.\nThe advantages of FEM in the medical device arena are \nmany. The most attractive being the speed at which the FEM \ncan enable early device performance testing prior to costly \nprototyping and bench testing. Correspond
