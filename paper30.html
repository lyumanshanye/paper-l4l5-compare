actors between groups.\n\n- **Duration of symptoms and weight loss**: These give us a sense of how advanced the disease was before surgery. Both groups had symptoms for about 10–12 weeks on average, and lost around 8 kg in the year before surgery—again, quite similar.\n\n- **Karnofsky Performance Score**: This measures a patient’s ability to perform daily activities. A score ≥80 means they’re able to carry out normal activity with minor signs or symptoms of disease. Most patients in both groups fall into this category, indicating they were relatively functional before surgery.\n\n- **Preoperative biliary drainage**: This is often done to relieve jaundice caused by bile duct blockage. About two-thirds of patients in each group had this procedure, so it’s evenly distributed.\n\n- **Diagnosis at pathology**: The vast majority had **adenocarcinoma** (a type of cancer), with a few having other malignant or benign conditions like chronic pancreatitis. The retrocolic group had one patient with a benign lesion, while the antecolic group had three—still, the overall mix is similar.\n\nSo what’s the takeaway? These two groups are **well-matched** in terms of demographics and clinical features. That’s crucial because it means any differences we see later in outcomes (like gastric emptying) are more likely due to the surgical technique itself, rather than one group being inherently healthier or sicker.\n\n---\n\n## Table 2 Treatment characteristics, delayed gastric emptying and other clinical outcomes  \nRetrocolic  \ngroup  \n(n=38)  \nAntecolic  \ngroup  \n(n=35) P§  \nTreatment characteristics  \nPylorus preserved 34 29 0 ⋅411  \nFeeding tube jejunostomy 0 3 0 ⋅065  \nOctreotide prophylaxis 20 17 0 ⋅729  \nDGE and other clinical outcomes  \nClinically relevant DGE† 13 14 0 ⋅609  \nPrimary clinically relevant DGE‡ 7 3 0 ⋅221  \n(Par)enteral nutritional support  \nNone 23 21 0 ⋅641  \nTube feeding 8 5  \nParenteral nutrition 3 2  \nTube feeding and parenteral  \nnutrition  \n4 7  \nDindo–Clavien classification 0 ⋅117  \n0–I 16 12  \nII 15 9  \n≥III 7 14  \nHospital death 0 1 0 ⋅294  \nDuration of hospital stay (days)* 11 (8–17) 13 (9–25) 0 ⋅282¶  \n\n*Values are median (i.q.r.). †Grade B or C according to the consensus definition of the International Study Group of Pancreatic Surgery. ‡Primary delayed gastric emptying (DGE) in the absence of other intra-abdominal complications. §χ² test, except ¶Mann–Whitney U test.\n\nNow we move to what actually happened during and after surgery—this table captures treatment details and key outcomes.\n\nFirst, let’s clarify some terms:\n\n- **Pylorus preservation**: The pylorus is the valve at the end of the stomach that controls food entering the small intestine. In some surgeries, it’s removed; here, it was preserved in most cases (34 out of 38 in retrocolic, 29 out of 35 in antecolic). This is important because removing the pylorus can disrupt normal stomach emptying. Since both groups mostly kept it, we can focus on the *reconstruction path* (retrocolic vs. antecolic) as the main variable.\n\n- **Feeding tube jejunostomy**: A tube placed into the jejunum (part of the small intestine) during surgery to provide nutrition if the stomach isn’t emptying well. Only the antecolic group had any (3 patients), though the difference wasn’t statistically significant (P = 0.065). It’s close to significance, so it’s worth noting—but not enough to conclude one group needed more support.\n\n- **Octreotide prophylaxis**: Octreotide is a drug that reduces digestive secretions and is sometimes used to prevent complications like pancreatic fistula. About half the patients in each group received it, so its use was balanced.\n\nNow, the big question: **Did patients experience delayed gastric emptying (DGE)?**\n\nDGE is a common complication after pancreatic surgery. It means the stomach takes too long to empty its contents, leading to nausea, vomiting, bloating, and inability to eat. Clinically relevant DGE (defined here as Grade B or C) includes cases that require prolonged nasogastric tube placement or nutritional support beyond day 7.\n\n- **Clinically relevant DGE**: 13 in retrocolic, 14 in antecolic → nearly identical. The P-value is 0.609, meaning no statistically significant difference. So based on symptoms and clinical management, both techniques performed similarly.\n\n- **Primary DGE**: This narrows it down to cases where DGE occurred *without* other abdominal complications (like infection or leak). Here, retrocolic had 7 cases, antecolic only 3. That seems like a difference, but the P-value is 0.221—not statistically significant. With small numbers, it’s hard to detect real effects, so we can’t say for sure if retrocolic is worse.\n\nNext, **nutritional support** tells us how severely patients were affected:\n\n- Most patients in both groups needed no supplemental feeding (23 vs. 21).\n- A few required tube feeding or parenteral (IV) nutrition.\n- Notably, the antecolic group had more patients needing both tube and parenteral nutrition (7 vs. 4), though again, not statistically significant.\n\nThe **Dindo–Clavien classification** grades surgical complications by severity:\n- Grade 0–I: No or minor complications.\n- Grade II: Requires medication (e.g., antibiotics, TPN).\n- Grade ≥III: Requires intervention (endoscopic, radiological, or surgical).\n\nThe antecolic group had more high-grade complications (14 vs. 7), which might suggest more serious issues, but the P-value is 0.117—not quite significant. Still, it’s a signal worth watching.\n\n- **Hospital death**: One patient in the antecolic group died; none in retrocolic. But with only one death, we can’t draw strong conclusions (P = 0.294).\n\n- **Length of stay**: Median was 11 days (retrocolic) vs. 13 days (antecolic). The antecolic group stayed longer, but again, not significantly different (P = 0.282).\n\nSo overall, **no major differences** in clinical outcomes were found between the two surgical approaches. Both seem equally safe and effective in terms of patient recovery and complications.\n\nBut here’s a critical insight: **clinical assessment might miss subtle differences** in stomach function. A patient may appear to be recovering well—eating normally, no vomiting—but their stomach could still be emptying slowly. That’s where objective testing comes in.\n\n---\n\n## Table 3 Gastric emptying scintigraphy results  \nRetrocolic  \ngroup  \n(n=32)  \nAntecolic  \ngroup  \n(n=33) P†  \nPreoperative scan 20 22 0 ⋅725‡  \nLag time (min)* 11 (4–19) 12 (7–20) 0 ⋅754  \nt₁∕₂ (min)* 40 (23–47) 38 (29–52) 0 ⋅638  \n%RA120* 6 (0–12) 6 (4–11) 0 ⋅548  \nPostoperative scan 23 20 0 ⋅337‡  \nLag time (min)* 66 (12–171) 22 (5–105) 0 ⋅141  \nt₁∕₂ (min)* 145 (52–351) 64 (25–312) 0 ⋅189  \n%RA120* 64 (21–96) 28 (5–87) 0 ⋅213  \n%RA120 >60% 12 7 0 ⋅258‡  \n\n*Values are median (i.q.r.). t₁∕₂, Time needed to empty half of the stomach content; %RA120, residual percentage of radioactivity in the stomach after 2h. †Mann–Whitney U test, except ‡χ² test.\n\nThis table dives deeper using **gastric emptying scintigraphy (GES)**—a nuclear medicine test that objectively measures how fast the stomach empties.\n\nHere’s how it works: the patient eats a meal containing a small amount of radioactive tracer. A camera then tracks how much radioactivity remains in the stomach over time. It’s like putting a GPS tracker on food.\n\nKey metrics:\n- **Lag time**: How long the stomach waits before starting to empty. Think of it as the “warm-up” phase.\n- **t₁/₂ (half-emptying time)**: The time it takes for half the stomach contents to empty. A longer t₁/₂ means slower emptying.\n- **%RA120**: The percentage of radioactivity (i.e., food) still in the stomach after 120 minutes (2 hours). Higher values mean more food is stuck.\n\nLet’s look at **preoperative** scans first:\n- Both groups had similar baseline function. Lag time, t₁/₂, and %RA120 were nearly identical.\n- This confirms that before surgery, stomach motility was comparable—so any post-op differences are likely due to the surgery itself.\n\nNow, **postoperative** results:\n- **Lag time**: Increased dramatically in both groups (as expected after major surgery), but the retrocolic group had a much longer median lag time (66 min vs. 22 min). That’s a big difference—over 3 times longer. However, the P-value is 0.141, not statistically significant. Why? Because there’s high variability (some patients emptied quickly, others very slowly), which makes it harder to detect a true effect.\n  \n- **t₁/₂**: Again, much longer in retrocolic (145 min vs. 64 min). That means it took more than twice as long to empty half the stomach. But P = 0.189—not significant.\n\n- **%RA120**: After 2 hours, the retrocolic group retained 64% of the meal on average, compared to 28% in antecolic. That’s a striking difference. More than half still in the stomach vs. less than a third. And 12 patients in retrocolic had >60% retention (a common threshold for abnormal emptying), versus only 7 in antecolic.\n\nEven though none of these differences reach statistical significance (likely due to small sample size and high variation), the **trend is clear and consistent**: the **retrocolic group shows markedly slower gastric emptying** after surgery.\n\nThis is a powerful example of how **objective testing can reveal hidden dysfunction** that clinical observation might miss. Patients may have been discharged and eating adequately, yet their stomachs were still struggling to process food efficiently.\n\nSo while both techniques look similar in terms of overt complications (Table 2), the physiological impact—measured precisely—suggests **antecolic reconstruction may preserve better stomach motility**.\n\n---\n\n## Table 4 Association between clinically relevant delayed gastric emptying and delayed emptying at scintigraphy in patients who underwent postoperative gastric emptying scintigraphy  \nNo delayed  \nemptying at GES  \n(n"}},"metadata":{"paper_id":"004f6cd5bf331bc90768ed16fbab4a97","csv_row":63972,"doi":"10.1002/bjs.9812","openalex_id":"https://openalex.org/W2128318661","pdf_url":"https://pure.amsterdamumc.nl/ws/files/160681388/Gastric-emptying-and-quality-of-life-after-pancreatoduodenectomy-with-retrocolic-or-antecolic-gastroenteric-anastomosis.pdf","page_count":11,"text_chars":40588,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2329,"total_tokens":3221,"completion_tokens":892,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2190,"total_tokens":4407,"completion_tokens":2217,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":4.379368782043457,"l5_seconds":13.487967014312744}},{"idx":24,"domain":"Academic paper","source":"CSV row 61296 ·  · 10.11178/jdsa.12.52","title":"Potential Impact of an Exotic Plant Invasion on Both Plant and Arthropod Communities in a Semi-natural Grassland on Sugadaira Montane in Japan","seg":"not significantly different between the two areas\n(Wilcoxonranksumtest: U＝18, p＝1.000;Fig.3e).\nArthropodcommunitycompositionanddiversity\nIn total, 427 arthropod individuals and 96 species\nbelonging to 54 families (two classes) were collected\nfrom the grassland (Table 2). Among them, families\nof17arthropodindividuals(2Lepidoptera,13Araneae\nand2Hymenoptera)wereunknownandwereomitted\nfrom the analyses. Nine species were only found in\nthe reference area, 22 species were only found in the\ninvaded area, whilst 65 species were found in both\nareas(Table2). Thedifferenceinarthropodcommu-\nnitycompositionbetweeninvadedandreferenceareas\nwas significant (perMANOVA: F'\n1,10＝2.776, p＝\n0.006),althoughlessclearthanthedifferenceobserved\ninplantcommunitycomposition(Fig.2b).\nEighty-threedetritivoreindividualsbelongingto21\nspecies and 10 families, 167 herbivore individuals\nbelonging to 34 species and 17 families, and 166\npredator (including omnivores and parasitoids) indi-\nviduals belonging to 39 species and 25 families were\nsampled (Table 2). The feeding habitats of 8\nCecidomyiidae (Diptera) individuals were unknown;\ntherefore,inadditiontothe17unidentifiedindividuals\n(seeabove),theywereomittedfromtheanalyses. We\ndid not find the invasive leaf beetle,O. communa,\nwhichisaspecialistoftheexoticgiantragweed,even\nthoughitsinvasionwasreportedinNaganoPrefecture,\nJapan (Moriya and Shiyake, 2001). Arthropod abun-\ndance (the number of individuals) was significantly\ndifferent depending on the trophic level (F-test:F＝\n4.118, df＝2, p＝0.026;Fig.4a),andoverallwassig-\nnificantly higher in invaded areas compared to re-\nferenceareas(F-test: F＝4.817, df＝1, p＝0.036;Fig.\n3a). Speciesrichness(thenumberofspecies)wasalso\nsignificantly different depending on the trophic level\n(F-test: F＝3.735, df＝2, p＝0.035;Fig.4b)andover-\nall,tendedtobehigherininvadedthanreferenceareas\n(F-test: F＝2.929, df＝1, p＝0.097;Fig.4b). Theef-\nfect of the interaction between area and trophic level\non Simpson’s diversity index was marginally sig-\nnificant (F-test:F＝3.274, df＝2, p＝0.053; Fig. 4c),\nindicating that the effect of area on Simpson’s index\ndependsonthetrophiclevel. Hence,Simpson’sindex\nwascomparedateachtrophiclevelseparately. There\nwerenosignificantdifferencesbetweenthetwoareas\nfordetritivores(F-test: F＝0.773, df＝1, p＝0.405)or\nherbivores(F-test: F＝0.615, df＝1, p＝0.451). Pred-\nators seemed to have a significantly higher index in\ninvadedareascomparedtoreferenceareas(F-test: F＝\n3.754, df＝1, p＝0.081;Fig.4c).\nSato et al.:Exoticplantinvasioninasemi-naturalgrassland 57\nFig. 2. NMDS plots with Bray-Curtis dissimilarity indices for (a) plant community composition, and (b)\narthropod community composition, in invaded and reference areas. I1-I6 indicate quadrats in the in-\nvaded area, which is dominated by the exotic giant ragweed,Ambrosia trifida,and R1-R6 indicate\nquadrats in the reference area, which is dominated by the Japanese pampas grass,Miscanthussinensis.\nStress values in NMDS plots of plant and arthropod community compositions were 0.07 and 0.20. For\nthe location of each area and quadrat, see Fig. 1.\n\nJ.Dev.Sus.Agr.12(1)58\nFig. 3. (a) Bar plots of plant abundance, (b) box plots of plant species richness, (c) box plots of plant\nspecies richness excluding exotic species and dominant species in each area, (d) box plots of Simpson's\ndiversityindexofplants,and(e","models":{"dsv4-flash":{"l5":"not significantly different between the two areas\n(Wilcoxonranksumtest: U＝18, p＝1.000;Fig.3e).\n\nBefore we move on, let’s pause to appreciate what this result means. The Wilcoxon rank-sum test is a nonparametric test—it doesn’t assume that the data follow a normal distribution—and it compares whether two groups (here, the invaded and reference areas) tend to have different central values. A p-value of 1.000 is the maximum possible value, indicating that the two groups are essentially indistinguishable in this metric. In other words, whatever aspect of the community this test is measuring (in this case, the variable shown in Fig. 3e), the invaded and reference areas behave identically. This is a striking contrast to the differences we’ll see in other community properties, so keep this in mind: not every ecological response to invasion is a dramatic shift.\n\n---\n\n**Arthropod community composition and diversity**\n\nNow we turn from plants to the arthropods—the insects, spiders, and their relatives that live in the grassland. These animals are not just passive residents; they are active players in the ecosystem, consuming plants, preying on other animals, and recycling nutrients. Understanding how an invasive plant like giant ragweed affects them is crucial, because arthropods are the link between primary producers (plants) and higher trophic levels (birds, mammals, etc.).\n\nIn total, 427 arthropod individuals and 96 species belonging to 54 families (two classes) were collected from the grassland (Table 2). Let’s unpack this sentence. An *individual* is a single organism—one beetle, one spider, one fly. A *species* is a group of individuals that can interbreed and produce fertile offspring. A *family* is a higher taxonomic rank that groups together related genera (e.g., the family *Araneidae* includes many orb-weaver spiders). So, the researchers found 427 individual arthropods, which they classified into 96 distinct species, which in turn belong to 54 families. The fact that they span two classes (e.g., *Insecta* and *Arachnida*) tells us that the sample includes both insects and spiders, among others.\n\nAmong them, families of 17 arthropod individuals (2 Lepidoptera, 13 Araneae and 2 Hymenoptera) were unknown and were omitted from the analyses. This is a crucial data-cleaning step. Imagine trying to sort a pile of photographs, but some are too blurry to identify the people in them. You can’t assign those to a category, so you set them aside. Here, 17 individuals could not be assigned to a family—perhaps they were juveniles, damaged, or simply too small to identify. The researchers note the breakdown: 2 were butterflies or moths (Lepidoptera), 13 were spiders (Araneae), and 2 were bees, wasps, or ants (Hymenoptera). These 17 are excluded from any analysis that requires family-level information, but they are still counted in the total abundance (427). This is a common and transparent way to handle missing data.\n\nNine species were only found in the reference area, 22 species were only found in the invaded area, whilst 65 species were found in both areas (Table 2). This is a fascinating pattern. Think of it as a Venn diagram: 9 species are unique to the reference area, 22 are unique to the invaded area, and 65 are shared. The invaded area has *more* unique species than the reference area—which might seem counterintuitive if you expect invasion to reduce biodiversity. But remember, the invaded area is dominated by giant ragweed, which may create new habitats or resources (e.g., a different plant structure, different microclimates) that attract certain arthropods. At the same time, some species that prefer the native Japanese pampas grass may be lost. The net effect is not a simple loss of species, but a *reshuffling* of the community.\n\nThe difference in arthropod community composition between invaded and reference areas was significant (perMANOVA: F'₁,₁₀ = 2.776, p = 0.006), although less clear than the difference observed in plant community composition (Fig. 2b). Let’s decode this. *perMANOVA* (permutational multivariate analysis of variance) is a statistical test that compares the overall composition of two or more groups, taking into account all species simultaneously. It asks: “Are the species present, and their relative abundances, different between the two areas?” The p-value of 0.006 is well below the conventional threshold of 0.05, so we can confidently say that the arthropod communities in the invaded and reference areas are not the same. However, the phrase “less clear” refers to the visual pattern in Fig. 2b: the points representing invaded and reference quadrats may overlap more than they do in the plant community plot (Fig. 2a). In other words, the difference is real but not as stark—perhaps because arthropods are mobile and can move between areas, or because the effects of the plant invasion on arthropods are indirect and take time to manifest.\n\n---\n\nEighty-three detritivore individuals belonging to 21 species and 10 families, 167 herbivore individuals belonging to 34 species and 17 families, and 166 predator (including omnivores and parasitoids) individuals belonging to 39 species and 25 families were sampled (Table 2). This is a breakdown by trophic level—that is, by what the organisms eat. Let’s define each group:\n\n- **Detritivores** feed on dead organic matter, like fallen leaves, dead insects, and animal waste. They are the recyclers of the ecosystem. Here, 83 individuals were found, spread across 21 species and 10 families.\n- **Herbivores** feed on living plant tissue—leaves, stems, roots, or nectar. They are the primary consumers. Here, 167 individuals were found, across 34 species and 17 families.\n- **Predators** (including omnivores and parasitoids) feed on other animals. Omnivores eat both plants and animals, and parasitoids are organisms whose larvae develop inside or on a host, eventually killing it (e.g., certain wasps). Here, 166 individuals were found, across 39 species and 25 families.\n\nNotice that the number of species increases as we move up the trophic levels: 21 detritivore species, 34 herbivore species, and 39 predator species. This is a common pattern in ecology—predators are often more diverse because they can specialize on different prey, and they integrate energy from multiple lower levels. The number of individuals, however, is highest for herbivores (167), which makes sense: in a typical ecosystem, there are more plants than herbivores, and more herbivores than predators, forming a pyramid of numbers.\n\nThe feeding habits of 8 Cecidomyiidae (Diptera) individuals were unknown; therefore, in addition to the 17 unidentified individuals (see above), they were omitted from the analyses. Cecidomyiidae is a family of flies known as gall midges. Many of them are herbivorous, but some are predators or detritivores, so without further identification, the researchers couldn’t assign them to a trophic level. This is another example of careful data handling: rather than guessing, they exclude these 8 individuals from any analysis that requires trophic-level information. So, in total, 17 + 8 = 25 individuals are excluded from trophic-level analyses.\n\nWe did not find the invasive leaf beetle, *O. communa*, which is a specialist of the exotic giant ragweed, even though its invasion was reported in Nagano Prefecture, Japan (Moriya and Shiyake, 2001). This is a particularly interesting note. *O. communa* is a beetle that feeds specifically on giant ragweed—it is a natural enemy of the invasive plant. In some regions, it has been introduced or has spread naturally as a biological control agent. The researchers expected to find it in their study area, because it had been reported in the same prefecture (Nagano) in 2001. But they did not find it. This suggests that the beetle has not yet reached this particular grassland, or that it is present but at very low densities. This is important because the beetle could potentially reduce the dominance of giant ragweed, so its absence means the invasion is unchecked in this area.\n\nArthropod abundance (the number of individuals) was significantly different depending on the trophic level (F-test: F = 4.118, df = 2, p = 0.026; Fig. 4a), and overall was significantly higher in invaded areas compared to reference areas (F-test: F = 4.817, df = 1, p = 0.036; Fig. 3a). Let’s break this down. The first F-test tells us that the number of individuals is not the same across the three trophic levels—detritivores, herbivores, and predators have different abundances. This is expected, as we saw earlier. The second F-test tells us that, when we pool all trophic levels together, the invaded areas have more arthropod individuals than the reference areas. This is a key finding: the invasion of giant ragweed is associated with a *higher* total number of arthropods. Why might this be? One possibility is that the ragweed provides more food (e.g., more leaves for herbivores) or more habitat structure (e.g., taller, denser vegetation) than the native grass. Another possibility is that the ragweed attracts a different set of herbivores, which in turn attract more predators.\n\nSpecies richness (the number of species) was also significantly different depending on the trophic level (F-test: F = 3.735, df = 2, p = 0.035; Fig. 4b) and overall, tended to be higher in invaded than reference areas (F-test: F = 2.929, df = 1, p = 0.097; Fig. 4b). Here, we see a similar pattern for species richness. The first F-test shows that the number of species differs across trophic levels. The second F-test shows that the invaded area tends to have more species than the reference area, but the p-value is 0.097, which is above the conventional threshold of 0.05. This means the difference is *marginally significant*—it is a trend, but not a strong enough one to be conclusive. In ecology, such results are often reported as “tended to be higher,” which is exactly what the authors do. This is an honest and careful interpretation: they do not overstate the evidence.\n\nThe effect of the interaction between area and trophic level on Simpson’s diversity index was marginally significant (F-test: F = 3.274, df = 2, p = 0.053; Fig. 4c), indicating that the effect of area on Simpson’s index depends on the trophic level. This is a subtle but important point. Simpson’s diversity index is a measure of diversity that takes into account both the number of species and their relative abundances. It ranges from 0 to 1, where higher values indicate more even, diverse communities. The “interaction” here means that the difference between invaded and reference areas is not the same for all trophic levels. In other words, the invasion might increase diversity for predators, but not for herbivores or detritivores. The p-value of 0.053 is just above 0.05, so it is marginally significant, but the pattern is suggestive enough that the researchers decide to investigate further.\n\nHence, Simpson’s index was compared at each trophic level separately. This is a logical next step: if the interaction is significant, you should not pool all trophic levels together. Instead, you ask: “For each trophic level, is there a difference between invaded and reference areas?” This is called a *post-hoc* or *simple effects* analysis.\n\nThere were no significant differences between the two areas for detritivores (F-test: F = 0.773, df = 1, p = 0.405) or herbivores (F-test: F = 0.615, df = 1, p = 0.451). For detritivores and herbivores, the invaded and reference areas have similar diversity. This makes sense: detritivores feed on dead organic matter, which is likely abundant in both areas, and herbivores may find both the ragweed and the native grass suitable, or they may be generalists that feed on many plants.\n\nPredators seemed to have a significantly higher index in invaded areas compared to reference areas (F-test: F = 3.754, df = 1, p = 0.081; Fig. 4c). Here, the p-value is 0.081, which is again above 0.05, but the authors describe it as “seemed to have a significantly higher index.” This is a cautious interpretation: the evidence suggests a trend, but it is not conclusive. Why might predators be more diverse in the invaded area? One hypothesis is that the higher abundance of herbivores (which we saw earlier) provides more prey, which in turn supports a more diverse predator community. Another possibility is that the structural complexity of the ragweed plants offers more niches for predators to exploit.\n\n---\n\nSato et al.: Exotic plant invasion in a semi-natural grassland 57\n\nFig. 2. NMDS plots with Bray-Curtis dissimilarity indices for (a) plant community composition, and (b) arthropod community composition, in invaded and reference areas. I1-I6 indicate quadrats in the invaded area, which is dominated by the exotic giant ragweed, *Ambrosia trifida*, and R1-R6 indicate quadrats in the reference area, which is dominated by the Japanese pampas grass, *Miscanthus sinensis*. Stress values in NMDS plots of plant and arthropod community compositions were 0.07 and 0.20. For the location of each area and quadrat, see Fig. 1.\n\nLet’s take a moment to understand this figure. NMDS (Non-metric Multidimensional Scaling) is a technique that takes a complex, multi-species dataset and projects it into a two-dimensional space, so that we can visually see how similar or different the communities are. Each point represents a quadrat (a sample plot). The closer two points are, the more similar their species compositions. The Bray-Curtis dissimilarity index is a measure of how different two communities are, based on the species present and their abundances. The stress value is a measure of how well the two-dimensional plot represents the true relationships: a stress value below 0.2 is considered acceptable, and below 0.1 is excellent. Here, the plant community has a stress of 0.07 (excellent), while the arthropod community has a stress of 0.20 (acceptable but less reliable). This explains why the arthropod plot is less clear: the data are more variable, and the two-dimensional representation is less faithful.\n\n---\n\nJ. Dev. Sus. Agr. 12(1) 58\n\nFig. 3. (a) Bar plots of plant abundance, (b) box plots of plant species richness, (c) box plots of plant species richness excluding exotic species and dominant species in each area, (d) box plots of Simpson's diversity index of plants, and (e"},"qwen3-235b-a22b":{"l5":"not significantly different between the two areas  \n(Wilcoxon rank-sum test: $ U = 18 $, $ p = 1.000 $; Fig. 3e).  \n\n### Arthropod community composition and diversity  \n\nIn total, 427 arthropod individuals and 96 species belonging to 54 families (spanning two classes) were collected from the grassland (Table 2). Before diving into the analysis, it’s important to understand what happens when researchers encounter incomplete data. In this case, 17 individuals—2 from the order Lepidoptera (butterflies and moths), 13 Araneae (spiders), and 2 Hymenoptera (wasps, bees, ants)—could not be assigned to a known family and were therefore excluded from further analyses. Why exclude them? Because accurate classification is essential for studying community composition; including unidentified organisms could skew results or introduce uncertainty.  \n\nOf the identified species, 9 were found only in the reference area (the uninvaded grassland), 22 were found exclusively in the invaded area (dominated by the exotic giant ragweed, *Ambrosia trifida*), and 65 species were present in both areas (Table 2). This overlap tells us that while there is a shared core of arthropod life across both environments, a notable number of species are unique to each habitat—suggesting that the invasion may be reshaping which insects and spiders can thrive where.  \n\nTo formally test whether the types of arthropods differed between invaded and reference areas, the researchers used a statistical method called perMANOVA (permutational multivariate analysis of variance). This technique is ideal when comparing entire communities—like sets of species—based on their composition (i.e., which species are present and how abundant they are). The result showed a statistically significant difference between the two areas ($ F'_{1,10} = 2.776 $, $ p = 0.006 $), meaning the arthropod communities are indeed structured differently in invaded versus uninvaded sites.  \n\nHowever, the authors note that this difference, while real, is *less clear* than the stark contrast seen in plant communities (Fig. 2b). What does “less clear” mean here? It suggests that although the statistical test detects a difference, the separation between arthropod communities in the two areas isn’t as strong or consistent as it is for plants. Looking at the NMDS plot (Non-metric Multidimensional Scaling) in Fig. 2b, which visually represents how similar or different each sample is, we see more overlap between invaded and reference quadrats for arthropods than for plants. This makes intuitive sense: plants are the foundation of the ecosystem, so when an aggressive invader like giant ragweed takes over, it directly reshapes the physical and chemical environment. Arthropods, being mobile and often generalist feeders, may respond more subtly or variably.  \n\nNow, let’s break down the arthropods by their ecological roles, or **trophic levels**—a key way ecologists categorize species based on how they get their energy. Three main feeding groups were identified:  \n\n- **Detritivores**: 83 individuals from 21 species (10 families) that feed on dead organic matter, like leaf litter. These are nature’s recyclers, breaking down debris and returning nutrients to the soil.  \n- **Herbivores**: 167 individuals from 34 species (17 families) that feed on living plant tissue. These include insects like aphids, grasshoppers, and caterpillars.  \n- **Predators**: 166 individuals from 39 species (25 families), including omnivores and parasitoids (organisms that lay eggs in or on other insects, eventually killing them). This group includes spiders, beetles, and wasps that help control herbivore populations.  \n\nAdditionally, 8 individuals from the family Cecidomyiidae (gall midges, in the order Diptera) had unknown feeding habits. Since we can’t assign them to a trophic level with confidence, they were also omitted from trophic-level analyses—just like the 17 unidentified individuals mentioned earlier. This careful filtering ensures that conclusions about feeding roles are based on reliable data.  \n\nInterestingly, the researchers did *not* find the invasive leaf beetle *Ophraella communa*, a known specialist feeder on giant ragweed, despite its documented presence in Nagano Prefecture, Japan (Moriya and Shiyake, 2001). This absence is surprising because one might expect such a specialist to follow its host plant into invaded areas. Possible explanations could include time lags in spread, local environmental conditions unsuitable for the beetle, or sampling limitations (e.g., the beetle may be active at different times of day or year). This highlights an important point in ecology: just because a species *can* invade doesn’t mean it *will*—many factors influence whether a species successfully establishes itself.  \n\nNow, turning to abundance—the total number of individuals—the data show a significant effect of trophic level (F-test: $ F = 4.118 $, df = 2, $ p = 0.026 $; Fig. 4a). This means that some feeding groups are naturally more numerous than others in this ecosystem. More importantly, overall arthropod abundance was significantly higher in invaded areas compared to reference areas (F-test: $ F = 4.817 $, df = 1, $ p = 0.036 $; Fig. 3a). So, despite the plant invasion, the total number of arthropods actually *increased*. This might seem counterintuitive—often, invasions are assumed to reduce biodiversity—but here, the new plant may be providing more resources or shelter, leading to a boom in certain insect populations.  \n\nSpecies richness—the number of distinct species—also varied significantly by trophic level (F-test: $ F = 3.735 $, df = 2, $ p = 0.035 $; Fig. 4b). Again, this tells us that some feeding groups naturally support more species than others. Overall, species richness tended to be higher in invaded areas, though this difference was not quite statistically significant (F-test: $ F = 2.929 $, df = 1, $ p = 0.097 $; Fig. 4b). A p-value of 0.097 is close to the conventional threshold of 0.05, so we say the result shows a *trend* but not definitive evidence. In science, such near-significant results are often treated as hints—worth noting and possibly exploring in future studies with larger samples.  \n\nNext, the researchers examined **Simpson’s diversity index**, a measure that combines both species richness and evenness (how evenly individuals are distributed among species). A higher index means greater diversity. They found that the interaction between *area* (invaded vs. reference) and *trophic level* had a **marginally significant** effect on Simpson’s index (F-test: $ F = 3.274 $, df = 2, $ p = 0.053 $; Fig. 4c). Why is the interaction important? Because it suggests that the impact of plant invasion on diversity *depends on* the feeding group. In other words, invasion doesn’t affect all arthropods the same way—it might boost diversity in one group while leaving another unchanged.  \n\nSince the interaction was nearly significant, the researchers wisely chose to dig deeper and compare Simpson’s index *separately* for each trophic level. This is a smart analytical move: when an interaction is suggestive, breaking it down helps clarify where the real differences lie.  \n\n- For **detritivores**, there was no significant difference in diversity between invaded and reference areas (F-test: $ F = 0.773 $, df = 1, $ p = 0.405 $).  \n- For **herbivores**, similarly, no significant difference was found (F-test: $ F = 0.615 $, df = 1, $ p = 0.451 $).  \n- For **predators**, however, diversity appeared higher in invaded areas, with a p-value of 0.081 (F-test: $ F = 3.754 $, df = 1, $ p = 0.081 $; Fig. 4c). While still not statistically significant at the 0.05 level, this is the strongest signal among the three groups. It suggests that predator diversity may be responding positively to the invasion—perhaps because the new plant supports more prey, or creates more complex habitat for hunting.  \n\nSo, what’s the big picture? The invasion of giant ragweed has significantly altered arthropod community composition, though less dramatically than it changed plant communities. Total arthropod abundance is higher in invaded areas, and there are hints—especially among predators—that diversity may also be increasing. This challenges the common assumption that invasive plants always harm native biodiversity. Instead, the story is more nuanced: some groups may benefit, others remain unaffected, and the overall impact depends on ecological context.  \n\nSato et al.: Exotic plant invasion in a semi-natural grassland 57  \n\nFig. 2. NMDS plots with Bray-Curtis dissimilarity indices for (a) plant community composition, and (b) arthropod community composition, in invaded and reference areas. I1-I6 indicate quadrats in the invaded area, which is dominated by the exotic giant ragweed, *Ambrosia trifida*, and R1-R6 indicate quadrats in the reference area, which is dominated by the Japanese pampas grass, *Miscanthus sinensis*. Stress values in NMDS plots of plant and arthropod community compositions were 0.07 and 0.20. For the location of each area and quadrat, see Fig. 1.  \n\nJ. Dev. Sus. Agr. 12(1) 58  \n\nFig. 3. (a) Bar plots of plant abundance, (b) box plots of plant species richness, (c) box plots of plant species richness excluding exotic species and dominant species in each area, (d) box plots of Simpson's diversity index of plants, and (e"}},"metadata":{"paper_id":"004c5f5df5e03417c003b4d8fd07283b","csv_row":61296,"doi":"10.11178/jdsa.12.52","openalex_id":"https://openalex.org/W2620074143","pdf_url":"https://tsukuba.repo.nii.ac.jp/record/45006/files/JDSA_12_52.pdf","page_count":13,"text_chars":40351,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2386,"total_tokens":3303,"completion_tokens":917,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2247,"total_tokens":5501,"completion_tokens":3254,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":3.7564446926116943,"l5_seconds":20.511591911315918}},{"idx":25,"domain":"Academic paper","source":"CSV row 29417 · 2011 · 10.5582/bst.2011.v5.1.23","title":"Nrf2-mediated protection against UVA radiation in human skin keratinocytes","seg":"www.biosciencetrends.com\nBioScience Trends. 2011; 5(1):23-29.\nUV A irradiation are strong inducers of Nrf2 in FEK4 \nhuman skin fibroblasts but weak inducers of Nrf2 in \nhuman skin keratinocytes ( 10,14,15). To investigate \nif a moderate to high dose (400 kJ•m\n−2\n) of irradiation \naltered Nrf2 localization, HaCaT was exposed to this \ndose of irradiation. Results revealed a less than 2-fold \nincrease in Nrf2 protei\nn levels in HaCaT cells 4 and 8 \nh after UV A irradiation (Figure 2A). Immunostaining \nanalysis showed that Nrf2 protein was maintained \nin the nucleus of non-irradiated control cells, and it \naccumulated slightly in cells 4 and 8 h after this dose \nof irradiation. This result indicates that despite its \nactivation in skin fibroblasts ( 10,14) Nrf2 was not \nsignificantly activated in human skin keratinocytes \nfollowing UV A irradiation.\n3.3. Reduction of Nrf2 increased cell damage induced \nby 400 kJ•m\n–2\n of UVA in HaCaT cells\nA study demonstrated that a moderate dose (250 kJ•m\n−2\n) \nof UV A irradiation significantly induced the expression \nof Nrf2 in skin fibroblasts and that Nrf2 protected the \ncells against this dose of UV A irradiation-mediated \nmembrane damage, which was measured with an LDH \nassay ( 10). Nrf2 was expected to protect HaCaT skin \nkeratinocytes, though UV A irradiation caused only \na slight increase in Nrf2 protein levels and nuclear \naccumulation in these cells (Figure 2).\n To demonstrate the importance of Nrf2 in UV A \nirradiation-mediated cell damage, the Nrf2 gene was \nknocked down in HaCaT cells using siRNA. Knock \ndown of Nrf2 protein levels was confirmed by Western \nblotting analysis, which revealed a significant decrease \nin Nrf2 protein levels following siRNA transfection \n(\nFigure 3).\n Cell damage was demonstrated by the loss of \nthe integrity of the membrane, as gauged by LDH \nrelease and viability (MTT assay). HaCaT Cells were \npretreated with vehicle or scrambled siRNA and siNrf2 \nduring plating and grown to 90% confluence. Cells \nwere then either sham or UV A (400 kJ•m\n−2\n)-irradiated \nand further incubated in normal medium for 4 h. As \nshown in Figure 4, without UV A irradiation siRNA \nhad a negligible effect on the leakage of LDH and \nviability of HaCaT cells, but 400 kJ•m\n−2\n of UV A \nirradiation caused a 1.7-fold increase in LDH leakage, \nrepresenting a significant increase (Figure 4A). This \ndose of UV A irradiation caused a 10% decrease in \ncell viability (Figure 4B), representing a significant \nreduction in viability. UV A-induced LDH leakage was \nfurther increased to 2.3- and 2.5-fold by pre-treatment \nwith 10 and 50 nM of siNrf2, respectively ( p < 0.05) \n(Figure 4A). UV A-induced loss of viability was further \ni\nncreased to 15% and 20% by pre-treatment with 10 \nand 50 nM of siNrf2, respectively ( p < 0.05) (Figure \n4B). A different exon targeting siNrf2 also provided \nsimilar results (data not shown). These results indicate \nthat loss of Nrf2 significantly increased cell damage in \nhuman HaCaT keratinocytes irradiated with a moderate \nto high dose (400 kJ•m\n−2\n) of UV A.\n26\nFigure 1. Immunocytochemical analysis of morphology and vinculin pattern following UV A irradiation of HaCaT cells. \nCells were non-irradiated (sham) or irradiated with the doses indicated and then fixed and subjected to vinculin immunostaining \nfor 4 h following UV A irradiation, as described in the Materials and Methods.\n\nwww.biosciencetrends.com\nBioScience Trends. 2011; 5(1):23-29.\n4. Discussion\nExposure to excessive UV irradiation in the form \nof sunlight adversely affects the skin, causing \nerythema, sunburn, pigmentation, hyperplasia, \nimmunosuppression, skin","models":{"dsv4-flash":{"l5":"UV A irradiation are strong inducers of Nrf2 in FEK4 human skin fibroblasts but weak inducers of Nrf2 in human skin keratinocytes (10,14,15). To investigate if a moderate to high dose (400 kJ·m⁻²) of irradiation altered Nrf2 localization, HaCaT was exposed to this dose of irradiation. Results revealed a less than 2-fold increase in Nrf2 protein levels in HaCaT cells 4 and 8 h after UV A irradiation (Figure 2A). Immunostaining analysis showed that Nrf2 protein was maintained in the nucleus of non-irradiated control cells, and it accumulated slightly in cells 4 and 8 h after this dose of irradiation. This result indicates that despite its activation in skin fibroblasts (10,14), Nrf2 was not significantly activated in human skin keratinocytes following UV A irradiation.\n\nBefore we move on, let’s pause to make sure the key player here is clear. **Nrf2** (short for Nuclear factor erythroid 2-related factor 2) is a master regulator of the cell’s antioxidant defense. Think of it as a fire alarm system: when cells are stressed by something like UV light, Nrf2 should rush into the nucleus—the cell’s command center—and switch on a battery of protective genes. In skin fibroblasts (a type of connective tissue cell), UV A does trigger this alarm loudly. But in keratinocytes (the cells that make up the bulk of our outer skin layer), the alarm barely whispers. The data above show that even at a hefty dose of 400 kJ·m⁻², Nrf2 levels in HaCaT cells (a standard keratinocyte cell line) only creep up by less than 2-fold, and the protein stays mostly put in the nucleus even without any irradiation. This is a crucial clue: keratinocytes may not rely on Nrf2 as their primary defense against UV A, or they may use a different, slower pathway. Keep this in mind, because it sets the stage for the next experiment, where we ask: if we remove Nrf2 entirely, does the cell become more vulnerable?\n\n3.3. Reduction of Nrf2 increased cell damage induced by 400 kJ·m⁻² of UVA in HaCaT cells\n\nA study demonstrated that a moderate dose (250 kJ·m⁻²) of UV A irradiation significantly induced the expression of Nrf2 in skin fibroblasts and that Nrf2 protected the cells against this dose of UV A irradiation-mediated membrane damage, which was measured with an LDH assay (10). Nrf2 was expected to protect HaCaT skin keratinocytes, though UV A irradiation caused only a slight increase in Nrf2 protein levels and nuclear accumulation in these cells (Figure 2). To demonstrate the importance of Nrf2 in UV A irradiation-mediated cell damage, the Nrf2 gene was knocked down in HaCaT cells using siRNA. Knock down of Nrf2 protein levels was confirmed by Western blotting analysis, which revealed a significant decrease in Nrf2 protein levels following siRNA transfection (Figure 3).\n\nLet’s unpack this strategy. The researchers are essentially asking: *If Nrf2 is only weakly activated, does it still matter?* To answer this, they use a powerful tool called **siRNA** (small interfering RNA). This is like sending a targeted “mute” signal to a specific gene—here, the Nrf2 gene—so that the cell can’t produce the Nrf2 protein. The Western blot in Figure 3 confirms that the mute worked: Nrf2 levels dropped dramatically. Now, with Nrf2 out of the picture, the researchers can compare what happens to cells with and without this protective protein when they’re hit with UV A.\n\nCell damage was demonstrated by the loss of the integrity of the membrane, as gauged by LDH release and viability (MTT assay). HaCaT Cells were pretreated with vehicle or scrambled siRNA and siNrf2 during plating and grown to 90% confluence. Cells were then either sham or UV A (400 kJ·m⁻²)-irradiated and further incubated in normal medium for 4 h. As shown in Figure 4, without UV A irradiation siRNA had a negligible effect on the leakage of LDH and viability of HaCaT cells, but 400 kJ·m⁻² of UV A irradiation caused a 1.7-fold increase in LDH leakage, representing a significant increase (Figure 4A). This dose of UV A irradiation caused a 10% decrease in cell viability (Figure 4B), representing a significant reduction in viability. UV A-induced LDH leakage was further increased to 2.3- and 2.5-fold by pre-treatment with 10 and 50 nM of siNrf2, respectively (p < 0.05) (Figure 4A). UV A-induced loss of viability was further increased to 15% and 20% by pre-treatment with 10 and 50 nM of siNrf2, respectively (p < 0.05) (Figure 4B). A different exon targeting siNrf2 also provided similar results (data not shown). These results indicate that loss of Nrf2 significantly increased cell damage in human HaCaT keratinocytes irradiated with a moderate to high dose (400 kJ·m⁻²) of UV A.\n\nLet’s break down what these numbers mean. **LDH** (lactate dehydrogenase) is an enzyme that normally lives inside the cell. If the cell membrane gets damaged—like a leaky boat—LDH spills out into the surrounding fluid. So measuring LDH in the culture medium is like checking for water outside a submarine: the more LDH outside, the more holes in the membrane. **MTT assay** is a different readout: it measures how many cells are still alive and metabolically active. Think of it as a headcount of healthy cells.\n\nHere’s the story the data tell. Without UV, silencing Nrf2 does almost nothing—cells are fine, membranes intact. But when you hit the cells with UV, the damage is real: LDH leakage jumps 1.7-fold, and viability drops by 10%. Now, if you also remove Nrf2 (with siNrf2), the damage gets worse. LDH leakage climbs to 2.3-fold (with 10 nM siNrf2) and 2.5-fold (with 50 nM siNrf2). Viability drops further, to 15% and 20% loss, respectively. The fact that a higher dose of siNrf2 causes more damage suggests a dose-dependent effect—more Nrf2 loss, more vulnerability. And the fact that a second, independent siNrf2 (targeting a different part of the gene) gives the same result rules out off-target effects. So even though UV A only weakly activates Nrf2 in keratinocytes, Nrf2 still plays a meaningful protective role. It’s not the star of the show, but it’s a crucial supporting actor.\n\n26\n\nFigure 1. Immunocytochemical analysis of morphology and vinculin pattern following UV A irradiation of HaCaT cells. Cells were non-irradiated (sham) or irradiated with the doses indicated and then fixed and subjected to vinculin immunostaining for 4 h following UV A irradiation, as described in the Materials and Methods.\n\nwww.biosciencetrends.com\nBioScience Trends. 2011; 5(1):23-29.\n\n4. Discussion\n\nExposure to excessive UV irradiation in the form of sunlight adversely affects the skin, causing erythema, sunburn, pigmentation, hyperplasia, immunosuppression, skin"},"qwen3-235b-a22b":{"l5":"www.biosciencetrends.com  \nBioScience Trends. 2011; 5(1):23-29.  \n\nUVA irradiation is known to strongly activate the Nrf2 pathway in FEK4 human skin fibroblasts—cells that provide structural support in the skin—but only weakly activates Nrf2 in human skin keratinocytes, which are the primary cell type in the outermost layer of the skin (10,14,15). This difference is important because Nrf2 is a key regulatory protein that helps protect cells from oxidative stress, such as that caused by UV radiation. When activated, Nrf2 moves into the nucleus and turns on a network of antioxidant and detoxifying genes, essentially putting the cell into defense mode.\n\nGiven this, researchers wanted to explore whether a moderate to high dose of UVA radiation—specifically 400 kJ·m⁻²—could still influence Nrf2 activity in keratinocytes, even if previous studies suggested only weak activation. To test this, they used HaCaT cells, a well-established model of human skin keratinocytes, and exposed them to this high dose of UVA. They then measured Nrf2 protein levels at 4 and 8 hours after irradiation.\n\nThe results, shown in Figure 2A, revealed only a modest increase—less than two-fold—in Nrf2 protein levels after irradiation. That’s a relatively small change, especially when compared to the robust activation seen in fibroblasts under similar conditions. But protein levels aren’t the whole story. Where the protein is located in the cell matters just as much. So the researchers also performed immunostaining to visualize where Nrf2 was located within the HaCaT cells.\n\nHere’s what they found: even in the *non-irradiated* control cells, Nrf2 was already present in the nucleus. This is unusual because in most cell types, Nrf2 is normally held in the cytoplasm and only moves into the nucleus when activated by stress. The fact that it’s already nuclear in unstimulated HaCaT cells suggests that these keratinocytes may have a baseline level of Nrf2 activity, possibly as a preemptive defense mechanism given their frontline position in the skin.\n\nAfter UVA irradiation, there was only a slight additional accumulation of Nrf2 in the nucleus at 4 and 8 hours. While this hints at some level of activation, it’s not a dramatic response. Taken together, these findings indicate that despite Nrf2 being a powerful protector in skin fibroblasts when activated by UVA (as shown in earlier studies (10,14)), it does not become significantly activated in human skin keratinocytes—even under a relatively high dose of UVA radiation. This raises an important question: if Nrf2 isn’t strongly turned on in keratinocytes after UV exposure, does it still play a meaningful protective role in these cells?\n\n### 3.3. Reduction of Nrf2 increased cell damage induced by 400 kJ·m⁻² of UVA in HaCaT cells\n\nWe know from prior research that in skin fibroblasts, a moderate dose of UVA (250 kJ·m⁻²) significantly boosts Nrf2 expression, and this increase helps protect the cells from membrane damage caused by oxidative stress. That damage is typically measured using the LDH (lactate dehydrogenase) assay, which detects when cell membranes become leaky—a clear sign of injury.\n\nSo, even though UVA only causes a small rise in Nrf2 levels and nuclear presence in HaCaT keratinocytes, could Nrf2 still be playing a subtle but important protective role? To answer this, the researchers used a powerful technique called gene knockdown. Specifically, they used small interfering RNA (siRNA) to reduce the expression of the Nrf2 gene in HaCaT cells. This approach allows scientists to \"turn down\" a specific protein and observe what happens when it’s missing—like removing a single player from a sports team to see how the team performs.\n\nAfter transfecting the cells with siRNA targeting Nrf2 (siNrf2), they confirmed the knockdown using Western blotting, a method that detects protein levels. The results (Figure 3) showed a clear and significant reduction in Nrf2 protein, meaning the intervention worked as intended.\n\nNow came the critical test: how would these Nrf2-deficient cells respond to UVA radiation? To assess cell damage, the researchers looked at two key indicators: membrane integrity and cell viability.\n\n- **Membrane integrity** was measured by the LDH assay: when cells are damaged, LDH leaks out into the surrounding medium. More LDH release = more damage.\n- **Cell viability** was assessed using the MTT assay, which measures the metabolic activity of living cells. A drop in MTT signal means fewer healthy, functioning cells.\n\nThe experimental setup was carefully designed:\n- HaCaT cells were pretreated with either a control (scrambled) siRNA or Nrf2-targeting siRNA (siNrf2) at two concentrations: 10 nM and 50 nM.\n- Cells were grown to 90% confluence (almost a full layer) to mimic natural tissue density.\n- Then, they were either not irradiated (sham) or exposed to 400 kJ·m⁻² of UVA.\n- After irradiation, cells were incubated for 4 more hours in normal growth medium to allow damage responses to develop.\n\nLet’s walk through the results step by step.\n\nIn the absence of UVA (sham condition), neither the scrambled siRNA nor siNrf2 caused much LDH leakage or loss of viability (Figure 4A and 4B). This is reassuring—it means the siRNA treatment itself isn’t toxic. The cells are healthy and intact without radiation.\n\nBut when cells were exposed to UVA:\n- Control cells (treated with scrambled siRNA) showed a **1.7-fold increase in LDH leakage** (Figure 4A), indicating significant membrane damage.\n- Their viability dropped by about **10%** (Figure 4B), which is a measurable but not catastrophic loss.\n\nNow, here’s where it gets interesting: when Nrf2 was knocked down before UVA exposure, the damage got noticeably worse.\n\n- With **10 nM siNrf2**, LDH leakage jumped to **2.3-fold** higher than control.\n- With **50 nM siNrf2**, it increased even further—to **2.5-fold** (p < 0.05), meaning the difference is statistically significant.\n- Similarly, the loss of viability increased from 10% to **15% and 20%**, respectively, with the two doses of siNrf2 (Figure 4B).\n\nTo make sure this wasn’t an off-target effect (i.e., the siRNA accidentally disrupting another gene), the researchers tested a second siRNA that targeted a different part (exon) of the Nrf2 gene. It produced the same result—increased damage—confirming that the effect was specifically due to reduced Nrf2.\n\nWhat does all this mean? Even though UVA doesn’t strongly *activate* Nrf2 in HaCaT keratinocytes, Nrf2 still plays a crucial protective role. Think of it like a smoke detector that’s already on standby. You don’t need to turn it on during a fire—it’s already active enough to help. In this case, even the baseline or slightly elevated level of Nrf2 is doing important work shielding the cells from UV-induced damage.\n\nSo, while keratinocytes don’t mount a strong Nrf2 response to UVA like fibroblasts do, the Nrf2 they *do* have is functionally important. Removing it makes the cells significantly more vulnerable. This tells us that Nrf2 is a key defender in human skin keratinocytes, even in the absence of robust induction by UVA.\n\nThese findings highlight a subtle but vital point in cellular defense mechanisms: sometimes, protection doesn’t come from a dramatic on-switch, but from a quiet, constant readiness. And disrupting that readiness—even slightly—can have real consequences.\n\n26  \nFigure 1. Immunocytochemical analysis of morphology and vinculin pattern following UVA irradiation of HaCaT cells.  \nCells were non-irradiated (sham) or irradiated with the doses indicated and then fixed and subjected to vinculin immunostaining  \nfor 4 h following UVA irradiation, as described in the Materials and Methods.  \n\nwww.biosciencetrends.com  \nBioScience Trends. 2011; 5(1):23-29.  \n4. Discussion  \nExposure to excessive UV irradiation in the form  \nof sunlight adversely affects the skin, causing  \nerythema, sunburn, pigmentation, hyperplasia,  \nimmunosuppression, skin"}},"metadata":{"paper_id":"0026d68ff835c45a45e42ee051a76106","csv_row":29417,"doi":"10.5582/bst.2011.v5.1.23","openalex_id":"https://openalex.org/W2105559500","pdf_url":"https://www.jstage.jst.go.jp/article/bst/5/1/5_2011.v5.1.23/_pdf","page_count":7,"text_chars":29303,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2360,"total_tokens":3194,"completion_tokens":834,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2221,"total_tokens":3826,"completion_tokens":1605,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":3.872260808944702,"l5_seconds":10.625709295272827}},{"idx":26,"domain":"Academic paper","source":"CSV row 53220 · 2012 · 10.5772/37339","title":"Infrared Spectroscopy as a Tool to Monitor Radiation Curing","seg":"Fig. 3. Conversion curve and Rp curve as a function of irradiation time for a radical induced \npolymerization [Fouassier & Rabek, 1993]. \n2.2 Presence of O2 \nThe free radicals formed by the photolysis of the initiator are rapidly scavenged by O 2 \nmolecules to yield peroxyl radicals. These sp ecies are not reactive towards the acrylate \ndouble bonds and can therefore not initiate or participate in any polymerization reaction. \nAn additional amount of photoinitiator (and of UV energy) is therefore needed to \nconsume/compensate the oxygen dissolved in the resin, as well as the atmospheric O 2 \ndiffusing into the sample duri ng the UV exposure, in order to obtain coatings with the \ndesired mechanical properties and tack-free surfaces. \nwww.intechopen.com\n\nInfrared Spectroscopy as a Tool to Monitor Radiation Curing \n \n329 \nOvercoming this unwanted reaction has turned into a major challenge. Different methods \nhave been considered: A clear, illustrative example is reported in Figure 4 in which the effect \nof air and inert atmosphere (CO 2 and N 2) was investigated [Studer et al., 2003]. In the \npresence of air, the polymerization starts after an induction period of 0.2 s, at a speed four \ntimes lower than that in an inert atmosphere (F ig. 4). After 0.35 s, once 15% of the acrylate \ndouble bonds have polymerized, the reaction begins alread y to slow down because of the \ncontinuous diffusion of air into the sample. To prevent the diffusion of oxygen into the \nsample, a UV-transparent polypropylene (PP) f ilm was placed on top of the liquid coating \n(laminated sample). The induction period is then slightly shorter than in air (oxygen is still \ndissolved in the film) and the polymerization proc eeds three times faster than in air to reach \nan 85% conversion by the end of the UV-irradiation (35 s). \n \nFig. 4. Conversion curves as a function of irradiation time. Profiles recorded by RT-FTIR \nspectroscopy for a PUA (Polyurethane) resin exposed to UV light under different \natmospheres and with a PP-film as oxygen barrier (“laminate”). [Studer et al., 2003] \n2.3 Photoinitiator \nThe efficiency of the radical photo-initiator can be described by two quantum yields: The \nquantum yields of initiation, which represents the number of starting polymer chains per \nphotons absorbed, and the quantum yields of polymerization, which is the number of monomer \nunits polymerized per photons absorbed. Therefore, it is clear that if the monomers are \nabsorbing in the same UV range as the photoi nitiator the competition will limit the photons \nabsorbed by the latter. This can lead to a de crease of quantum yiel ds and therefore to a \nlower degree of conversion as well as polymerization rate. In such cases special care needs \nto be taken when selecting the proper phot oinitiator. This issue becomes particularly \nimportant when dealing with formulations containing fillers which absorb light in the same \nspectral range as the photoinitiator. \nwww.intechopen.com\n\nInfrared Spectroscopy – Materials Science, Engineering and Technology \n \n330 \nIn Figure 5 the UV-Vis spectra of a radical photoinitiator and the BaTiO 3 (BT) filler that \nwas used in an acrylic formulation are presented. It is evident that there is a competitiv e \nabsorption between the photo-initiator and the ceramic powder in the UV region bet ween \n200 and 400 nm. That leads to a linear decrease of acrylic double bond during UV \nirradiation by increasing the filler content in the photocurable formulation [Lo mbardi et \nal., 2011]. \n \nFig. 5. UV-VIS spectra of the 2-hydroxy-2-methyl-1-phenyl-propan-1-one (DAROCUR® \n1173, Ciba®) photo-initiator and the BaTiO3 (BT) filler. [Lombardi et al., 2011] \n2.4 Monomers \nFrom the slope of the RT-FTIR kinetic curves it is easy to evaluate the rate of polymerization \n(Rp) which can be calculated at any moment of the reaction. It is therefore possible to plot \nthe R p values as a function of the conversion rate. The overall polymerization quantum \nyield, p, can be calculated from the ratio of polymerization, R p, over the absorbed light \nintensity. \nIn a pioneer study from Christian Decker the photopolymerization of polyurethane-\ndiacrylates was","models":{"dsv4-flash":{"l5":"Fig. 3. Conversion curve and Rp curve as a function of irradiation time for a radical induced polymerization [Fouassier & Rabek, 1993].\n\n### 2.2 The Presence of O₂: Oxygen as the Polymerization Spoiler\n\nNow that we have seen how a radical polymerization proceeds under ideal conditions, we must confront a very real and pervasive problem: oxygen. The air we breathe is roughly 21% molecular oxygen (O₂), and this seemingly benign gas is a formidable enemy to radical polymerization.\n\nWhen a photoinitiator absorbs UV light and breaks apart to form free radicals, these highly reactive species are immediately attacked by any oxygen molecules present. The oxygen acts like a trap, quickly reacting with the radical to form a new species called a *peroxyl radical*. \n\nLet's pause and think about this new molecule. The original radical was hungry to react with the acrylate double bond to start a polymer chain. The peroxyl radical, however, is a much more stable and \"lazy\" species. It is not reactive towards the acrylate double bonds. This means it cannot initiate a new polymer chain, nor can it participate in the growth of an existing one. In essence, every radical that reacts with oxygen is a radical that is lost for the polymerization reaction.\n\nThis has a direct and costly consequence. To get the desired result—a hard, tack-free coating with good mechanical properties—you need a certain number of polymer chains to form. If oxygen is \"stealing\" your radicals, you must compensate. This means you need to add *more* photoinitiator to the formulation and expose the sample to *more* UV energy. This extra energy and initiator are not used to build the polymer network; they are simply consumed to neutralize the oxygen. This includes both the oxygen that was initially dissolved in the resin and the atmospheric oxygen that continuously diffuses into the sample during the entire UV exposure.\n\nOvercoming this unwanted reaction has turned into a major challenge. Different methods have been considered. A clear, illustrative example is reported in Figure 4, in which the effect of air and inert atmosphere (CO₂ and N₂) was investigated [Studer et al., 2003]. In the presence of air, the polymerization starts after an induction period of 0.2 s, at a speed four times lower than that in an inert atmosphere (Fig. 4). After 0.35 s, once 15% of the acrylate double bonds have polymerized, the reaction begins already to slow down because of the continuous diffusion of air into the sample. To prevent the diffusion of oxygen into the sample, a UV-transparent polypropylene (PP) film was placed on top of the liquid coating (laminated sample). The induction period is then slightly shorter than in air (oxygen is still dissolved in the film) and the polymerization proceeds three times faster than in air to reach an 85% conversion by the end of the UV-irradiation (35 s).\n\nFig. 4. Conversion curves as a function of irradiation time. Profiles recorded by RT-FTIR spectroscopy for a PUA (Polyurethane) resin exposed to UV light under different atmospheres and with a PP-film as oxygen barrier (\"laminate\"). [Studer et al., 2003]\n\n### 2.3 The Photoinitiator: A Matter of Light Competition\n\nWe have established that the photoinitiator is the engine of the reaction, but how do we measure its efficiency? The efficiency of the radical photo-initiator can be described by two quantum yields: The quantum yields of initiation, which represents the number of starting polymer chains per photons absorbed, and the quantum yields of polymerization, which is the number of monomer units polymerized per photons absorbed. \n\nThink of these as two different \"fuel efficiency\" ratings. The first tells you how many engines (polymer chains) you can start with a single unit of fuel (a photon). The second tells you how many miles (monomer units added) you can travel per unit of fuel. A highly efficient photoinitiator will have high values for both.\n\nTherefore, it is clear that if the monomers are absorbing in the same UV range as the photoinitiator, the competition will limit the photons absorbed by the latter. This can lead to a decrease of quantum yields and therefore to a lower degree of conversion as well as polymerization rate. In such cases, special care needs to be taken when selecting the proper photoinitiator. This issue becomes particularly important when dealing with formulations containing fillers which absorb light in the same spectral range as the photoinitiator.\n\nIn Figure 5, the UV-Vis spectra of a radical photoinitiator and the BaTiO₃ (BT) filler that was used in an acrylic formulation are presented. It is evident that there is a competitive absorption between the photo-initiator and the ceramic powder in the UV region between 200 and 400 nm. That leads to a linear decrease of acrylic double bond during UV irradiation by increasing the filler content in the photocurable formulation [Lombardi et al., 2011].\n\nFig. 5. UV-VIS spectra of the 2-hydroxy-2-methyl-1-phenyl-propan-1-one (DAROCUR® 1173, Ciba®) photo-initiator and the BaTiO₃ (BT) filler. [Lombardi et al., 2011]\n\n### 2.4 Monomers: Reading the Kinetics\n\nFrom the slope of the RT-FTIR kinetic curves it is easy to evaluate the rate of polymerization (Rp) which can be calculated at any moment of the reaction. It is therefore possible to plot the Rp values as a function of the conversion rate. The overall polymerization quantum yield, Φp, can be calculated from the ratio of polymerization, Rp, over the absorbed light intensity.\n\nIn a pioneer study from Christian Decker, the photopolymerization of polyurethane-diacrylates was"},"qwen3-235b-a22b":{"l5":"Fig. 3. Conversion curve and Rp curve as a function of irradiation time for a radical induced  \npolymerization [Fouassier & Rabek, 1993].  \n\n## 2.2 Presence of O₂  \n\nLet’s step into the lab for a moment and imagine we’re shining UV light on a liquid resin to turn it into a solid coating—like curing a nail polish or a protective layer on a smartphone screen. The process starts when a *photoinitiator* molecule absorbs UV light and breaks apart into *free radicals*, which are highly reactive fragments that kickstart polymerization by attacking double bonds in acrylate monomers.  \n\nBut here’s a hidden enemy: oxygen (O₂). Even though we don’t see it, O₂ is floating around in the air and dissolved in the resin. When those freshly formed free radicals meet O₂, they don’t get to start polymerization. Instead, they’re instantly intercepted and converted into *peroxyl radicals*.  \n\nNow, why does that matter?  \n\nPeroxyl radicals are like overcautious workers—they’re too stable and unreactive to attack acrylate double bonds. They just wander off without starting any chains. So, every radical that gets scavenged by oxygen is a wasted opportunity to build polymer chains. This means the polymerization reaction can’t begin in earnest until all the available oxygen is used up.  \n\nThis creates two big problems:  \n1. **Oxygen already dissolved** in the resin must be consumed before polymerization can start.  \n2. **More oxygen keeps diffusing in** from the air above the sample during UV exposure, especially at the surface.  \n\nSo, we’re fighting a constant battle. To win it, we need extra photoinitiator—and more UV energy—to generate enough radicals not just to start polymerization, but first to *neutralize* all the oxygen. Only then can the real curing begin.  \n\nThis delay is called the **induction period**, and it directly impacts how fast and how completely the material cures. If we don’t compensate for oxygen, we end up with soft, sticky surfaces (called \"tackiness\") and weak mechanical properties—definitely not what we want in a durable coating.  \n\nOvercoming this unwanted reaction has turned into a major challenge. Different methods  \nhave been considered: A clear, illustrative example is reported in Figure 4 in which the effect  \nof air and inert atmosphere (CO₂ and N₂) was investigated [Studer et al., 2003].  \n\nLet’s look at what happens in practice. In **air**, the polymerization doesn’t start right away. There’s a **0.2-second delay**—the induction period—while radicals are busy neutralizing oxygen. When the reaction finally kicks in, it proceeds at only **one-fourth the speed** compared to an oxygen-free environment.  \n\nEven worse: after just **0.35 seconds**, when only **15%** of the acrylate double bonds have reacted, the polymerization begins to slow down. Why? Because fresh oxygen is continuously diffusing into the sample from the air above, creating a never-ending supply of radical scavengers.  \n\nNow, here’s a clever fix: what if we put a barrier on top?  \n\nResearchers placed a thin, **UV-transparent polypropylene (PP) film** over the liquid resin—like sealing it with plastic wrap. This film acts as an **oxygen barrier**, blocking atmospheric oxygen from entering. This setup is called a “laminated sample.”  \n\nThe result? The induction period shortens slightly (some oxygen is still trapped in the resin itself), but now the polymerization proceeds **three times faster** than in air. And by the end of 35 seconds of UV exposure, the conversion reaches **85%**—a dramatic improvement.  \n\nThis shows how critical oxygen management is in real-world applications. Whether you’re making dental fillings, optical fibers, or industrial coatings, controlling the atmosphere or using physical barriers can make the difference between success and failure.  \n\nFig. 4. Conversion curves as a function of irradiation time. Profiles recorded by RT-FTIR  \nspectroscopy for a PUA (Polyurethane) resin exposed to UV light under different  \natmospheres and with a PP-film as oxygen barrier (“laminate”). [Studer et al., 2003]  \n\n## 2.3 Photoinitiator  \n\nNow let’s zoom in on the star of the show: the **photoinitiator**. Its job is to absorb light and generate radicals efficiently. But how do we measure its performance?  \n\nWe use two key metrics called **quantum yields**—these tell us how good the photoinitiator is at converting light into useful chemical reactions.  \n\n- **Quantum yield of initiation (Φᵢ):** This is the number of *polymer chains started* per photon absorbed. Think of it as “how many fires can one spark light?”  \n- **Quantum yield of polymerization (Φₚ):** This is the number of *monomer units* that get added into polymer chains per photon absorbed. It reflects the overall efficiency of turning light into polymer.  \n\nIdeally, every photon absorbed would lead to a long chain of monomers being linked together. But reality gets in the way.  \n\nHere’s a critical issue: **competition for light**.  \n\nIf the *monomers themselves* absorb UV light in the same wavelength range as the photoinitiator, they’re essentially stealing photons. The photoinitiator can’t generate radicals if it doesn’t get enough light.  \n\nSo even if we shine plenty of UV on the sample, much of it might be absorbed by the wrong molecules—monomers or other additives—leaving the photoinitiator starved. This reduces both quantum yields, leading to **slower polymerization** and a **lower final conversion**.  \n\nThis isn’t just theoretical. It becomes a real headache when formulating resins with **fillers**—solid particles added to improve mechanical strength, thermal stability, or other properties. Some fillers, like certain ceramics, also absorb UV light.  \n\nIn Figure 5 the UV-Vis spectra of a radical photoinitiator and the BaTiO₃ (BT) filler that  \nwas used in an acrylic formulation are presented. It is evident that there is a competitive  \nabsorption between the photo-initiator and the ceramic powder in the UV region between  \n200 and 400 nm. That leads to a linear decrease of acrylic double bond during UV  \nirradiation by increasing the filler content in the photocurable formulation [Lombardi et al., 2011].  \n\nLet’s unpack that.  \n\nFig. 5. UV-VIS spectra of the 2-hydroxy-2-methyl-1-phenyl-propan-1-one (DAROCUR®  \n1173, Ciba®) photo-initiator and the BaTiO₃ (BT) filler. [Lombardi et al., 2011]  \n\nYou can see that both the photoinitiator (DAROCUR 1173) and the BaTiO₃ filler absorb strongly in the same UV range. As more filler is added, less light reaches the photoinitiator. It’s like trying to sunbathe under an increasingly shady tree—the more leaves (filler), the less sunlight (UV) hits your skin (photoinitiator).  \n\nThe result? A **linear drop** in the rate of double bond consumption. More filler → less initiation → slower cure.  \n\nSo, when designing a formulation, you can’t just pick any photoinitiator. You have to **match its absorption profile** to the transmission window of the rest of the system. Otherwise, you’re wasting energy and money.  \n\nThis is why formulation science is both art and engineering: balancing reactivity, transparency, cost, and performance.  \n\n## 2.4 Monomers  \n\nNow that we understand how radicals are generated and how oxygen and light absorption affect the process, let’s shift focus to the building blocks themselves: the **monomers**.  \n\nOne of the most powerful tools we have is **RT-FTIR spectroscopy** (Real-Time Fourier Transform Infrared Spectroscopy). It lets us watch the reaction as it happens, second by second.  \n\nSpecifically, we can track the disappearance of the **acrylate C=C double bond peak** around 810 cm⁻¹. As polymerization proceeds, this peak shrinks. By measuring how fast it decreases, we can calculate the **rate of polymerization (Rₚ)** at any point in time.  \n\nIn fact, if we plot Rₚ against the **conversion** (i.e., how much of the double bonds have reacted), we get a kinetic profile that reveals everything: induction periods, maximum speed, and how the reaction slows down as viscosity increases or oxygen interferes.  \n\nBut we can go deeper.  \n\nThe **overall polymerization quantum yield (Φₚ)**—remember, the number of monomers polymerized per photon absorbed—can be calculated using a simple but powerful relationship:  \n\n\\[\n\\phi_p = \\frac{R_p}{I_a}\n\\]  \n\nwhere:  \n- \\( R_p \\) = rate of polymerization (in mol·L⁻¹·s⁻¹)  \n- \\( I_a \\) = intensity of *absorbed* light (in einstein·L⁻¹·s⁻¹)  \n\nThis equation connects the macroscopic world (how fast the material is curing) to the microscopic world (how efficiently photons are being used).  \n\nA high Φₚ means we’re getting a lot of polymer per photon—ideal for energy-efficient curing. A low Φₚ suggests losses, perhaps due to oxygen, poor initiator choice, or competitive absorption.  \n\nIn a pioneer study from Christian Decker the photopolymerization of polyurethane-diacrylates was"}},"metadata":{"paper_id":"0042c2ea041f3972f31f36b3960f627d","csv_row":53220,"doi":"10.5772/37339","openalex_id":"https://openalex.org/W2102476075","pdf_url":"https://www.intechopen.com/citation-pdf-url/36181","page_count":14,"text_chars":25751,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2371,"total_tokens":3240,"completion_tokens":869,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2232,"total_tokens":3443,"completion_tokens":1211,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":3.506167411804199,"l5_seconds":8.44801926612854}},{"idx":27,"domain":"Academic paper","source":"CSV row 49372 · 2016 · 10.1007/s10948-016-3666-0","title":"Conductivity in Cuprates Arises from Two Different Sources: One-Electron Exchange and Disproportionation","seg":"J Supercond Nov Magn (2017) 30:275–285 279\nis switched on, the parabola acting with the field is moved\ndown compared to the other one, in such a way that the\nheight of the barrier is decreased.\nThe height of the barrier for forward (E\n+) and backward\ntransfer (E−) in the presence of a field E can be expressed\nas [5]\nE± = λ\n4\n(\n1 ± eEa\nλ\n) 2\n= λ\n4 ± eEa\n2 + (eEa)2\n4λ (12)\nThe rate of ET between the two molecules is:\nk± = νnκ · exp\n(\n− E±\nkBT\n)\n(13)\nνn is the frequency for the vibrational mode that is cou-\npled to till ET (we assume one unique mode). T is the\ntemperature and kB the Boltzmann constant. Correspond-\ning modes induce ET. In the case of metal complexes, the\nrelevant mode is the breathing or half-breathing mode at\n500–600 cm−1.\nWe thus calculate the difference between the forward and\nbackward rates for ET. If E is small, the third term in (12)\nmay be neglected, and we obtain after Taylor expansion:\nk+ − k− = νnκ\n[\nexp\n(\n− E+\nkBT\n)\n− exp\n(\n− E−\nkBT\n)]\n≈ νnκ · eEa\nkBT · exp\n(\n− λ\n4kBT\n)\n(14)\nκ is called the electronic factor and is equal to [3]\nκ = 2\n[ 1 − exp(−νel/2νn)\n2 − exp(−νel/2νn)\n]\n; νel = /Delta12\n4πℏ\n( π3\nλkBT\n) 1/2\n(15)\nνel is called the “electronic frequency”, while νn is the\nnuclear frequency. κ and νel will be derived below.\nAccording ( 9), (11), and (14) the total current can be\nexpressed as\nσ = J\nE = νnκ · ne2a2\nkBT · exp\n(\n− λ\n4kBT\n)\n(16)\nprovided that /Delta1is small.\nIn the caseνel <<ν n, we obtainκ = νel/νn in (15). If this\nis inserted in (29), we obtain a conductivity proportional to\nthe square of the coupling (/Delta12), independent of the nuclear\nfrequency νn\nσ = J\nE = ne2a2\nkBT · /Delta12\n4πh\n( π3\nλkBT\n) 1/2\n· exp\n(\n− λ\n4kBT\n)\n(17)\nwhere n is the concentration of carriers.\nThe result in (17) is shown in Fig. 5. We notice that the\nsame equation is used both in t
