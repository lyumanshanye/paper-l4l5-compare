ee of any MEN2A associated lesions.\nDue to the fact that MEN2A syndrome is inherited in an \nautosomal dominant way, genetic counseling and genetic testing \nof first degree relatives are indicated ( Wells et  al., 2015 ). The \ndetailed family history revealed that the patient’s mother and \nher aunt had breast cancer and both died due to brain metastases. \nThis unexpected clinical presentation was suspicious to hereditary \nbreast cancer syndrome. However, no samples for mutation \nanalysis of BRCA1/2 genes were available from these two \naffected relatives. Hereditary breast cancer is also an autosomal \ndominant disorder mutation, and thus, analysis is recommended \nfor the first-degree relatives ( Moyer, 2014 ). Accordingly, the \nmutation analysis of BRCA1/2 genes identified a pathogenic, \nheterozygous frameshift BRCA1 mutation ( BRCA1 Ile90Serfs, \nNC_000017.10:g.41256905_41256917 delTGAAAAGCACAAA) \nin the proband ( Figure 1B ). Clinical examination and breast \nmagnetic resonance imaging (MRI) revealed no sign of \nmalignancy in the breasts, and 6 years after initial examination \nstill no signs of breast or ovarian cancer are present. After \nthese striking results, the patient’s family members underwent \ngenetic counseling again and, after obtaining informed consent, \nunderwent mutation testing for the RET exon 11 and BRCA1 \ngenes. The proband’s brother (age: 36  years) and his two sons \n(age: 4 and 6  years) were also heterozygotes for the RET \np.C634W mutation, but the BRCA1 mutation was absent in \nthem. In her brother, two thyroid masses and elevated serum \ncalcitonin level (215 pg/ml) were observed. Total thyroidectomy \nwas performed, and his serum calcitonin returned to normal \nrange. Two sons of the proband’s brother underwent prophylactic \nthyroidectomy, and the histopathological examination of the \nremoved tissues showed no signs of MTC. The proband’s father \ndid not carry the RET mutation and the BRCA1 mutation. \nThe pedigree of the family is shown in Figure 1C.\nDISCUSSION\nTo the best of our knowledge, we  present the first patient \nwho carries both RET and BRCA1 pathogenic germline mutations. \nThe combination of two hereditary cancer syndromes is extremely \nrare and represents a challenging situation regarding routine \nfollow-up screening and patient’s management. The prevalence \nof MEN2 syndrome is approximately 1:30,000 ( Kloos et  al., \n2009), whereas the estimated prevalence of BRCA1/2 mutations \nin general population varies between 1:330 and 1:500 ( Moyer, \n2014). Therefore, co-harboring a RET and BRCA1 mutations \nis extremely rare; it may be  approximately 1:10–15,000,000. \nThis is in line with data deposited in a database containing \ncases where two pathogenic mutations in genes encoding \nhereditary cancers were identified. In this database, only 39 \ncases have been uploaded ( Stradella et  al., 2018 ). It should \nbe  noted that in NGS cancer gene panel RET or MEN1 genes \nare not studied. A panel sequencing of 64 genes by Shin et  al. \nrevealed that of 252 breast cancer patients, 67 patients (26.8%) \ncarried 77 pathogenic mutations (12 in BRCA1, 13 in BRCA2, \n9 in CDH1, 3 in FH, 5 in MSH2, 2 in MSH6, 4 in NAT1, 6 \nin PTCH1, 3 in RAD51, 7 in RET, 4 in SPINK1, 3 in TP53 \nand one each in ALK, BRIP1, CHEK2, MLH2, MUTYH, and \nPTEN). However, all these seven RET mutations were identified \nin BRCA negative cases ( Shin et  al., 2017 ).\nBased on the pedigree and genetic analysis (absence of the \nRET mutation in our proband’s father), it","models":{"dsv4-flash":{"l5":"Sarkadi et al. Coincidence of a BRCA1 and RET Mutations\n\nFrontiers in Genetics | www.frontiersin.org 3 June 2019 | Volume 10 | Article 544\n\nThe 24-hour urine collection showed no elevation of metanephrines, which are breakdown products of catecholamines (hormones like adrenaline). This is an important negative result: it tells us that the patient does not have a tumor that secretes these hormones, which is a key feature of pheochromocytoma, a tumor commonly associated with MEN2A. Similarly, the serum intact parathormone level was normal, ruling out hyperparathyroidism. So, despite carrying a known MEN2A-causing mutation, the patient has not developed any of the classic MEN2A-associated tumors (medullary thyroid carcinoma, pheochromocytoma, or parathyroid adenoma) during the 6-year follow-up period. This is clinically reassuring but also raises an important question: why is this patient protected, or is it just a matter of time?\n\nBecause MEN2A is inherited in an autosomal dominant pattern, meaning that a single copy of the mutated *RET* gene is enough to cause the syndrome, it is standard practice to offer genetic counseling and testing to all first-degree relatives (parents, siblings, and children) of an affected individual (Wells et al., 2015). When the family history was taken in detail, a striking pattern emerged: the patient’s mother and her aunt both had breast cancer, and both tragically died from brain metastases. This is a classic red flag for hereditary breast cancer syndrome, which is also autosomal dominant. Unfortunately, no tissue samples from these two deceased relatives were available for *BRCA1/2* testing, so we cannot confirm their genetic status directly. However, the clinical history is so suggestive that the clinical team recommended *BRCA1/2* analysis for the proband (the patient we are following) (Moyer, 2014).\n\nThe result was indeed positive: the proband carries a pathogenic, heterozygous frameshift mutation in the *BRCA1* gene, designated *BRCA1* Ile90Serfs (NC_000017.10:g.41256905_41256917 delTGAAAAGCACAAA). Let’s unpack this notation. \"Heterozygous\" means that only one of the two copies of the *BRCA1* gene is mutated; the other copy is normal. \"Frameshift\" means that a small deletion (in this case, 13 base pairs) shifts the reading frame of the gene, completely scrambling the protein sequence downstream of the mutation, which almost always leads to a non-functional protein. This is a classic, high-risk mutation for breast and ovarian cancer. However, a clinical breast exam and a breast MRI showed no signs of malignancy, and 6 years later, the patient still has no evidence of breast or ovarian cancer. This is a good example of the difference between having a genetic predisposition and actually developing the disease—the mutation increases risk dramatically, but it does not guarantee that cancer will occur.\n\nGiven these striking results, the family was brought back for a second round of genetic counseling. After obtaining informed consent, they were tested for both the *RET* exon 11 mutation (the specific mutation found in the proband) and the *BRCA1* mutation. The proband’s brother (age 36) and his two sons (ages 4 and 6) all carried the *RET* p.C634W mutation, but none of them had the *BRCA1* mutation. This is a classic example of independent segregation of two different genetic traits. In the brother, two thyroid masses were found, and his serum calcitonin level was elevated at 215 pg/ml (normal is typically <10 pg/ml). Calcitonin is a hormone produced by the parafollicular C-cells of the thyroid, and a high level is a sensitive marker for medullary thyroid carcinoma (MTC). A total thyroidectomy was performed, and his calcitonin levels returned to normal, indicating that the tumor was successfully removed. The brother’s two sons, who were only 4 and 6 years old, underwent prophylactic thyroidectomy—a preventive surgery to remove the thyroid before cancer can develop. The pathology on their removed thyroids showed no signs of MTC, which is the goal of early intervention. The proband’s father, however, carried neither the *RET* nor the *BRCA1* mutation. The family pedigree is shown in Figure 1C.\n\n**DISCUSSION**\n\nTo the best of our knowledge, this is the first reported patient carrying both a pathogenic *RET* and a pathogenic *BRCA1* germline mutation. The combination of two hereditary cancer syndromes is extraordinarily rare and presents a unique challenge for clinical management, because the patient must be screened for two completely different sets of cancers, each with its own surveillance protocol. Let’s put the rarity in perspective. The prevalence of MEN2 syndrome is approximately 1 in 30,000 (Kloos et al., 2009), while the prevalence of *BRCA1*2 mutations in the general population is estimated at between 1 in 330 and 1 in 500 (Moyer, 2014). If these two events were independent, the probability of a single person having both would be roughly 1 in 10 to 15 million. This is an extremely rare event, and it is consistent with data from a database that collects cases where two pathogenic mutations in hereditary cancer genes are identified—only 39 such cases have been uploaded (Stradella et al., 2018). This rarity is also a reminder that when we see a patient with a known hereditary syndrome, we should not assume that they cannot also carry a second, unrelated mutation.\n\nIt is important to note that standard next-generation sequencing (NGS) cancer gene panels often do not include the *RET* or *MEN1* genes, which are associated with MEN2 and MEN1, respectively. This is a critical gap. For example, a study by Shin et al. used a panel of 64 genes to screen 252 breast cancer patients. They found that 67 patients (26.8%) carried a total of 77 pathogenic mutations, including 12 in *BRCA1*, 13 in *BRCA2*, and, notably, 7 in *RET*. However, all seven *RET* mutations were found in patients who were *BRCA*-negative (Shin et al., 2017). This suggests that *RET* mutations may be more common in breast cancer patients than previously thought, but because *RET* is not routinely included in breast cancer panels, these mutations are often missed. This is a critical point for clinical practice: if a patient has a strong family history of cancer but tests negative for the common genes, we should consider expanding the panel to include genes like *RET*.\n\nBased on the pedigree and genetic analysis (absence of the *RET* mutation in our proband’s father), it"},"qwen3-235b-a22b":{"l5":"Sarkadi et al. Coincidence of a BRCA1 and RET Mutations  \nFrontiers in Genetics | www.frontiersin.org 3 June 2019 | Volume 10 | Article 544  \n\nMeasurement of metanephrines in the 24-hour urine showed no evidence of a tumor secreting catecholamines or their metabolites—substances often overproduced in pheochromocytomas, a type of adrenal gland tumor. This is an important test because one of the hallmark features of Multiple Endocrine Neoplasia type 2A (MEN2A) is the development of pheochromocytoma. Since the levels were normal, there was no biochemical sign pointing to this condition. Additionally, the patient’s serum intact parathormone (also known as parathyroid hormone, or PTH) was within the normal range. This hormone is produced by the parathyroid glands, and abnormal levels can signal hyperparathyroidism—a second key component of MEN2A. With both tests coming back normal, and no clinical signs of either pheochromocytoma or parathyroid disease, the picture was incomplete despite the presence of a known disease-causing mutation.\n\nOver the next 6 years of follow-up, the patient (referred to as the proband—the first individual in a family identified with a condition) remained free of any tumors typically associated with MEN2A. This is noteworthy because individuals with pathogenic *RET* mutations, especially the specific one this patient carries (more on that soon), usually develop medullary thyroid cancer (MTC) at a young age, often requiring preventive surgery. The absence of disease manifestations in this case raised questions: Was the *RET* mutation truly pathogenic in her? Or was something else modifying its effects?\n\nNow, let’s step back and consider the bigger picture. MEN2A is inherited in an autosomal dominant pattern. What does that mean? It means that only one copy of the mutated gene (in this case, *RET*) is enough to significantly increase the risk of developing the syndrome. Each child of an affected parent has a 50% chance of inheriting the mutation. Because of this inheritance pattern, clinical guidelines strongly recommend genetic counseling and testing for first-degree relatives—parents, siblings, and children—of any individual found to carry a pathogenic *RET* mutation (Wells et al., 2015). The goal is early detection and, when appropriate, preventive interventions like thyroidectomy.\n\nWhen the medical team dug deeper into the family history, they uncovered a striking pattern: the patient’s mother and her maternal aunt had both developed breast cancer and ultimately died from brain metastases. This is not a typical feature of MEN2A. Instead, this kind of clustering—especially with early-onset breast cancer and fatal metastatic disease—raises a red flag for hereditary breast cancer syndromes, such as those caused by mutations in the *BRCA1* or *BRCA2* genes.\n\nHere’s why this matters: *BRCA1* and *BRCA2* are tumor suppressor genes. Normally, they help repair damaged DNA and prevent cells from growing and dividing too rapidly. When a person inherits a harmful mutation in one of these genes, their ability to repair DNA is compromised, leading to a much higher lifetime risk of breast, ovarian, and certain other cancers. Like MEN2A, hereditary breast cancer due to *BRCA1/2* mutations follows an autosomal dominant inheritance pattern. That means if one parent carries the mutation, each child has a 50% chance of inheriting it.\n\nUnfortunately, no biological samples (like blood or tissue) were available from the mother or aunt to test for *BRCA1/2* mutations directly. But because the pattern strongly suggested a hereditary cause, and because the patient herself was at risk, it made perfect sense to test her for these mutations—even though her initial presentation was focused on MEN2A.\n\nAnd here’s where things got really interesting: genetic testing revealed that the patient carried a pathogenic, heterozygous frameshift mutation in the *BRCA1* gene. Let’s unpack that.\n\n- **Pathogenic** means the mutation is known to cause disease.\n- **Heterozygous** means she has one normal copy of the gene and one mutated copy—typical in inherited cancer syndromes.\n- A **frameshift mutation** is a type of genetic error that occurs when a small number of DNA building blocks (nucleotides) are inserted or deleted, throwing off the entire reading frame of the gene. It’s like removing one or two letters from a sentence written without spaces: “thecatruns” becomes “thc atr uns”—nonsensical. In genes, this usually leads to a truncated, nonfunctional protein.\n\nThe specific mutation was named **BRCA1 Ile90Serfs**, and its genomic location is given as **NC_000017.10:g.41256905_41256917 delTGAAAAGCACAAA**. Let’s break this down:\n\n- **NC_000017.10** is the reference sequence for chromosome 17.\n- **g.41256905_41256917** tells us the exact position on the chromosome where the deletion occurs.\n- **delTGAAAAGCACAAA** means that the DNA sequence “TGAAAAGCACAAA” (13 nucleotides) is deleted.\n\nThis deletion shifts the reading frame early in the gene (at amino acid 90), leading to a premature stop signal and a severely shortened BRCA1 protein that can’t perform its DNA repair function. This mutation is well-documented as disease-causing.\n\nDespite carrying this high-risk *BRCA1* mutation, the patient herself showed no signs of breast or ovarian cancer. Clinical examination and breast MRI were normal at diagnosis, and even 6 years later, she remained cancer-free. This doesn’t mean she’s out of danger—her lifetime risk of breast cancer is still very high (up to 70%)—but it does show that cancer development is not immediate and can be influenced by other genetic or environmental factors.\n\nThese findings completely changed the clinical picture. Now, instead of just managing a potential MEN2A case, the team was dealing with *two* inherited cancer syndromes in one person: MEN2A (from the *RET* mutation) and hereditary breast and ovarian cancer syndrome (from the *BRCA1* mutation). This dual diagnosis has major implications for the entire family.\n\nSo, the patient’s relatives were brought back for **genetic counseling**—a critical step that helps people understand their genetic risks, the meaning of test results, and their options for screening or prevention. After informed consent, family members were tested for both the *RET* exon 11 mutation (the specific *RET* change linked to MEN2A) and the *BRCA1* frameshift mutation.\n\nHere’s what they found:\n\n- The **proband’s brother** (age 36) carried the *RET* p.C634W mutation but *not* the *BRCA1* mutation. The p.C634W mutation is a well-known, high-risk variant in the *RET* gene, strongly associated with early-onset medullary thyroid cancer. Sure enough, two thyroid masses were found in him, and his serum calcitonin—a biomarker for MTC—was elevated at 215 pg/ml (normal is typically <10 pg/ml in non-smokers). He underwent total thyroidectomy (complete removal of the thyroid gland), and afterward, his calcitonin levels returned to normal, indicating successful removal of the tumor tissue.\n\n- His **two sons** (ages 4 and 6) also inherited the *RET* p.C634W mutation. Because of the high risk and early onset of MTC in *RET* mutation carriers, **prophylactic thyroidectomy**—surgery to remove the thyroid *before* cancer develops—is the standard of care. Both boys underwent the procedure. Importantly, histopathological examination of the removed thyroid tissue showed no signs of medullary thyroid cancer. This is a success story: intervention *before* cancer developed, thanks to genetic testing.\n\n- The **proband’s father** was tested and found to carry *neither* the *RET* mutation nor the *BRCA1* mutation. This is a crucial piece of information for understanding how these mutations were inherited.\n\nThe family’s genetic history is summarized in **Figure 1C**, a pedigree chart that visually maps out who has which mutation and their health status. Pedigrees are essential tools in medical genetics—they help trace inheritance patterns and assess risk across generations.\n\n---\n\n**DISCUSSION**\n\nTo the best of our knowledge, this is the first reported case of a single individual carrying both a pathogenic germline mutation in *RET* (causing MEN2A) and a pathogenic germline mutation in *BRCA1* (causing hereditary breast and ovarian cancer). Germline mutations are those present in every cell of the body, inherited from a parent, and can be passed on to offspring. Somatic mutations, in contrast, occur later in life and are not inherited.\n\nThe co-occurrence of two distinct hereditary cancer syndromes in one person is extremely rare. Why? Let’s think about the odds.\n\nMEN2 syndrome has an estimated prevalence of about **1 in 30,000** people (Kloos et al., 2009). That means, on average, only about 3 out of every 100,000 individuals carry a disease-causing *RET* mutation. On the other hand, *BRCA1/2* mutations are more common in the general population, with an estimated prevalence between **1 in 330 and 1 in 500** (Moyer, 2014). If we assume these two conditions are independent (i.e., one doesn’t influence the likelihood of the other), we can estimate the probability of someone having both by multiplying the two frequencies:\n\n- Using the lower bound: (1/30,000) × (1/500) = 1/15,000,000\n- Using the higher bound: (1/30,000) × (1/330) ≈ 1/9,900,000\n\nSo, we’re looking at a rough estimate of **1 in 10 to 15 million** people who might carry both mutations. That’s rarer than winning a major lottery—and explains why such cases are almost never seen in clinical practice.\n\nThis theoretical estimate aligns with real-world data. A database compiling cases of individuals with two pathogenic mutations in cancer susceptibility genes has recorded only **39 such cases** to date (Stradella et al., 2018). This scarcity underscores how unusual dual diagnoses are.\n\nIt’s also important to note a limitation in current genetic testing practices: many next-generation sequencing (NGS) cancer gene panels—especially those used in breast cancer clinics—do *not* include *RET* or *MEN1* genes. These panels are often designed to detect mutations commonly linked to breast and ovarian cancer, like *BRCA1/2*, *PALB2*, or *TP53*, but may miss genes associated with endocrine tumors.\n\nFor example, a study by Shin et al. (2017) performed panel sequencing of 64 genes in 252 breast cancer patients. They found that 67 patients (26.8%) carried one or more pathogenic mutations. Among these, 7 patients had mutations in the *RET* gene. But here’s the key point: **all seven of these *RET* mutations were found in patients who were *negative* for *BRCA1/2* mutations**. None of the *BRCA*-positive patients had a *RET* mutation in this cohort.\n\nThis suggests that even when both genes are analyzed, the co-occurrence is exceptionally rare. It also highlights a potential blind spot: if a breast cancer patient with a family history of thyroid cancer is only tested for *BRCA1/2*, a *RET* mutation might be missed—unless a broader panel is used.\n\nNow, returning to this family: the pedigree and genetic analysis revealed that the proband’s father does *not* carry the *RET* mutation. This is a critical clue. Since the *RET* mutation is autosomal dominant, and the father lacks it, that means the proband must have inherited the *RET* mutation from her *mother*—the same mother who had breast cancer and died of brain metastases.\n\nBased on the pedigree and genetic analysis (absence of the \nRET mutation in our proband’s father), it"}},"metadata":{"paper_id":"006a0d7d8feaa1a559c1352d4a9bee2b","csv_row":86882,"doi":"10.3389/fgene.2019.00544","openalex_id":"https://openalex.org/W2951443334","pdf_url":"https://www.frontiersin.org/articles/10.3389/fgene.2019.00544/pdf","page_count":5,"text_chars":26239,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2390,"total_tokens":3295,"completion_tokens":905,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2251,"total_tokens":3711,"completion_tokens":1460,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":4.251204967498779,"l5_seconds":10.26327919960022}},{"idx":5,"domain":"Academic paper","source":"CSV row 32789 · 2017 · 10.5296/ijafr.v7i2.11936","title":"Moderating Effect of Social Uncertainty between Capital Budgeting Practices and Performance","seg":"International Journal of Accounting and Financial Reporting \nISSN 2162-3082 \n2017, V ol. 7, No. 2 \nhttp://ijafr.macrothink.org 87 \n4.4.1 Social Uncertainty as a Moderator of the Relationship between Sophisticated Capital \nBudgeting Practices and Tobin_q \nThis section examines whether social uncertainty will moderate the relationship between \nsophisticated capital budgeting practices and Tobin-q (firms‟ performance) i.e., the \nrelationship between sophisticated capital budgeting practices and Tobin-q will be weakened \nfor firms that experience higher levels of social uncertainty than those that experience lower \nlevels of social uncertainty. The result of the moderator analysis is presented in Table 6. \n \nTable 6. Social uncertainty as a moderator between sophisticated capital budgeting practices \nand Tobin_q \n b SE B t P \nConstant -.01(-.12,.12).0612 -.0196 p =.9844 \nSocial Uncertainty (centred) -.40(-.60,-.20).1021 -3.8853 p =.0001 \nSophisticated CBP (centred).41(.24,.58).0869 4.7519 p =.0000 \nSophisticated CBP X Social uncertainty -.32(-.60,-.04).1428 -2.2184 p =.0278 \n \nAs can be seen in Table 6, the interaction term (Sophisticated CBP X Social uncertainty) is \nsignificant, b = -.32, t = -2.2184, p = 0.0278 indicating that the relationship between \nsophisticated capital budgeting practices and Tobin-q is moderated by social uncertainty i.e., \nsocial uncertainty weakens the positive relationship between sophisticated capital budgeting \npractices and Tobin-q. Furthermore, the results of the slope analysis and the nature of \nmoderating effect are depicted in Figure 1. \n \n \nFigure 1. Graphical presentation of social uncertainty as a moderator between sophisticated \ncapita budgeting practices and Tobin_q\n\nInternational Journal of Accounting and Financial Reporting \nISSN 2162-3082 \n2017, V ol. 7, No. 2 \nhttp://ijafr.macrothink.org 88 \nThe result of the conditional effect of sophisticated capital budgeting practices on Tobin_q \nfor the different levels of social uncertainty is presented at the bottom of figure 1. According \nto the figure, there are three different regressions: the regression for sophisticated capital \nbudgeting practices as a predictor of Tobin-q (1) when social uncertainty is low (value of \nsocial uncertainty is -1.000); (2) at the mean value of social uncertainty (the value is zero \nbecause of centred traits); and (3) when the value of social uncertainty is high (value of traits \nis.5405). When social uncertainty is low, there is a significant positive relationship between \nsophisticated capital budgeting practices and Tobin-q, b =.73, 95% CI (0.32, 1.14), t = \n3.5048, p < 0.05, whilst at the mean value of social uncertainty the relationship between \nsophisticated capital budgeting practices and Tobin-q is significantly positive. However, this \nrelationship is weaker than at a low level of social uncertainty, b =.41,95% CI (0.24,.58), t = \n4.7519, p < 0.05. Similarly, when social uncertainty is high there is still a significant positive \nrelationship between sophisticated capital budgeting practices and Tobin-q. However, this \nrelationship is weaker than at the mean level of social uncertainty, b =.24, 95% CI (.10, 0.38), \nt = 3.3552, p < 0.05. Overall, the results reveal that there is a significant positive relationship \nbetween sophisticated capital budgeting practices and Tobin-q at all three levels of social \nuncertainty; nonetheless, this positive relationship is weakened when the level of social \nuncertainty increases. It is shown in Figure 1 that the positive relationship between \nsophisticated capital budgeting practices and Tobin-q is stronger at low levels of social \nuncertainty than at average or higher levels of social uncertainty. \n4.4.2 Social Uncertainty as a Moderator of the Relationship between Advanced Capital \nBudgeting Practices and Tobin_q \nThe section examines whether the social uncertainty will moderate the relationship between \nadvanced capital budgeting practices and Tobin_q (firms‟ performance) i.e., the relationship \nbetween advanced capital budgeting practices and Tobin_q will be weakened for firms that \nexperience higher levels of social uncertainty than those that experience low levels of social \nuncertainty. The result of the moderator analysis is presented in Table 7.","models":{"dsv4-flash":{"l5":"International Journal of Accounting and Financial Reporting \nISSN 2162-3082 \n2017, V ol. 7, No. 2 \nhttp://ijafr.macrothink.org 87 \n4.4.1 Social Uncertainty as a Moderator of the Relationship between Sophisticated Capital \nBudgeting Practices and Tobin_q \n\nNow we turn to a crucial question: does the *context* in which a firm operates change the payoff of using sophisticated capital budgeting practices? Specifically, we ask whether social uncertainty—the unpredictability of the social, political, or regulatory environment—acts as a *moderator*. \n\nLet’s unpack what “moderator” means here. A moderator is a variable that changes the strength (or even the direction) of the relationship between two other variables. In our case, the relationship of interest is between sophisticated capital budgeting practices (our predictor) and Tobin-q (our outcome, a measure of firm performance). The moderator is social uncertainty. The hypothesis we are testing is straightforward: the positive link between sophisticated capital budgeting practices and Tobin-q should be *weaker* for firms facing higher social uncertainty than for firms facing lower social uncertainty. Why might this be? Think of it this way: if the environment is highly unpredictable, even the best-laid financial plans may be rendered obsolete by sudden shifts in policy, regulation, or social conditions. Thus, the value of sophisticated planning is diminished.\n\nTo test this, we run a moderated regression analysis. The key term to look for is the *interaction term*—the product of the two predictors (Sophisticated CBP × Social uncertainty). If this interaction term is statistically significant, it tells us that the effect of one variable depends on the level of the other. The results are shown in Table 6.\n\nTable 6. Social uncertainty as a moderator between sophisticated capital budgeting practices \nand Tobin_q \n b SE B t P \nConstant -.01(-.12,.12) .0612 -.0196 p =.9844 \nSocial Uncertainty (centred) -.40(-.60,-.20) .1021 -3.8853 p =.0001 \nSophisticated CBP (centred) .41(.24,.58) .0869 4.7519 p =.0000 \nSophisticated CBP X Social uncertainty -.32(-.60,-.04) .1428 -2.2184 p =.0278 \n\nLet’s read this table together. The first column lists the predictors. The second column gives the unstandardized coefficient (b), with the 95% confidence interval in parentheses. The third column is the standard error (SE), the fourth is the t-statistic, and the last is the p-value. \n\nFocus on the bottom row: the interaction term. Its coefficient is b = -.32, with a p-value of .0278. Since this p-value is less than the conventional threshold of .05, we conclude that the interaction is statistically significant. In plain terms: the relationship between sophisticated capital budgeting practices and Tobin-q is indeed moderated by social uncertainty. The negative sign of the interaction coefficient tells us the direction: as social uncertainty increases, the positive relationship between sophisticated capital budgeting practices and Tobin-q *weakens*. \n\nBut what does this mean in practical terms? To see the full picture, we need to examine the *conditional effects*—that is, how the relationship between sophisticated capital budgeting practices and Tobin-q looks at different levels of social uncertainty. This is exactly what the slope analysis and Figure 1 show us.\n\nFigure 1. Graphical presentation of social uncertainty as a moderator between sophisticated \ncapital budgeting practices and Tobin_q\n\nInternational Journal of Accounting and Financial Reporting \nISSN 2162-3082 \n2017, Vol. 7, No. 2 \nhttp://ijafr.macrothink.org 88 \nThe result of the conditional effect of sophisticated capital budgeting practices on Tobin_q \nfor the different levels of social uncertainty is presented at the bottom of figure 1. According \nto the figure, there are three different regressions: the regression for sophisticated capital \nbudgeting practices as a predictor of Tobin-q (1) when social uncertainty is low (value of \nsocial uncertainty is -1.000); (2) at the mean value of social uncertainty (the value is zero \nbecause of centred traits); and (3) when the value of social uncertainty is high (value of traits \nis .5405). \n\nLet’s unpack this. Because we centred the social uncertainty variable (subtracted the mean from each score), the mean value is now zero. So, “low” social uncertainty corresponds to a value of -1.000 (one standard deviation below the mean), and “high” social uncertainty corresponds to a value of .5405 (which is the actual maximum value in our data). For each of these three levels, we compute a separate regression line. \n\nWhen social uncertainty is low, there is a significant positive relationship between \nsophisticated capital budgeting practices and Tobin-q, b =.73, 95% CI (0.32, 1.14), t = \n3.5048, p < 0.05. This is the strongest positive relationship of the three. \n\nAt the mean value of social uncertainty (i.e., zero), the relationship is still significantly \npositive, but it is weaker: b =.41, 95% CI (0.24,.58), t = 4.7519, p < 0.05. \n\nSimilarly, when social uncertainty is high, there is still a significant positive relationship \nbetween sophisticated capital budgeting practices and Tobin-q. However, this relationship is \nweaker still, b =.24, 95% CI (.10, 0.38), t = 3.3552, p < 0.05. \n\nOverall, the results reveal that there is a significant positive relationship between \nsophisticated capital budgeting practices and Tobin-q at all three levels of social uncertainty; \nnonetheless, this positive relationship is weakened when the level of social uncertainty \nincreases. It is shown in Figure 1 that the positive relationship between sophisticated capital \nbudgeting practices and Tobin-q is stronger at low levels of social uncertainty than at \naverage or higher levels of social uncertainty. \n\nIn short, the story is consistent: sophisticated capital budgeting practices are always beneficial, but their benefit is greatest in stable environments. When the social environment is unpredictable, the edge they provide shrinks—though it never disappears entirely. This is a classic moderation effect, and it has important practical implications: firms in volatile environments should not expect the same return on their investment in sophisticated budgeting tools as firms in stable ones.\n\n4.4.2 Social Uncertainty as a Moderator of the Relationship between Advanced Capital \nBudgeting Practices and Tobin_q \n\nWe now turn to a second, related question: does social uncertainty also moderate the relationship between *advanced* capital budgeting practices and Tobin-q? The logic is the same as before. We expect that the positive relationship between advanced capital budgeting practices and firm performance will be weaker for firms facing higher levels of social uncertainty. The result of the moderator analysis is presented in Table 7."},"qwen3-235b-a22b":{"l5":"International Journal of Accounting and Financial Reporting  \nISSN 2162-3082  \n2017, Vol. 7, No. 2  \nhttp://ijafr.macrothink.org 87  \n\n## 4.4.1 Social Uncertainty as a Moderator of the Relationship between Sophisticated Capital Budgeting Practices and Tobin_q\n\nLet’s step into the shoes of a researcher trying to understand what drives firm performance—and more specifically, whether using advanced financial tools actually helps companies create value. One common measure of firm performance is **Tobin’s q**, which compares a company’s market value to the replacement cost of its assets. A Tobin’s q greater than 1 suggests the market believes the firm is creating value beyond its physical assets—perhaps through innovation, brand strength, or smart management.\n\nNow, many firms use what researchers call **sophisticated capital budgeting practices (CBP)**—tools like discounted cash flow analysis, real options valuation, or scenario planning—to decide which projects to invest in. The idea is that better decision-making tools should lead to better investment choices, which in turn should boost firm value (i.e., increase Tobin’s q). And indeed, prior research often finds a positive link between these sophisticated methods and performance.\n\nBut here’s a critical question: **Does this benefit hold true under all conditions?** Or could external factors weaken the payoff from using advanced tools?\n\nThis section investigates one such factor: **social uncertainty**. What do we mean by that? Imagine a society where people distrust institutions, political instability is high, or social norms are shifting rapidly. In such environments, even the best financial models may struggle to predict outcomes because the \"rules of the game\" keep changing. Consumer behavior, government policy, or labor relations might be unpredictable—not due to economic cycles, but because of deeper societal turbulence.\n\nSo the hypothesis here is this:  \n> *The positive effect of sophisticated capital budgeting practices on firm value (Tobin’s q) will be weaker when firms operate in contexts of high social uncertainty.*\n\nIn other words, **social uncertainty acts as a moderator**—a factor that changes the strength (or even direction) of a relationship between two other variables. If you think of the relationship between sophisticated CBP and Tobin’s q as an engine that generates value, social uncertainty is like thick air or rough terrain—it doesn’t stop the engine, but it makes it work less efficiently.\n\nTo test this idea, the researchers used a statistical technique called **moderated regression analysis**. This allows them to see not just whether sophisticated CBP predicts Tobin’s q, but whether that prediction gets stronger or weaker depending on the level of social uncertainty.\n\nThe results are summarized in **Table 6**.\n\n### Table 6. Social uncertainty as a moderator between sophisticated capital budgeting practices and Tobin_q  \n\n| Variable | b [95% CI] | SE | t | p |\n|--------|------------|-----|------|-------|\n| Constant | –0.01 [–0.12, 0.12] | 0.0612 | –0.0196 | p = .9844 |\n| Social Uncertainty (centred) | –0.40 [–0.60, –0.20] | 0.1021 | –3.8853 | p = .0001 |\n| Sophisticated CBP (centred) | 0.41 [0.24, 0.58] | 0.0869 | 4.7519 | p = .0000 |\n| Sophisticated CBP × Social Uncertainty | –0.32 [–0.60, –0.04] | 0.1428 | –2.2184 | p = .0278 |\n\nLet’s unpack this table step by step, because each row tells us something important.\n\nFirst, the **constant** (or intercept) is not statistically significant (p = .9844), which means we can’t say the baseline Tobin’s q differs significantly from zero when all predictors are at their mean values. That’s fine—it’s not the focus here.\n\nSecond, **social uncertainty alone** has a negative and highly significant association with Tobin’s q (b = –0.40, p < .001). This suggests that, on average, firms in more socially uncertain environments tend to have lower market valuations, independent of their budgeting practices. That makes intuitive sense—investors may discount the value of firms operating in unstable societies.\n\nThird, **sophisticated capital budgeting practices alone** show a strong positive relationship with Tobin’s q (b = 0.41, p < .001). So, all else being equal, firms using advanced tools do appear to create more value. This aligns with conventional wisdom in finance.\n\nNow comes the key part: the **interaction term**—*Sophisticated CBP × Social Uncertainty*—which tests our moderation hypothesis. The coefficient here is **b = –0.32**, and it's statistically significant (p = .0278). A negative interaction coefficient means that as social uncertainty increases, the positive effect of sophisticated CBP on Tobin’s q **decreases**.\n\nThink of it like this:  \nImagine two firms with identical levels of sophisticated capital budgeting practices—one in a stable society, one in a volatile one. The firm in the stable environment gets a bigger boost in market value from using advanced tools than the one in the turbulent setting. The tools still help, but their impact is dampened by the surrounding chaos.\n\nTo visualize how this moderation works, the authors provide **Figure 1**.\n\n### Figure 1. Graphical presentation of social uncertainty as a moderator between sophisticated capital budgeting practices and Tobin_q\n\nIn this figure, the x-axis shows levels of **sophisticated capital budgeting practices**, and the y-axis shows the predicted value of **Tobin’s q**. But instead of one line, there are **three separate regression lines**, each representing a different level of social uncertainty:\n\n1. **Low social uncertainty** (defined as one standard deviation below the mean; value = –1.000)  \n2. **Average social uncertainty** (at the mean; value = 0, due to centering)  \n3. **High social uncertainty** (at +0.5405 standard deviations above the mean)\n\nCentering the variables (subtracting the mean) helps avoid multicollinearity and makes the interpretation of the interaction clearer.\n\nNow, look at the slopes of these three lines. A steeper slope means a stronger relationship between sophisticated CBP and Tobin’s q.\n\n- At **low social uncertainty**, the relationship is strongest: **b = 0.73**, 95% CI [0.32, 1.14], p < .05. That’s a large and significant effect—the firm gains substantial value from using advanced tools.\n- At **average social uncertainty**, the effect is still positive and significant, but smaller: **b = 0.41**, 95% CI [0.24, 0.58], p < .05. This matches the main effect from the regression table.\n- At **high social uncertainty**, the effect remains positive and significant, but even weaker: **b = 0.24**, 95% CI [0.10, 0.38], p < .05.\n\nSo, while sophisticated capital budgeting practices are always beneficial across all levels of social uncertainty, **their value-creating power diminishes as social uncertainty rises**.\n\nThis pattern is exactly what a **negative moderating effect** looks like: the same managerial practice yields diminishing returns when the external social environment becomes less predictable.\n\nIt’s a bit like driving a high-performance car. On a smooth, clear highway (low uncertainty), you can really take advantage of the engine’s power. But on a bumpy, foggy mountain road (high uncertainty), even the best car can’t go fast or safely—no matter how skilled the driver.\n\nThus, the takeaway is not that sophisticated tools are useless in uncertain times, but that **their effectiveness depends on context**. Managers shouldn’t assume that adopting advanced financial techniques automatically translates into higher firm value—especially if they’re operating in socially volatile environments.\n\nThese findings also suggest that improving institutional stability and reducing societal unpredictability could amplify the benefits of good financial management practices. In that sense, the study bridges corporate finance and broader socio-institutional theory.\n\nOverall, the results confirm that **social uncertainty significantly weakens the positive relationship between sophisticated capital budgeting practices and Tobin’s q**, providing strong empirical support for the moderation hypothesis.\n\n## 4.4.2 Social Uncertainty as a Moderator of the Relationship between Advanced Capital Budgeting Practices and Tobin_q\n\nThe section examines whether the social uncertainty will moderate the relationship between advanced capital budgeting practices and Tobin_q (firms‟ performance) i.e., the relationship between advanced capital budgeting practices and Tobin_q will be weakened for firms that experience higher levels of social uncertainty than those that experience low levels of social uncertainty. The result of the moderator analysis is presented in Table 7."}},"metadata":{"paper_id":"002acf8da78b1511450101a85479f162","csv_row":32789,"doi":"10.5296/ijafr.v7i2.11936","openalex_id":"https://openalex.org/W2767616261","pdf_url":"http://www.macrothink.org/journal/index.php/ijafr/article/download/11936/9597","page_count":17,"text_chars":45488,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2386,"total_tokens":3249,"completion_tokens":863,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2247,"total_tokens":3739,"completion_tokens":1492,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":4.136795520782471,"l5_seconds":9.858405590057373}},{"idx":6,"domain":"Academic paper","source":"CSV row 69018 · 2018 · 10.1109/tmag.2018.2847031","title":"Efficient Terahertz Generation Using Fe/Pt Spintronic Emitters Pumped at Different Wavelengths","seg":"2 II. EXPERIMENT A. Experimental details A standard terahertz time-domain spectroscopy (THz-TDS) system, described in detail in [8, 10] has been used for generation and measurements of THz waveforms from different spintronic emitters (see Fig 1). The system is driven by a femtosecond Ti:Sa laser delivering sub-100 fs optical pulses at a repetition rate of 75 MHz with an average output power of typically 600 mW. Alternatively, a fiber laser at 1.55 µm wavelength with a repetition rate of 100 MHz and an output power of up to 50 mW was used. The laser beam is split into a pump and probe beam by a 90:10 beam-splitter. The stronger part is led through a mechanical computer-controlled delay line to pump the THz emitter, and the weaker part is used to gate the detector photoconductive switch with a 20 µm dipole antenna. The PCA emitter used in a standard TDS set-up is replaced by a spintronic (ST) Fe/Pt bilayer sample. The sample is mounted perpendicular to the direction of the pump beam. A weak external magnetic (20 mT) field is applied perpendicular to the pump beam to saturate the magnetization in the direction of the easy axis of Fe. The direction of the magnetic field determines the polarization of the THz field which is always perpendicular to the direction of the pump beam and the direction of the magnetic field. The PCA detector is sensitive to the polarization direction of the incident THz wave and, therefore, the polarization direction has to be stabilized by the external magnetic field and the orientation of the easy axis of the Fe/Pt emitter. \n Figure 1: THz time-domain emission spectroscopy setup (THz-TDES) was used to measure the THz emission of the optimized Fe/Pt spintronic emitter. The optical pump beam is sharply focused with an aspherical short-focus lens down to a spot diameter of less than 10 µm in the plane of the metal layers. It excites spin polarized electrons in the magnetic layer (Fe) which give rise to a spin-current, which in turn excites a transverse transient electric current in the Pt layer. The current transient results in THz pulse generation of sub-picosecond duration with a center wavelength \naround 300 µm being emitted forward and backward into free space in the form of a strongly divergent beam. A hyperhemispherical Si-lens being attached to the back side of the sample collects it into a divergent beam in the form of a cone and directs it further to an off-axis parabolic mirror for collimation. With the lens attached an enhancement factor of up to 30 in electric field amplitude has been observed. The function of the Si-lens is to reduce the angular dimensions of the emitted THz wave already at its source. Since the central wavelength of the THz emission is about 300 µm and is much bigger than dimensions of its source (about 10µm in diameter), the beam, if not being collected with the help of an additional optical element (in our case- Si-lens), tends to diffract immediately and fill the half space behind the emitter sample. Without the Si-lens most of THz beam would pass by the first parabolic mirror and correspondingly not reach the detector, reducing essentially the efficiency of the THz optics. But since the comparing measurements are made with the same Si-lens, only the differences (if any for different pump wavelengths) are of interest. Another and identical off-axis parabolic mirror in the reversed configuration directs the collimated THz beam onto the second Si lens which finally focuses the beam through the GaAs substrate of the detector PCA onto the dipole gap for detection. In this way the THz optical system consisting of the two Si-lenses and the two parabolic mirrors images the point source of THz wave on the emitter surface onto the gap of the detector PCA and ensures an efficient transfer of the emitted THz emission from its source to the detector. In our set-up the THz beam path is determined by the silicon lens on the emitter, the parabolic mirrors and the silicon lens on the photoconductive antenna of the detector. The alignment of these components is not changed during an exchange of the spintronic emitter. If in addition the position of the pump beam focus remains constant the spintronic emitter can easily be exchanged without changing the beam path as the lateral position of the focus on the emitter is not critical assuming a homogeneous lateral layer structure. The frequency response of the photoconductive dipole antenna with 20 µm dipole length limits the observable bandwidth. With this dipole length a maximum in the detector response around 1 THz can be expected with a reduction to 50% at 330 GHz and 2 THz. The 10% values are at 100 GHz and 3 THz. Above 3 THz the frequency response of the","models":{"dsv4-flash":{"l5":"## II. EXPERIMENT\n\n### A. Experimental details\n\nTo measure the THz waveforms generated by our spintronic emitters, we employed a standard terahertz time-domain spectroscopy (THz-TDS) system, which has been described in detail in references [8, 10]. Think of THz-TDS as a very fast \"stopwatch\" for light: it fires an ultrashort laser pulse, then measures the electric field of the resulting terahertz wave at precise time delays, building up a complete picture of the waveform point by point. This system is driven by a femtosecond Ti:Sa laser—a workhorse of ultrafast optics—that delivers pulses shorter than 100 femtoseconds (that's less than one millionth of one billionth of a second!) at a repetition rate of 75 MHz, meaning it fires 75 million pulses every second. The average output power is typically 600 mW, which is enough to excite the emitter efficiently. Alternatively, we could switch to a fiber laser operating at a wavelength of 1.55 µm (in the infrared region), with a repetition rate of 100 MHz and a lower output power of up to 50 mW. This flexibility allows us to test how the emitter responds to different pump wavelengths, which will become important later.\n\nThe laser beam is first split into two parts using a 90:10 beam-splitter. The stronger portion (90%) is directed through a mechanical, computer-controlled delay line—essentially a movable mirror that changes the path length, and thus the arrival time, of the pump pulse. This delay line is crucial because it lets us sample the THz waveform at different time points. The weaker portion (10%) is used to \"gate\" the detector: it triggers a photoconductive switch, a tiny dipole antenna with a 20 µm gap, which acts as a fast electronic shutter to capture the THz field at a specific moment. By scanning the delay line, we map out the entire THz pulse shape.\n\nIn this setup, the usual photoconductive antenna (PCA) emitter is replaced by our spintronic (ST) sample, which is a bilayer of iron (Fe) and platinum (Pt). The sample is mounted perpendicular to the direction of the pump beam, meaning the laser hits it head-on. A weak external magnetic field of 20 mT (millitesla—about 400 times weaker than a typical fridge magnet) is applied perpendicular to the pump beam. This field serves a critical purpose: it saturates the magnetization of the Fe layer along its easy axis (the direction in which it naturally prefers to magnetize). Why does this matter? Because the direction of the magnetic field dictates the polarization of the emitted THz field. Specifically, the THz field is always polarized perpendicular to both the pump beam direction and the magnetic field direction. Since the PCA detector is sensitive to the polarization of the incoming THz wave, we must ensure this polarization is stable and well-defined. That's why we carefully control both the external magnetic field and the orientation of the Fe/Pt emitter's easy axis—any drift would cause the detector to lose sensitivity.\n\n**Figure 1** illustrates the full THz time-domain emission spectroscopy (THz-TDES) setup used to measure the emission from our optimized Fe/Pt spintronic emitter. The optical pump beam is sharply focused using an aspherical short-focus lens down to a spot diameter of less than 10 µm in the plane of the metal layers. Why so tight? Because we want to excite a very small, well-defined region of the Fe layer. When the pump pulse hits the Fe, it excites spin-polarized electrons—electrons that have a preferred spin direction due to the magnetization. These hot electrons diffuse into the adjacent Pt layer, creating a spin-current. In the Pt layer, due to a phenomenon called the inverse spin Hall effect, this spin-current is converted into a transient transverse electric current. This current transient is the source of the THz pulse: it radiates an electromagnetic wave with a sub-picosecond duration (less than one trillionth of a second) and a center wavelength around 300 µm. That wavelength corresponds to a frequency of about 1 THz, which is in the terahertz gap—a region of the electromagnetic spectrum between microwaves and infrared.\n\nThis THz pulse is emitted both forward and backward into free space, but it is not a nice, collimated beam. Instead, it emerges as a strongly divergent beam, spreading out in all directions. Why? Because the source is tiny (10 µm) compared to the wavelength (300 µm), the beam diffracts immediately—a fundamental property of waves. To capture this spreading radiation, we attach a hyperhemispherical silicon (Si) lens to the back side of the sample. This lens collects the divergent THz emission and converts it into a more manageable cone-shaped beam, which is then directed to an off-axis parabolic mirror for collimation (making the rays parallel). The Si-lens is a game-changer: with it attached, we observe an enhancement factor of up to 30 in the electric field amplitude. To understand why, imagine trying to catch rain with a thimble versus a funnel. Without the lens, most of the THz radiation would miss the first parabolic mirror and be lost, drastically reducing the efficiency of the entire optical system. The Si-lens acts as the funnel, capturing the wide-angle emission and funneling it into the detection path.\n\nNow, you might wonder: does the Si-lens itself affect the measurements? Yes, but here's the key insight: since we use the same Si-lens for all comparative measurements, any wavelength-dependent effects are identical across experiments. So, when we compare results from different pump wavelengths, the only differences we see are due to the emitter's intrinsic behavior, not the optics.\n\nAfter the first parabolic mirror collimates the THz beam, a second, identical off-axis parabolic mirror in a reversed configuration focuses the beam onto a second Si lens. This lens then concentrates the THz radiation through the GaAs substrate of the detector PCA and onto the dipole gap, where it is detected. In this way, the entire THz optical system—two Si-lenses and two parabolic mirrors—acts as a precise imaging system. It images the point source of THz waves on the emitter surface onto the gap of the detector, ensuring an efficient transfer of the emitted THz energy from source to detector. This is analogous to a projector lens focusing an image onto a screen: the source is the \"object,\" the detector gap is the \"image,\" and the optics ensure that the image is sharp and bright.\n\nIn our setup, the THz beam path is fixed by the silicon lens on the emitter, the parabolic mirrors, and the silicon lens on the photoconductive antenna. Importantly, the alignment of these components is not changed when we exchange the spintronic emitter. If we also keep the position of the pump beam focus constant, we can easily swap emitters without realigning the beam path. This is because the lateral position of the focus on the emitter is not critical, as long as the layer structure is homogeneous. This design makes the experiment highly reproducible and efficient.\n\nFinally, we must consider the detector's frequency response. The photoconductive dipole antenna has a dipole length of 20 µm, which limits the observable bandwidth. This is a fundamental trade-off: a shorter dipole would respond to higher frequencies but with lower sensitivity, while a longer dipole would be more sensitive at lower frequencies but miss the higher ones. With a 20 µm dipole, the detector response peaks around 1 THz, with a 50% reduction in sensitivity at 330 GHz and 2 THz. The 10% response points (where the sensitivity drops to one-tenth of the maximum) are at 100 GHz and 3 THz. Above 3 THz, the frequency response of the"},"qwen3-235b-a22b":{"l5":"## II. EXPERIMENT  \n### A. Experimental details  \n\nTo study the generation of terahertz (THz) radiation from spintronic materials, we use a technique called **terahertz time-domain spectroscopy**, or **THz-TDS**. This method allows us to not only generate short bursts of THz waves but also to measure their electric field directly over time—giving us both amplitude and phase information, which is incredibly powerful for understanding the physics of emission. The full setup is illustrated in Figure 1, and we’ll walk through it step by step, explaining not just *what* each part does, but *why* it’s designed that way.\n\nAt the heart of the system is a **femtosecond laser**—a laser that emits extremely short pulses of light, each lasting less than 100 femtoseconds (that’s 0.0000000000001 seconds!). This laser serves as the \"engine\" driving the entire experiment. In our case, we have two possible lasers we can use:\n\n- A **Ti:sapphire (Ti:Sa) laser** that pulses at a rate of 75 million times per second (75 MHz), with an average power of about 600 milliwatts.\n- Alternatively, a **fiber laser** operating at a longer wavelength (1.55 micrometers), pulsing even faster (100 MHz), but with lower power (up to 50 mW).\n\nWhy do we have two options? Because one of our scientific goals is to compare how different wavelengths of light affect the THz emission from our spintronic devices. But more on that later.\n\nNow, here’s a key idea: THz-TDS is a **pump-probe** technique. That means we split the laser beam into two parts:\n\n- The **pump beam** (the stronger one) is used to *excite* the sample and generate THz radiation.\n- The **probe beam** (the weaker one) is used to *detect* the THz wave at a precisely controlled time delay.\n\nThe splitting is done using a **90:10 beam splitter**—90% of the light goes to the pump, 10% to the probe. The pump beam is sent through a **mechanical delay line**, which is essentially a movable mirror on a motorized stage. By changing the position of this mirror, we can control exactly when the pump pulse arrives at the sample relative to the probe pulse. This allows us to \"scan\" through the THz waveform in time, building it up point by point—like taking a slow-motion movie of an invisible electromagnetic wave.\n\nThe pump beam hits a **spintronic (ST) emitter**, specifically a thin bilayer made of **iron (Fe)** and **platinum (Pt)**. This replaces the traditional photoconductive antenna (PCA) used in standard THz-TDS systems. So instead of using a semiconductor switch to generate THz waves, we’re using the quantum property of electron **spin**—hence the name *spintronic*. We’ll dive deeper into how this works in a moment.\n\nThe sample is mounted so that the laser hits it **perpendicularly**—that is, head-on. But there’s another crucial ingredient: a **weak external magnetic field**, about 20 millitesla (mT), applied perpendicular to the laser beam. Why? Because the Fe layer is magnetic, and we need to align all the electron spins in a specific direction—this is called **saturating the magnetization** along the **easy axis** of the material. Think of it like combing tangled hair: without the magnetic field, the spins point in random directions; with it, they all line up neatly.\n\nThis alignment is critical because the **polarization** (i.e., the direction of oscillation) of the emitted THz wave depends on the direction of the magnetization. Specifically, the THz electric field is always **perpendicular to both the pump laser beam and the magnetic field direction**. So by controlling the magnetic field, we control the polarization of the THz wave. This also means the detector must be aligned to match this polarization—otherwise, it won’t \"see\" the signal properly.\n\nOn the detection side, we use a **photoconductive antenna (PCA)** with a tiny **20-micrometer dipole antenna**. The probe beam \"gates\" this antenna—meaning it briefly turns it on, allowing it to sample the instantaneous strength of the THz electric field passing through it. By repeating this measurement at many different delay times, we reconstruct the full THz waveform.\n\nNow let’s follow the THz wave on its journey from emitter to detector. When the pump laser hits the Fe/Pt bilayer, it excites **spin-polarized electrons** in the iron. These electrons carry their spin orientation as they move into the platinum layer, creating a **spin current**. But platinum has a strong **spin-orbit coupling**—a quantum effect that converts spin current into a **transverse charge current** (a regular electric current flowing perpendicular to the spin flow). This ultrafast current surge—lasting less than a picosecond—radiates a burst of THz light, emitted both forward and backward from the sample.\n\nHere’s a big challenge: THz waves have **long wavelengths**—around **300 micrometers** (which corresponds to a frequency of about 1 THz). But the source—the laser spot—is tiny, only **less than 10 micrometers in diameter**. When a wave is emitted from a source much smaller than its wavelength, it **spreads out rapidly in all directions**—a phenomenon called **diffraction**. Without any help, the THz beam would instantly fan out into a hemisphere, and most of it would miss the collection optics entirely.\n\nTo solve this, we attach a **hyperhemispherical silicon (Si) lens** to the back of the sample. This lens acts like a funnel, capturing the widely spreading THz radiation and redirecting it into a more manageable, cone-shaped beam. This is a huge deal: experiments show this lens boosts the detected **electric field amplitude by up to 30 times**! Why such a dramatic improvement? Because it effectively reduces the angular spread of the emission right at the source, making the beam much easier to collect and guide.\n\nAfter the Si lens, the beam hits an **off-axis parabolic mirror**, which **collimates** it—meaning it makes the rays parallel, like turning a flashlight beam into a laser-like beam. A second, identical parabolic mirror (in reverse configuration) then **refocuses** the beam. Finally, another Si lens on the detector side focuses the THz radiation precisely onto the **20-µm gap** of the photoconductive antenna, where it can be measured.\n\nSo the full optical path is:  \n**Emitter → Si lens → Parabolic mirror (collimator) → Parabolic mirror (focuser) → Si lens on detector → PCA gap**\n\nThis entire system acts like an **imaging system**: it maps the point-like THz source on the emitter directly onto the tiny detection gap. This ensures **maximum transfer efficiency**—we’re not losing precious signal along the way.\n\nAn important practical detail: once this optical path is aligned, we **don’t change it** when swapping out different spintronic emitters. As long as the new sample has the same Si lens attached and the pump laser is focused to the same spot, the THz beam path remains unchanged. And because the laser spot is small and the layers are uniform, the exact lateral position on the sample isn’t critical. This makes comparing different samples fast and reliable.\n\nNow, what about the **bandwidth**—how much of the THz spectrum can we actually detect? That’s limited by the **photoconductive dipole antenna** on the detector. The 20-µm gap size sets the response characteristics. Generally, smaller gaps allow detection of higher frequencies, but there’s a trade-off with signal strength.\n\nFor our 20-µm dipole, the detector is most sensitive around **1 THz**. The response drops to half (−3 dB) at about **330 GHz** and **2 THz**. At the extremes, it falls to 10% of peak response at **100 GHz** and **3 THz**. This means our system can reliably capture signals from roughly **0.1 THz to 3 THz**, with the strongest sensitivity in the middle.\n\nAbove 3 THz the frequency response of the"}},"metadata":{"paper_id":"005566e7f74861ab1d3d1e937f71488f","csv_row":69018,"doi":"10.1109/tmag.2018.2847031","openalex_id":"https://openalex.org/W2793214487","pdf_url":"https://arxiv.org/pdf/1803.08838","page_count":5,"text_chars":21731,"segment_tokens":1024,"l4_usage":{"prompt_toke out visiting either of the wells, and then returns to th e exit\nregion without visiting either of the wells.\nB. The reacting trajectory starts from the entrance region and visits the\nregion of the top or bottom well.\nMoreover, in each of the panels of Fig. 2 we depict three curves in blu e.\nThese are the UPO of the upper index-1 saddle, the UPO in the region of the\ntop well (top UPO) and the UPO in the region of the bottom well (bott om\nUPO). The UPO of the upper index-1 saddle controls entrance and e xit from\nthe reaction region, the UPO in the region of the top well (top UPO) c ontrols\nentrance and exit to the top well and the UPO in the region of the bot tom\nwell (bottom UPO) controls entrance and exit to the bottom well. Th is occurs\nthrough the stable and unstable manifolds of the UPOs in a way that w e now\nexplain.\nA)\n B)\nFigure 2: Illustration of the diﬀerent types of qualitative dynamical behavior of trajectories\nwith energy H0 = 0.1 that enter the system through the channel. W e display the fo rward time\nevolution of the trajectories in red, projected onto the PES. The initial conditions are taken\non the surface of section deﬁned in Eq. (4), and are shown as ma genta dots. The unstable\nperiodic orbits of the system are depicted as blue curves.\nFor two degree-of-freedom Hamiltonian systems UPOs have two dim ensional\nstable and unstable manifolds in the three dimensional energy surfa ce. As a re-\nsult of their dimensionality they divide the three dimensional energy s urface,\nand since they are invariant trajectories cannot pass through th ese surfaces.\nConsequently, they are barriers to phase space transport and t hey therefore\nconstrain the way in which trajectories can evolve in phase space. T o make this\nmore explicit we focus on the notion of homoclinic and heteroclinic traj ectories.\n5\n\nA homoclinic trajectory is a trajectory that is in both the stable and unstable\nmanifold of an unstable periodic orbit. A heteroclinic trajectory is in t he stable\nmanifold of one periodic orbit and the unstable manifold of a diﬀerent p eriodic\norbit. Homoclinic trajectories provide a mechanism for trajectorie s to leave the\nneighbourhood of the periodic orbit and to return to the neighbour hood of the\nperiodic orbit. Heteroclinic trajectories provide a mechanism for tr ajectories to\nleave the neighbourhood of one periodic orbit and enter the neighbo urhood of\nthe other periodic orbit. Furthermore, the existence of homoclinic and hetero-\nclinic trajectories imply that the stable and unstable manifolds of the periodic\norbits intersect in a manner that form two dimensional regions, calle d lobes,\nwhose boundaries are segments of the stable and unstable manifold s [13, 14].\nSince the","models":{"dsv4-flash":{"l5":"Figure 1: Equipotential contours of the potential energy surface described in Eq. (2). We have marked index-1 saddles (upper and lower) as red diamonds, minima of the potential wells with red dots and the valley-ridge inflection point as a blue point. The blue arrows indicate the possible paths for trajectories that enter the system through the upper channel of the system, illustrating the chemical selectivity mechanism.\n\nBefore we dive into the dynamics, let's pause to decode this figure and the table that follows, because they lay the groundwork for everything we'll explore. The potential energy surface (PES) is like a topographical map of a mountain range, where height represents energy. The \"critical points\" are the special landmarks on this map: the *saddles* are mountain passes (the lowest-energy routes between valleys), the *wells* are the valleys themselves (where molecules would naturally settle), and the *valley-ridge inflection point* is a subtle feature where a valley floor transitions into a ridge. The red diamonds mark the saddles, the red dots mark the well minima, and the blue point marks the inflection. The blue arrows show the possible routes a trajectory could take if it enters through the upper channel—these are the pathways we'll be analyzing for selectivity.\n\n| Critical Point | Location (x, y) | Energy (V) | Stability |\n|---|---|---|---|\n| Index-1 Saddle (Upper) | (0,0) | 0 | saddle × center |\n| Index-1 Saddle (Lower) | (1,0) | -4/3 | saddle × center |\n| Potential Well (Top) | (1.107146, 0.879883) | -1.94773 | center |\n| Potential Well (Bottom) | (1.107146, -0.879883) | -1.94773 | center |\n\nTable 1: Location and energies of the critical points of the PES, together with their linear stability behavior when considered as equilibrium points of Hamilton’s equations.\n\nNow, a quick word on what \"stability\" means here. When we say a critical point is a \"saddle × center,\" we're describing what happens to a trajectory that starts very close to that point. The \"saddle\" part means that in one direction, trajectories are pulled away (unstable), while in the perpendicular direction, they oscillate around the point (the \"center\" part, which is stable). So, these saddles are like a mountain pass: you can cross them, but you won't stay there. The wells, on the other hand, are pure \"centers\"—they're stable in all directions, so trajectories will happily orbit around them.\n\n---\n\n## 3. The Phase Space Transport Mechanisms Governing Selectivity\n\nNow we get to the heart of the matter. Our goal is to understand *why* some trajectories visit the wells and others don't—and, crucially, to be able to *predict* which will happen for any given trajectory. We'll do this by working at a fixed total energy, \\( H_0 = 0.1 \\). Think of this as setting the \"budget\" of energy available to our molecule; it can't exceed this amount.\n\nIn Fig. 2, we see two qualitatively distinct reactive trajectories, shown in red, projected onto the PES. These are our \"representative examples\" of the two types of behavior we're trying to explain:\n\n- **A.** The trajectory starts from the entrance region, reaches the energy boundary (the edge of the allowed region) *without* visiting either well, and then returns to the exit region—again, without visiting either well. It's like a visitor who walks into a building, glances around the lobby, and walks right back out without checking out any of the rooms.\n- **B.** The trajectory starts from the entrance region but *does* visit the region of the top or bottom well. This is the visitor who goes into one of the rooms before leaving.\n\nIn each panel of Fig. 2, we also see three blue curves. These are **unstable periodic orbits (UPOs)**. Let's unpack that term. A *periodic orbit* is a trajectory that repeats itself exactly after some time—like a planet orbiting a star. \"Unstable\" means that if you nudge a trajectory slightly off this orbit, it will drift away over time. These UPOs are the gatekeepers of the system:\n\n- The UPO of the **upper index-1 saddle** controls entrance to and exit from the reaction region (the whole area we're studying).\n- The UPO in the region of the **top well** controls entrance and exit to that well.\n- The UPO in the region of the **bottom well** controls entrance and exit to that well.\n\nBut how do these UPOs actually *control* anything? The answer lies in their *stable and unstable manifolds*—the sets of all trajectories that approach the UPO in forward time (stable) or backward time (unstable). These manifolds are the \"walls\" that guide trajectories, and we'll see exactly how in a moment.\n\n---\n\n**Figure 2:** Illustration of the different types of qualitative dynamical behavior of trajectories with energy \\( H_0 = 0.1 \\) that enter the system through the channel. We display the forward time evolution of the trajectories in red, projected onto the PES. The initial conditions are taken on the surface of section defined in Eq. (4), and are shown as magenta dots. The unstable periodic orbits of the system are depicted as blue curves.\n\n---\n\nNow, here's the key geometric insight that makes everything click. For a two degree-of-freedom Hamiltonian system (which is what we have here), the energy surface is three-dimensional. The stable and unstable manifolds of a UPO are each *two-dimensional* surfaces within this three-dimensional space. This is a crucial fact: a two-dimensional surface inside a three-dimensional space acts as a *barrier*—it divides the space into separate regions. You can't get from one side to the other without crossing the surface.\n\nAnd since these manifolds are *invariant* (meaning trajectories that start on them stay on them forever), no trajectory can ever pass *through* them. They are impenetrable walls in phase space. This is the fundamental reason why they constrain the evolution of trajectories: they carve the energy surface into distinct \"rooms,\" and the only way to move between rooms is through the \"doors\" created by the intersections of these manifolds.\n\nTo make this more explicit, we need to introduce two important types of trajectories that live on these manifolds:\n\n- A **homoclinic trajectory** is a trajectory that lies in *both* the stable and unstable manifold of the *same* UPO. Think of it as a path that leaves the neighborhood of the UPO, wanders around, and then comes back to the *same* UPO. This provides a mechanism for trajectories to leave and return to the neighborhood of a single periodic orbit.\n- A **heteroclinic trajectory** is a trajectory that lies in the stable manifold of *one* UPO and the unstable manifold of a *different* UPO. This is a path that leaves the neighborhood of one periodic orbit and enters the neighborhood of another. It's like a bridge connecting two different \"rooms.\"\n\nNow, here's the beautiful part. The existence of homoclinic and heteroclinic trajectories implies that the stable and unstable manifolds of the periodic orbits intersect in a very specific way. They don't just cross at a single point; they weave together to form two-dimensional regions called **lobes**, whose boundaries are segments of the stable and unstable manifolds [13, 14]. These lobes are the \"transport packets\" of the system—they carry trajectories from one region to another. Since the"},"qwen3-235b-a22b":{"l5":"Figure 1: Equipotential contours of the potential energy surface described in Eq. (2). We have marked index-1 saddles (upper and lower) as red diamonds, minima of the potential wells with red dots and the valley-ridge inflection point as a blue point. The blue arrows indicate the possible paths for trajectories that enter the system through the upper channel of the system, illustrating the chemical selectivity mechanism.\n\nCritical point | Location (x, y) | Energy (V) | Stability  \n--- | --- | --- | ---  \nIndex-1 Saddle (Upper) | (0,0) | 0 | saddle × center  \nIndex-1 Saddle (Lower) | (1,0) | -4/3 | saddle × center  \nPotential Well (Top) | (1.107146, 0.879883) | -1.94773 | center  \nPotential Well (Bottom) | (1.107146, −0.879883) | -1.94773 | center  \n\nTable 1: Location and energies of the critical points of the PES, together with their linear stability behavior when considered as equilibrium points of Hamilton’s equations.\n\n4\n\n## 3. The Phase Space Transport Mechanisms Governing Selectivity\n\nNow we’re going to uncover the hidden machinery behind chemical selectivity—why some trajectories end up in one product well and others in a different one, even when they start out very similarly. This isn’t random; it’s governed by precise structures in phase space. Our goal is to predict the fate of individual trajectories based on the underlying geometry of motion.\n\nWe’ll focus on a fixed total energy: $ H_0 = 0.1 $. Why fix the energy? Because in conservative systems like this one (no friction or external forces), energy is conserved. That means every trajectory must stay on the same “energy surface” in phase space—like hikers who can only walk along a specific elevation contour on a mountain. By fixing $ H_0 $, we’re slicing through the full phase space to look at just the allowed motions at this energy.\n\nLet’s start by looking at **Figure 2**, where we see two very different kinds of behavior, shown in red. These are actual computed trajectories, projected down onto the 2D potential energy surface (PES)—think of this as watching the shadow of a 4D motion on a 2D map. Even though the full motion happens in position *and* momentum (four variables total), projecting onto $ (x, y) $ helps us visualize what’s happening in real space.\n\nThere are two main types of trajectory behavior we observe:\n\n**A. Direct reactive trajectories:**  \nThese start from the entrance channel (near the upper index-1 saddle), cross over the reaction region, and exit—without ever falling into either potential well. They’re like a ball rolling quickly over a hill without getting caught in any side valleys.\n\n**B. Indirect (or complex-forming) trajectories:**  \nThese enter the system and get temporarily trapped near one of the two potential wells—either the top or the bottom. They swirl around for a while, as if exploring the neighborhood, before eventually escaping to the exit. This temporary trapping is key to understanding selectivity: depending on which well they visit, they may lead to different chemical outcomes.\n\nNow, here’s the big question: **What controls whether a trajectory takes path A or B? What decides which well it might visit—or if it gets trapped at all?**\n\nThe answer lies not in the trajectories themselves, but in special invariant structures that act like traffic directors in phase space: **unstable periodic orbits (UPOs)**.\n\nIn each panel of Figure 2, you’ll see three blue curves. These are not random—they are the UPOs of the system:\n- The **UPO associated with the upper index-1 saddle** (the red diamond at (0,0))—this one guards the gateway to the entire reaction region.\n- The **top UPO**, which lives near the upper potential well.\n- The **bottom UPO**, which lives near the lower potential well.\n\nEach of these UPOs acts like a dynamical checkpoint:\n- The **upper UPO** controls access *into and out of* the reaction region. No trajectory can enter or leave the central area without passing near this orbit.\n- The **top UPO** regulates traffic going into and out of the top well.\n- The **bottom UPO** does the same for the bottom well.\n\nBut how do they “control” anything? After all, they’re just periodic orbits—repeating loops in phase space.\n\nThe magic happens through their **stable and unstable manifolds**—structures that grow out from the UPOs like invisible rails guiding trajectories.\n\nLet’s build some intuition. Imagine a UPO as a kind of unstable swing that keeps moving in a loop. If you place a ball *exactly* on the swing’s path, it will follow the loop forever. But if you nudge it slightly off, it won’t just wiggle around—it will be *repelled* away along specific directions. These directions define the **unstable manifold**: trajectories that *diverge* from the UPO as time moves forward.\n\nConversely, if you could run time backward, you’d see some trajectories that *approach* the UPO—they’re coming in along the **stable manifold**.\n\nSo, the stable manifold is like a set of incoming highways to the UPO’s neighborhood, and the unstable manifold is a set of outgoing highways.\n\nIn a two-degree-of-freedom Hamiltonian system (like ours), each UPO lives in a 3D energy surface (because energy is fixed), and its stable and unstable manifolds are **2D surfaces** within that 3D space.\n\nNow here’s the crucial point: **2D surfaces in a 3D space can act as barriers.** Just like a piece of paper floating in a room divides the room into two sides, these invariant manifolds divide the energy surface into regions. And because they’re *invariant*—meaning trajectories can’t cross them—they act as one-way membranes that guide and constrain motion.\n\nBut they don’t just sit there passively. They twist and fold, and sometimes, the stable and unstable manifolds of a UPO **intersect** each
