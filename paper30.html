ES\n(3)\n ¬\nThe right hand side of (3) is independent of the rotation dƒÆƒÌ and moreover\n¬\nThus we can conclude that the Besov norm via the wavelet transform is bounded by \nthe usual Besov norm. q.e.d.\nPROOF OF THEOREM 3. Sufficiency: As in Theorem 2, let ¬. \nThen, we have\n¬\nHence, we can easily see that the usual Triebel-Lizorkin norm is bounded by the norm \nvia the wavelet transform.\nNecessity: This part needs very deep results which are continuous versions of the \nwork of Fefferman-Stein [2] and Triebel [5].\nFirst, we state the results without proof. The proof is carried out in the same way \nas in the discrete case. See [2], [5].\nClaim 1 (continuous version of [2]). Let f(x, y) be a function of (x, y)¸Rnx~Rny \nand Mf(x, y) the Hardy-Littlewood maximal function of f(x, y) with respect to x. Then, \nwe have\n¬\nwhere 1<p<‡, 1<q…‡.\nClaim 2 (continuous version of the maximal inequalities in [5]). Let p, q, r sat-\nisfy\n0<p<‡, 0<q…‡ and 0<r<min(p,q).\nLet f(ƒÌ, y) be the Fourier transform of f(x, y) with respect to x and let ƒ","models":{"dsv4-flash":{"l5":"561\n\n## Wavelet Transforms in Euclidean Spaces\n\nLet's begin by setting the stage. We are in the middle of a proof—specifically, the proof of Theorem 1—and we have reached what the author calls \"the heart of the matter.\" Up to this point, we have established some preliminary properties of the wavelet transform. Now, we need to prove a crucial technical fact that will unlock the theorem.\n\n**Setting up the final piece.** We define \\( U_2(0) = \\{\\phi(x) \\equiv 1\\} \\). In plain terms, this means we are considering the constant function that is equal to 1 everywhere. Why do we care about this? Because we want to show that a certain wavelet transform behaves nicely—specifically, that it belongs to a *Sobolev space*, which is a space of functions that have a certain amount of smoothness and decay. This is a very strong and useful property.\n\nNow, by applying Proposition 2 (which we have already established) and by exchanging the order of differentiation and integration—a step that is justified here because our functions are well-behaved enough—we can easily verify that the transform has the desired property. The exchange of differentiation and integration is a standard trick: when we want to differentiate an integral, we can often move the derivative inside the integral sign, provided the integrand is sufficiently smooth and decays nicely. This is exactly what we do here.\n\nSo, we have shown that the transform is smooth in a certain sense. But we want more. We want to show that the transform belongs *globally* to the Sobolev space \\(H^s(\\mathbb{R}^n)\\). This means that not only is the function smooth, but its derivatives up to order \\(s\\) are also square-integrable over the entire space. This is a strong regularity result.\n\nTo prove this, we turn to the **Fourier transform**, which is a powerful tool for studying smoothness. The Fourier transform of our wavelet transform is given by an explicit formula. Let's write it down and then unpack it.\n\n\\[\n\\widehat{f_{\\phi',\\phi}}(\\xi) = \\int g(\\xi, \\eta) \\overline{\\hat{\\phi}(\\eta)} \\, d\\eta\n\\]\n\nHere, the notation \\(\\widehat{\\cdot}\\) denotes the Fourier transform. The key idea is that the Fourier transform converts differentiation into multiplication, so studying the decay of the Fourier transform tells us about smoothness.\n\nNow, we make a clever substitution. We define a new variable, say \\( \\eta = r \\theta \\), where \\( r > 0 \\) and \\( \\theta \\in S^{n-1} \\) (the unit sphere in \\( \\mathbb{R}^n \\)). This is a standard trick: we decompose the frequency space into radial and angular parts. The hypothesis of our theorem, combined with the fact that the support of \\( \\phi(x) \\) is contained in the unit ball \\( U(0) \\), gives us a crucial bound. Let's unpack that.\n\nThe **support** of a function is the set of points where it is nonzero. Since \\( \\phi \\) is supported inside the unit ball, its Fourier transform \\( \\hat{\\phi} \\) has certain decay properties. This is a fundamental fact: the more localized a function is in space, the more spread out its Fourier transform is, and vice versa. Here, the compact support of \\( \\phi \\) means that \\( \\hat{\\phi} \\) is an entire function of exponential type, which gives us strong decay estimates.\n\nSo, we have the inequality:\n\n\\[\n| \\widehat{f}(\\xi) | \\le C \\int |g(\\xi, \\eta)| \\, |\\hat{\\phi}(\\eta)| \\, d\\eta\n\\]\n\nwhere \\( C \\) is a constant. Now, we denote the Fourier transform of \\( g(x, \\eta) \\) with respect to \\( x \\) by \\( \\hat{g}(\\xi, \\eta) \\). This is a standard notation: the hat over \\( g \\) indicates that we have taken the Fourier transform in the first variable only, leaving the second variable untouched.\n\nWe then define a kernel \\( K(\\xi, \\eta) \\) by:\n\n\\[\nK(\\xi, \\eta) = \\hat{g}(\\xi, \\eta) \\overline{\\hat{\\phi}(\\eta)}\n\\]\n\nThis kernel is the product of the Fourier transform of \\( g \\) and the conjugate of the Fourier transform of \\( \\phi \\). It's a measure of how much the wavelet transform \"picks up\" at frequency \\( \\xi \\) from the wavelet at scale \\( \\eta \\).\n\nNow, here's the key observation. Because the support of \\( \\phi \\) is compact, there exists a constant \\( C \\) such that:\n\n\\[\n|K(\\xi, \\eta)| \\le C\n\\]\n\nThis is a uniform bound—it doesn't depend on \\( \\xi \\) or \\( \\eta \\). This is a consequence of the fact that \\( \\hat{\\phi} \\) is bounded (since \\( \\phi \\) is integrable) and that \\( \\hat{g} \\) is also bounded (by the hypothesis of the theorem).\n\nNow, since \\( 0 \\notin \\text{supp} \\, \\hat{\\phi} \\)—that is, the Fourier transform of \\( \\phi \\) does not vanish at the origin—we can use the same argument as in the proof of Proposition 1. The integral over \\( \\eta \\) is bounded by a constant times the \\( L^2 \\) norm of \\( g \\). Specifically, we get:\n\n\\[\n\\int |K(\\xi, \\eta)| \\, d\\eta \\le (2\\pi)^{-n} C \\| \\hat{\\phi} \\|_2^2\n\\]\n\nThis is a crucial estimate. It tells us that the kernel is integrable in \\( \\eta \\), uniformly in \\( \\xi \\). This allows us to bound the Fourier transform of our wavelet transform.\n\nConsequently, we obtain the following inequality:\n\n\\[\n\\| \\hat{f} \\|_{L^2} \\le C \\| g \\|_{L^2}\n\\]\n\nwhich, by the Plancherel theorem (which says that the Fourier transform is an isometry on \\( L^2 \\)), gives us the desired Sobolev space membership. This completes the proof of the theorem.\n\n**q.e.d.**\n\n---\n\n## 2. Proof of Theorems 2 and 3\n\n### Proof of Theorem 2\n\n**Sufficiency:** This direction says: if a function has a bounded Besov norm via the wavelet transform, then it has a bounded usual Besov norm. In other words, the wavelet transform is a *stronger* measure of smoothness.\n\nFor simplicity, we introduce some notation. Let:\n\n\\[\nf_r(\\theta) = f(r\\theta), \\quad \\phi_r(\\theta) = \\phi(r\\theta)\n\\]\n\nwhere \\( d\\theta \\) is the Haar measure on the unit sphere \\( S^{n-1} \\). The Haar measure is the natural notion of \"uniform\" measure on a group or a sphere—it's the measure that is invariant under rotations.\n\nNow, because the support of \\( \\phi \\) is compact and does not contain the origin, the function \\( \\phi_r(\\theta) \\) is compactly supported in the domain:\n\n\\[\nC_1 r \\le |\\theta| \\le C_2 r\n\\]\n\nThis is a spherical shell—a region between two spheres of radii \\( C_1 r \\) and \\( C_2 r \\). This is a direct consequence of the fact that \\( \\phi \\) is supported away from zero, so when we scale it by \\( r \\), the support moves outward.\n\nWe then have the following chain of inequalities:\n\n\\[\n\\| f \\|_{B^s_{p,q}} \\le C \\| f \\|_{B^s_{p,q}(\\psi)}\n\\]\n\nThe first inequality is due to the **continuous version of the Minkowski inequality**, which is a generalization of the triangle inequality to integrals. It allows us to bound the norm of a sum by the sum of the norms. The second inequality is due to the **Hölder inequality**, which is a fundamental tool for bounding products of functions.\n\nBy integrating both sides of this inequality with respect to \\( |\\theta|^s q^{-1} d|\\theta| \\), we can see that the usual Besov norm is bounded by the Besov norm via the wavelet transform. This is a matter of unpacking the definitions: the Besov norm is defined via a weighted integral over scales, and the wavelet transform provides a natural way to measure the size of the function at each scale.\n\n**Necessity:** Now we prove the converse. Let:\n\n\\[\n\\psi_r(\\xi) = \\hat{\\phi}(r\\xi)\n\\]\n\n(cf. the proof of Proposition 1). Then, the support of \\( \\psi_r(\\xi) \\) is contained in the domain:\n\n\\[\nC_1 r \\le |\\xi| \\le C_2 r\n\\]\n\nand we have:\n\n\\[\n\\sum_{j \\in \\mathbb{Z}} \\psi_{2^j}(\\xi) = 1\n\\]\n\nfor all \\( \\xi \\neq 0 \\). This is a **continuous decomposition of unity**. It means that we can write any function as a sum of pieces, each localized in a different frequency band. This is a fundamental tool in harmonic analysis.\n\nBy using this decomposition, we have:\n\n\\[\nf(x) = \\sum_{j \\in \\mathbb{Z}} f_j(x)\n\\]\n\nwhere \\( f_j \\) is the piece of \\( f \\) whose Fourier transform is supported in the \\( j \\)-th frequency band.\n\nNow, because the Fourier transform of \\( \\phi \\) is identically zero unless \\( C_3 |\\xi| \\le r \\le C_4 |\\xi| \\), and because the \\( L^1 \\)-norm of \\( \\phi(|\\xi|, r \\theta) \\) and that of \\( \\psi_r \\) is bounded, the last term in the decomposition does not exceed:\n\n\\[\nC \\sum_{j \\in \\mathbb{Z}} \\| f_j \\|_{L^p}\n\\]\n\nThe right-hand side is independent of the rotation \\( d\\theta \\), and moreover:\n\n\\[\n\\sum_{j \\in \\mathbb{Z}} \\| f_j \\|_{L^p} \\le C \\| f \\|_{B^s_{p,q}}\n\\]\n\nThus, we can conclude that the Besov norm via the wavelet transform is bounded by the usual Besov norm. This completes the proof.\n\n---\n\n### Proof of Theorem 3\n\n**Sufficiency:** As in Theorem 2, let \\( f_r(x) = f(rx) \\). Then, we have:\n\n\\[\n\\| f \\|_{F^s_{p,q}} \\le C \\| f \\|_{F^s_{p,q}(\\psi)}\n\\]\n\nHence, we can easily see that the usual Triebel-Lizorkin norm is bounded by the norm via the wavelet transform. The Triebel-Lizorkin spaces are a family of function spaces that generalize both Sobolev and Besov spaces, and they are defined using a different way of measuring smoothness.\n\n**Necessity:** This part needs very deep results which are continuous versions of the work of Fefferman-Stein [2] and Triebel [5]. These are foundational results in harmonic analysis that deal with maximal functions and their properties.\n\nFirst, we state the results without proof. The proof is carried out in the same way as in the discrete case. See [2], [5].\n\n**Claim 1 (continuous version of [2]).** Let \\( f(x, y) \\) be a function of \\( (x, y) \\in \\mathbb{R}^n_x \\times \\mathbb{R}^n_y \\) and \\( M f(x, y) \\) the Hardy-Littlewood maximal function of \\( f(x, y) \\) with respect to \\( x \\). Then, we have:\n\n\\[\n\\| M f \\|_{L^p(L^q)} \\le C \\| f \\|_{L^p(L^q)}\n\\]\n\nwhere \\( 1 < p < \\infty \\), \\( 1 < q \\le \\infty \\). The Hardy-Littlewood maximal function is a fundamental tool in harmonic analysis; it measures the local \"size\" of a function by taking the supremum of its averages over balls.\n\n**Claim 2 (continuous version of the maximal inequalities in [5]).** Let \\( p, q, r \\) satisfy:\n\n\\[\n0 < p < \\infty, \\quad 0 < q \\le \\infty, \\quad 0 < r < \\min(p, q)\n\\]\n\nLet \\( f(\\xi, y) \\) be the Fourier transform of \\( f(x, y) \\) with respect to \\( x \\) and let \\( \\"},"qwen3-235b-a22b":{"l5":"561 WAVELET TRANSFORMS IN EUCLIDEAN SPACES  \nLet us define $ U_2(0) = \\{\\psi(x) \\neq 0\\} $. Our goal now is to analyze the behavior of a certain function associated with the wavelet transform and understand its regularity properties—specifically, whether it belongs to a Sobolev space. Why does this matter? Because Sobolev spaces measure not just the size of a function, but also the size of its derivatives, giving us a precise way to quantify smoothness. This is crucial when we want to understand how well a function can be approximated or reconstructed from its wavelet coefficients.\n\nFrom Proposition 2, we know that under suitable conditions, we can exchange the order of differentiation and integration. This might sound technical, but here's what it means intuitively: if you're integrating a function that also depends on a parameter (like scale or position in wavelet analysis), and you want to take a derivative with respect to that parameter, sometimes you can safely \"pull\" the derivative inside the integral. This is not always allowed—functions need to be sufficiently nice—but in our case, the conditions of Proposition 2 justify this step.\n\nSo, using that result, we can differentiate under the integral sign and conclude that the function in question is differentiable in a weak (distributional) sense. Therefore, it follows that this function has derivatives up to a certain order in $ L^2 $, which brings us closer to showing it lies in a Sobolev space.\n\nNow comes the most important part: we want to show that $ f_{\\psi}', \\psi $ belongs globally to the Sobolev space $ H^s(\\mathbb{R}^n) $. Let’s unpack that. The notation $ H^s(\\mathbb{R}^n) $ refers to the space of functions whose Fourier transforms are weighted by $ (1 + |\\xi|^2)^{s/2} $, meaning we require:\n$$\n\\int_{\\mathbb{R}^n} |\\hat{f}(\\xi)|^2 (1 + |\\xi|^2)^s \\, d\\xi < \\infty.\n$$\nThis is a measure of both decay at infinity and smoothness: larger $ s $ means the function must be smoother.\n\nThe Fourier transform of $ f_{\\psi}'(\\cdot, \\psi) $ is given by:\n$$\n\\widehat{f_{\\psi}'}(\\xi) = \\int_0^\\infty \\int_{S^{n-1}} \\hat{f}(r\\theta) \\overline{\\hat{\\psi}(r\\theta)} r^{n-1} \\, d\\sigma(\\theta) \\, \\frac{dr}{r}.\n$$\n\nIf we put $ g(x, r) = \\int_{S^{n-1}} \\hat{f}(r\\theta) e^{2\\pi i x \\cdot r\\theta} d\\sigma(\\theta) $, then it follows from the hypothesis—and the fact that the support of $ \\psi(x) $ is contained in $ U(0) $, a neighborhood of the origin—that the corresponding Fourier-side support of $ \\hat{\\psi} $ avoids the origin and lies within an annular region. This is key: wavelets are designed to localize in frequency around specific scales, so their Fourier transforms vanish near zero frequency (i.e., no DC component) and decay outside a certain band.\n\nSince $ \\text{supp}\\, \\hat{\\psi} $ is compact and does not include the origin, there exist constants $ C_1, C_2 > 0 $ such that $ \\text{supp}\\, \\hat{\\psi} \\subset \\{ \\xi : C_1 \\leq |\\xi| \\leq C_2 \\} $. This annular support is fundamental to the wavelet’s ability to capture oscillatory behavior at a given scale.\n\nIf we denote the Fourier transform of $ g(x, r) $ with respect to $ x $ by $ \\hat{g}(\\xi, r) $, we have:\n$$\n\\hat{g}(\\xi, r) = \\int_{S^{n-1}} \\hat{f}(r\\theta) \\delta(\\xi - r\\theta) \\, d\\sigma(\\theta),\n$$\nwhere $ \\delta $ represents the Dirac distribution. But more precisely, this object is better understood as a restriction of $ \\hat{f} $ to spheres of radius $ r $, smeared over the angular variable.\n\nHere, $ K(\\xi, r) $ is defined by:\n$$\nK(\\xi, r) = \\int_{S^{n-1}} \\delta(\\xi - r\\theta) \\, d\\sigma(\\theta).\n$$\nThis kernel captures how the spherical averages of $ \\hat{f} $ contribute to the overall transform.\n\nSince $ \\text{supp}\\, \\hat{\\psi} $ is compact, there exists a constant $ C $ such that:\n$$\n|K(\\xi, r)| \\leq C \\quad \\text{uniformly in } r.\n$$\nThis uniform boundedness is essential—it ensures that our integral operators don’t blow up.\n\nTherefore, since $ 0 \\notin \\text{supp}\\, \\hat{\\psi} $, by the argument given in the proof of Proposition 1 (which relies on nonstationary phase estimates or integration by parts for oscillatory integrals), the integral\n$$\n\\int_{\\mathbb{R}^n} \\frac{|\\hat{f}(\\xi)|^2}{(1 + |\\xi|^2)^s} \\left| \\int_0^\\infty |\\hat{\\psi}(r\\xi/|\\xi|)|^2 \\frac{dr}{r} \\right| d\\xi\n$$\nis bounded with bound $ (2\\pi)^{-n} C_\\psi C^2 $, where $ C_\\psi $ depends only on the wavelet $ \\psi $.\n\nConsequently, we obtain the following inequality:\n$$\n\\|f\\|_{H^s}^2 \\leq C \\int_0^\\infty \\int_{S^{n-1}} |W_\\psi f(r\\theta)|^2 r^{-2s} \\, d\\sigma(\\theta) \\, \\frac{dr}{r},\n$$\nwhere $ W_\\psi f $ denotes the continuous wavelet transform of $ f $ with respect to $ \\psi $. This inequality shows that control over the wavelet coefficients—weighted appropriately by scale—gives control over the Sobolev norm. In other words, the wavelet transform provides a faithful representation of smoothness in terms of multiscale analysis.\n\n562 S. MORITOH  \nq.e.d.\n\n2. Proof of Theorems 2 and 3.  \nPROOF OF THEOREM 2.  \nSufficiency: For simplicity, let  \n$$\n\\psi_r(\\theta) = \\psi(r\\theta), \\quad \\text{and} \\quad d\\sigma_\\theta \\text{ be the Haar measure on } S^{n-1}.\n$$\nHere, $ d\\sigma_\\theta $ is just the standard surface measure on the unit sphere—it tells us how to integrate over directions in $ \\mathbb{R}^n $. The function $ \\psi_r(\\theta) $ represents the wavelet dilated to scale $ r $ and evaluated in direction $ \\theta $.\n\nThen, $ \\psi_r(\\theta) $ is compactly supported in the annular domain $ C_1 r \\leq |\\theta| \\leq C_2 r $? Wait—that doesn’t make sense because $ \\theta \\in S^{n-1} $, so $ |\\theta| = 1 $. Let's correct that interpretation.\n\nActually, what is meant is that the function $ x \\mapsto \\psi_r(x) = r^{-n} \\psi(x/r) $ has a Fourier transform supported in the annulus $ C_1 r \\leq |\\xi| \\leq C_2 r $. This is the standard setup in wavelet theory: each scale $ r $ corresponds to frequencies of magnitude roughly $ r $. And since $ \\text{supp}\\, \\hat{\\psi} $ is compact and does not contain 0, this annular support is preserved under scaling.\n\nMoreover, any half-line starting from the origin intersects $ \\text{supp}\\, \\hat{\\psi}_r $—this ensures that all directions are covered across scales, which is necessary for a complete decomposition.\n\nWe have:\n$$\n|W_\\psi f(x,r)| = \\left| \\int_{\\mathbb{R}^n} f(y) \\overline{\\psi_r(x - y)} dy \\right| \\leq \\int_{\\mathbb{R}^n} |f(y)| |\\psi_r(x - y)| dy.\n$$\n\nThe first inequality is due to the continuous version of the Minkowski inequality—which allows us to bound the norm of an integral by the integral of the norm—and the second one is due to Hölder's inequality, which helps us split products into manageable $ L^p $ norms.\n\nIntegrating both sides of this inequality with respect to $ r^{s q - 1} dr $, we can see that the usual Besov norm is bounded by the Besov norm defined via the wavelet transform. Why is this useful? Because Besov norms measure smoothness using differences or frequency localization, and now we’ve shown that the wavelet-based version controls the classical one. This means wavelets are powerful enough to characterize function spaces accurately.\n\nNecessity: Let  \n$$\n\\phi_r(\\xi) = \\phi(\\xi / r),\n$$\n(cf. the proof of Proposition 1). Then, $ \\text{supp}\\, \\phi_r(\\xi) $ is contained in the annulus $ C_1 r \\leq |\\xi| \\leq C_2 r $, and  \n$$\n\\sum_{r > 0} |\\hat{\\phi}_r(\\xi)|^2 \\sim 1,\n$$\nthat is,  \n$$\n\\int_0^\\infty |\\hat{\\phi}_r(\\xi)|^2 \\frac{dr}{r} \\approx 1 \\quad \\text{for all } \\xi \\neq 0.\n$$\n\nThis is a continuous decomposition of unity in frequency space: every nonzero frequency is “covered” by some scale $ r $, and the total weight sums to about 1. This allows us to reconstruct any function (with zero mean) from its wavelet coefficients.\n\nBy using this continuous decomposition of unity, we have  \n(2)\n$$\nf = \\int_0^\\infty \\int_{S^{n-1}} W_\\psi f(x,r) \\psi_r(x - \\cdot) \\, d\\sigma(\\theta) \\, \\frac{dr}{r},\n$$\nin the sense of distributions.\n\nBecause the Fourier transform of $ \\psi_r $ is identically zero unless $ C_3 |\\xi| \\leq r \\leq C_4 |\\xi| $, and because the $ L^1 $-norm of $ \\psi_r $ and that of $ \\phi_r $ is bounded uniformly in $ r $, the last term in (2) does not exceed\n\n563 WAVELET TRANSFORMS IN EUCLIDEAN SPACES  \n(3)\n$$\nC \\left( \\int_0^\\infty \\int_{S^{n-1}} |W_\\psi f(x,r)|^q \\, d\\sigma(\\theta) \\, \\frac{dr}{r} \\right)^{1/q}\n$$\nThe right-hand side of (3) is independent of the rotation $ d\\sigma_\\theta $ and moreover\n$$\n\\int_{S^{n-1}} d\\sigma(\\theta) = 1,\n$$\nso integrating over directions doesn't change the bound.\n\nThus we can conclude that the Besov norm via the wavelet transform is bounded by the usual Besov norm.  \nq.e.d.\n\nPROOF OF THEOREM 3.  \nSufficiency: As in Theorem 2, let  \n$$\n\\psi_r(x) = r^{-n} \\psi(x/r).\n$$\nThen, we have  \n$$\n\\|f\\|_{F^{s}_{p,q}} \\leq C \\left\\| \\left( \\int_0^\\infty \\int_{S^{n-1}} |W_\\psi f(\\cdot, r)|^q \\, d\\sigma(\\theta) \\, \\frac{dr}{r} \\right)^{1/q} \\right\\|_{L^p}.\n$$\n\nHence, we can easily see that the usual Triebel-Lizorkin norm is bounded by the norm via the wavelet transform. This parallels the Besov case, but now we’re taking $ L^p $ of a square function (or $ q $-function), which captures oscillation in a different way—more sensitive to cancellation across scales.\n\nNecessity: This part needs very deep results which are continuous versions of the work of Fefferman-Stein [2] and Triebel [5].  \nFirst, we state the results without proof. The proof is carried out in the same way as in the discrete case. See [2], [5].\n\nClaim 1 (continuous version of [2]). Let $ f(x, y) $ be a function of $ (x, y) \\in \\mathbb{R}^n_x \\times \\mathbb{R}^n_y $ and $ Mf(x, y) $ the Hardy-Littlewood maximal function of $ f(x, y) $ with respect to $ x $. Then, we have  \n$$\n\\left\\| \\left( \\int |f(\\cdot, y)|^q \\, dy \\right)^{1/q} \\right\\|_{L^p} \\leq C \\left\\| \\left( \\int |Mf(\\cdot, y)|^q \\, dy \\right)^{1/q} \\right\\|_{L^p},\n$$\nwhere $ 1 < p < \\infty $, $ 1 < q \\leq \\infty $.  \n\nThis inequality says that the $ L^p(L^q) $ norm of a function is controlled by the maximal function applied in one variable. The Hardy-Littlewood maximal function averages a function over balls and gives a measure of its local size—it’s a tool to control pointwise behavior without assuming continuity.\n\nClaim 2 (continuous version of the maximal inequalities in [5]). Let $ p, q, r $ satisfy  \n$$\n0 < p < \\infty, \\quad 0 < q \\leq \\infty, \\quad 0 < r < \\min(p,q).\n$$\nLet $ \\hat{f}(\\xi, y) $ be the Fourier transform of $ f(x, y) $ with respect to $ x $ and let $ \\mathcal{M} $"}},"metadata":{"paper_id":"0073d99d248824583864cf3a03ec544f","csv_row":95132,"doi":"10.2748/tmj/1178225461","openalex_id":"https://openalex.org/W2092006861","pdf_url":"https://www.jstage.jst.go.jp/article/tmj1949/47/4/47_4_555/_pdf","page_count":11,"text_chars":13111,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2450,"total_tokens":3279,"completion_tokens":829,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2311,"total_tokens":4979,"completion_tokens":2668,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":2.830667734146118,"l5_seconds":15.104705333709717}}]}</script>

function mathEnd(text,start){
  let close="",cursor=0;
  if(text.startsWith("$$",start)){close="$$";cursor=start+2}
  else if(text.startsWith("\\[",start)){close="\\]";cursor=start+2}
  else if(text.startsWith("\\(",start)){close="\\)";cursor=start+2}
  else if(text[start]==="$"&&(start===0||text[start-1]!=="\\")){close="$";cursor=start+1}
  else return -1;
  while(cursor<text.length){
    const found=text.indexOf(close,cursor);
    if(found<0)return -1;
    if(found===0||text[found-1]!=="\\")return found+close.length;
    cursor=found+close.length;
  }
  return -1;
}
function tokenize(value){
  const text=String(value??""),tokens=[];
  let cursor=0;
  while(cursor<text.length){
    const formulaEnd=mathEnd(text,cursor);
    if(formulaEnd>cursor){tokens.push(text.slice(cursor,formulaEnd));cursor=formulaEnd;continue}
    if(/\s/.test(text[cursor])){let end=cursor+1;while(end<text.length&&/\s/.test(text[end]))end++;tokens.push(text.slice(cursor,end));cursor=end;continue}
    let end=cursor+1;
    while(end<text.length&&!/\s/.test(text[end])&&mathEnd(text,end)<0)end++;
    tokens.push(text.slice(cursor,end));cursor=end;
  }
  return tokens;
}

  const ops=[];let del=0,ins=0,i=0,j=0;const push=(t,s)=>{const last=ops[ops.length-1];if(last&&last.t===t)last.s+=s;else ops.push({t,s})};

}

function renderMath(root){if(typeof renderMathInElement==="function")renderMathInElement(root,MATH_OPTIONS)}
function stripDanglingMath(value){
  const text=String(value??""),trimmed=text.trimEnd();
  for(const [open,close] of [["\\(","\\)"],["\\[","\\]"]]){
    const start=trimmed.lastIndexOf(open);
    if(start>=0&&trimmed.indexOf(close,start+open.length)<0&&trimmed.length-start<=8)return trimmed.slice(0,start).trimEnd();
  }
  return text;
}
function buildRail(){
  BOOKS.forEach((book,index)=>{const button=document.createElement("button");button.type="button";button.className="bk hard";button.innerHTML='<span class="n">'+pad2(book.idx)+'</span><span><span class="dm" title="'+esc(book.title)+'">'+esc(book.title)+'</span><span class="src">'+esc(book.source)+'</span></span>';button.onclick=()=>select(index);rail.appendChild(button)});
}
function syncHash(){history.replaceState(null,"","#book="+BOOKS[cur].idx)}
function select(index,scroll=true){if(index<0||index>=BOOKS.length)return;cur=index;[...rail.querySelectorAll(".bk")].forEach((el,i)=>el.classList.toggle("on",i===index));render();if(scroll)main.scrollIntoView({block:"start"});syncHash()}
function render(){
  const book=BOOKS[cur],seq=++renderSeq,meta=book.metadata||{},tokenLabel=meta.segment_tokens||1024;
  main.innerHTML='<div class="bookhead"><div class="bighash">'+pad2(book.idx)+'</div><div class="meta"><div class="titlerow"><span class="dombadge">'+esc(book.domain||"Academic paper")+'</span><span class="srcmini">'+esc(book.source)+'</span></div><div class="booktitle">'+esc(book.title)+'</div></div><div class="nav-arrows"><button class="arrow" id="prevb" '+(cur===0?"disabled":"")+'>← 上一篇</button><button class="arrow" id="nextb" '+(cur===BOOKS.length-1?"disabled":"")+'>下一篇 →</button></div></div>'+ 
  '<div class="stagebar"><span class="stage-hint"><a class="source-link" target="_blank" rel="noopener" href="'+esc(meta.pdf_url||"")+'">公开 PDF</a> · '+tokenLabel+' token</span></div>'+ 
  '<div class="orig" id="origp"><div class="panel-tag"><span class="step">①</span> L5 输入 · 论文正文段</div><div class="body">'+esc(book.seg)+'</div><button class="moretog" id="origmore">展开全文 ▾</button></div><div class="strip-wrap"><div class="strip stagewrap" id="strip"></div></div>';
  renderMath($("origp").querySelector(".body"));
  $("prevb").onclick=()=>select(cur-1);$("nextb").onclick=()=>select(cur+1);$("origmore").onclick=()=>{const open=$("origp").classList.toggle("open");$("origmore").textContent=open?"收起 ▴":"展开全文 ▾"};
  const strip=$("strip");
  ORDER.forEach(model=>{const value=stripDanglingMath((book.models[model]||{}).l5||""),card=document.createElement("div");card.className="mcard";card.innerHTML='<div class="mcard-h"><span class="mname">'+esc(model)+'</span><span class="badge base">对比模型</span></div>';const stage=document.createElement("div");stage.className="stage l5";stage.innerHTML='<div class="stage-h"><span class="step">②</span>过 L5 · 认知重写<span class="stat" data-role="stat">…</span></div><div class="difftext" data-role="body"><span class="calc">计算 diff…</span></div>';card.appendChild(stage);strip.appendChild(card);setTimeout(()=>{if(seq!==renderSeq)return;if(!value){stage.querySelector('[data-role="body"]').innerHTML='<div class="waitbox">暂无 L5 结果</div>';stage.querySelector('[data-role="stat"]').textContent="无结果";return}const diff=diffTokens(book.seg,value),body=stage.querySelector('[data-role="body"]');body.innerHTML=renderDiff(diff,"l5");renderMath(body);stage.querySelector('[data-role="stat"]').textContent="+"+diff.ins+" 新增 · −"+diff.del+" 删"},0)});
}
buildRail();
const match=/book=(\d+)/.exec(location.hash);if(match){const found=BOOKS.findIndex(book=>book.idx===+match[1]);if(found>=0)cur=found}select(cur,false);
document.addEventListener("keydown",event=>{if(event.key==="ArrowLeft")select(cur-1);if(event.key==="ArrowRight")select(cur+1)});
</script>
</body>
