orf (ξ1,ξ 2)RG> 0 taking into account the property (14) of the exponential-integr al function we see\nthat the eﬀective potenial (15) is non-negative and takes minimum a tρ = 0. This situation is illustrated\nby Fig. 1 at f (ξ1,ξ 2)RG = 10.\nAs is seen in Fig. 1 the chiral symmetry is broken down for f (ξ1,ξ 2)RG = −10. To understand the\nphase structure of the SUSY NJL model for a negative f (ξ1,ξ 2)RG we will analyse the eﬀective potential\nmore precisely. The dynamically generated mass m of fermion ψ and scalar φ is given by the value of ρ\nat the minimum of the eﬀective potential. Stationary condition for th e eﬀective potential (15) is given\nby\n∂V (ρ)\n∂ρ =ρ\n[ 2\nG − 2R\n(4π )2f (ξ1,ξ 2)Ei\n(\n−ρ2\nΛ 2\n)]\n= 0. (17)\nThus the dynamical mass m = ⟨ρ⟩ satisﬁes\n16π 2\nRG =f (ξ1,ξ 2)Ei\n(\n−m2\nΛ 2\n)\n< 0. (18)\nThis equation","models":{"dsv4-flash":{"l5":"We begin with a crucial observation from our numerical results. Figure 1 displays the effective potential \\( G V(\\rho)/\\Lambda^2 \\) as a function of \\( \\rho/\\Lambda \\) for three distinct values of the renormalized nonminimal coupling parameter: \\( f(\\xi_1,\\xi_2)_{\\text{RG}} = 10 \\), \\( 0 \\), and \\( -10 \\). \n\nBefore we interpret these curves, let's recall what we are looking at. The effective potential \\( V(\\rho) \\) tells us the energy of the system as a function of the \"condensate\" field \\( \\rho \\). The ground state of the system—the state of lowest energy—corresponds to the minimum of this potential. If the minimum occurs at \\( \\rho = 0 \\), the symmetry is unbroken. If the minimum occurs at a non-zero value of \\( \\rho \\), the symmetry is spontaneously broken, and the fermions and scalars acquire a dynamical mass proportional to that value of \\( \\rho \\).\n\nNow, let's examine the three curves. For \\( f(\\xi_1,\\xi_2)_{\\text{RG}} = 0 \\), the potential is a simple quadratic function that has its minimum exactly at \\( \\rho = 0 \\). For \\( f(\\xi_1,\\xi_2)_{\\text{RG}} = 10 \\), the potential is non-negative and also has its minimum at \\( \\rho = 0 \\). However, for \\( f(\\xi_1,\\xi_2)_{\\text{RG}} = -10 \\), the potential develops a minimum at a non-zero value of \\( \\rho \\), indicating that the chiral symmetry is broken down.\n\nTo understand this behavior analytically, we need to go back to the integral we encountered earlier. The integration over the proper time \\( t \\) diverges near \\( t \\sim 0 \\). To handle this divergence, we introduce a proper time cut-off \\( \\Lambda \\). This is a standard regularization technique: we simply stop the integration at a lower bound \\( 1/\\Lambda^2 \\) instead of going all the way to zero. This gives us the result:\n\n\\[\nI \\rightarrow \\frac{R}{2(4\\pi)^2} \\int_{1/\\Lambda^2}^{\\infty} dt \\frac{1}{t^2} \\left( e^{-t\\rho^2} - 1 \\right) = \\frac{R}{2(4\\pi)^2} \\left[ \\rho^2 \\text{Ei}\\left(-\\frac{\\rho^2}{\\Lambda^2}\\right) + \\Lambda^2 \\left( e^{-\\rho^2/\\Lambda^2} - 1 \\right) \\right],\n\\]\n\nwhich is equation (13). Here, \\( \\text{Ei}(-x) \\) is the exponential-integral function, defined as:\n\n\\[\n\\text{Ei}(-x) = -\\int_x^\\infty dt \\frac{e^{-t}}{t} = \\ln x + \\gamma + \\sum_{n=1}^\\infty \\frac{(-x)^n}{n \\cdot n!} < 0 \\quad (x > 0).\n\\]\n\nThis function is negative for all positive \\( x \\), which is a property we will use shortly. The constant \\( \\gamma \\) is the Euler-Mascheroni constant.\n\nSubstituting this result back into the expression for the effective potential, we obtain the leading-order effective potential in the \\( 1/N_c \\)-expansion for the supersymmetric NJL model in curved spacetime:\n\n\\[\nV(\\rho) = \\frac{1}{G} \\rho^2 - \\frac{R}{(4\\pi)^2} f(\\xi_1, \\xi_2) \\left[ \\rho^2 \\text{Ei}\\left(-\\frac{\\rho^2}{\\Lambda^2}\\right) + \\Lambda^2 \\left( e^{-\\rho^2/\\Lambda^2} - 1 \\right) \\right],\n\\]\n\nwhich is equation (15). Here, the function \\( f(\\xi_1, \\xi_2) \\) is defined as:\n\n\\[\nf(\\xi_1, \\xi_2) = \\frac{1}{2} - \\xi_1 - \\xi_2.\n\\]\n\nThis function encodes the nonminimal coupling of the scalar fields to the curvature scalar \\( R \\). \n\nNow, let's analyze the behavior of this potential. \n\n**Case 1: Flat spacetime (\\( R = 0 \\))**\n\nIn flat spacetime, the curvature scalar \\( R \\) vanishes. The effective potential (15) reduces to a simple quadratic function:\n\n\\[\nV(\\rho) = \\frac{1}{G} \\rho^2.\n\\]\n\nIt is evident that the minimum of this potential is at \\( \\rho = 0 \\) for any values of the nonminimal coupling parameters. This is exactly what we see in Fig. 1 for \\( f(\\xi_1,\\xi_2)_{\\text{RG}} = 0 \\). No symmetry breaking occurs.\n\n**Case 2: Positive \\( f(\\xi_1,\\xi_2)_{\\text{RG}} > 0 \\)**\n\nWhen \\( f(\\xi_1,\\xi_2)_{\\text{RG}} > 0 \\), we must use the property (14) of the exponential-integral function: \\( \\text{Ei}(-x) < 0 \\) for \\( x > 0 \\). This means the term \\( \\rho^2 \\text{Ei}(-\\rho^2/\\Lambda^2) \\) is negative. However, the overall potential (15) remains non-negative, and its minimum is still at \\( \\rho = 0 \\). This is illustrated in Figure 1 at \\( f(\\xi_1,\\xi_2)_{\\text{RG}} = 10 \\). Again, no symmetry breaking.\n\n**Case 3: \\( f(\\xi_1,\\xi_2)_{\\text{RG}} < 0 \\)**\n\nAs seen in Figure 1, for \\( f(\\xi_1,\\xi_2)_{\\text{RG}} = -10 \\), the chiral symmetry is broken down. To understand the phase structure for negative \\( f \\), we need to analyze the effective potential more precisely.\n\nThe dynamically generated mass \\( m \\) of the fermion \\( \\psi \\) and scalar \\( \\phi \\) is given by the value of \\( \\rho \\) at the minimum of the effective potential. To find this minimum, we impose the stationary condition:\n\n\\[\n\\frac{\\partial V(\\rho)}{\\partial \\rho} = \\rho \\left[ \\frac{2}{G} - \\frac{2R}{(4\\pi)^2} f(\\xi_1,\\xi_2) \\text{Ei}\\left(-\\frac{\\rho^2}{\\Lambda^2}\\right) \\right] = 0.\n\\]\n\nThis is equation (17). Notice that \\( \\rho = 0 \\) is always a solution, but we are interested in the non-trivial solution where the bracket vanishes. Setting the bracket to zero and solving for the dynamical mass \\( m = \\langle \\rho \\rangle \\), we find:\n\n\\[\n\\frac{16\\pi^2}{RG} = f(\\xi_1,\\xi_2) \\text{Ei}\\left(-\\frac{m^2}{\\Lambda^2}\\right) < 0.\n\\]\n\nThis is equation (18). The inequality \\( < 0 \\) follows from the property of the exponential-integral function. This equation"},"qwen3-235b-a22b":{"l5":"fRG = −10  \nfRG = 0  \nfRG = 10  \n−6 × 10⁻⁹  \n−4 × 10⁻⁹  \n−2 × 10⁻⁹  \n0  \n2 × 10⁻⁹  \n4 × 10⁻⁹  \n6 × 10⁻⁹  \n8 × 10⁻⁹  \n1 × 10⁻⁸  \n1.2 × 10⁻⁸  \n0 0.0001 0.0002 0.0003 0.0004 0.0005  \nGV(ρ)/Λ²  \nρ/Λ  \nFigure 1: Behaviour of the effective potential at f(ξ₁,ξ₂)RG = 10, 0, −10.\n\nLet’s walk through what’s happening here step by step. We’re studying how quantum fields behave in curved spacetime, specifically within a model called the supersymmetric Nambu–Jona-Lasinio (SUSY NJL) model. One of the key tools we use is the *effective potential*, V(ρ), which tells us about the possible stable states (or \"phases\") of the system. The variable ρ is related to the expectation value of a composite field—it will eventually tell us whether fermions and scalars in the theory acquire a dynamical mass.\n\nBut before we get to the full expression for V(ρ), we encounter a mathematical challenge: an integral that blows up (diverges) when the integration variable t approaches zero. This is common in quantum field theory—it signals that we’re probing physics at extremely short distances (or high energies), where our current description might break down.\n\nTo handle this, we introduce a *proper time cutoff*, Λ. Think of this like putting a lower limit on how finely we can probe spacetime—similar to how a microscope has a resolution limit. We’re saying: “We won’t consider physics at scales smaller than 1/Λ.” This makes the integral finite and physically meaningful.\n\nSo instead of integrating t from 0 to ∞ (which would give infinity), we start the integral at t = 1/Λ². That’s what the next expression does:\n\n$$\nI \\rightarrow \\frac{R}{2(4\\pi)^2} \\int_{1/\\Lambda^2}^{\\infty} dt\\, \\frac{1}{t^2} \\left( e^{-t\\rho^2} - 1 \\right)\n$$\n\nNow, this integral might look intimidating, but let’s break it down. We’re integrating a function that combines an exponential decay (e⁻ᵗρ²) and a constant (−1), scaled by 1/t². The exponential term dies off at large t, and the subtraction of 1 ensures that the integrand behaves nicely at large t. But near t = 0 (or rather, near t = 1/Λ² due to the cutoff), the 1/t² factor makes the integral sensitive to high-energy effects.\n\nAfter performing this integral (which involves some clever calculus and special functions), we arrive at a closed-form expression:\n\n$$\nI = \\frac{R}{2(4\\pi)^2} \\left[ \\rho^2 \\, \\text{Ei}\\left( -\\frac{\\rho^2}{\\Lambda^2} \\right) + \\Lambda^2 \\left( e^{-\\rho^2/\\Lambda^2} - 1 \\right) \\right], \\tag{13}\n$$\n\nHere, **Ei(−x)** is the *exponential integral function*, a special function that often appears in physics when integrating exponentials over infinite ranges. It’s not an elementary function like sine or log, but it’s well-studied and tabulated.\n\nLet’s pause to understand Ei(−x). It’s defined as:\n\n$$\n\\text{Ei}(-x) = -\\int_x^\\infty dt\\, \\frac{e^{-t}}{t}, \\quad (x > 0). \\tag{14}\n$$\n\nThis means we’re integrating the function e⁻ᵗ/t from x to infinity. Because of the 1/t factor, the integral diverges logarithmically as t → 0, but since we start at x > 0, it’s finite. In fact, for small x, Ei(−x) behaves like ln(x) plus some constants. The full expansion is:\n\n$$\n\\text{Ei}(-x) = \\ln x + \\gamma + \\sum_{n=1}^\\infty \\frac{(-x)^n}{n \\cdot n!} < 0, \\quad (x > 0),\n$$\n\nwhere γ is the Euler-Mascheroni constant (approximately 0.5772). Note that Ei(−x) is always *negative* for positive x—this will be important later when we analyze the shape of the potential.\n\nNow, plugging this result back into our effective action, we obtain the full effective potential in the leading order of the 1/N_c expansion (a large-N approximation commonly used to make strongly interacting theories tractable):\n\n$$\nV(\\rho) = \\frac{1}{G}\\rho^2 - \\frac{R}{(4\\pi)^2} f(\\xi_1,\\xi_2) \\left[ \\rho^2 \\, \\text{Ei}\\left( -\\frac{\\rho^2}{\\Lambda^2} \\right) + \\Lambda^2 \\left( e^{-\\rho^2/\\Lambda^2} - 1 \\right) \\right], \\tag{15}\n$$\n\nHere, G is a coupling constant that governs the strength of the interaction, R is the Ricci scalar (a measure of spacetime curvature), and f(ξ₁,ξ₂) is a combination of nonminimal coupling parameters ξ₁ and ξ₂ that describe how the scalar and fermion fields couple to gravity. Specifically:\n\n$$\nf(\\xi_1,\\xi_2) = \\frac{1}{2} - \\xi_1 - \\xi_2. \\tag{16}\n$$\n\nThis function f(ξ₁,ξ₂) acts like a *control knob* that determines how curvature affects symmetry breaking. By adjusting ξ₁ and ξ₂ (the ways fields interact with gravity), we can change the sign and magnitude of f, which in turn changes the behavior of the potential.\n\nThe physical state of the system corresponds to the *minimum* of this effective potential V(ρ)—just like a ball rolling to the bottom of a valley. So to find out whether particles acquire mass or whether symmetries are broken, we need to study how V(ρ) behaves for different values of f(ξ₁,ξ₂)RG.\n\nIn Figure 1, we plot GV(ρ)/Λ² versus ρ/Λ for three representative values: f(ξ₁,ξ₂)RG = 10, 0, and −10. These curves reveal dramatically different physical scenarios.\n\nLet’s consider each case.\n\n**Case 1: f(ξ₁,ξ₂)RG = 0 (Flat spacetime or balanced couplings)**\n\nWhen f(ξ₁,ξ₂)RG = 0, the curvature-dependent term in V(ρ) vanishes, regardless of whether R is zero or not (though typically this case corresponds to flat spacetime, R = 0). Then the potential reduces to a simple quadratic:\n\n$$\nV(\\rho) = \\frac{1}{G} \\rho^2.\n$$\n\nThis is a parabola opening upwards. Its minimum is clearly at ρ = 0. This means no dynamical mass is generated—the chiral symmetry of the theory remains unbroken. All particles stay massless. This is shown in Figure 1 as the upward-opening curve centered at the origin.\n\n**Case 2: f(ξ₁,ξ₂)RG > 0 (e.g., f(ξ₁,ξ₂)RG = 10)**\n\nNow the curvature term is active and multiplied by a positive f(ξ₁,ξ₂)RG. Recall from Eq. (14) that Ei(−ρ²/Λ²) is negative, and the combination in brackets in Eq. (15) is such that the entire curvature correction term becomes positive when multiplied by −f(ξ₁,ξ₂) (since there’s a minus sign in front).\n\nSo the full potential remains *non-negative* and still minimized at ρ = 0. The potential may be slightly modified in shape, but the minimum doesn’t shift. Again, no symmetry breaking occurs. This is illustrated in Figure 1 by the curve for f(ξ₁,ξ₂)RG = 10—it’s still steepest at ρ = 0.\n\n**Case 3: f(ξ₁,ξ₂)RG < 0 (e.g., f(ξ₁,ξ₂)RG = −10)**\n\nNow things get interesting. When f(ξ₁,ξ₂)RG is negative, the sign of the curvature term flips. The correction to the potential now works *against* the positive ρ²/G term. Because Ei(−ρ²/Λ²) is negative, multiplying it by a negative f(ξ₁,ξ₂) makes the whole term positive in a way that can create a *dip* away from ρ = 0.\n\nLooking at Figure 1, we see that for f(ξ₁,ξ₂)RG = −10, the potential has a minimum at some ρ > 0. This means the system prefers a state where ρ is nonzero—this is *dynamical symmetry breaking*. The chiral symmetry is spontaneously broken, and fermions ψ and scalars φ acquire a dynamical mass.\n\nThe value of ρ at the minimum gives us the mass: m = ⟨ρ⟩.\n\nTo find this minimum precisely, we take the derivative of V(ρ) with respect to ρ and set it to zero. This is the *stationary condition*:\n\n$$\n\\frac{\\partial V(\\rho)}{\\partial \\rho} = \\rho \\left[ \\frac{2}{G} - \\frac{2R}{(4\\pi)^2} f(\\xi_1,\\xi_2) \\, \\text{Ei}\\left( -\\frac{\\rho^2}{\\Lambda^2} \\right) \\right] = 0. \\tag{17}\n$$\n\nThis equation has two possible solutions:\n\n1. ρ = 0 — the symmetric phase.\n2. The term in brackets is zero — the broken phase.\n\nFor a nontrivial solution (ρ ≠ 0), we require:\n\n$$\n\\frac{2}{G} = \\frac{2R}{(4\\pi)^2} f(\\xi_1,\\xi_2) \\, \\text{Ei}\\left( -\\frac{\\rho^2}{\\Lambda^2} \\right)\n$$\n\nSolving for the coupling, we get:\n\n$$\n\\frac{16\\pi^2}{RG} = f(\\xi_1,\\xi_2) \\, \\text{Ei}\\left( -\\frac{m^2}{\\Lambda^2} \\right), \\tag{18}\n$$\n\nwhere m = ⟨ρ⟩ is the dynamically generated mass.\n\nNote that Ei(−m²/Λ²) < 0, as established earlier. So for this equation to hold, the right-hand side must be positive (since the left-hand side 16π²/(RG) is typically positive for reasonable G and R). This only happens if f(ξ₁,ξ₂) is *negative*—because a negative times a negative gives a positive.\n\nThis explains why symmetry breaking only occurs when f(ξ₁,ξ₂)RG < 0: only then can the equation support a solution with m > 0.\n\nThis equation"}},"metadata":{"paper_id":"0026f8271505eb006e8bd5936f4b8f9e","csv_row":29529,"doi":"10.1142/s021773239700234x","openalex_id":"https://openalex.org/W2080972562","pdf_url":"https://arxiv.org/pdf/hep-th/9702097","page_count":8,"text_chars":12854,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2355,"total_tokens":3220,"completion_tokens":865,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2216,"total_tokens":3786,"completion_tokens":1570,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":4.131347179412842,"l5_seconds":8.98672366142273}},{"idx":20,"domain":"Academic paper","source":"CSV row 93852 · 2013 · 10.2754/avb201382020141","title":"Effect of β-1,3/1,6-D-glucan in diet on productivity and humoral and cellular defense mechanisms in sheep","seg":"When analyzing the results of ultrasonographic measurements (Table 3), lambs of \nthe experimental group were characterized by better development of muscle tissue. The \narea of their m.l.d. was higher by 17.74 % on day 28 and by 10.46% on day 70 of life. \nNevertheless, no significant differences were noted in this respect, same as in fat thickness \nabove the “loin eye”. \nResults describing the immunity markers of sheep are presented in Table 4. It was found \nthat in ewes administered β-1,3/1,6-D-glucan, markers of non-specific humoral immunity \n(concentration of gammaglobulin, activity of lysozyme, and markers of cellular immunity) \nwere at a higher level than in the control ewes. The differences turned out to be significant \nin both analytical terms (P < 0.01). \n143\nTable 1. Effect of β-1,3/1,6-D-glucan on milk performance traits and composition of ewe’s milk\nValues represent means ± standard deviation. Values within rows with different superscripts are significantly \ndifferent a,b (P < 0.05), A,B (P < 0.01).\nIndicator Day od life Control group Experimental group\nMilk yield (ml): 28 1596.15 ± 181.90b 1812.31 ± 231.31a\n 70 998.46 ± 187.69b 1138.69 ± 155.46a\nComposition of milk (%):\nFat 28 5.04 ± 0.91B 6.56 ± 1.12A\n 70 7.05 ± 1.04B 8.13 ± 1.00A\nProtein 28 4.99 ± 0.43 5.02 ± 0.36\n 70 5.55 ± 0.88b 6.16 ± 0.53a\nLactose 28 5.17 ± 0.33 5.20 ± 0.14\n 70 4.72 ± 0.87 4.70 ± 0.28\nDry matter 28 15.78 ± 0.80B 17.28 ± 1.22A\n 70 17.91 ± 1.48b 19.12 ± 1.00a\nSomatic cell count (thousand/ml): 28 316.77 ± 699.63A 96.23 ± 25.99B\n 70 236.77 ± 296.34 88.92 ± 13.27\nTable 2. Effect of β-1,3/1,6-D-glucan on body weight, daily gains and growth rates of lambs\nValues represent means ± standard deviation\nIndicator Control group Experimental group\nBody weight (kg) at days of life:\n 2 4.91 ± 0.97 4.91 ± 0.49\n28 11.84 ± 2.67 12.16 ± 2.60\n70 19.75 ± 4.30 20.15 ± 3.00\nDaily gains (g) in the period (days): \n 2–28 266.48 ± 71.66 278.57 ± 90.26\n28–70 188.32 ± 55.32 190.25 ± 47.75\n 2–70 218.21 ± 53.40 224.02 ± 41.14\nGrowth rate (%) in the period (days):\n 2–28 82.18 ± 8.75 82.91 ± 14.64\n28–70 50.27 ± 9.66 50.32 ± 13.79\n 2–70 119.92 ± 8.77 120.90 ± 8.49\n\nDiscussion\nThe study demonstrated that β-1,3/1,6-D-glucan exerted a significant impact on indicators \nof milk performance in sheep. In the experimental group, its administration resulted in \nincreased performance, protein and fat contents of milk, as well as decreased somatic cell \ncount (SCC) in milk, which indicated a better health status of the mammary gland. Mastitis \nhas an adverse effect on the physical indicators of milk, which in a consequence leads \nto deterioration of its quality and technological usability. Persson-Waller and Colditz \n(1999) demonstrated that injections of β-1,3/1,6-D-glucan in the udder of ewes manifesting \nmastitis stimulated migration of monocytes and macrophages to the gland, which resulted \nin a reduced somatic cell count in milk. Pres","models":{"dsv4-flash":{"l5":"When analyzing the results of ultrasonographic measurements (Table 3), lambs of the experimental group were characterized by better development of muscle tissue. The area of their *m.l.d.* (musculus longissimus dorsi, the \"loin eye\" muscle) was higher by 17.74% on day 28 and by 10.46% on day 70 of life. Nevertheless, no significant differences were noted in this respect, same as in fat thickness above the \"loin eye.\" In other words, while the numbers trended in favor of the glucan-supplemented group, the variation within each group was large enough that we cannot confidently attribute this difference to the treatment—it could plausibly be due to chance.\n\nResults describing the immunity markers of sheep are presented in Table 4. It was found that in ewes administered β-1,3/1,6-D-glucan, markers of non-specific humoral immunity (concentration of gammaglobulin, activity of lysozyme, and markers of cellular immunity) were at a higher level than in the control ewes. The differences turned out to be significant in both analytical terms (P < 0.01). This is a strong result: a P-value below 0.01 means there is less than a 1% probability that such a difference would appear by random chance alone, giving us high confidence that the glucan genuinely boosted these immune markers.\n\n143\n\n**Table 1.** Effect of β-1,3/1,6-D-glucan on milk performance traits and composition of ewe’s milk\n\nValues represent means ± standard deviation. Values within rows with different superscripts are significantly different: a,b (P < 0.05), A,B (P < 0.01).\n\n| Indicator | Day of life | Control group | Experimental group |\n|-----------|-------------|---------------|---------------------|\n| Milk yield (ml): | 28 | 1596.15 ± 181.90^b | 1812.31 ± 231.31^a |\n|           | 70 | 998.46 ± 187.69^b | 1138.69 ± 155.46^a |\n| Composition of milk (%): | | | |\n| Fat       | 28 | 5.04 ± 0.91^B | 6.56 ± 1.12^A |\n|           | 70 | 7.05 ± 1.04^B | 8.13 ± 1.00^A |\n| Protein   | 28 | 4.99 ± 0.43 | 5.02 ± 0.36 |\n|           | 70 | 5.55 ± 0.88^b | 6.16 ± 0.53^a |\n| Lactose   | 28 | 5.17 ± 0.33 | 5.20 ± 0.14 |\n|           | 70 | 4.72 ± 0.87 | 4.70 ± 0.28 |\n| Dry matter| 28 | 15.78 ± 0.80^B | 17.28 ± 1.22^A |\n|           | 70 | 17.91 ± 1.48^b | 19.12 ± 1.00^a |\n| Somatic cell count (thousand/ml): | 28 | 316.77 ± 699.63^A | 96.23 ± 25.99^B |\n|           | 70 | 236.77 ± 296.34 | 88.92 ± 13.27 |\n\n**Table 2.** Effect of β-1,3/1,6-D-glucan on body weight, daily gains and growth rates of lambs\n\nValues represent mean values ± standard deviation.\n\n| Indicator | Control group | Experimental group |\n|-----------|---------------|---------------------|\n| Body weight (kg) at days of life: | | |\n| 2         | 4.91 ± 0.97 | 4.91 ± 0.49 |\n| 28        | 11.84 ± 2.67 | 12.16 ± 2.60 |\n| 70        | 19.75 ± 4.30 | 20.15 ± 3.00 |\n| Daily gains (g) in the period (days): | | |\n| 2–28      | 266.48 ± 71.66 | 278.57 ± 90.26 |\n| 28–70     | 188.32 ± 55.32 | 190.25 ± 47.75 |\n| 2–70      | 218.21 ± 53.40 | 224.02 ± 41.14 |\n| Growth rate (%) in the period (days): | | |\n| 2–28      | 82.18 ± 8.75 | 82.91 ± 14.64 |\n| 28–70     | 50.27 ± 9.66 | 50.32 ± 13.79 |\n| 2–70      | 119.92 ± 8.77 | 120.90 ± 8.49 |\n\n**Discussion**\n\nThe study demonstrated that β-1,3/1,6-D-glucan exerted a significant impact on indicators of milk performance in sheep. In the experimental group, its administration resulted in increased performance, protein and fat contents of milk, as well as decreased somatic cell count (SCC) in milk, which indicated a better health status of the mammary gland. Mastitis has an adverse effect on the physical indicators of milk, which in a consequence leads to deterioration of its quality and technological usability. Persson-Waller and Colditz (1999) demonstrated that injections of β-1,3/1,6-D-glucan in the udder of ewes manifesting mastitis stimulated migration of monocytes and macrophages to the gland, which resulted in a reduced somatic cell count in milk. Pres"},"qwen3-235b-a22b":{"l5":"When analyzing the results of ultrasonographic measurements (Table 3), lambs of the experimental group showed better muscle tissue development compared to those in the control group. Specifically, the cross-sectional area of the *m. longissimus dorsi* (often abbreviated as m.l.d.)—a key muscle located along the back, commonly used as an indicator of meat yield in livestock—was 17.74% larger in the experimental group on day 28 of life and still 10.46% larger on day 70. This suggests that the lambs receiving the supplement were building more muscle earlier and maintaining that advantage over time.\n\nNow, let’s pause and think: why would we care about the m.l.d. area? In meat-producing animals like sheep, the size of this muscle is directly related to carcass value. A larger m.l.d. area generally means more high-quality meat, especially in premium cuts like the loin. So, even though the difference wasn’t statistically significant, the consistent trend toward greater muscle development in the experimental group is promising—it hints that the intervention might be supporting better growth at the tissue level.\n\nHowever, when it came to fat thickness above the “loin eye”—another common ultrasonographic measurement used to assess meat quality and marbling—no noticeable differences were found between the two groups. This tells us that while muscle development appeared to benefit, fat deposition did not change significantly. That’s actually useful information: it means the treatment may be selectively influencing muscle growth without altering fat accumulation, which could be desirable depending on breeding or market goals.\n\nMoving on to immune function, the data in Table 4 reveal a clearer and more statistically robust story. In ewes that were given β-1,3/1,6-D-glucan, several markers of immunity were elevated compared to the control group. Let’s unpack what this means.\n\nFirst, the study looked at **non-specific humoral immunity**, which refers to the body’s general, first-line immune defenses found in bodily fluids (the “humors,” like blood and mucus). Two key markers here were:\n\n- **Gammaglobulin concentration**: These are proteins in the blood that include antibodies—molecules that help neutralize pathogens like bacteria and viruses. Higher levels suggest a stronger readiness to fight infection.\n- **Lysozyme activity**: Lysozyme is an enzyme that can directly break down the cell walls of certain bacteria, acting like a built-in antibacterial agent. Increased activity means the ewes’ bodies were more capable of destroying microbes on contact.\n\nIn addition to these fluid-based defenses, the study also measured **markers of cellular immunity**—which involve specialized white blood cells (like T-cells and macrophages) that identify and destroy infected or abnormal cells. While the specific cellular markers aren’t named here, the fact that they were collectively higher in the experimental group indicates a more active and responsive immune system at the cellular level.\n\nThe most important takeaway? The differences in these immune markers weren’t just slight—they were **statistically significant at the P < 0.01 level**. That means there’s less than a 1% probability that these results happened by chance. In scientific terms, this is a strong signal that β-1,3/1,6-D-glucan genuinely boosted the ewes’ immune function.\n\nSo, what’s the bigger picture here? This immune enhancement likely contributed to the improved mammary health observed in the experimental group, as reflected in the lower somatic cell count (SCC) in their milk—a point we’ll return to in the discussion. But for now, it’s worth noting that β-1,3/1,6-D-glucan appears to act as an **immunomodulator**: a substance that doesn’t directly kill pathogens but instead \"primes\" the immune system to respond more effectively when threats arise.\n\nThis principle of immune priming is actually a cornerstone of modern animal health strategies, especially in reducing reliance on antibiotics. By boosting natural defenses, such supplements can help prevent infections before they start—particularly important in high-stress periods like lactation.\n\nNow, let’s look at the earlier tables to see how these immune and developmental benefits connect with actual performance.\n\n**Table 1** shows the effect of β-1,3/1,6-D-glucan on milk production and composition. Right away, we see that milk yield was significantly higher in the experimental group: 1812 mL vs. 1596 mL on day 28 (P < 0.05), and 1139 mL vs. 998 mL on day 70. That’s a meaningful increase—especially on day 28, when lambs are growing rapidly and depend heavily on milk.\n\nBut it’s not just about quantity. The **quality** of the milk also improved. Fat content was significantly higher—6.56% vs. 5.04% on day 28 and 8.13% vs. 7.05% on day 70 (P < 0.01). Since fat is a major source of energy for growing lambs, this means each sip of milk provided more fuel for growth. Similarly, protein content increased significantly from day 28 to 70 (6.16% vs. 5.55%, P < 0.05), delivering more building blocks for muscle and tissue development.\n\nEven the **dry matter** content—the total solids in milk, including fat, protein, lactose, and minerals—was significantly higher in the experimental group at both time points. This further confirms that the milk was more nutrient-dense.\n\nOne of the most striking findings, though, is in the **somatic cell count (SCC)**. On day 28, the control group had an average of 316,770 cells per mL, while the experimental group had only 96,230—a dramatic difference (P < 0.01). High SCC is a classic indicator of inflammation or infection in the udder, often due to mastitis. So, this sharp reduction strongly suggests that the supplemented ewes had healthier mammary glands.\n\nWhy does this matter? Because mastitis doesn’t just make animals sick—it directly harms milk quality. It can alter pH, reduce shelf life, and interfere with cheese-making and other processing. So, lowering SCC isn’t just a health win; it’s an economic and quality win too.\n\nNow, looking at **Table 2**, we see how these improvements in milk quantity and quality translated to the lambs. Body weight at birth was nearly identical between groups—about 4.91 kg—so any later differences can’t be blamed on initial size. But by day 28, lambs in the experimental group averaged 12.16 kg vs. 11.84 kg in the control group, and by day 70, they reached 20.15 kg vs. 19.75 kg. That’s a consistent, though modest, advantage.\n\nDaily weight gains followed the same pattern: slightly higher in the experimental group across all periods (2–28, 28–70, and 2–70 days), though none of the differences reached statistical significance. The same goes for growth rates, which were very similar between groups.\n\nSo, while the lambs did grow a bit faster and end up a bit heavier—likely thanks to better milk nutrition—the real story isn’t in dramatic weight gains. Instead, it’s in the **quality of growth**: more muscle, better immune priming from the mother’s milk, and a healthier start in life.\n\nThis leads us into the **Discussion**, where the authors begin to connect these dots.\n\nThe study demonstrated that β-1,3/1,6-D-glucan exerted a significant impact on indicators of milk performance in sheep. In the experimental group, its administration resulted in increased performance, protein and fat contents of milk, as well as decreased somatic cell count (SCC) in milk, which indicated a better health status of the mammary gland. Mastitis has an adverse effect on the physical indicators of milk, which in a consequence leads to deterioration of its quality and technological usability. Persson-Waller and Colditz (1999) demonstrated that injections of β-1,3/1,6-D-glucan in the udder of ewes manifesting mastitis stimulated migration of monocytes and macrophages to the gland, which resulted in a reduced somatic cell count in milk. Pres"}},"metadata":{"paper_id":"00723972d306894616fc7def03d7ee07","csv_row":93852,"doi":"10.2754/avb201382020141","openalex_id":"https://openalex.org/W2139875776","pdf_url":"https://actavet.vfu.cz/media/pdf/avb_2013082020141.pdf","page_count":6,"text_chars":19171,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2402,"total_tokens":3510,"completion_tokens":1108,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2263,"total_tokens":3527,"completion_tokens":1264,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":4.337319612503052,"l5_seconds":7.083873510360718}},{"idx":21,"domain":"Academic paper","source":"CSV row 50122 · 2012 · 10.3389/fpls.2012.00013","title":"Model Misinterpretation within Biology: Phenotypes, Statistics, Networks, and Inference","seg":"Kliebenstein Model misinterpretation\nthat just below the signiﬁcance threshold was a signature indi-\ncating that this gene also altered the circadian clocks oscillation\n(Kerwin et al., 2011). This threshold effect hiding is also apparent\nwith this gene where an expression QTL analysis using a conser-\nvative signiﬁcance threshold did not identify this locus as having\nglobal impacts whereas the more speciﬁc and thus more liberal\nanalysis showed that this AOP2 QTL did impact the majority of\noscillatory genes ( W est et al., 2007; Kerwin et al., 2011 ). As such,\nFDRs should be considered as tools within data analysis that are\nnecessary but should not be forced into a ﬁxed value. Instead, the\nresearcher should query the data at multiple levels to ascertain the\nmost appropriate FDR given their ability to biologically validate\nthe results.\nRANDOM ERROR\nAnother key assumption of nearlyall genomics papers utilizing sta-\ntistics is contained in the following statement “The model tested\nis y\ni = μ + Pi + εi, the error, εi, is assumed to be normally dis-\ntributed with mean 0 and variance σ2\nε ”( Kliebenstein et al., 2006).\nIn this statement the variance due to stochastic error within the\nsystem is assumed to be random with a normal distribution. How-\never, it is rapidly being found in prokaryotes that ε\ni is not purely\nrandom and is in fact controlled by genetic variation that is likely\nto be present within a genomic experiment ( V eening et al., 2008).\nAdditionally, results are starting to show that ε\ni is also genetically\ncontrolled within eukaryotes (Jarosz and Lindquist, 2010; Jimenez-\nGomez et al., 2011; Makumburage and Stapleton, 2011). Thus, it is\nlikely that the assumption of stochastic noise being a random error\nwith a particular variance is not an appropriate model in genomic\nexperiments and that the researcher should investigate the ability\nto utilize a random error model in each and every instance. Future\nwork will be required to develop new approaches that can simul-\ntaneously account for genetic control over both the average and\nvariance of a phenotype.\nNORMALIZATION AND BIOLOGY\nWhen scientists generate large genomics datasets there is often\na desire to standardize this data using proper statistical theory\nprior to any data analysis or modeling approach. These include\nnormalization of the data to force it into a normal distribution\nand the elimination of >3σ outliers. Typically this normaliza-\ntion takes the form of a log 2 transformation but there are other\napproaches, all with similar intentions to force biological data\ninto a proper statistical framework of the generalized linear model\n(GLM). However, the pushing of biological data into a statistical\nframework, while statistically proper, may not be fundamentally\nproper biology. As mentioned above, the routine transformation\nof transcript data into log 2 values is a simple example of this\ntype of assumption concerning biological relationships ( Doerge,\n2002). If a researcher normalizes data such as that for glucosino-\nlate concentration, metabolite concentration or disease resistance\nwithin Arabidopsis by log 2 to increase its normality, then this\nwill eliminate the ability to observe biologically validated epistatic\ninteractions (W entzell et al., 2007; Rowe and Kliebenstein, 2008 ;\nRowe et al., 2008). This is a result of the fact that epistatic interac-\ntions inherently cause deviations from normality. While log 2 or\nother methods nicely transform data into a normal distribution for\nstatistical purposes, the transformation also imparts an implica-\ntion that the organism measures its transcripts on a log basis rather\nthan an absolute basis because we are now testing for signiﬁcance\non the log basis. This may or may not accurately reﬂect the rela-\ntionship of expression kinetics as chemistry has nicely shown that\nenzymatic reactions adhere to absolute concentrations of protein,\nsubstrate, and product according to Michaelis–Menten relation-\nships. It is possible that the log 2 transformations of expression\ndata may not be reﬂective of biological relationships.\nAll of these observations lead to a signiﬁcant issue with most\nnormalization approaches because they are conducted blindly\nprior to conducting any investigation of the data ( Doerge, 2002;\nFiehn et al., 2005 ). This could have serious consequences on the\nresults obtained. For instance, if there is some form of genetic\ninteraction in a large genomic dataset that generates a synthetic\nphenotype not previously seen it is likely to result in genotypes\nthat appear to be","models":{"dsv4-flash":{"l5":"## Kliebenstein Model misinterpretation\n\nThis is a subtle but crucial point about how we interpret statistical results. The example here shows a gene that was just below the significance threshold—meaning a standard, conservative statistical test said \"no effect.\" But the researchers suspected otherwise. They dug deeper using a more liberal, targeted analysis and found that this gene *did* influence the majority of oscillatory genes (genes that cycle in expression over time, like circadian clock genes). \n\nSo what’s the lesson? Significance thresholds (like False Discovery Rates, or FDRs) are not sacred, fixed numbers. They are *tools*—useful for filtering, but not for making final judgments. A conservative threshold might hide real biological signals, while a more liberal one might reveal them. The best practice is to explore your data at multiple thresholds and then use biological validation to decide which results are real. In other words, **statistics should guide, not dictate, biological discovery.**\n\n---\n\n## RANDOM ERROR\n\nNearly every genomics paper that uses statistics makes a hidden assumption. It’s often written like this: *“The model tested is yᵢ = μ + Pᵢ + εᵢ, where the error εᵢ is assumed to be normally distributed with mean 0 and variance σ².”* \n\nLet’s unpack that. Here, **yᵢ** is the measured trait for individual *i*, **μ** is the overall mean, **Pᵢ** is the effect of some treatment or genotype, and **εᵢ** is the leftover “noise”—the random variation that we can’t explain. The assumption is that this noise is purely random, like the unpredictable jitter of a dice roll. \n\nBut here’s the problem: **that assumption is breaking down.** In bacteria, scientists are discovering that what we call “noise” is actually *genetically controlled*. That is, the variation we thought was random is actually influenced by the organism’s genes. And the same is starting to appear in plants and animals (e.g., in yeast, Arabidopsis, and even in human cells). \n\nSo what does this mean? If the “error” is not truly random, then our statistical models are missing something important. The variance itself might be a trait that can be inherited or influenced by the environment. This is a profound shift: **we may need to model not just the average of a trait, but also its variability.** \n\nThe takeaway: don’t blindly assume that noise is noise. In every experiment, ask: *Is this variation truly random, or is it biologically meaningful?* Future research will need to develop new statistical methods that can simultaneously account for genetic control over both the average and the variance of a phenotype.\n\n---\n\n## NORMALIZATION AND BIOLOGY\n\nWhen scientists generate large genomics datasets, there’s a strong urge to “clean up” the data before analysis. This often means transforming the data to fit a normal distribution (e.g., using a log₂ transformation) and removing outliers (like values more than 3 standard deviations from the mean). The goal is to make the data conform to the assumptions of the generalized linear model (GLM), which is a powerful statistical framework.\n\nBut here’s the catch: **what’s statistically proper might not be biologically proper.** \n\nFor example, consider glucosinolate concentration, metabolite levels, or disease resistance in *Arabidopsis*. If you log₂-transform these data to make them more “normal,” you might inadvertently destroy your ability to detect real biological interactions—specifically, **epistatic interactions**. Epistasis is when the effect of one gene depends on the presence of another gene. These interactions are inherently *non-normal*; they create deviations from a bell-shaped curve. By forcing the data into a normal distribution, you’re essentially erasing the very signal you’re looking for.\n\nWorse, the log₂ transformation implies something about biology: it suggests that the organism measures its transcripts on a *logarithmic* scale, not an absolute one. But is that true? Chemistry tells us that enzymes follow Michaelis–Menten kinetics, which depend on *absolute* concentrations of protein, substrate, and product. So a log₂ transformation might not reflect the actual biological relationships at all.\n\nThis leads to a serious problem: **most normalization is done blindly, before any exploration of the data.** That’s like putting a filter on a camera before you even look at the scene. If there’s a genetic interaction that creates a novel, unexpected phenotype—a “synthetic” trait that no one has seen before—the normalization might hide it. The result could be genotypes that appear to be"},"qwen3-235b-a22b":{"l5":"Kliebenstein Model misinterpretation  \nJust below the significance threshold, there was a subtle but telling signal suggesting that this gene also influenced the oscillation of the circadian clock (Kerwin et al., 2011). This phenomenon—where a biologically meaningful effect hides just beneath a statistical cutoff—is not unique to this case. With the same gene, an expression QTL (quantitative trait locus) analysis using a conservative significance threshold failed to detect any broad impact of this locus. However, when researchers applied a more targeted, biologically informed—and therefore more liberal—analytical approach, they uncovered something important: the AOP2 QTL actually affected the majority of oscillatory genes (West et al., 2007; Kerwin et al., 2011).\n\nWhat’s going on here? Let’s step back and think like a scientist analyzing data. When we run genome-wide studies, we’re testing thousands, sometimes millions, of associations. To avoid false positives, we use statistical corrections like the False Discovery Rate (FDR). But here’s the key insight: **FDR is a tool, not a rule carved in stone**. It helps us manage noise, but setting it too rigidly—say, at 5% across all studies—can cause us to miss real biological signals that fall just outside the arbitrary line.\n\nImagine you're searching for stars near the horizon. If you only look above a certain angle, you’ll miss those that are just below your cutoff—even if they’re bright and real. Similarly, biological systems are complex, and genetic effects often exist on a spectrum, not in binary “significant” or “not significant” categories. That’s why researchers should treat FDR as a dial, not a switch. They should explore their data at multiple FDR thresholds, then use biological knowledge—like known pathways or follow-up experiments—to decide which findings are worth pursuing. The goal isn’t just statistical purity; it’s biological truth.\n\nRANDOM ERROR  \nAnother foundational assumption in nearly all genomics studies using statistics appears in this model:  \n> $ y_i = \\mu + P_i + \\varepsilon_i $,  \nwhere the error term $ \\varepsilon_i $ is assumed to be normally distributed with mean 0 and variance $ \\sigma^2_\\varepsilon $ (Kliebenstein et al., 2006).\n\nLet’s unpack this. In plain terms, this equation says:  \nEach observed measurement ($ y_i $) equals an overall average ($ \\mu $), plus the effect of some factor we’re studying (like a genotype, $ P_i $), plus random noise ($ \\varepsilon_i $). That noise—$ \\varepsilon_i $—is supposed to represent unpredictable, random fluctuations: things like tiny differences in lab temperature, pipetting errors, or natural biological variability that we can’t control or predict.\n\nAnd here’s the critical assumption: this noise is assumed to be **random**, symmetrically scattered around zero, following a bell-shaped (normal) distribution. This assumption underpins most statistical tests used in genomics—from t-tests to ANOVA to linear models.\n\nBut what if the “noise” isn’t really random?\n\nEmerging evidence shows that in prokaryotes, this so-called stochastic error ($ \\varepsilon_i $) is not purely random—it’s influenced by genetic variation (Veening et al., 2008). In other words, some genes don’t just affect the average outcome (like increasing a metabolite level); they affect how *variable* that outcome is across individuals. One genotype might produce consistent results, while another leads to wildly different outcomes even under identical conditions—because it controls the *variance*, not just the mean.\n\nAnd it’s not just bacteria. Studies in eukaryotes—including plants and yeast—are now showing the same thing: genetic differences can shape the variability of traits (Jarosz and Lindquist, 2010; Jimenez-Gomez et al., 2011; Makumburage and Stapleton, 2011). This means that $ \\varepsilon_i $, the “error,” isn’t just background static—it can be a signal in itself, shaped by the genome.\n\nSo why does this matter? Because if the noise is genetically controlled, then treating it as random violates a core assumption of the model. It’s like trying to measure the weight of apples while ignoring the fact that some trees grow apples with wildly inconsistent sizes due to their DNA. The standard statistical tools may no longer be valid—or at least, they’re blind to an important layer of biology.\n\nThe takeaway? Researchers shouldn’t automatically assume that random error is truly random. Instead, they should **test whether their data fits this assumption**—and consider models that allow for genetic control of variance. This is not just a statistical nuance; it’s a shift in how we view biological variation. Future methods will need to simultaneously model how genes affect both the *average* and the *variability* of traits—a dual control system that’s likely widespread in nature.\n\nNORMALIZATION AND BIOLOGY  \nWhen scientists generate large-scale genomics data—like gene expression levels, metabolite concentrations, or disease resistance scores—they often feel compelled to “clean up” the data before analysis. One common step is **normalization**: transforming the data so it better fits the assumptions of statistical models, particularly the generalized linear model (GLM). A typical goal is to make the data look more like a normal distribution—symmetrical, bell-shaped—and to remove extreme outliers (e.g., values more than 3 standard deviations from the mean).\n\nThe most common transformation? Taking the log base 2 (log₂) of the data. For example, instead of analyzing raw gene expression counts, researchers analyze log₂(expression). This often works well: it compresses large values, spreads out small ones, and makes skewed data more symmetric.\n\nBut here’s the critical question: **Are we shaping the data to fit statistics, or are we respecting the biology?**\n\nConsider this: when we apply a log₂ transformation to biological data—say, glucosinolate levels in *Arabidopsis*—we’re not just making the numbers prettier for a statistical test. We’re implicitly assuming that the *organism itself* responds to these molecules on a logarithmic scale. In other words, a doubling of concentration (which becomes a +1 change on the log₂ scale) is treated as a biologically equivalent step, regardless of starting point.\n\nBut is that how biology works?\n\nThink about enzyme kinetics. Biochemistry teaches us that most enzymatic reactions depend on **absolute concentrations** of substrates and proteins, governed by the Michaelis–Menten equation. The rate of a reaction isn’t determined by the *log* of substrate concentration—it’s determined by the actual, physical amount present. So if a plant’s defense system relies on enzyme activity, it’s likely responding to absolute levels of a compound, not its logarithm.\n\nNow here’s the real problem: **epistatic interactions**—where the effect of one gene depends on the presence of another—often produce non-linear, non-normal patterns in data. These interactions are a fundamental source of complexity in genetics. But when we force data into normality via log transformations, we risk erasing these very signals (Wentzell et al., 2007; Rowe and Kliebenstein, 2008; Rowe et al., 2008). It’s like smoothing out the wrinkles in a map—you get a cleaner surface, but you lose the mountains and valleys.\n\nIn essence, normalization methods like log₂ transformation can **remove biologically meaningful variation** just as easily as they remove technical noise. And because these transformations are typically applied *before* any biological investigation—blindly, as a routine step—they may silently distort the very relationships we’re trying to discover.\n\nAll of these observations lead to a significant issue with most normalization approaches because they are conducted blindly prior to conducting any investigation of the data (Doerge, 2002; Fiehn et al., 2005). This could have serious consequences on the results obtained. For instance, if there is some form of genetic interaction in a large genomic dataset that generates a synthetic phenotype not previously seen it is likely to result in genotypes that appear to be"}},"metadata":{"paper_id":"003f46ff700334938a4981ac585bca7e","csv_row":50122,"doi":"10.3389/fpls.2012.00013","openalex_id":"https://openalex.org/W2067685934","pdf_url":"https://www.frontiersin.org/articles/10.3389/fpls.2012.00013/pdf","page_count":5,"text_chars":30781,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2382,"total_tokens":3272,"completion_tokens":890,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2243,"total_tokens":3212,"completion_tokens":969,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":4.362890958786011,"l5_seconds":8.746028423309326}},{"idx":22,"domain":"Academic paper","source":"CSV row 36643 · 2010 · 10.1186/cc8652","title":"Is sepsis mortality rate driven by differences in Brazilian healthcare systems?","seg":"Is sepsis mortality rate driven by diff erences in Brazilian healthcare \nsystems?\nF Machado\n1, R Salomao1, O Rigato2, E Ferreira1, T Mohovic3, G Schettino2, \nN Tereran1, M Assunçao3, R Caltabiano2, F Colombari3, C Silva4, R Cal3, \nE Silva3\n1Federal University of São Paulo, Brazil; 2Hospital Sirio-Libanes, São Paulo, \nBrazil; 3Hospital Israelita Albert Einstein, São Paulo, Brazil; 4Latin American \nSepsis Institute, São Paulo, Brazil\nCritical Care 2010, 14(Suppl 1):P420 (doi: 10.1186/cc8652)\nIntroduction The sepsis mortality rate is higher in Brazilian public \nhospitals with no clear diff erences in risk factors. We aim to identify risk \nfactors that could explain why the mortality rate is diff erent in public and \nprivate hospitals.\nMethods All severe sepsis and septic shock patients over 18 years \nold admitted to two private ICUs (Group 1) and one public ICU (Group \n2) were prospectively included. Demographic, clinical and outcome \nfeatures, including compliance to the 6-hour Surviving Sepsis Campaign \nbundle (SSC-6h), were collected in an electronic CRF. Duration of organ \ndysfunction was defi ned as the time elapsed between the installation of \nthe dysfunction and its diagnosis by the healthcare provider. Results were \nexpressed as a percentage or as median and interquartiles, and P <0.05 \nwas considered signifi cant.\nResults Three hundred and eighty-six patients were included (Group \n1 – 210, Group 2 – 176). Patients from Group 1 were older (69.5 (53.0 to \n81.0) years vs 59.0 (43.5 to 73.5) years, P <0.000), had a higher APACHE II \nscore (19.0 (15.0 to 23.0) vs 17.0 (13.0 to 23.0), P = 0.01), had more organ \ndysfunctions (3.0 (2.0 to 4.0) vs 2.0 (2.0 to 4.00), P = 0.08), and more septic \nshock episodes (74.3% vs 60.8%, P = 0.006). No diff erence was found \nregarding gender, site of infection, and day 1 or day 3 delta SOFA score. \nHowever, the mortality rate was higher in Group 2 than in Group 1, 60.8 \nand 38.3, respectively. Compliance to the SSC-6h bundle did not explain \nthis diff erence as they were better in Group 2 for lactate (70.5% vs 49.8%), \nblood culture (61.4% vs 52.4%), achieving MAP >65 mmHg (98.8% vs \n90.5%), and completion of the bundle (15.9% vs 4.8%). Only antibiotics \n(63.3% vs 54.5%, P = 0.10) and CVP had a better performance in Group 1 \n(49.4% vs 33.3%, P = 0.01). SOFA score at admission was slightly higher on \nGroup 2 (7.0 (4.0 to 9.0) vs 8.0 (5.5 to 10.0), P = 0.004). However, duration \nof organ dysfunction was clearly longer in Group 2 (150.0 (0.0 to 650) \nminutes vs 360.0 (0.0 to 1008.0) minutes, P = 0.02). In all patients, we have \nidentifi ed some variables associated with mortality, including being in the \npublic hospital (OR 2.46 (1.63 to 3.72), P = 0.00002), as well as the median \nduration of organ dysfunction, SOFA at admission, age, APACHE II score \nand number of organ dysfunctions.\nConclusions The mortality rate was higher in the public hospital despite \nbetter SSC bundle adherence. A delay in initiating those interventions may \nnegatively impact the outcome in patients treated in public hospital.","models":{"dsv4-flash":{"l5":"**Is sepsis mortality rate driven by differences in Brazilian healthcare systems?**\n\nF Machado¹, R Salomao¹, O Rigato², E Ferreira¹, T Mohovic³, G Schettino², N Tereran¹, M Assunçao³, R Caltabiano², F Colombari³, C Silva⁴, R Cal³, E Silva³\n\n¹Federal University of São Paulo, Brazil; ²Hospital Sirio-Libanes, São Paulo, Brazil; ³Hospital Israelita Albert Einstein, São Paulo, Brazil; ⁴Latin American Sepsis Institute, São Paulo, Brazil\n\n*Critical Care* 2010, 14(Suppl 1):P420 (doi: 10.1186/cc8652)\n\n---\n\n**Introduction**\n\nSepsis is a life-threatening condition in which the body’s response to infection damages its own tissues and organs. In Brazil, the mortality rate for sepsis is known to be higher in public hospitals than in private ones, even though patients in both settings appear to have similar risk factors. This observation raises a critical question: *Why* does this difference exist? The goal of this study is to identify specific risk factors—particularly those related to the timing and quality of care—that might explain the mortality gap between public and private healthcare institutions.\n\n---\n\n**Methods**\n\nTo investigate this, the researchers conducted a prospective study (meaning they followed patients forward in time, collecting data as events unfolded). They included all adult patients (over 18 years old) with severe sepsis or septic shock who were admitted to one of three intensive care units (ICUs): two private hospitals (Group 1) and one public hospital (Group 2).\n\nFor each patient, they collected a wide range of data: demographic information (age, gender), clinical details (severity of illness, number of organ dysfunctions), and outcome data (whether the patient survived). They also tracked **compliance with the 6-hour Surviving Sepsis Campaign bundle (SSC-6h)** — a set of evidence-based interventions that should be completed within six hours of recognizing sepsis, including measuring blood lactate, taking blood cultures, giving antibiotics, and maintaining blood pressure.\n\nOne particularly important variable was the **duration of organ dysfunction**. This was defined as the time elapsed between the *onset* of an organ dysfunction and the moment it was *diagnosed* by a healthcare provider. This measure is critical because it captures not just *how sick* a patient is, but *how quickly* the system recognizes and responds to that sickness.\n\nResults were expressed as percentages (for categorical data) or as medians with interquartile ranges (for continuous data, since these are often not normally distributed). A *P* value of less than 0.05 was considered statistically significant, meaning the result is unlikely to be due to chance.\n\n---\n\n**Results**\n\nA total of 386 patients were enrolled: 210 in Group 1 (private) and 176 in Group 2 (public).\n\nAt first glance, the private hospital patients (Group 1) appeared *sicker*: they were older (median 69.5 years vs. 59.0 years, *P* < 0.000), had higher APACHE II scores (a measure of acute illness severity, 19.0 vs. 17.0, *P* = 0.01), and had more organ dysfunctions (3.0 vs. 2.0, *P* = 0.08). They also had a higher proportion of septic shock episodes (74.3% vs. 60.8%, *P* = 0.006). There were no significant differences in gender, site of infection, or the change in SOFA score (a measure of organ dysfunction) from day 1 to day 3.\n\nDespite this, the **mortality rate was dramatically higher in the public hospital (Group 2)**: 60.8% vs. 38.3% in the private hospitals. This is a striking difference — nearly 23 percentage points — and it is *not* explained by the patients being sicker at admission.\n\nIn fact, the public hospital actually had **better compliance** with the SSC-6h bundle for several key measures: lactate measurement (70.5% vs. 49.8%), blood culture collection (61.4% vs. 52.4%), achieving a mean arterial pressure (MAP) >65 mmHg (98.8% vs. 90.5%), and completing the entire bundle (15.9% vs. 4.8%). Only antibiotic administration (63.3% vs. 54.5%, *P* = 0.10) and central venous pressure (CVP) measurement (49.4% vs. 33.3%, *P* = 0.01) were better in the private group.\n\nSo, if the public hospital is doing *more* of the right things, why are its patients dying more often?\n\nThe answer may lie in **timing**. The SOFA score at admission was slightly higher in Group 2 (8.0 vs. 7.0, *P* = 0.004), indicating a marginally worse initial organ function. But the most telling finding was the **duration of organ dysfunction**: it was clearly longer in the public hospital — 360.0 minutes (median) vs. 150.0 minutes in the private hospitals (*P* = 0.02). In other words, organ dysfunction was present for more than twice as long before being recognized in the public setting.\n\nWhen the researchers looked at all patients together, they identified several variables associated with mortality: being treated in a public hospital (odds ratio 2.46, 95% CI 1.63–3.72, *P* = 0.00002), the median duration of organ dysfunction, SOFA at admission, age, APACHE II score, and the number of organ dysfunctions.\n\n---\n\n**Conclusions**\n\nThe mortality rate was higher in the public hospital despite better adherence to the SSC-6h bundle. This suggests that the *quality* of care is not the only issue — the *speed* of recognition and intervention matters enormously. A delay in initiating those interventions may negatively impact the outcome in patients treated in public hospitals."},"qwen3-235b-a22b":{"l5":"Is sepsis mortality rate driven by differences in Brazilian healthcare systems?  \nF Machado  \n1, R Salomão¹, O Rigato², E Ferreira¹, T Mohovic³, G Schettino²,  \nN Tereran¹, M Assunçao³, R Caltabiano², F Colombari³, C Silva⁴, R Cal³,  \nE Silva³  \n¹Federal University of São Paulo, Brazil; ²Hospital Sírio-Libanês, São Paulo,  \nBrazil; ³Hospital Israelita Albert Einstein, São Paulo, Brazil; ⁴Latin American  \nSepsis Institute, São Paulo, Brazil  \nCritical Care 2010, 14(Suppl 1):P420 (doi: 10.1186/cc8652)\n\n## Introduction\n\nSepsis is a life-threatening condition that occurs when the body’s response to an infection spirals out of control, damaging its own tissues and organs. If not treated quickly, sepsis can progress to septic shock, organ failure, and death. In Brazil, studies have shown that patients with sepsis in public hospitals face higher mortality rates compared to those in private hospitals—even when their initial risk factors appear similar. This raises a critical question: **Why do more patients die from sepsis in public hospitals if the patients don’t seem inherently sicker at first glance?**\n\nThe goal of this study was to dig deeper. The researchers wanted to find out whether differences in hospital systems—like how quickly care is delivered or how strictly treatment guidelines are followed—could explain this gap in survival. Specifically, they focused on the **Surviving Sepsis Campaign 6-hour bundle (SSC-6h)**, a set of time-sensitive medical actions proven to improve outcomes when completed within six hours of recognizing sepsis.\n\nBut here’s the key insight: **It’s not just about *whether* these actions are done—it’s about *how fast* they’re started.** Even if two hospitals follow the same checklist, a delay in beginning treatment could mean the difference between life and death. So, the team set out to compare patients in public and private ICUs, not only looking at survival rates and guideline adherence but also measuring how long it took for organ dysfunction to be recognized and acted upon.\n\n## Methods\n\nThe study included all adult patients (over 18 years old) diagnosed with severe sepsis or septic shock who were admitted to the intensive care units (ICUs) of three hospitals in São Paulo, Brazil. Two of these hospitals were private (Group 1), and one was public (Group 2). Every patient was enrolled prospectively, meaning data were collected in real time as patients came in, reducing the risk of recall bias or missing information.\n\nFor each patient, the researchers gathered detailed information, including:\n- Basic demographics (age, gender)\n- Clinical features (source of infection, severity of illness)\n- Outcomes (survival, length of stay, organ dysfunction)\n- Adherence to the **SSC-6h bundle**, which includes six critical steps:\n  1. Measuring blood lactate levels\n  2. Obtaining blood cultures before antibiotics\n  3. Administering broad-spectrum antibiotics\n  4. Giving IV fluids for low blood pressure\n  5. Achieving a mean arterial pressure (MAP) >65 mmHg, using fluids or medications\n  6. Achieving central venous pressure (CVP) of 8–12 mmHg (or 12–15 if on mechanical ventilation)\n\nAll this data was recorded in a secure electronic case report form (e-CRF), ensuring consistency and accuracy.\n\nOne particularly important measure was the **duration of organ dysfunction**—defined as the time between when organ failure *actually began* and when it was *recognized and documented* by the healthcare team. Why does this matter? Because the sooner doctors realize an organ is failing (like the lungs, kidneys, or liver), the faster they can intervene. A long delay here could mean the body is under stress for hours without treatment, worsening the patient’s condition even if the formal checklist is eventually completed.\n\nResults were analyzed using standard statistical methods. Categorical data (like percentages of patients receiving antibiotics) were compared using proportions. Continuous data (like age or APACHE II scores) were reported as **median and interquartile range (IQR)**—this is more reliable than averages when data are skewed (for example, a few very old patients could distort the average age). A *p-value* less than 0.05 was considered statistically significant, meaning the observed difference is unlikely due to random chance.\n\n## Results\n\nA total of **386 patients** were included in the study: 210 from private hospitals (Group 1) and 176 from the public hospital (Group 2).\n\nAt first glance, you might expect patients in private hospitals to be healthier or less severely ill. But surprisingly, the opposite was true. Patients in Group 1 (private) were actually **older**—median age 69.5 years (IQR: 53.0–81.0)—compared to 59.0 years (IQR: 43.5–73.5) in the public hospital (Group 2), and this difference was highly significant (*P < 0.000*). They also had higher illness severity scores:\n\n- **APACHE II score**: 19.0 (15.0–23.0) vs. 17.0 (13.0–23.0), *P = 0.01*  \n  *(APACHE II is a scoring system that predicts the risk of death based on vital signs, lab values, and medical history—the higher the score, the sicker the patient.)*\n- More **organ dysfunctions** (3.0 vs. 2.0, *P = 0.08*)—though this didn’t quite reach statistical significance.\n- More cases of **septic shock** (74.3% vs. 60.8%, *P = 0.006*)\n\nIn other words, the private hospital patients started out in worse shape—older, sicker, more likely to be in shock—yet they had a **much lower mortality rate**: **38.3%** in private hospitals versus **60.8%** in the public hospital. That’s a dramatic difference.\n\nNow, you might wonder: Could this survival advantage be explained by better adherence to the SSC-6h bundle in private hospitals? After all, following best practices should improve outcomes.\n\nBut here’s the twist: **The public hospital actually did better on most parts of the bundle.**\n\nLet’s break it down:\n- **Lactate measurement**: 70.5% (public) vs. 49.8% (private) ✅\n- **Blood cultures before antibiotics**: 61.4% vs. 52.4% ✅\n- **Achieving MAP >65 mmHg**: 98.8% vs. 90.5% ✅\n- **Overall bundle completion**: 15.9% vs. 4.8% ✅\n\nAll of these were higher in the public hospital. So, despite doing *more* of the recommended actions, they had *worse* survival.\n\nOnly two elements favored the private hospitals:\n- **Antibiotics administered within 6 hours**: 63.3% vs. 54.5% (*P = 0.10*)—this difference wasn’t statistically significant.\n- **CVP monitoring**: 49.4% vs. 33.3% (*P = 0.01*)—this one was significantly better in private hospitals.\n\nSo, bundle compliance alone doesn’t explain the mortality gap. In fact, the public hospital outperformed the private ones on most metrics.\n\nBut then what does explain it?\n\nTwo other findings stand out:\n\n1. **SOFA score at admission** was slightly higher in the public hospital: 8.0 (5.5–10.0) vs. 7.0 (4.0–9.0), *P = 0.004*.  \n   *(The SOFA score—Sequential Organ Failure Assessment—measures how many organs are failing and how badly. A higher score means more severe organ dysfunction at the time of ICU admission.)*  \n   This suggests that by the time patients arrived in the ICU, those in the public hospital were already a bit more unstable.\n\n2. More importantly: **Duration of organ dysfunction** was significantly longer in the public hospital:  \n   360.0 minutes (0.0 to 1008.0) vs. 150.0 minutes (0.0 to 650.0), *P = 0.02*.  \n   That’s a median delay of **6 hours** in the public system versus **2.5 hours** in the private system.\n\nThink about that: **Patients in the public hospital had failing organs for, on average, 3.5 hours longer before the dysfunction was recognized and documented.** This delay likely meant that life-saving treatments—like fluids, antibiotics, or vasopressors—were started later, even if they were eventually given.\n\nFinally, the researchers ran a statistical model to identify which factors were independently associated with death. They found that:\n- Being treated in a **public hospital** carried a 2.46 times higher odds of death (OR 2.46, 95% CI: 1.63–3.72, *P = 0.00002*)\n- Other strong predictors included:\n  - Longer **duration of organ dysfunction**\n  - Higher **SOFA score at admission**\n  - Older **age**\n  - Higher **APACHE II score**\n  - Greater **number of organ dysfunctions**\n\nThis confirms that hospital type—public vs. private—is a powerful predictor of survival, even after accounting for how sick the patient is.\n\n## Conclusions\n\nThe mortality rate was higher in the public hospital despite better adherence to the SSC-6h bundle. This counterintuitive finding reveals a crucial insight: **It’s not just about completing the checklist—it’s about *when* you start.**"}},"metadata":{"paper_id":"002f61567568a9f205e6cb7491e1adac","csv_row":36643,"doi":"10.1186/cc8652","openalex_id":"https://openalex.org/W2092122597","pdf_url":"https://ccforum.biomedcentral.com/track/pdf/10.1186/cc8652","page_count":202,"text_chars":1525133,"segment_tokens":962,"l4_usage":{"prompt_tokens":2329,"total_tokens":3082,"completion_tokens":753,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2190,"total_tokens":3495,"completion_tokens":1305,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":3.258578300476074,"l5_seconds":8.853673458099365}},{"idx":23,"domain":"Academic paper","source":"CSV row 63972 · 2015 · 10.1002/bjs.9812","title":"Gastric emptying and quality of life after pancreatoduodenectomy with retrocolic or antecolic gastroenteric anastomosis","seg":"1126 W. J. Eshuis, K. de Bree, M. A. G. Sprangers, R. J. Bennink, T. M. van Gulik, O. R. C. Busch and D. J. Gou  22 (5–105) 0 ⋅141\nt1∕2 (min)* 145 (52–351) 64 (25–312) 0 ⋅189\n%RA120* 64 (21–96) 28 (5–87) 0 ⋅213\n%RA120 >60% 12 7 0 ⋅258‡\n*Values are median (i.q.r.).t1∕2, Time needed to empty half of the\nstomach content; %RA120, residual percentage of radioactivity in the\nstomach after 2h.†Mann–Whitney U test, except‡χ2 test.\nTable 4 Association between clinically relevant delayed gastric\nemptying and delayed emptying at scintigraphy in patients who\nunderwent postoperative gastric emptying scintigraphy\nNo delayed\nemptying at GES\n(n","models":{"dsv4-flash":{"l5":"1126 W. J. Eshuis, K. de Bree, M. A. G. Sprangers, R. J. Bennink, T. M. van Gulik, O. R. C. Busch and D. J. Gouma\n\nBefore we dive into the numbers, let's set the stage. This study compares two surgical techniques for reconstructing the digestive tract after a pancreaticoduodenectomy (the Whipple procedure). The key difference is the route the surgeon uses to reconnect the stomach to the small intestine: one goes *behind* the transverse colon (the **retrocolic** route) and the other goes *in front* of it (the **antecolic** route). The tables below summarize the patient characteristics and outcomes for these two groups. As you read, keep asking yourself: *Are these two groups similar enough to make a fair comparison?* That's the first question any good researcher asks.\n\n**Table 1** lays out the baseline demographic and clinical characteristics of the two groups. This is the \"starting line\" – we want to ensure both groups are comparable before we look at any outcomes.\n\n| **Demographic / Clinical Characteristic** | **Retrocolic group (n=38)** | **Antecolic group (n=35)** |\n|:---|:---:|:---:|\n| **Age (years)*** | 62.6 (11.0) | 66.0 (7.9) |\n| **Sex ratio (M:F)** | 17:21 | 24:11 |\n| **ASA fitness grade** | | |\n| I | 0 | 4 |\n| II | 23 | 24 |\n| III | 5 | 7 |\n| **Body mass index (kg/m²)*** | 25.3 (4.2) | 24.9 (3.8) |\n| **Duration of symptoms (weeks)†** | 12 (9–20) | 11 (8–15) |\n| **Weight loss (kg)†‡** | 8 (5–11) | 8 (5–14) |\n| **Karnofsky Performance Score** | | |\n| ≥80 | 36 | 31 |\n| <80 | 2 | 4 |\n| **Preop. biliary drainage** | 25 | 24 |\n| **Diagnosis at pathological examination** | | |\n| Adenocarcinoma | 33 | 28 |\n| Other (pre)malignant lesions | 4 | 4 |\n| Chronic pancreatitis or other benign lesion | 1 | 3 |\n\n*Values are *mean (s.d.)* and †median (i.q.r.). ‡Compared with reported weight 1 year earlier. ASA, American Society of Anesthesiologists.\n\nLet's unpack the notation. The asterisk (*) means the number shown is the **mean** (the average) with the **standard deviation** (s.d.) in parentheses – a measure of how spread out the values are. The dagger (†) means the number is the **median** (the middle value) with the **interquartile range** (i.q.r.) in parentheses – the range containing the middle 50% of the data. The ASA fitness grade is a simple scale (I to V) used by anesthesiologists to rate a patient's overall health before surgery; a higher grade means more severe systemic disease. The Karnofsky Performance Score is a similar scale (0–100) that measures a patient's ability to perform ordinary tasks; a score of ≥80 means they can carry on normal activity with only minor signs of disease.\n\nNow, look at the two columns. Do you notice any major imbalances? The groups are broadly similar in age, BMI, weight loss, and diagnosis. However, the **sex ratio** is noticeably different (17:21 vs. 24:11), and the **ASA grade** distribution is not identical. These are the kinds of baseline differences that a reader must keep in mind – they might influence the outcomes we see later.\n\n**Table 2** moves us to the heart of the study: the treatment itself and the primary outcome of interest – **delayed gastric emptying (DGE)**.\n\n| **Treatment characteristics & clinical outcomes** | **Retrocolic group (n=38)** | **Antecolic group (n=35)** | **P§** |\n|:---|:---:|:---:|:---:|\n| **Treatment characteristics** | | | |\n| Pylorus preserved | 34 | 29 | 0.411 |\n| Feeding tube jejunostomy | 0 | 3 | 0.065 |\n| Octreotide prophylaxis | 20 | 17 | 0.729 |\n| **DGE and other clinical outcomes** | | | |\n| Clinically relevant DGE† | 13 | 14 | 0.609 |\n| Primary clinically relevant DGE‡ | 7 | 3 | 0.221 |\n| **(Par)enteral nutritional support** | | | |\n| None | 23 | 21 | 0.641 |\n| Tube feeding | 8 | 5 | |\n| Parenteral nutrition | 3 | 2 | |\n| Tube feeding and parenteral nutrition | 4 | 7 | |\n| **Dindo–Clavien classification** | | | 0.117 |\n| 0–I | 16 | 12 | |\n| II | 15 | 9 | |\n| ≥III | 7 | 14 | |\n| **Hospital death** | 0 | 1 | 0.294 |\n| **Duration of hospital stay (days)*** | 11 (8–17) | 13 (9–25) | 0.282¶ |\n\n*Values are median (i.q.r.). †Grade B or C according to the consensus definition of the International Study Group of Pancreatic Surgery. ‡Primary delayed gastric emptying (DGE) in the absence of other intra-abdominal complications. §χ² test, except ¶Mann–Whitney U test.*\n\nLet's decode the jargon. **DGE** is a common complication after this surgery, where the stomach takes too long to empty its contents into the small intestine. The table distinguishes between *clinically relevant* DGE (grades B and C, meaning it requires intervention) and *primary* DGE (which occurs without any other intra-abdominal complication like a leak). The **Dindo–Clavien classification** is a widely used scale for grading the severity of surgical complications, from 0 (no complication) to IV (life-threatening) and V (death). The **P** value is the statistical significance – a P < 0.05 is typically considered \"statistically significant,\" meaning the difference is unlikely to be due to chance alone.\n\nNow, look at the P values. For **clinically relevant DGE**, P = 0.609 – not significant. For **primary DGE**, P = 0.221 – also not significant. The same is true for hospital stay (P = 0.282). The takeaway? **There is no statistically significant difference between the two surgical routes for any of these key outcomes.** The numbers might look different (e.g., 13 vs. 14 for DGE), but the statistical test tells us that this difference could easily be due to random variation. This is a classic \"negative\" result – and an important one.\n\n**Table 3** takes us deeper, examining the *physiological* mechanism behind DGE using a special imaging test called **gastric emptying scintigraphy (GES)**.\n\n| **Gastric emptying scintigraphy results** | **Retrocolic group (n=32)** | **Antecolic group (n=33)** | **P†** |\n|:---|:---:|:---:|:---:|\n| **Preoperative scan** | 20 | 22 | 0.725‡ |\n| Lag time (min)* | 11 (4–19) | 12 (7–20) | 0.754 |\n| t½ (min)* | 40 (23–47) | 38 (29–52) | 0.638 |\n| %RA120* | 6 (0–12) | 6 (4–11) | 0.548 |\n| **Postoperative scan** | 23 | 20 | 0.337‡ |\n| Lag time (min)* | 66 (12–171) | 22 (5–105) | 0.141 |\n| t½ (min)* | 145 (52–351) | 64 (25–312) | 0.189 |\n| %RA120* | 64 (21–96) | 28 (5–87) | 0.213 |\n| %RA120 >60% | 12 | 7 | 0.258‡ |\n\n*Values are median (i.q.r.). t½, Time needed to empty half of the stomach content; %RA120, residual percentage of radioactivity in the stomach after 2 h. †Mann–Whitney U test, except ‡χ² test.*\n\nHere, we are measuring how fast the stomach empties a radioactive-labeled meal. **Lag time** is the time before the meal starts to leave the stomach. **t½** is the time to empty half of the stomach content. **%RA120** is the percentage of radioactivity (i.e., food) remaining in the stomach after 2 hours – a higher number means slower emptying. The **preoperative scan** shows both groups start with similar emptying (P values all > 0.5). After surgery, both groups show a dramatic slowdown (e.g., t½ jumps from ~40 to ~145 min in the retrocolic group), which is expected. But again, the P values for the postoperative comparisons are all > 0.1, meaning **no statistically significant difference** between the two routes. The numbers look different (e.g., 145 vs. 64 min for t½), but the variability within each group is so large that we cannot confidently say the antecolic route is faster.\n\n**Table 4** now asks a crucial question: **Does the objective measurement of delayed emptying on scintigraphy actually correspond to the patient's clinical symptoms?**\n\n| **Association between clinically relevant delayed gastric emptying and delayed emptying at scintigraphy in patients who underwent postoperative gastric emptying scintigraphy** | | |\n|:---|:---:|:---:|\n| | **No delayed emptying at GES (n** |"},"qwen3-235b-a22b":{"l5":"1126 W. J. Eshuis, K. de Bree, M. A. G. Sprangers, R. J. Bennink, T. M. van Gulik, O. R. C. Busch and D. J. Gouma  \n## Table 1 Demographic and clinical characteristics  \nRetrocolic  \ngroup (n=38)  \nAntecolic  \ngroup (n=35)  \nAge (years)* 62 ⋅6(11⋅0) 66 ⋅0(7⋅9)  \nSex ratio (M:F) 17:21 24:11  \nASA fitness grade  \nI1 0 4  \nII 23 24  \nIII 5 7  \nBody mass index (kg/m²)* 25 ⋅3(4⋅2) 24 ⋅9(3⋅8)  \nDuration of symptoms (weeks)† 12 (9–20) 11 (8–15)  \nWeight loss (kg)†‡ 8 (5–11) 8 (5–14)  \nKarnofsky Performance Score  \n≥80 36 31  \n<80 2 4  \nPreop. biliary drainage 25 24  \nDiagnosis at pathological  \nexamination  \nAdenocarcinoma 33 28  \nOther (pre)malignant lesions 4 4  \nChronic pancreatitis or other  \nbenign lesion  \n1 3  \n\nValues are *mean(s.d.) and †median (i.q.r.). ‡Compared with reported weight 1 year earlier. ASA, American Society of Anesthesiologists.\n\nLet’s walk through what this table is telling us. This is a comparison of two groups of patients who underwent a specific type of surgery—likely a pancreatic procedure such as a pancreaticoduodenectomy (also known as the Whipple procedure)—but with a key difference in surgical technique: one group had a **retrocolic** reconstruction, and the other had an **antecolic** reconstruction. These terms refer to how the surgeon reconnects the digestive tract after removing part of the pancreas and duodenum.\n\n- In **retrocolic**, the reconstructed loop of intestine (the jejunal limb) is passed *behind* the transverse colon.\n- In **antecolic**, it’s passed *in front of* the colon.\n\nWhy does this matter? Because the path the intestine takes might affect how well the stomach empties after surgery—a major concern known as **delayed gastric emptying (DGE)**.\n\nNow, before we even look at outcomes, we need to ask: *Are these two groups comparable to begin with?* That’s exactly what Table 1 helps us assess. It shows the baseline characteristics of both groups—things like age, sex, overall health, and disease severity.\n\nLet’s break down a few key entries:\n\n- **Age**: The retrocolic group averaged 62.6 years (with a standard deviation of 11.0), while the antecolic group was slightly older at 66.0 years. The spread of ages (standard deviation) is larger in the retrocolic group, meaning it’s more varied. But is this difference meaningful? We’d need a statistical test to say for sure, but visually, the groups are fairly similar in age.\n  \n- **Sex ratio**: The retrocolic group had more females (17 males, 21 females), whereas the antecolic group had more males (24 males, 11 females). This could be important if gender influences recovery, so it’s something to keep in mind when interpreting results.\n\n- **ASA fitness grade**: This is a standard scale used by anesthesiologists to assess a patient’s overall health before surgery.\n  - Grade I: Healthy individual.\n  - Grade II: Mild systemic disease (e.g., well-controlled diabetes).\n  - Grade III: Severe systemic disease that limits activity but isn’t incapacitating.\n  \n  Most patients in both groups were Grade II, which is typical for major surgery. Only a few were Grade III, and no one was Grade IV (severe life-threatening disease). The antecolic group actually had slightly more healthy patients (4 Grade I vs. 0 in retrocolic), but again, the numbers are small.\n\n- **Body mass index (BMI)**: Both groups have similar average BMIs (~25 kg/m²), which is in the “normal weight” to “overweight” range. This suggests nutrition and weight aren’t major confounding f
