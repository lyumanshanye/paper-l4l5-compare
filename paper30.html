ors should have TVD efficiency ≥ 1.\n\n🔍 **What do we observe?**\n- The robust estimators—labeled 1TML, 2TML, and 1SWML—have TVD efficiencies **markedly greater than 1** for small samples (e.g., $n=50$), meaning they’re less efficient than ML when the model is correct.\n- But as the sample size increases, their TVD efficiency **approaches 1**. That is, they become nearly as good as ML in clean data.\n\n✅ This is excellent news for robust methods!  \nEven though they’re designed to handle contamination, they don’t pay too high a price in clean data—they are **asymptotically efficient**. As $n$ grows, they \"catch up\" to ML.\n\n🔄 Similar patterns were observed across other settings ($\\lambda_0 = 2$, 25% censoring), confirming that this behavior is consistent.\n\n📌 **Takeaway**: These robust estimators strike a smart balance—they may sacrifice a bit of efficiency in ideal conditions, but they gain resilience when things go wrong (as we’ll see next).\n\n---\n\n## 5.1.2 Simulation under Point Mass Contamination\n\nNow let’s stress-test the estimators. What happens when the data aren’t perfect? In real-world applications, datasets often contain **outliers**—erroneous or extreme observations that don’t follow the assumed model.\n\nTo simulate this, we conducted a second Monte Carlo experiment with **point mass contamination**. This is a classic and challenging way to introduce outliers.\n\nHere’s how it works:\n- 90% of the data (“good” observations) are generated from the true Generalized Log-Gamma (GLG) model.\n- 10% of the data (“outliers”) are placed at a fixed point $y_0$, creating a spike (or “point mass”) in the distribution.\n\nWe varied $y_0$ from $-10$ to $10$ in steps of $0.5$, effectively sliding the outlier cluster across the real line to test how sensitive each estimator is to the location of contamination.\n\n🎯 **Why use point mass contamination?**  \nIt’s considered one of the **most adverse forms of contamination** because it creates a sharp, concentrated deviation from the model. If an estimator can withstand this, it’s likely to perform well under more diffuse or realistic outlier scenarios.\n\nWe again used $n = 50, 100, 400, 1000$, $\\lambda_0 = 1$ and $2$, and censoring fractions of 15% and 25%. For each value of $y_0$, we performed 1200 replications.\n\n📊 **Figure 1 (bottom)** displays the **ATVD of the estimated densities** as a function of $y_0$. This shows how the overall estimation error changes depending on where the outliers are located.\n\n🔍 **Key Findings**:\n- The estimators **TQ$\\tau$ (with 10% trimming), 1TML, and 2TML** show remarkably **stable ATVD values** across all values of $y_0$. Their performance barely wavers whether outliers are on the far left ($y_0 = -10$), center, or far right ($y_0 = 10$).\n- In contrast, the **1SWL estimator** exhibits a **very high ATVD for positive values of $y_0$**—indicating it breaks down badly when outliers appear in the upper tail.\n- The **ML estimator** is so sensitive to outliers that its ATVD becomes extremely large—so large, in fact, that it’s **not shown** in the plot. Its behavior is **unbounded**: a single outlier can completely distort the ML estimate.\n\n🧠 **Why does ML fail so badly?**  \nMaximum likelihood assumes every data point comes from the model. When even 10% of the data are wildly off, ML tries to \"explain\" them by drastically shifting the estimated parameters. This leads to massive bias.\n\n🛠️ **How do the robust estimators resist this?**\n- **TQ$\\tau$** uses trimming: it automatically down-weights or removes the most extreme 10% of residuals, effectively ignoring the outliers.\n- **1TML and 2TML** are two-step robust procedures: they first identify and reduce the influence of outlying observations before re-estimating the model.\n- **1SWL**, unfortunately, lacks sufficient protection against asymmetric contamination, especially in the upper tail, which explains its poor performance.\n\n📌 **Takeaway**: Under contamination, robustness matters. While ML fails catastrophically, properly designed robust estimators maintain stable, reliable performance—exactly what we need in practical data analysis.\n\n---\n\n## 5.2 Regression Case\n\nWe now extend our evaluation to a more complex and realistic setting: **regression with censored responses**.\n\nA second set of experiments was run to investigate the behavior of:\n- The **MM-TQ$\\tau$** estimator (defined in Section 4.1),\n- The **1TML** and **2TML** estimators (defined in Section 4.2),\n- And the **1SWL** estimator (defined in Section A.3.2 of the Appendix).\n\nIn each simulation, we generated $n$ pairs of observations $(x_i, y^*_i)$ according to the following regression model:\n\n$$\ny_i = \\mu_0 + \\beta_0^\\top x_i + \\sigma_0 u_i, \\tag{34}\n$$\n$$\ny^*_i = \\min(y_i, c_i), \\tag{35}\n$$\n$$\nc_i = \\mu_c + e_i, \\tag{36}\n$$\n$$\n\\delta_i = \n\\begin{cases} \n1 & \\text{if } y^*_i = y_i \\\\\n0 & \\text{otherwise}\n\\end{cases} \\tag{37}\n$$\n\nLet’s unpack this step by step.\n\n📌 **Equation (34)**: This is the **true regression model**.\n- $y_i$: the latent (unobserved) response variable.\n- $x_i = (x_{i1}, x_{i2})$: a vector of two predictors.\n- $\\beta_0^\\top = (2, 3)$: the true regression coefficients.\n- $u_i$: random error drawn from a GLG distribution with parameters $(\\mu=0, \\sigma=1, \\lambda=\\lambda_0)$, where $\\lambda_0 = 1$ or $2$.\n- $\\mu_0 = 0$, $\\sigma_0 = 1$: location and scale of the error term.\n\n📌 **Equation (35)**: This introduces **right-censoring**.\n- $y^*_i$: the observed response.\n- $c_i$: the censoring threshold.\n- If the true $y_i$ exceeds $c_i$, we only observe $c_i$, not the full value. This mimics scenarios like survival times where a patient is still alive at the end of the study.\n\n📌 **Equation (36)**: The censoring threshold $c_i$ itself varies across individuals:\n- $\\mu_c$: a fixed baseline.\n- $e_i \\sim \\text{GLG}(\\mu_c, 1, 1)$: random variation in censoring times.\n\n📌 **Equation (37)**: The indicator $\\delta_i$ tells us whether observation $i$ is censored ($\\delta_i = 0$) or fully observed ($\\delta_i = 1$).\n\n🎯 **Goal**: Estimate the regression parameters $(\\mu_0, \\beta_0, \\sigma_0, \\lambda_0)$ accurately despite censoring and potential outliers.\n\nThe predictors were generated as:\n- $x_{i1} \\sim \\mathcal{N}(0, 1)$: a continuous covariate (standard normal),\n- $x_{i2} \\sim \\text{Bernoulli}(0.4)$: a binary covariate (e.g., treatment vs. control),\n- Independent of each other.\n\nThe parameter $\\mu_0$ was"}},"metadata":{"paper_id":"0068afd7f75bf8da4d8e14d3b31b2cf9","csv_row":85755,"doi":"10.1016/j.csda.2016.10.012","openalex_id":"https://openalex.org/W2269131308","pdf_url":"https://arxiv.org/pdf/1512.01473","page_count":44,"text_chars":62255,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2372,"total_tokens":3307,"completion_tokens":935,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2233,"total_tokens":3159,"completion_tokens":926,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":4.314884901046753,"l5_seconds":4.652058839797974}},{"idx":15,"domain":"Academic paper","source":"CSV row 73092 · 2018 · 10.1007/s11468-018-0858-4","title":"Mode Controlling of Surface Plasmon Polaritons by Geometric Phases","seg":"the achiral structure of the bar-type nanoslits cannot distin-\nguish the helicity of light.\nFor the /C22Z -type metasurfaces, Fig. 5(a1,b 1,c 1,d 1)s h o w s\nSEM images of q =1,− 1, 2, and − 2, respectively. Obviously,\nin comparison with Fig. 4, the symmetry of the metasurfaces\nwas not changed by the replacement of metamolecules. The\ncharacteristics of circular, square, line, and hexagonal symme-\ntries remained correspondent to q =1, −1, 2, and − 2, respec-\ntively. Under ∣σ\n+⟩ illumination, specific near-field interfer-\nence patterns, SNOM results [Fig. 5(a2,b 2,c 2,d 2)], and the\ncorresponding simulations [Fig.5(a3,b 3,c 3,d 3)] still maintain\nthe same symmetry as the geometric structures, although the\ndetailed fringes differ significantly from those for the bar-type\nmetasurfaces. Especially notable is that in Fig. 5(a2), almost\nno SNOM signals can be detected for the q = 1 metasurface,\nand the corresponding calculated electric filed intensity of\nFig. 5(a\n3) is very weak (quantitatively, approximately an order\nof magnitude smaller than for other metasurfaces). Referring\nto previous works [ 29], in asymmetrical metasurface struc-\ntures, such as spiral structures, under the circularly polarized\nlight illumination, the excited SPP field is a chiral vortex\nstructure carrying an orbital angular momentum. These /C22Z -\ntype metamolecules, which are planar chiral left-handed struc-\ntures, can also create a chiral vortex SPP electromagnetic field\nwith circulation around the ring. Because the helicity of /C22Z\ncontradicts the right-handed circularly polarized incident light,\nnear-field destructive interference occurs between the left-\nhanded chiral vortex field and the field with geometric phases,\nproduced by the right-handed circularly polarized light in the\nmetasurface with q = 1. For non-circular symmetric\nmetasurfaces, a complete vortex field could not be formed\ndue to a symmetry effect; then, a complete weakening of the\ninterference could not occur, which was more clearly observed\nin Fig. 5(b\n3,c 3,d 3), manifested in some fringe relics accom-\npanied by main symmetric fringes. However, under ∣σ−⟩\nillumination of the q = 1 metasurface, constructive interfer-\nence occurs due to the identity of the incident light and\nmetamolecules, as shown in Fig. 5(a4,a 5), where clear fringes\nare observed. For other symmetric metasurfaces [Fig. 5(b, c,\nd)], the structures of the near field of SPPs are similar to those\nof the bar-type metasurfaces under ∣σ\n+⟩ illumination, but\nthe detailed interference fringes have changed completely\nand are distinguished easil y. This indicates that for\nmetasurfaces with chiral metamolecules, it is possible to dif-\nferentiate the helicity of the incident light, which is the appear-\nance of the optical spin Hall effect. It is noted that the results of\nthe Z-type metasurface are completely opposite to those of the\n/C22Z -type one and are not shown here.\nFig. 4 (a1,b 1,c 1,d 1) Scanning electron microscope images of ring-\nshaped metasurfaces made of bar-type metamolecules for topological\ncharges q =1, − 1, 2, − 2, respectively. The radius of the ring is 2.6 μm\nand the number of metamolecules within the circumference is 36. Under\nthe illumination of ∣σ+⟩, the excited SPP distribution (I || =| E|||2) for\nvarious topological charges was measured by SNOM (a2,b 2,c 2,d 2)a n d\nsimulated by FDTD (a3,b 3,c 3,d 3). The bar at the bottom-right corner of\n(a1) represents 1 μm, which is applicable to the rest of the frames\n788 Plasmonics (2019) 14:785–790\n\nConclusion\nIn this work, we have established a tunable topological charge\non a ring-shaped metasurface, which facilitates significant con-\ntrol over the propagation modes of excited SPPs under the\nillumination of circularly polarized light. This is due to the fact\nthat, at the nanos","models":{"dsv4-flash":{"l5":"For the /C22Z -type metasurfaces, Fig. 5(a1,b 1,c 1,d 1)s h o w s SEM images of q =1,− 1, 2, and − 2, respectively. Obviously, in comparison with Fig. 4, the symmetry of the metasurfaces was not changed by the replacement of metamolecules. The characteristics of circular, square, line, and hexagonal symmetries remained correspondent to q =1, −1, 2, and − 2, respectively. Under ∣σ\n+⟩ illumination, specific near-field interference patterns, SNOM results [Fig. 5(a2,b 2,c 2,d 2)], and the corresponding simulations [Fig.5(a3,b 3,c 3,d 3)] still maintain the same symmetry as the geometric structures, although the detailed fringes differ significantly from those for the bar-type metasurfaces. Especially notable is that in Fig. 5(a2), almost no SNOM signals can be detected for the q = 1 metasurface, and the corresponding calculated electric field intensity of Fig. 5(a3) is very weak (quantitatively, approximately an order of magnitude smaller than for other metasurfaces). Referring to previous works [29], in asymmetrical metasurface structures, such as spiral structures, under the circularly polarized light illumination, the excited SPP field is a chiral vortex structure carrying an orbital angular momentum. These /C22Z -type metamolecules, which are planar chiral left-handed structures, can also create a chiral vortex SPP electromagnetic field with circulation around the ring. Because the helicity of /C22Z contradicts the right-handed circularly polarized incident light, near-field destructive interference occurs between the left-handed chiral vortex field and the field with geometric phases, produced by the right-handed circularly polarized light in the metasurface with q = 1. For non-circular symmetric metasurfaces, a complete vortex field could not be formed due to a symmetry effect; then, a complete weakening of the interference could not occur, which was more clearly observed in Fig. 5(b3,c 3,d 3), manifested in some fringe relics accompanied by main symmetric fringes. However, under ∣σ−⟩ illumination of the q = 1 metasurface, constructive interference occurs due to the identity of the incident light and metamolecules, as shown in Fig. 5(a4,a 5), where clear fringes are observed. For other symmetric metasurfaces [Fig. 5(b, c, d)], the structures of the near field of SPPs are similar to those of the bar-type metasurfaces under ∣σ+⟩ illumination, but the detailed interference fringes have changed completely and are distinguished easily. This indicates that for metasurfaces with chiral metamolecules, it is possible to differentiate the helicity of the incident light, which is the appearance of the optical spin Hall effect. It is noted that the results of the Z-type metasurface are completely opposite to those of the /C22Z -type one and are not shown here.\nFig. 4 (a1,b 1,c 1,d 1) Scanning electron microscope images of ring-shaped metasurfaces made of bar-type metamolecules for topological charges q =1, − 1, 2, − 2, respectively. The radius of the ring is 2.6 μm and the number of metamolecules within the circumference is 36. Under the illumination of ∣σ+⟩, the excited SPP distribution (I || =| E|||2) for various topological charges was measured by SNOM (a2,b 2,c 2,d 2)a n d simulated by FDTD (a3,b 3,c 3,d 3). The bar at the bottom-right corner of (a1) represents 1 μm, which is applicable to the rest of the frames\n788 Plasmonics (2019) 14:785–790\n\nConclusion\nIn this work, we have established a tunable topological charge on a ring-shaped metasurface, which facilitates significant control over the propagation modes of excited SPPs under the illumination of circularly polarized light. This is due to the fact that, at the nanos"},"qwen3-235b-a22b":{"l5":"the achiral structure of the bar-type nanoslits cannot distinguish the helicity of light.  \nThis means that whether the incoming light is right-handed (clockwise rotation of the electric field) or left-handed (counterclockwise), the bar-shaped nanostructures respond in exactly the same way. They lack any inherent \"handedness\" or chirality in their design—like a plain straight road that doesn’t care which direction you turn onto it. As a result, they cannot tell the difference between the two circular polarizations, denoted as $|\\sigma_+\\rangle$ (right-handed) and $|\\sigma_-\\rangle$ (left-handed). This symmetry limitation prevents them from exhibiting polarization-dependent responses, such as selectively enhancing or suppressing one helicity over the other.\n\nFor the /C22Z-type metasurfaces, Fig. 5(a1,b1,c1,d1) shows SEM images of $q = 1, -1, 2,$ and $-2$, respectively. Let’s unpack what this means. The parameter $q$ refers to the topological charge of the metasurface, which essentially dictates how the orientation of the individual building blocks—called metamolecules—rotates as you move around the ring. A positive $q$ means the rotation follows a counterclockwise twist; a negative $q$, a clockwise twist. The magnitude tells us how many full rotations occur over one circumference. So for $q = 1$, the metamolecules complete one full turn around the ring; for $q = 2$, two turns, and so on.\n\nNow, looking at these SEM images, we see that even though the metamolecules have been replaced—from simple bars to more complex /C22Z-shaped elements—the overall symmetry of the metasurface remains unchanged. In other words, the global geometric pattern still respects the same rotational symmetries as before. Specifically:\n- The circular symmetry corresponds to $q = 1$,\n- Square symmetry to $q = -1$,\n- Linear (or bilateral) symmetry to $q = 2$,\n- Hexagonal symmetry to $q = -2$.\n\nThis preservation of symmetry is crucial because it allows us to isolate the effect of the metamolecule’s shape—its local chirality—without being confounded by changes in the global geometry.\n\nUnder $|\\sigma_+\\rangle$ illumination (right-handed circularly polarized light), we observe specific near-field interference patterns via scanning near-field optical microscopy (SNOM), shown in Fig. 5(a2,b2,c2,d2), along with corresponding finite-difference time-domain (FDTD) simulations in Fig. 5(a3,b3,c3,d3). Remarkably, the symmetry of the resulting surface plasmon polariton (SPP) field patterns still matches the geometric symmetry of each metasurface. This tells us that the macroscopic arrangement continues to guide the overall symmetry of the excited electromagnetic field.\n\nHowever, the fine details—the intricate interference fringes—look very different from those seen with the bar-type metasurfaces. Why? Because now, each /C22Z-shaped metamolecule is itself chiral: it has a built-in handedness. In fact, these /C22Z units are planar chiral and specifically left-handed. Think of them like tiny spiral staircases etched flat into the surface, all turning in the same direction—say, like a left-handed screw when viewed from above.\n\nWhen right-handed circularly polarized light ($|\\sigma_+\\rangle$) hits these left-handed chiral structures, something fascinating happens. The incident light tries to excite surface plasmons that carry a certain orbital angular momentum—a kind of \"twist\" in the wavefront. But because the metamolecule is left-handed, it naturally wants to generate a vortex-like SPP field that circulates in the opposite direction (counterclockwise, if we define the coordinate system appropriately).\n\nThis leads to a clash: the geometric phase induced by the metasurface structure and the spin-orbit interaction from the circular polarization produce fields with opposing circulation. When these two effects are out of sync—when the handedness of the light doesn’t match the handedness of the structure—they interfere destructively in the near field.\n\nNowhere is this more evident than in Fig. 5(a2): for the $q = 1$ metasurface under $|\\sigma_+\\rangle$ illumination, almost no SNOM signal is detected. That means there's very little light-matter interaction happening at the surface—very few plasmons are being excited. The simulation in Fig. 5(a3) confirms this: the calculated electric field intensity is extremely weak, roughly an order of magnitude lower than for the other cases. It’s as if the structure and the light are “speaking different languages”—they can’t communicate effectively.\n\nWhy does this destructive interference happen so strongly for $q = 1$ and not as completely for others? Because the $q = 1$ structure has circular symmetry, which supports the formation of a clean, coherent vortex field. When that ideal vortex is excited with the wrong helicity, the mismatch is total, leading to near-perfect cancellation. But for non-circularly symmetric structures—like the square ($q = -1$), linear ($q = 2$), or hexagonal ($q = -2$)—the symmetry breaks the perfection of the vortex. You can’t form a smooth, continuous whirlpool on a square-shaped track. So while some destructive interference still occurs, it’s incomplete. That’s why in Fig. 5(b3,c3,d3), we see residual fringe patterns lingering alongside the main symmetric features—“relics” of partial interference, where some plasmonic activity survives despite the mismatch.\n\nBut now, flip the polarization: use left-handed circularly polarized light, $|\\sigma_-\\rangle$, on the $q = 1$ metasurface. Suddenly, everything clicks. The incident light has the same handedness as the chiral metamolecules. Now, instead of fighting each other, the geometric phase and the spin-induced field reinforce one another. Constructive interference takes over. This is clearly seen in Fig. 5(a4,a5), where strong, well-defined interference fringes appear in both measurement and simulation. The structure and the light are now in harmony, efficiently coupling energy into the SPPs.\n\nFor the other symmetric metasurfaces [Fig. 5(b,c,d)], the near-field SPP patterns under $|\\sigma_+\\rangle$ illumination resemble those of the bar-type counterparts—but with completely different fringe details. This isn’t just random noise; it reflects the new physics introduced by the chiral metamolecules. The interference landscape is reshaped by the local chirality, making the response highly sensitive to the input polarization.\n\nThe big takeaway? Unlike the achiral bar-type designs, these chiral /C22Z metasurfaces *can* distinguish between left- and right-handed light. They respond strongly to one helicity and weakly (or not at all) to the other, depending on their structural handedness. This selective response based on spin—on the circular polarization state—is a hallmark of the **optical spin Hall effect**. It’s a direct manifestation of spin-orbit coupling in nanophotonics, where the \"spin\" of light (its polarization) influences the \"orbit\" (its spatial trajectory or mode structure) via structured interfaces.\n\nIt is noted that the results of the Z-type metasurface are completely opposite to those of the /C22Z-type one and are not shown here.  \nThis implies that the Z-type structures are likely right-handed chiral versions of the same design. So they would couple strongly to $|\\sigma_+\\rangle$ light and weakly to $|\\sigma_-\\rangle$, the reverse of /C22Z. This symmetry complementarity further underscores the role of structural chirality in controlling light at the nanoscale.\n\nFig. 4 (a1,b1,c1,d1) Scanning electron microscope images of ring-shaped metasurfaces made of bar-type metamolecules for topological charges $q = 1, -1, 2, -2$, respectively. The radius of the ring is 2.6 μm and the number of metamolecules within the circumference is 36. Under the illumination of $|\\sigma_+\\rangle$, the excited SPP distribution ($I_{||} = |E_{||}|^2$) for various topological charges was measured by SNOM (a2,b2,c2,d2) and simulated by FDTD (a3,b3,c3,d3). The bar at the bottom-right corner of (a1) represents 1 μm, which is applicable to the rest of the frames  \n788 Plasmonics (2019) 14:785–790\n\nConclusion  \nIn this work, we have established a tunable topological charge  \non a ring-shaped metasurface, which facilitates significant con-  \ntrol over the propagation modes of excited SPPs under the  \nillumination of circularly polarized light. This is due to the fact  \nthat, at the nanos"}},"metadata":{"paper_id":"005a0e397e5c7c60eddd137bbd2dcd74","csv_row":73092,"doi":"10.1007/s11468-018-0858-4","openalex_id":"https://openalex.org/W2893884578","pdf_url":"https://link.springer.com/content/pdf/10.1007%2Fs11468-018-0858-4.pdf","page_count":6,"text_chars":23802,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2384,"total_tokens":3246,"completion_tokens":862,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2245,"total_tokens":3122,"completion_tokens":877,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":4.137099266052246,"l5_seconds":4.88971734046936}},{"idx":16,"do is \n(0,9%), drogas não injetáveis (3,8%) e prostituição (0,3%); \n89,3% relataram parceiro único no último ano. História de \nDST e prostituição foram fatores de risco tanto para a infecção \npelo HIV e como para a sífilis; A realização de pré-natal e ter \nparceiro único no último ano foram fatores de proteção para \nas infecções. O uso de drogas não injetáveis, ter parceiro com \nsorologia positiva para HIV e com história de encarceramento \nestiveram associados com HIV e a história de violência sexual \ncom a sífilis ( Tabela 2).\nO modelo final de regressão logística não mostrou associação \nestatística entre as infecções e os fatores de risco estudados.\nTABELA 2\nFrequência dos fatores de risco relatados pelas 1.380 parturientes e suas associações com a infecção pelo HIV e sífilis. \n *OR (IC 95%) *OR (IC 95%)\nVariáveis Percentagem HIV Sífilis\nRealizou pré-natal 94,8 0,16 (0,03-0,80) 0,22 (0,03-1,95)\nHistória de DST 4,1 14,64 (3,41-62,86) 49,85 (8,93-278,23)\nUso drogas injetáveis 0,9 1,01 (1,00 - 1,01) **\nUsuária drogas não-injetáveis","models":{"dsv4-flash":{"l5":"388\nRevista da Sociedade Brasileira de Medicina Tropical 42(4):386-391, jul-ago, 2009\n\nEntre as gestantes que fizeram o teste no pré-natal, o VDRL foi positivo em 14 (1%) gestantes, sendo que entre estas 50% dos parceiros também fizeram o VDRL e 42,8% destes receberam tratamento. O resultado do HbsAg estava no cartão de pré-natal de 1.198 parturientes, nessas parturientes a prevalência de infecção crônica pelo vírus B foi de 0,4% (IC95% 0,36%-0,44%).\n\nA média de idade da primeira relação sexual foi de 16,5 (DP 2,9) anos. A mediana da idade gestacional foi 39 (DIQ 37; 40) semanas. Os dados sócio-demográficos estão descritos na Tabela 1. Mais de 25% das gestantes eram adolescentes; 83,9% tinham renda familiar de até três salários mínimos e 55,7% tiveram partos normais. Aproximadamente, 95% das parturientes relataram ter feito pré-natal, sendo que entre estas 8,5% relatou menos de quatro consultas e somente 54,8% realizou seis ou mais consultas.\n\nTABELA 1\nCaracterísticas socio-demográficas das 1.380 parturientes atendidas nas maternidades públicas de Vitória, ES.\nVariáveis Número Percentagem\nEstado civil\nsolteira 289 20,9\ncasada/união estável 1.071 77,6\ndivorciada/separada 18 1,3\nviúva 2 0,1\nIdade (anos)\n13-19 352 25,5\n20-29 778 56,4\n30-39 224 16,2\n40-44 26 1,9\nMaternidade\nPro-Matre (baixo risco) 933 67,7\nHUCAM (alto risco) 289 21,0\nSanta Casa (médio risco) 157 11,4\nRenda familiar em salários mínimos\n< 1 439 31,8\n1 a 3 719 52,1\n3 a 5 177 12,8\n> 5 45 3,3\nMotivo de Internação\nparto normal 769 55,7\nparto cesariana 454 32,9\nabortamento 51 3,7\ntratamento Clínico 106 7,7\n\nOs fatores de risco relatados foram: história de DST (4,1%), transfusão sanguínea (3,2%), drogas injetáveis (0,9%), drogas não injetáveis (3,8%) e prostituição (0,3%); 89,3% relataram parceiro único no último ano. História de DST e prostituição foram fatores de risco tanto para a infecção pelo HIV como para a sífilis; A realização de pré-natal e ter parceiro único no último ano foram fatores de proteção para as infecções. O uso de drogas não injetáveis, ter parceiro com sorologia positiva para HIV e com história de encarceramento estiveram associados com HIV e a história de violência sexual com a sífilis (Tabela 2).\n\nO modelo final de regressão logística não mostrou associação estatística entre as infecções e os fatores de risco estudados.\n\nTABELA 2\nFrequência dos fatores de risco relatados pelas 1.380 parturientes e suas associações com a infecção pelo HIV e sífilis.\n*OR (IC 95%) *OR (IC 95%)\nVariáveis | Percentagem | HIV | Sífilis\nRealizou pré-natal | 94,8 | 0,16 (0,03-0,80) | 0,22 (0,03-1,95)\nHistória de DST | 4,1 | 14,64 (3,41-62,86) | 49,85 (8,93-278,23)\nUso drogas injetáveis | 0,9 | 1,01 (1,00 - 1,01) | **\nUsuária drogas não-injetáveis"},"qwen3-235b-a22b":{"l5":"388  \nRevista da Sociedade Brasileira de Medicina Tropical 42(4):386-391, jul-ago, 2009  \n\nEntre as gestantes que realizaram o teste durante o pré-natal, o VDRL — um exame usado para detectar sífilis — foi positivo em 14 delas, o que corresponde a 1% do total. Dentre essas 14 gestantes com resultado positivo, metade (50%) tinham parceiros que também fizeram o teste VDRL, e, desses parceiros, 42,8% receberam tratamento adequado. Isso destaca a importância de envolver também os parceiros no diagnóstico e tratamento, já que a sífilis é uma infecção sexualmente transmissível e pode ser transmitida de volta à gestante se o parceiro não for tratado.\n\nO antígeno de superfície do vírus da hepatite B (HbsAg) estava registrado no cartão de pré-natal de 1.198 parturientes. Nesse grupo, a prevalência de infecção crônica pelo vírus da hepatite B foi de 0,4%. Isso quer dizer que, a cada 1.000 gestantes, cerca de 4 tinham hepatite B de forma crônica. O intervalo de confiança de 95% (IC95%) — que nos dá uma faixa dentro da qual o valor real provavelmente está — foi de 0,36% a 0,44%, indicando que a estimativa é bastante precisa, com pouca margem de erro.\n\nA idade média em que as gestantes tiveram sua primeira relação sexual foi de 16,5 anos, com um desvio padrão (DP) de 2,9 anos. O desvio padrão nos diz o quão variável é essa idade entre as mulheres: quanto maior o valor, mais espalhados estão os dados em torno da média. Neste caso, um DP de 2,9 sugere que a maioria das mulheres teve sua primeira relação sexual entre cerca de 14 e 19 anos (ou seja, dentro de um intervalo de aproximadamente dois desvios padrão da média).\n\nA mediana da idade gestacional ao nascimento foi de 39 semanas, com um desvio interquartil (DIQ) de 37 a 40 semanas. A mediana é o valor central: metade das gestações durou menos que 39 semanas, metade durou mais. O desvio interquartil mostra onde estão os 50% do meio dos dados — aqui, entre 37 e 40 semanas — o que indica que a maioria das gestações estava bem próxima do termo completo (considerado entre 37 e 42 semanas).\n\nOs dados socioeconômicos e demográficos das 1.380 parturientes estão detalhados na Tabela 1. Mais de um quarto delas — 25,5% — eram adolescentes (entre 13 e 19 anos), o que pode ter implicações importantes para o cuidado pré-natal, já que adolescentes grávidas podem enfrentar barreiras adicionais no acesso a serviços de saúde. A grande maioria (83,9%) tinha renda familiar de até três salários mínimos, o que reflete uma população predominantemente de baixa renda. Cerca de 55,7% das mulheres tiveram parto normal, enquanto os demais tiveram cesariana, abortamento ou necessitaram de tratamento clínico durante a internação.\n\nQuase todas as parturientes — aproximadamente 95% — relataram ter feito pré-natal, o que é um indicador positivo de acesso aos serviços de saúde. No entanto, entre essas, 8,5% fizeram menos de quatro consultas, o que está abaixo do mínimo recomendado pela Organização Mundial da Saúde (pelo menos seis consultas). Apenas 54,8% realizaram seis ou mais consultas, o que sugere que, embora o acesso inicial ao pré-natal seja alto, a continuidade e a qualidade do acompanhamento podem ser insuficientes em muitos casos.\n\n### TABELA 1  \nCaracterísticas socio-demográficas das 1.380 parturientes atendidas nas maternidades públicas de Vitória, ES.  \n\n| Variáveis                     | Número | Percentagem |\n|-------------------------------|--------|-------------|\n| Estado civil                  |        |             |\n| solteira                      | 289    | 20,9        |\n| casada/união estável          | 1.071  | 77,6        |\n| divorciada/separada           | 18     | 1,3         |\n| viúva                         | 2      | 0,1         |\n| Idade (anos)                  |        |             |\n| 13-19                         | 352    | 25,5        |\n| 20-29                         | 778    | 56,4        |\n| 30-39                         | 224    | 16,2        |\n| 40-44                         | 26     | 1,9         |\n| Maternidade                   |        |             |\n| Pro-Matre (baixo risco)       | 933    | 67,7        |\n| HUCAM (alto risco)            | 289    | 21,0        |\n| Santa Casa (médio risco)      | 157    | 11,4        |\n| Renda familiar em salários mínimos |        |             |\n| < 1                           | 439    | 31,8        |\n| 1 a 3                         | 719    | 52,1        |\n| 3 a 5                         | 177    | 12,8        |\n| > 5                           | 45     | 3,3         |\n| Motivo de Internação          |        |             |\n| parto normal                  | 769    | 55,7        |\n| parto cesariana               | 454    | 32,9        |\n| abortamento                   | 51     | 3,7         |\n| tratamento Clínico            | 106    | 7,7         |\n\nOs fatores de risco relatados pelas gestantes incluíram: história de doença sexualmente transmissível (DST) em 4,1% delas, transfusão sanguínea (3,2%), uso de drogas injetáveis (0,9%), uso de drogas não injetáveis (3,8%) e prática de prostituição (0,3%). A grande maioria — 89,3% — relatou ter tido apenas um parceiro sexual no último ano, o que é um comportamento considerado de menor risco para infecções como HIV e sífilis.\n\nAlguns desses fatores se mostraram especialmente relevantes na análise de risco. História de DST e prática de prostituição estiveram associadas tanto ao HIV quanto à sífilis — ou seja, mulheres que relataram essas experiências tinham maior probabilidade de terem sido diagnosticadas com uma dessas infecções. Por outro lado, ter feito pré-natal e ter tido um único parceiro no último ano foram identificados como fatores de proteção: eles reduziram a chance de infecção, provavelmente por promoverem maior acesso a cuidados e testes, além de menor exposição a novos parceiros.\n\nOutros fatores também mostraram associações específicas: o uso de drogas não injetáveis, ter um parceiro com sorologia positiva para HIV ou com histórico de encarceramento estiveram associados ao HIV. Já a história de violência sexual esteve associada à sífilis — uma ligação preocupante que pode refletir situações de vulnerabilidade e exposição forçada a riscos.\n\nEssas associações são exploradas com mais detalhe na Tabela 2, que apresenta as razões de chances (OR — *odds ratio*) com intervalos de confiança de 95%. A OR nos diz o quanto um fator aumenta (ou diminui) a chance de uma infecção. Por exemplo, uma OR maior que 1 indica maior risco; menor que 1, proteção.\n\nApesar dessas associações observadas, o modelo final de regressão logística — uma técnica estatística usada para analisar a relação entre múltiplas variáveis e um desfecho (neste caso, infecção por HIV ou sífilis) — **não mostrou associação estatisticamente significativa** entre os fatores de risco estudados e as infecções. Isso pode parecer contraditório à primeira vista, mas é importante entender: enquanto algumas associações individuais parecem fortes (como a história de DST), quando todas as variáveis são analisadas juntas no modelo estatístico, os efeitos podem se tornar não significativos. Isso pode acontecer por vários motivos — por exemplo, o tamanho da amostra pode ser insuficiente para detectar diferenças reais, ou os fatores podem estar interligados de forma complexa (como colinearidade), ou o número de casos de infecção pode ser muito pequeno para permitir conclusões firmes.\n\n### TABELA 2  \nFrequência dos fatores de risco relatados pelas 1.380 parturientes e suas associações com a infecção pelo HIV e sífilis.  \n\n| Variáveis                     | Percentagem | *OR (IC 95%) HIV* | *OR (IC 95%) Sífilis* |\n|-------------------------------|-------------|--------------------|-------------------------|\n| Realizou pré-natal            | 94,8        | 0,16 (0,03-0,80)   | 0,22 (0,03-1,95)        |\n| História de DST               | 4,1         | 14,64 (3,41-62,86) | 49,85 (8,93-278,23)     |\n| Uso drogas injetáveis         | 0,9         | 1,01 (1,00 - 1,01) | **                   |\n| Usuária drogas não-injetáveis"}},"metadata":{"paper_id":"005c9359cea36df37ac20ed3ab1fa021","csv_row":75241,"doi":"10.1590/s0037-86822009000400006","openalex_id":"https://openalex.org/W1992774820","pdf_url":"https://www.scielo.br/j/rsbmt/a/K8DT7JsjXpc4FWfFhxX9hxn/?lang=pt&format=pdf","page_count":6,"text_chars":30050,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2394,"total_tokens":3359,"completion_tokens":965,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2255,"total_tokens":3242,"completion_tokens":987,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":4.597237825393677,"l5_seconds":5.271195650100708}},{"idx":17,"domain":"Academic paper","source":"CSV row 98227 · 2012 · 10.1103/physreva.85.013632","title":"Overlaying optical lattices for simulation of complex frustrated antiferromagnets","seg":"4\nm m \nz\n/ 3! \"# \n(a)\nkx/ \n√\n2π\nkx/ \n√\n2π\n0 1 2 3 40\n1\n2\n3\n4\n10 \n20 \n30 \n(b)\n1t\n2t\n(c)\nFIG. 2: (Color online) (a) Schematic diagram for generating\nthe interference ﬁeld V3(x, y). (b) The optical lattice induced\nby interference ﬁeld V (x, y) in unit of ER. (c) Schematic\ndiagram of a checkerboard lattice.\nered respectively. Consequently, the diagonal tunnelings\nin these two sets of plaquettes are either suppressed or\nenhanced, providing us the checkerboard lattice. The\nconﬁguration of the checkerboard lattice is shown in Fig.\n2(c). When we ﬁx the value of V1 and V3 and adjust\nthe value of V2, the rate of t2/t 1 will be changed accord-\ningly. When t2 is comparable to t1, the checkerboard\nJ1-J2 model may reach the strongly frustrated regime\nJ2/J 1 ∼ 1.\nIII. THE FRUSTRATED J1-J2 HEISENBERG\nMODELS\nWe can implement the J1-J2 Heisenberg model by us-\ning a collection of ultracold fermionic atoms conﬁned in\nthe special square optical lattice at integer ﬁlling. In the\nreal experiments, ultracold fermionic atoms have been\nused to realize the Mott insulating state [21, 22]. By\nfurther lowering the temperatures, two easily accessible\nhyperﬁne states in such system can be used to realize\nmagnetic orders [23, 24]. Here we consider that the sys-\ntem enters into the Mott insulating state, and then load\nthe ultracold fermionic atoms onto the optical lattice so\nthat there is only one atom per lattice site. The two hy-\nperﬁne states represent the eﬀective spin states |σ ⟩ =|↑⟩\nand |↓⟩. We assume that the optical potential has no\nstate dependence and the atoms are conﬁned to the low-\nest Bloch band. The model Hamiltonian can be written\nas,\nH = − t1\n∑\n⟨i,j ⟩σ\n(c†\niσ cjσ + h.c. )\n− t2\n∑\n⟨⟨i,j ⟩⟩σ\n(c†\niσ cjσ + h.c. ) + U\n∑\ni\nni↑ni↓,\n(5)\nwhere ciσ is the Fermion annihilation operator for the\natom on site i, niσ = c†\niσ ciσ, t1 and t2 are respectively\nthe tunneling matrix elements between two nn sites ⟨i, j ⟩\nand two nnn sites ⟨⟨i, j ⟩⟩, and U denotes the on-site re-\npulsive interaction between the atoms. The interaction\nU can be adjusted by Feshbach resonances method. In\nthe Mott insulator regime, we have t1, t2 ≪ U. By treat-\ning the tunneling as weak perturbation and using the\nSchriﬀer-Wolﬀ transformation, it can be shown that Eq.\n(5) is equivalent to the following J1-J2 Heisenberg model\nHamiltonian,\nH = J1\n∑\n⟨i,j ⟩\nSi · Sj + J2\n∑\n⟨⟨i,j ⟩⟩\nSi · Sj. (6)\nwhere Ji = 4 t2\ni /U (i=1,2), J1 and J2 correspond to the\nnn and nnn exchange couplings, respectively. (see Fig.1c)\nHere we ignore the higher order corrections for the coef-\nﬁcient Ji, in which the dominant item is proportional to\nt4\ni /U 3 [25] and can be suppressed greatly as U/t i grows.\nDue to the competition between J1 and J2, the frus-\ntrated J1-J2 antiferromagnet has certain limiting cases.\nAt J2/J 1 ≪ 1, the model is reduced to the Heisenberg\nmodel on a square lattice. At J2/J 1 ∼ 1, the system has\na collinear antiferromagnetic quasi-long range order. In\nthe strongly frustrated regime J2/J 1 ∼ 0. 5, there are sev-\neral candidates of possible spin liquid states, but there\nis still lack of general consensus. According to previ-\nous analytical and numerical studies [26–28],","models":{"dsv4-flash":{"l5":"4\nm m \nz\n/ 3! \"# \n(a)\nkx/ \n√\n2π\nkx/ \n√\n2π\n0 1 2 3 40\n1\n2\n3\n4\n10 \n20 \n30 \n(b)\n1t\n2t\n(c)\nFIG. 2: (Color online) (a) Schematic diagram for generating\nthe interference field V3(x, y). (b) The optical lattice induced\nby interference field V (x, y) in unit of ER. (c) Schematic\ndiagram of a checkerboard lattice.\n\nLet’s pause to unpack what this figure is telling us, because it’s the visual key to the entire lattice design. In panel (a), we see the experimental setup: three laser beams (labeled with wavevectors kx/√2π) are arranged to interfere, creating a two-dimensional optical potential V₃(x, y). Think of these beams as overlapping ripples on a pond—where their peaks and troughs align, they create a standing-wave pattern of light intensity. Panel (b) shows the resulting optical lattice potential V(x, y), measured in units of the recoil energy E_R (the natural energy scale for an atom absorbing a photon from the lattice laser). The bright spots are deep potential wells—the “egg carton” dimples where atoms will be trapped. Now, here’s the crucial trick: by carefully choosing the relative strengths of the three beams, we can make the diagonal tunneling amplitudes (the rates at which atoms hop between next-nearest-neighbor sites) unequal on alternating plaquettes (the smallest squares of the lattice). On one set of plaquettes, the diagonal tunneling is suppressed (t₂ is small); on the adjacent set, it is enhanced (t₂ is large). This alternating pattern is exactly what creates the checkerboard lattice shown in panel (c). The two different colors represent the two types of plaquettes—one where diagonal hopping is weak, one where it is strong. So, by fixing V₁ and V₃ (the strengths of two beams) and tuning V₂ (the third beam), we directly control the ratio t₂/t₁. When t₂ becomes comparable to t₁, we push the system into the strongly frustrated regime where J₂/J₁ ~ 1—a regime where the magnetic interactions are in direct conflict, as we’ll see next.\n\nIII. THE FRUSTRATED J1-J2 HEISENBERG MODELS\n\nNow we arrive at the heart of the physics. We have built a special square lattice with two different diagonal tunnelings. But how do we turn this into a magnetic system? The answer lies in using ultracold fermionic atoms—atoms that obey the Pauli exclusion principle, meaning no two can occupy the same quantum state. Here’s the step-by-step plan:\n\n1. **Load the atoms into the lattice.** We start with a gas of ultracold fermionic atoms (e.g., potassium-40 or lithium-6) and load them into the optical lattice we just created. By carefully controlling the lattice depth and the atom density, we drive the system into a Mott insulating state—a state where exactly one atom sits on each lattice site. This is crucial: it means the atoms are localized, and the only way they can move is by tunneling to a neighboring site.\n\n2. **Use two hyperfine states as spin.** Each atom has two internal hyperfine states (different nuclear spin orientations) that we label as |↑⟩ and |↓⟩. These act as our effective spin-1/2 degrees of freedom. Think of them as two different colors of the same atom—they are indistinguishable in terms of the lattice potential (we assume the optical potential has no state dependence), but they can interact with each other.\n\n3. **Confine to the lowest Bloch band.** We ensure the atoms are in the lowest energy band of the lattice, meaning they have no kinetic energy beyond the tunneling we will describe. This is the standard “tight-binding” limit.\n\nNow, the full Hamiltonian that describes this system is given by Eq. (5):\n\nH = − t₁ ∑⟨i,j⟩σ (c†ᵢσ cⱼσ + h.c.) − t₂ ∑⟨⟨i,j⟩⟩σ (c†ᵢσ cⱼσ + h.c.) + U ∑ᵢ nᵢ↑ nᵢ↓.\n\nLet’s decode this term by term. The operator c†ᵢσ creates a fermion of spin σ on site i, and cⱼσ annihilates one on site j. The product c†ᵢσ cⱼσ therefore represents a particle hopping from site j to site i. The first sum runs over nearest-neighbor (nn) pairs ⟨i,j⟩, with tunneling amplitude t₁. The second sum runs over next-nearest-neighbor (nnn) pairs ⟨⟨i,j⟩⟩ (the diagonals of the plaquettes), with tunneling amplitude t₂. The “h.c.” (Hermitian conjugate) ensures the hopping is symmetric—particles can go both ways. The last term, U ∑ᵢ nᵢ↑ nᵢ↓, describes the on-site repulsive interaction: if two atoms (one spin-up, one spin-down) occupy the same site, they feel a repulsive energy U. This is the key ingredient that will generate magnetism.\n\n**Why is U so important?** In the Mott insulator regime, we have t₁, t₂ ≪ U. This means the atoms are strongly repelled from sharing a site, so they stay put. But they can still “virtually” hop to a neighboring site and back, as long as they don’t stay there. This virtual hopping is the microscopic origin of magnetic exchange.\n\nNow, here’s the crucial step: we treat the tunneling as a weak perturbation and use a mathematical tool called the **Schrieffer–Wolff transformation**. This transformation systematically eliminates the high-energy states (where two atoms occupy the same site) and projects the Hamiltonian onto the low-energy subspace where each site has exactly one atom. The result is that the original fermionic Hamiltonian (Eq. 5) becomes an effective spin Hamiltonian—the J₁-J₂ Heisenberg model:\n\nH = J₁ ∑⟨i,j⟩ Sᵢ · Sⱼ + J₂ ∑⟨⟨i,j⟩⟩ Sᵢ · Sⱼ. (6)\n\nHere, Sᵢ is the spin operator at site i (a vector with components Sˣ, Sʸ, Sᶻ), and the dot product Sᵢ · Sⱼ measures the relative alignment of two spins. The exchange couplings are given by Jᵢ = 4tᵢ²/U (for i = 1, 2). Let’s understand this formula: the factor 4 comes from the two possible paths (up-down and down-up) and the two spin states; tᵢ² reflects that the process involves two hops (out and back); and 1/U is the energy cost of the intermediate state with double occupancy. So J₁ is the nearest-neighbor exchange, and J₂ is the next-nearest-neighbor exchange, as shown in Fig. 1c.\n\n**A note on higher-order corrections.** We have ignored higher-order terms in the expansion, the dominant one being proportional to tᵢ⁴/U³. These corrections become negligible when U/tᵢ is large, which is exactly the regime we are in. So our approximation is well-controlled.\n\nNow, the beauty of this model is that the ratio J₂/J₁ can be tuned by adjusting the lattice parameters (via V₂, as we saw in Fig. 2). This tunability is what allows us to explore different magnetic phases. Let’s consider the limiting cases:\n\n- **J₂/J₁ ≪ 1:** The next-nearest-neighbor coupling is negligible. The model reduces to the standard Heisenberg model on a square lattice, which is a well-understood antiferromagnet with Néel order (spins alternate up-down-up-down).\n- **J₂/J₁ ~ 1:** The competition between J₁ and J₂ becomes significant. The system develops a **collinear antiferromagnetic quasi-long-range order**—meaning the spins align in stripes (e.g., up-up-down-down) rather than a simple checkerboard, but this order is only quasi-long-range (it decays algebraically, not exponentially).\n- **J₂/J₁ ~ 0.5:** This is the **strongly frustrated regime**. Here, the two couplings are in direct conflict: J₁ wants to align spins antiferromagnetically on nearest neighbors, while J₂ wants to align them antiferromagnetically on next-nearest neighbors. These two desires cannot be satisfied simultaneously—this is the essence of frustration. In this regime, several candidate spin liquid states have been proposed, but there is still no general consensus. A spin liquid is a state where the spins remain disordered even at zero temperature, with no long-range order, but with strong quantum entanglement.\n\nAccording to previous analytical and numerical studies [26–28],"},"qwen3-235b-a22b":{"l5":"4  \nm m  \nz  \n/ 3! \"#  \n(a)  \nkx/  \n√  \n2π  \nkx/  \n√  \n2π  \n0 1 2 3 40  \n1  \n2  \n3  \n4  \n10   \n20   \n30   \n(b)  \n1t  \n2t  \n(c)  \nFIG. 2: (Color online) (a) Schematic diagram for generating  \nthe interference field $ V_3(x, y) $. (b) The optical lattice induced  \nby interference field $ V(x, y) $ in units of $ E_R $. (c) Schematic  \ndiagram of a checkerboard lattice.  \n\nAs we saw in the previous section, the interference of laser beams creates a spatially varying potential that traps ultracold atoms in a periodic pattern—this is the optical lattice. In particular, the configuration shown in Fig. 2(a) is designed to generate a specific interference field $ V_3(x, y) $, which contributes to shaping the overall lattice potential. When combined with other laser fields (not shown here), this setup produces the full lattice potential $ V(x, y) $, whose energy landscape is plotted in Fig. 2(b) in units of the recoil energy $ E_R = \\hbar^2 k^2 / 2m $, a natural energy scale in optical lattices determined by the laser wavevector $ k $ and atomic mass $ m $.\n\nNow, what makes this lattice special? Look closely at the pattern in Fig. 2(b): it’s not just a simple square grid. The intensity and shape of the potential vary in such a way that certain tunneling pathways between neighboring sites are modified. Specifically, the diagonal tunneling amplitudes—how easily atoms can hop between next-nearest-neighbor (nnn) sites—are no longer uniform across the lattice. Instead, they alternate in strength depending on the local potential depth and geometry.\n\nThis leads us to the key idea: by carefully tuning the relative intensities of the laser beams that form the interference pattern, we can selectively suppress or enhance tunneling along certain diagonals. The result is a lattice where the effective tunneling rates differ between two interpenetrating sublattices—imagine a checkerboard where black squares have strong diagonal connections, while white squares have weak ones, or vice versa. This is precisely what is illustrated in Fig. 2(c): the **checkerboard lattice**.\n\nWhy is this useful? Because it gives us direct control over the ratio of tunneling amplitudes. Recall that in such systems, the dominant tunneling occurs between nearest neighbors (nn), denoted by $ t_1 $, and next-nearest neighbors (nnn), denoted by $ t_2 $. In a standard square lattice, $ t_2 $ is typically much smaller than $ t_1 $, but in this engineered checkerboard setup, we can tune their ratio $ t_2 / t_1 $ by adjusting the intensity of one of the laser fields—specifically $ V_2 $, as mentioned in the text.\n\nLet’s pause to clarify: when we say “adjust the value of $ V_2 $”, we mean changing the depth or phase of one component of the optical potential. This alters the local wavefunction overlap between adjacent sites, thereby modifying the probability of quantum tunneling. So even though $ V_1 $ and $ V_3 $ are held fixed, tweaking $ V_2 $ reshapes the energy landscape just enough to change $ t_2 $ relative to $ t_1 $.\n\nNow, here’s the big picture: when $ t_2 $ becomes comparable to $ t_1 $, something remarkable happens. The resulting magnetic interactions—mediated through virtual tunneling processes—lead to a situation where competing exchange couplings $ J_1 $ and $ J_2 $ are also comparable. This brings us into the **strongly frustrated regime**, where $ J_2 / J_1 \\sim 1 $. Frustration means that the system cannot simultaneously minimize all its interaction energies, leading to a vast number of nearly degenerate ground states and potentially exotic quantum phases.\n\nIII. THE FRUSTRATED J1-J2 HEISENBERG  \nMODELS  \n\nSo how do we connect this engineered optical lattice to magnetism? The answer lies in a beautiful chain of physical reasoning that links atomic motion to spin interactions.\n\nImagine loading ultracold fermionic atoms—such as lithium-6 or potassium-40—into this checkerboard optical lattice. These atoms have two accessible internal states, usually different hyperfine levels, which we can label as “up” ($ |\\uparrow\\rangle $) and “down” ($ |\\downarrow\\rangle $). These two states will serve as our effective **spin-1/2 degrees of freedom**, even though they aren’t actual electron spins. This is a common trick in quantum simulation: use controllable quantum systems to mimic others that are harder to study.\n\nNow, suppose we tune the system so that there is exactly **one atom per lattice site**. This is called **integer filling**. Furthermore, we make the on-site repulsion $ U $ very strong compared to the tunneling rates $ t_1 $ and $ t_2 $. In this regime, known as the **Mott insulator**, atoms are essentially pinned to their sites because it would cost too much energy to double-occupy any site. This suppresses charge motion, but interestingly, **spin dynamics still remain active** through virtual hopping processes.\n\nTo describe this system mathematically, we start with the **Fermi-Hubbard Hamiltonian**, which captures both kinetic energy (tunneling) and interaction energy:\n\n$$\nH = - t_1 \\sum_{\\langle i,j \\rangle,\\sigma} (c^\\dagger_{i\\sigma} c_{j\\sigma} + \\text{h.c.}) \n- t_2 \\sum_{\\langle\\langle i,j \\rangle\\rangle,\\sigma} (c^\\dagger_{i\\sigma} c_{j\\sigma} + \\text{h.c.}) \n+ U \\sum_i n_{i\\uparrow} n_{i\\downarrow},\n\\tag{5}\n$$\n\nLet’s unpack this equation piece by piece.\n\n- $ c_{i\\sigma} $ is the **fermion annihilation operator**: it removes a fermion with spin $ \\sigma $ (either $ \\uparrow $ or $ \\downarrow $) from lattice site $ i $. Its Hermitian conjugate $ c^\\dagger_{i\\sigma} $ creates one.\n- $ n_{i\\sigma} = c^\\dagger_{i\\sigma} c_{i\\sigma} $ counts the number of fermions with spin $ \\sigma $ on site $ i $, so $ n_{i\\uparrow} n_{i\\downarrow} $ is 1 only if both spin-up and spin-down fermions are present on the same site—this is the double occupancy.\n- The first two terms describe **quantum tunneling**: atoms can hop between nearest-neighbor sites (denoted $ \\langle i,j \\rangle $) with amplitude $ t_1 $, or between next-nearest-neighbor sites (denoted $ \\langle\\langle i,j \\rangle\\rangle $) with amplitude $ t_2 $. The “h.c.” stands for Hermitian conjugate, ensuring the Hamiltonian is self-adjoint.\n- $ U $ is the **on-site repulsive interaction energy**, which penalizes double occupancy. It can be tuned experimentally using **Feshbach resonances**, a powerful technique that uses magnetic fields to adjust interatomic scattering lengths.\n\nNow, in the **Mott insulating regime**, where $ t_1, t_2 \\ll U $, actual particle movement is highly suppressed. But quantum mechanics allows for **virtual processes**: an atom can briefly hop to a neighboring site and then hop back, as long as it doesn’t violate energy conservation over long times. These virtual hoppings don’t change the charge configuration but *can* flip spins.\n\nTo extract the effective low-energy physics, we apply a theoretical tool called the **Schrieffer-Wolff transformation**. This is a canonical transformation that integrates out high-energy charge fluctuations (like double occupancies) and yields an effective Hamiltonian acting only on the spin degrees of freedom.\n\nAfter performing this transformation, the resulting physics is captured by the **J1-J2 Heisenberg model**:\n\n$$\nH = J_1 \\sum_{\\langle i,j \\rangle} \\mathbf{S}_i \\cdot \\mathbf{S}_j + J_2 \\sum_{\\langle\\langle i,j \\rangle\\rangle} \\mathbf{S}_j \\cdot \\mathbf{S}_j.\n\\tag{6}\n$$\n\nHere, $ \\mathbf{S}_i $ is the spin-1/2 operator at site $ i $, and the sums run over nearest-neighbor and next-nearest-neighbor pairs, respectively.\n\nThe exchange couplings are given by:\n$$\nJ_i = \\frac{4 t_i^2}{U}, \\quad \\text{for } i = 1,2.\n$$\n\nSo $ J_1 $ comes from nearest-neighbor tunneling $ t_1 $, and $ J_2 $ from next-nearest-neighbor tunneling $ t_2 $. Since both are proportional to $ t_i^2 / U $, they are always positive under our assumptions—meaning both interactions are **antiferromagnetic**: neighboring spins prefer to point in opposite directions.\n\nBut here’s the catch: when both $ J_1 $ and $ J_2 $ are significant, they compete. On a square lattice, $ J_1 $ favors a Néel-type antiferromagnetic order (alternating up/down spins), but $ J_2 $ introduces diagonal interactions that want to align spins along rows or columns in a striped pattern. When $ J_2 / J_1 \\sim 0.5 $, this competition becomes intense—this is the **strongly frustrated regime**.\n\nAt this point, the system cannot settle into a simple ordered state. Instead, it may form a **quantum spin liquid**, a highly entangled phase with no long-range magnetic order, even at zero temperature. While numerical and analytical studies have proposed several candidate states—such as gapped $ \\mathbb{Z}_2 $ spin liquids or gapless Dirac spin liquids—there is still no universal agreement on the exact nature of the ground state in this regime [26–28]."}},"metadata":{"paper_id":"00776790898a4c20da9bd77a35e7fabd","csv_row":98227,"doi":"10.1103/physreva.85.013632","openalex_id":"https://openalex.org/W2167716703","pdf_url":"https://arxiv.org/pdf/1212.5326","page_count":7,"text_chars":35206,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2363,"total_tokens":3155,"completion_tokens":792,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2224,"total_tokens":4154,"completion_tokens":1930,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":3.9665110111236572,"l5_seconds":14.30591607093811}},{"idx":18,"domain":"Academic paper","source":"CSV row 71420 · 2011 · 10.1590/s1517-86922011000300006","title":"Correlação do teste de 1RM com aspectos maturacionais, neuromotores, antropométricos e a composição corporal em crianças e adolescentes","seg":"181Rev Bras Med Esporte – Vol. 17, N o 3 – Mai/Jun, 2011\nos movimentos com um peso inferior ao supostamente suportado, \napenas para aprender a execução dos movimentos. Os exercícios foram \ncompostos de três séries com 12 repetições, o intervalo de recuperação \nentre as séries e os exercícios foi de aproximadamente 90 segundos(2). \nA 1RM foi determinada tipicamente dentro de quatro-seis experi -\nmentações(9). Primeiramente, o avaliado realizava um aquecimento de \nseis a 10 repetições, com aproximadamente 50% de sua carga máxima \nestimada para a primeira tentativa no teste. Após o aquecimento, o \nsujeito tinha um intervalo de dois minutos e, em seguida, o avaliado \niniciava o teste. \nOs sujeitos foram orientados a tentarem completar duas repetições. \nCaso fossem completadas duas repetições na primeira tentativa, ou \nmesmo se não fosse completada sequer uma repetição, uma segun -\nda tentativa era oportunizada após um intervalo de recuperação de \ntrês a cinco minutos, com a carga superior (primeira possibilidade) ou \ninferior (segunda possibilidade) àquela utilizada na tentativa anterior. \nEste procedimento foi repetido novamente em uma terceira e última \ntentativa, caso ainda a carga de 1RM não tivesse sido determinada, \nsendo que o intervalo entre os exercícios foi de cinco minutos(2). Todos \nos procedimentos de teste foram supervisionados rigorosamente, e o \nincentivo uniforme foi oferecido a todos os sujeitos. \nPrimeiramente, foi executado o teste na cadeira extensora e em \nseguida na rosca direta de bíceps, sendo que a ordem de execução \nobedeceu ao tamanho do maior grupo muscular agonista envolvido. \nA forma e a técnica de execução foram padronizadas conforme Fai -\ngenbaum e Westcott (20). Um movimento mal sucedido era definido \nquando o mesmo não era realizado em sua amplitude completa nas \nduas repetições(2). \nIdade cronológica e maturação sexual\nA idade cronológica foi expressa na sua forma milesimal conforme \nos procedimentos apresentados por Healy et al.(21). A maturação bioló-\ngica foi indicada através do método de análise das características sexu-\nais secundárias, sendo esta realizada pela análise do desenvolvimento \ngenital e da pilosidade pubiana na forma de autoavaliação mediante \no uso dos padrões fotográficos propostos por Tanner(22) e modificadas \npor Matsudo(23), e pela análise visual da pilosidade axilar.\nAnálise estatística\nA análise de normalidade da distribuição dos dados foi realizada por \nmeio do teste de Shapiro Wilk no qual a significância adotada foi de p \n≤ 0,05. Para a caracterização da amostra foi utilizada estatística descri -\ntiva (média, desvio padrão, mediana, mínimo e máximo). A associação \nentre as variáveis foi averiguada mediante o emprego do coeficiente \nde correlação de Spearman, a significância estatística estabelecida para \nas análises foi de p < 0,01; p ≤ 0,05. Para a realização das análises foi \nutilizado o programa SPSS 13.0. \nRESULTADOS\nNa tabela 1 são apresentadas as características gerais da amostra \nconstando idade cronológica, composição corporal e variáveis antro -\npométricas.\nA tabela 2 apresenta os valores médios e seus respectivos desvios \npadrão, as medianas e os valores mínimos e máximos quanto aos testes \nneuromotores.\nNa tabela 3 são apresentados os valores médios e seus desvios \npadrão, as medianas e os valores mínimos e máximos referentes aos \ntestes de 1RM de membros inferiores e superiores.\nTabela 1. Valores das médias (Md), desvios-padrão (Dp), medianas (Mda), bem como \nvalores mínimos e máximos das características gerais da amostra.\nTabela 2. Médias (Md), desvios-padrão (Dp), medianas (Mda), bem como valores \n","models":{"dsv4-flash":{"l5":"181Rev Bras Med Esporte – Vol. 17, N o 3 – Mai/Jun, 2011\n\nos movimentos com um peso inferior ao supostamente suportado, apenas para aprender a execução dos movimentos. Os exercícios foram compostos de três séries com 12 repetições, o intervalo de recuperação entre as séries e os exercícios foi de aproximadamente 90 segundos(2). \n\nA 1RM foi determinada tipicamente dentro de quatro a seis experimentações(9). Primeiramente, o avaliado realizava um aquecimento de seis a 10 repetições, com aproximadamente 50% de sua carga máxima estimada para a primeira tentativa no teste. Após o aquecimento, o sujeito tinha um intervalo de dois minutos e, em seguida, o avaliado iniciava o teste.\n\nOs sujeitos foram orientados a tentarem completar duas repetições. Caso fossem completadas duas repetições na primeira tentativa, ou mesmo se não fosse completada sequer uma repetição, uma segunda tentativa era oportunizada após um intervalo de recuperação de três a cinco minutos, com a carga superior (primeira possibilidade) ou inferior (segunda possibilidade) àquela utilizada na tentativa anterior. Este procedimento foi repetido novamente em uma terceira e última tentativa, caso ainda a carga de 1RM não tivesse sido determinada, sendo que o intervalo entre os exercícios foi de cinco minutos(2). Todos os procedimentos de teste foram supervisionados rigorosamente, e o incentivo uniforme foi oferecido a todos os sujeitos.\n\nPrimeiramente, foi executado o teste na cadeira extensora e em seguida na rosca direta de bíceps, sendo que a ordem de execução obedeceu ao tamanho do maior grupo muscular agonista envolvido. A forma e a técnica de execução foram padronizadas conforme Faigenbaum e Westcott (20). Um movimento mal sucedido era definido quando o mesmo não era realizado em sua amplitude completa nas duas repetições(2).\n\n**Idade cronológica e maturação sexual**\n\nA idade cronológica foi expressa na sua forma milesimal conforme os procedimentos apresentados por Healy et al.(21). A maturação biológica foi indicada através do método de análise das características sexuais secundárias, sendo esta realizada pela análise do desenvolvimento genital e da pilosidade pubiana na forma de autoavaliação mediante o uso dos padrões fotográficos propostos por Tanner(22) e modificadas por Matsudo(23), e pela análise visual da pilosidade axilar.\n\n**Análise estatística**\n\nA análise de normalidade da distribuição dos dados foi realizada por meio do teste de Shapiro Wilk no qual a significância adotada foi de p ≤ 0,05. Para a caracterização da amostra foi utilizada estatística descritiva (média, desvio padrão, mediana, mínimo e máximo). A associação entre as variáveis foi averiguada mediante o emprego do coeficiente de correlação de Spearman, a significância estatística estabelecida para as análises foi de p < 0,01; p ≤ 0,05. Para a realização das análises foi utilizado o programa SPSS 13.0.\n\n**RESULTADOS**\n\nNa tabela 1 são apresentadas as características gerais da amostra constando idade cronológica, composição corporal e variáveis antropométricas.\n\nA tabela 2 apresenta os valores médios e seus respectivos desvios padrão, as medianas e os valores mínimos e máximos quanto aos testes neuromotores.\n\nNa tabela 3 são apresentados os valores médios e seus desvios padrão, as medianas e os valores mínimos e máximos referentes aos testes de 1RM de membros inferiores e superiores.\n\nTabela 1. Valores das médias (Md), desvios-padrão (Dp), medianas (Mda), bem como valores mínimos e máximos das características gerais da amostra.\n\nTabela 2. Médias (Md), desvios-padrão (Dp), medianas (Mda), bem como valores"},"qwen3-235b-a22b":{"l5":"181Rev Bras Med Esporte – Vol. 17, N o 3 – Mai/Jun, 2011\n\nBefore diving into strength training, participants began with lighter weights—well below what they might eventually lift—to focus purely on mastering the correct movement patterns. This is a smart and safe strategy: you wouldn’t try to run a marathon before learning to walk, and the same logic applies here. By starting light, the body learns the proper mechanics of each exercise, reducing the risk of injury and building a strong foundation for future progress.\n\nEach exercise session consisted of **three sets of 12 repetitions**. Between sets and between different exercises, participants took a recovery break of about **90 seconds**. This rest period is carefully chosen—it’s long enough to allow some recovery of energy stores in the muscles, but short enough to maintain an effective training stimulus and keep the session efficient.\n\nNow, let’s talk about how researchers determined each participant’s **one-repetition maximum**, or **1RM**—the heaviest weight a person can lift just once with proper form. This is a gold standard in strength assessment because it gives a clear, measurable benchmark of muscular strength. To find this value, testers typically needed between **four and six attempts**. But they didn’t just jump in with heavy weights—that would be dangerous. Instead, they followed a careful, step-by-step process.\n\nFirst, the participant warmed up by performing **6 to 10 repetitions** using about **50% of their estimated maximum load**. Think of this like revving a car engine gently before driving fast—it prepares the muscles, tendons, and nervous system for heavier work. After this warm-up, they rested for **two minutes**, giving their body time to reset before the first real attempt.\n\nThen came the test itself. The participant tried to complete **two full repetitions** with a challenging (but not maximal) weight. Why two? Because it’s a practical way to estimate whether the load is close to their true 1RM without pushing to absolute failure on the first try.\n\nHere’s where the smart, adaptive testing protocol kicks in:\n\n- If the participant **successfully completed two reps**, the researchers knew the weight was too light. So, in the next attempt, they **increased the load**.\n- If the participant **failed to complete even one repetition**, the weight was too heavy, so they **decreased it** in the next try.\n\nBetween these attempts, participants rested for **3 to 5 minutes**—a longer break than between regular sets. This ensures that fatigue doesn’t unfairly influence performance, so the test measures true strength, not just tiredness.\n\nIf the 1RM wasn’t pinpointed after the second attempt, a **third and final attempt** was made, again adjusting the weight up or down based on performance, with a **five-minute rest** between exercises. This systematic, feedback-driven approach allows for a precise and safe estimation of maximum strength.\n\nAll testing was closely supervised, and every participant received the **same level of encouragement**. This is crucial in research—it keeps the conditions fair and consistent across all individuals, so differences in performance reflect real physiological differences, not variations in motivation or coaching.\n\nThe order of the strength tests mattered too. Participants were tested first on the **leg extension machine** (which works the quadriceps, a large muscle group), and then on the **barbell biceps curl** (which targets the smaller biceps). Why this order? Because larger muscle groups tend to require more energy and focus, and testing them first ensures they’re assessed when the body is freshest. It also reduces the chance that fatigue from arm exercises could indirectly affect leg performance through overall exhaustion.\n\nTo ensure consistency and fairness, the **technique for each exercise was standardized** using guidelines from Faigenbaum and Westcott—experts in youth resistance training. This means every participant performed the movements the same way, making the results more reliable and comparable.\n\nA repetition was considered **failed** if the participant couldn’t complete the full range of motion in **both** of the two attempted reps. This strict criterion ensures that strength is measured with proper form—no shortcuts or partial movements that could inflate results artificially.\n\n---\n\n**Idade cronológica e maturação sexual**  \n*(Chronological Age and Sexual Maturation)*\n\nChronological age was expressed in **decimal (milesimal) form**—meaning, for example, a child who is 12 years and 6 months old would be recorded as 12.5 years. This method, following Healy et al., allows for more precise statistical analysis than just using whole years.\n\nBut chronological age doesn’t tell the whole story—especially in young people. Two 13-year-olds can be at very different stages of physical development. That’s why researchers also assessed **biological maturation**, which reflects how far along a person is in puberty.\n\nThis was done using the **Tanner staging system**, a well-established method that classifies development based on secondary sexual characteristics. Participants self-assessed their **genital development** and **pubic hair growth** by comparing themselves to standardized photographic charts developed by Tanner and later adapted by Matsudo for the population in this study. Additionally, researchers visually assessed **underarm (axillary) hair** development.\n\nThese markers give a much clearer picture of a participant’s true biological stage—not just how old they are on paper, but how mature their body is. This is especially important in studies involving strength and physical performance, as a biologically more mature teenager can have significant advantages in muscle mass and power, regardless of their chronological age.\n\n---\n\n**Análise estatística**  \n*(Statistical Analysis)*\n\nBefore running any tests, researchers checked whether the data followed a **normal distribution**—a bell-shaped curve where most values cluster around the average. They used the **Shapiro-Wilk test** for this, which is particularly reliable for smaller sample sizes. If the p-value was **≤ 0.05**, the data were considered *not* normally distributed, meaning they had to use statistical methods that don’t assume normality.\n\nTo describe the sample, they used **descriptive statistics**: mean (average), standard deviation (how spread out the data are), median (middle value), and the minimum and maximum values. These give a clear snapshot of who was in the study and how they varied.\n\nTo explore relationships between variables—like whether greater muscle strength correlates with more advanced maturation—they used the **Spearman correlation coefficient**. This is a non-parametric test, meaning it works well with data that aren’t normally distributed. It measures the strength and direction of a monotonic relationship (whether one variable tends to increase as the other increases, even if not in a straight line).\n\nStatistical significance was set at **p < 0.01** and **p ≤ 0.05**—in other words, a finding was considered meaningful if there was less than a 1% or 5% chance it occurred by random chance.\n\nAll analyses were performed using **SPSS 13.0**, a widely used software package for statistical analysis in the social and health sciences.\n\n---\n\n**RESULTADOS**  \n*(RESULTS)*\n\nTable 1 presents the general characteristics of the sample, including chronological age, body composition, and anthropometric variables (like height, weight, and body dimensions). This table helps readers understand who the participants were—what age range, how much they weighed, and so on.\n\nTable 2 displays the mean and standard deviation, median, and minimum and maximum values for neuromotor tests. These tests likely assessed coordination, balance, speed, or agility—important components of overall physical fitness beyond just strength.\n\nTable 3 shows the average 1RM values (and their variability) for both lower-body and upper-body exercises, giving a direct look at the participants’ strength levels in the leg extension and biceps curl.\n\n**Tabela 1. Valores das médias (Md), desvios-padrão (Dp), medianas (Mda), bem como valores mínimos e máximos das características gerais da amostra.**  \n*(Table 1. Mean values (Md), standard deviations (Dp), medians (Mda), as well as minimum and maximum values of the general characteristics of the sample.)*\n\n**Tabela 2. Médias (Md), desvios-padrão (Dp), medianas (Mda), bem como valores**"}},"metadata":{"paper_id":"00581bc56be11db3739863721c8578e8","csv_row":71420,"doi":"10.1590/s1517-86922011000300006","openalex_id":"https://openalex.org/W1964408908","pdf_url":"https://www.scielo.br/j/rbme/a/FThxg5PzN83ckVjTPdTtpQf/?lang=pt&format=pdf","page_count":5,"text_chars":29539,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2384,"total_tokens":3288,"completion_tok
