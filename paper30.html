<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>论文 L5 双模型效果对比</title>
<link rel="stylesheet" href="assets/katex/katex.min.css">
<script src="assets/katex/katex.min.js"></script>
<script src="assets/katex/auto-render.min.js"></script>
<style>
:root{
  --paper:#eef0f4; --surface:#ffffff; --surface-2:#e7eaf0; --surface-3:#f6f7fa;
  --ink:#1b232f; --ink-soft:#586373; --ink-faint:#8b95a4;
  --line:#d7dbe4; --line-soft:#e6e9ef;
  --accent:#2c5fa8; --accent-2:#1f477f; --accent-soft:rgba(44,95,168,.12);
  --del-fg:#9e1b0f; --del-bg:rgba(196,45,32,.13); --del-line:rgba(196,45,32,.5);
  --insl4-fg:#186b34; --insl4-bg:rgba(24,120,58,.15);
  --insl5-bg:rgba(214,158,10,.30); --insl5-line:#c99500;
  --wait:#8a6d1e; --wait-bg:rgba(214,158,10,.12);
  --shadow:0 1px 2px rgba(20,30,48,.06),0 8px 24px rgba(20,30,48,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0e131a; --surface:#161d27; --surface-2:#1d2733; --surface-3:#131a23;
  --ink:#e6eaf1; --ink-soft:#9aa6b5; --ink-faint:#6b7686;
  --line:#28323f; --line-soft:#1f2833;
  --accent:#6ea0e8; --accent-2:#8fb8f0; --accent-soft:rgba(110,160,232,.16);
  --del-fg:#ff9d90; --del-bg:rgba(255,95,78,.16); --del-line:rgba(255,120,104,.55);
  --insl4-fg:#74d190; --insl4-bg:rgba(70,190,115,.17);
  --insl5-bg:rgba(238,190,70,.24); --insl5-line:#e6ba46;
  --wait:#e0c065; --wait-bg:rgba(224,180,60,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.32);
}}
:root[data-theme="light"]{
  --paper:#eef0f4; --surface:#ffffff; --surface-2:#e7eaf0; --surface-3:#f6f7fa;
  --ink:#1b232f; --ink-soft:#586373; --ink-faint:#8b95a4;
  --line:#d7dbe4; --line-soft:#e6e9ef;
  --accent:#2c5fa8; --accent-2:#1f477f; --accent-soft:rgba(44,95,168,.12);
  --del-fg:#9e1b0f; --del-bg:rgba(196,45,32,.13); --del-line:rgba(196,45,32,.5);
  --insl4-fg:#186b34; --insl4-bg:rgba(24,120,58,.15);
  --insl5-bg:rgba(214,158,10,.30); --insl5-line:#c99500;
  --wait:#8a6d1e; --wait-bg:rgba(214,158,10,.12);
  --shadow:0 1px 2px rgba(20,30,48,.06),0 8px 24px rgba(20,30,48,.06);
}
:root[data-theme="dark"]{
  --paper:#0e131a; --surface:#161d27; --surface-2:#1d2733; --surface-3:#131a23;
  --ink:#e6eaf1; --ink-soft:#9aa6b5; --ink-faint:#6b7686;
  --line:#28323f; --line-soft:#1f2833;
  --accent:#6ea0e8; --accent-2:#8fb8f0; --accent-soft:rgba(110,160,232,.16);
  --del-fg:#ff9d90; --del-bg:rgba(255,95,78,.16); --del-line:rgba(255,120,104,.55);
  --insl4-fg:#74d190; --insl4-bg:rgba(70,190,115,.17);
  --insl5-bg:rgba(238,190,70,.24); --insl5-line:#e6ba46;
  --wait:#e0c065; --wait-bg:rgba(224,180,60,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
::selection{background:var(--accent-soft)}

/* ---------- top masthead ---------- */
header.mast{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px clamp(14px,3vw,30px)}
.mast-row{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 420px}
.brand h1{font-family:var(--serif);font-weight:600;font-size:clamp(19px,2.4vw,25px);
  margin:0;letter-spacing:.2px;text-wrap:balance}
.brand h1 .pipe{color:var(--accent);font-style:italic}
.brand p{margin:0;color:var(--ink-soft);font-size:12.5px;max-width:74ch;line-height:1.45}
.brand p b{color:var(--ink);font-weight:600}
.brand p.tabnote{color:var(--accent-2);font-weight:500;font-size:12px}
.brand p.tabnote b{color:var(--accent-2)}
.mast-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-soft)}
.lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sw{width:13px;height:13px;border-radius:3px;flex:none}
.sw.d{background:var(--del-bg);border:1px solid var(--del-line)}
.sw.a{background:var(--insl4-bg);border:1px solid var(--insl4-fg)}
.sw.h{background:var(--insl5-bg);border:1px solid var(--insl5-line)}
.themebtn{font-family:var(--sans);font-size:12px;color:var(--ink-soft);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.themebtn:hover{border-color:var(--accent);color:var(--accent)}
.reportlink{font-family:var(--sans);font-size:12px;font-weight:650;color:#fff;background:var(--accent);
  border:1px solid var(--accent);border-radius:8px;padding:6px 11px;text-decoration:none;white-space:nowrap}
.reportlink:hover{background:var(--accent-2);border-color:var(--accent-2)}

/* ---------- top-level tabs ---------- */
.tabbar{display:inline-flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:4px;align-self:flex-start;max-width:100%;flex-wrap:wrap}
.tabbar button{font-family:var(--sans);font-size:13.5px;font-weight:600;border:0;background:none;
  color:var(--ink-soft);padding:8px 16px;border-radius:9px;cursor:pointer;
  display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.tabbar button:hover{color:var(--ink)}
.tabbar button .cnt{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink-faint);
  background:var(--surface-3);border-radius:5px;padding:1px 6px;font-variant-numeric:tabular-nums}
.tabbar button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabbar button.on .cnt{color:#fff;background:var(--accent)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:246px minmax(0,1fr);gap:0;align-items:start}
nav.rail{position:sticky;top:74px;align-self:start;height:calc(100vh - 74px);overflow-y:auto;
  border-right:1px solid var(--line);padding:12px 10px 40px;background:var(--surface-3)}
.rail-h{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
  font-weight:700;padding:6px 8px 8px}
.bk{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:baseline;width:100%;text-align:left;
  background:none;border:0;border-radius:9px;padding:7px 9px;cursor:pointer;color:var(--ink-soft);
  font-family:var(--sans);margin-bottom:1px;border:1px solid transparent}
.bk:hover{background:var(--surface-2);color:var(--ink)}
.bk.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 34%,transparent);color:var(--ink)}
.bk .n{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);text-align:right;
  font-variant-numeric:tabular-nums}
.bk.on .n{color:var(--accent-2)}
.bk .dm{font-size:13px;line-height:1.32;font-weight:500}
.bk .src{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk.hard .dm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  white-space:normal;line-height:1.24;font-size:12.5px}
.bk .railmeta{display:block;margin-top:5px}

/* ---------- domain badge ---------- */
.dombadge{--h:var(--accent);font-size:11px;font-weight:700;letter-spacing:.03em;border-radius:6px;
  padding:2px 8px;flex:none;display:inline-block;line-height:1.5;
  background:color-mix(in srgb,var(--h) 15%,var(--surface));
  color:color-mix(in srgb,var(--h) 58%,var(--ink));
  border:1px solid color-mix(in srgb,var(--h) 40%,transparent)}
.dombadge.sm{font-size:9.5px;padding:1px 6px;letter-spacing:.02em}

/* ---------- main ---------- */
main{padding:20px clamp(14px,2.6vw,30px) 90px;min-width:0}
.bookhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.bighash{font-family:var(--mono);font-size:15px;color:#fff;background:var(--accent);
  width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-weight:700;flex:none;
  box-shadow:var(--shadow)}
.bookhead .meta{display:flex;flex-direction:column;gap:5px;min-width:0}
.bookhead .domain{font-family:var(--serif);font-size:clamp(19px,2.3vw,24px);font-weight:600;line-height:1.15;text-wrap:balance}
.bookhead .booktitle{font-family:var(--serif);font-size:clamp(19px,2.3vw,25px);font-weight:600;
  line-height:1.18;text-wrap:balance;color:var(--ink)}
.bookhead .titlerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bookhead .src{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)}
.bookhead .srcmini{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.nav-arrows{margin-left:auto;display:flex;gap:6px}
.arrow{font-family:var(--sans);font-size:13px;background:var(--surface);border:1px solid var(--line);
  color:var(--ink-soft);border-radius:8px;padding:7px 12px;cursor:pointer}
.arrow:hover{border-color:var(--accent);color:var(--accent)}
.arrow:disabled{opacity:.4;cursor:default}

/* stage controls */
.stagebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.segctl{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.segctl button{font-family:var(--sans);font-size:12.5px;border:0;background:none;color:var(--ink-soft);
  padding:6px 13px;border-radius:7px;cursor:pointer;font-weight:500}
.segctl button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.stage-hint{font-size:11.5px;color:var(--ink-faint)}

/* original panel */
.orig{position:relative;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:12px;padding:15px 17px 16px;margin-bottom:18px;box-shadow:var(--shadow)}
.panel-tag{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent);margin-bottom:9px}
.panel-tag .step{font-family:var(--mono);background:var(--accent-soft);border-radius:5px;padding:1px 6px}
.guide-chip{margin-left:auto;font-family:var(--sans);text-transform:none;letter-spacing:0;font-weight:600;
  font-size:11.5px;color:var(--accent-2);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  border-radius:20px;padding:3px 11px;cursor:help;display:inline-flex;gap:5px;align-items:center}
.orig .body{font-family:var(--serif);font-size:14.5px;line-height:1.62;color:var(--ink);
  white-space:pre-wrap;word-break:break-word;max-height:230px;overflow:auto}
.orig.open .body{max-height:none}
.moretog{margin-top:8px;font-size:11.5px;color:var(--accent);background:none;border:0;cursor:pointer;font-family:var(--sans);padding:0}
/* hover / focus reveal of guide */
.guide-pop{position:absolute;top:46px;right:14px;left:14px;z-index:15;
  background:var(--surface-2);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  border-radius:11px;padding:12px 15px;box-shadow:var(--shadow);
  font-family:var(--sans);font-size:13.5px;line-height:1.6;color:var(--ink);
  opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .16s,transform .16s,visibility .16s}
.guide-pop b{color:var(--accent-2)}
.orig:hover .guide-pop,.guide-chip:focus + .guide-pop,.guide-pop:hover{opacity:1;visibility:visible;transform:translateY(0)}
@media (hover:none){.guide-pop{display:none}}

/* models strip */
.strip-wrap{overflow-x:auto;padding-bottom:8px;margin:0 -2px}
.strip{display:flex;gap:14px;align-items:stretch;min-width:min-content;padding:2px}
.mcard{flex:0 0 clamp(320px,30vw,400px);background:var(--surface);border:1px solid var(--line);
  border-radius:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.mcard-h{padding:11px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px;
  background:var(--surface-3)}
.mcard-h .mname{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;
  padding:2px 6px;flex:none}
.badge.base{color:var(--accent-2);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.badge.wait{color:var(--wait);background:var(--wait-bg);border:1px solid color-mix(in srgb,var(--insl5-line) 40%,transparent)}
.stage{border-top:1px solid var(--line-soft);display:flex;flex-direction:column}
.stage:first-child{border-top:0}
.stage-h{display:flex;align-items:center;gap:8px;padding:9px 14px 7px;font-size:11px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase}
.stage-h .step{font-family:var(--mono);border-radius:5px;padding:1px 6px;font-size:10px}
.stage.l4 .stage-h{color:var(--insl4-fg)}
.stage.l4 .stage-h .step{background:var(--insl4-bg)}
.stage.l5 .stage-h{color:var(--insl5-line)}
.stage.l5 .stage-h .step{background:var(--insl5-bg)}
.stat{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--ink-soft);
  letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.difftext{font-family:var(--serif);font-size:13.5px;line-height:1.6;color:var(--ink);
  white-space:pre-wrap;word-break:break-word;padding:2px 14px 14px;max-height:340px;overflow:auto}
.difftext.tall{max-height:620px}
del.df-del{text-decoration:none;background:var(--del-bg);color:var(--del-fg);border-radius:2px;
  text-decoration:line-through;text-decoration-color:var(--del-line);text-decoration-thickness:1.5px}
.stage.l5 del.df-del{background:transparent;color:var(--ink-faint);text-decoration-color:var(--del-line);opacity:.7}
.df-ins-l4{background:var(--insl4-bg);color:var(--insl4-fg);border-radius:2px}
.df-ins-l5{background:var(--insl5-bg);border-radius:2px;box-shadow:inset 0 -1px 0 var(--insl5-line)}
.calc{color:var(--ink-faint);font-family:var(--sans);font-size:12px;padding:6px 14px 14px}
.waitbox{padding:22px 14px 26px;text-align:center;color:var(--wait)}
.waitbox .big{font-family:var(--serif);font-size:16px;margin-bottom:4px}
.waitbox .sub{font-size:11.5px;color:var(--ink-soft)}
.stagewrap[data-mode="l4"] .stage.l5{display:none}
.stagewrap[data-mode="l5"] .stage.l4{display:none}

/* responsive rail -> top strip */
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav.rail{position:static;height:auto;max-height:none;border-right:0;border-bottom:1px solid var(--line);
    display:flex;gap:6px;overflow-x:auto;padding:10px}
  .rail-h{display:none}
  .bk{flex:0 0 auto;width:auto;grid-template-columns:auto;gap:2px;padding:6px 11px}
  .bk .n{text-align:left}.bk .src{display:none}.bk .railmeta{display:none}
  .bk .dm{white-space:nowrap;font-size:12.5px}
  .bk.hard .dm{-webkit-line-clamp:1;display:block;white-space:nowrap;max-width:38vw;
    overflow:hidden;text-overflow:ellipsis}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.tabbar,.reportlink,.guide-chip,.guide-pop{display:none!important}
.shell{grid-template-columns:300px minmax(0,1fr)}
header.mast{position:relative}
nav.rail{top:0;height:100vh}
.bk{grid-template-columns:28px minmax(0,1fr)}
.bk .dm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;overflow:hidden}
.bk .src{font-size:9.5px}
.strip{display:block;min-width:0}
.mcard{width:100%;max-width:none;flex:none}
.source-link{color:var(--accent);text-decoration:none}
.source-link:hover{text-decoration:underline}
@media(max-width:760px){.shell{grid-template-columns:1fr}nav.rail{height:auto}.strip{display:block;min-width:0}.mcard{width:100%}}

.tabbar,.reportlink,.guide-chip,.guide-pop{display:none!important}
.shell{grid-template-columns:300px minmax(0,1fr)}
header.mast{position:relative}
nav.rail{top:0;height:100vh}
.bk{grid-template-columns:28px minmax(0,1fr)}
.bk .dm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;overflow:hidden}
.bk .src{font-size:9.5px}
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;min-width:0}
.mcard{width:100%;max-width:none;flex:none}
.source-link{color:var(--accent);text-decoration:none}
.source-link:hover{text-decoration:underline}
.difftext .katex-display,.orig .katex-display{overflow-x:auto;overflow-y:hidden;padding:6px 0;margin:.6em 0}
.difftext .katex,.orig .katex{font-size:1em}
@media(max-width:1000px){.strip{grid-template-columns:1fr}}
@media(max-width:760px){.shell{grid-template-columns:1fr}nav.rail{height:auto}.mcard{width:100%}}
</style>
</head>
<body>
<header class="mast">
  <div class="mast-row">
    <div class="brand">
      <h1>论文洗数据管线 · <span class="pipe">L5</span> 双模型审阅台</h1>
      <p>数据＝<b>K202607100001 论文批次</b>，固定种子抽取 30 篇可公开读取的真实论文。每篇使用完全相同的正文段与 <b>L5 认知补全 Prompt</b>。模型＝<b>dsv4-flash vs qwen3-235b-a22b</b>。</p>
      <p class="tabnote">黄色＝L5 新增或改写，灰色删除线＝L5 删除。每条可由 CSV 行号、DOI 和公开 PDF 追溯。</p>
    </div>
    <div class="mast-tools">
      <div class="legend">
        <span class="lg"><span class="sw h"></span>L5 新增 / 改写</span>
      </div>
      <button class="themebtn" id="themebtn" type="button"><span id="themeicon">◐</span><span id="themelabel">主题</span></button>
    </div>
  </div>
</header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="论文导航"><div class="rail-h">论文样本 · 30 篇</div></nav>

sed in\nboth the Orsay virus [ rde-1] and the Santeuil virus\n[JU1264] conditions while clec-7 was repressed in Orsay\nvirus [ rde-1] and induced in Santeuil virus [JU1264]. In\ntotal, there were 58 DEGs in the conserved response to viral\ninfection. 29 C. elegans genes were induced in both N2 and\nrde-1 and had corresponding C. briggsae orthologs induced\nfollowing Santeuil infection. These, included 14C17H1 fam-\nily genes, four DUF713 domain genes, a gene in the RNAi\npathway: C04F12.1, and a gene downstream of daf-16: dod-\n23. The remaining 9 genes have no known functions. There\nwere two C. elegans DEGs in N2 (but not in rde-1)w h o s e\northologs in C. briggsae were also DEGs. These were\nF14F9.3, a zinc finger (C6HC-type) domain gene and\nZK177.8, the human ortholog of which is SAMHD1, an\nantiviral gene against human immunodeficiency virus 1 [35].\nFinally, there were 27C. elegans DEGs in rde-1 (but not N2)\nwith correspondingC. briggsae DEGs. Six were immune re-\nlated genes, four were zinc finger (C6HC-type) domain\nTable 2 Gene Ontology (GO), InterPRO term enriched from C. elegans genes differentially expressed upon Orsay virus or N. parisii\ninfection\nCondition Go term, InterPRO classification Human ortholog Functional annotations Gene count FDR\nOrsay virus [N2] IPR026674:ALS2CR12 protein ( C17H1 family) Yes N/A 24 6.9E-32\nIPR002900:DUF38 No F-box associated 13 6.6E-09\nIPR007883:DUF713 No N/A 5 1.4E-06\nIPR002083:MATH Yes MATH 8 1.3E-06\nOrsay virus [ rde-1] IPR026674:ALS2CR12 protein ( C17H1 family) Yes N/A 25 2.3E-25\nGO:0045087:Innate immune response N/A Innate immunity 23 6.2E-13\nIPR002083:MATH Yes MATH 14 3.1E-09","models":{"dsv4-flash":{"l5":"Because the reference strain AF16 does not support Santeuil virus replication in our hands, we used the wild *C. briggsae* isolate JU1264, which we had previously demonstrated to be susceptible to Santeuil virus infection [18]. In *C. briggsae*, there were 258 DEGs following infection by Santeuil virus (edgeR, n = 3, FDR < 0.05, Additional file 2). Of the Santeuil virus DEGs, 37 were down-regulated and 221 were up-regulated. On a technical note, JU1264 sequence reads were mapped to the closely related AF16 reference transcriptome; strain-specific sequence differences may lead to incomplete mapping to some genes and thus a potential under-estimate of the DEGs.\n\nTo confirm the RNA-seq results, we used qRT-PCR of an independent Santeuil virus infection of JU1264 to evaluate transcript levels of two up-regulated genes: CBG03198, a gene with *C. elegans* orthologs that were also up-regulated, and CBG06596, an ortholog of the C17H1 family in *C. briggsae*. The two genes yielded similar results between transcriptional profiling and qRT-PCR (Additional file 6).\n\nApproximately 60% of all genes in *C. briggsae* have well-defined orthologs in *C. elegans* [34]. We further compared the DEGs in *C. elegans* to their orthologous genes in *C. briggsae*. Of the 320 genes identified as differentially expressed in either N2 or *rde-1* or both (union of N2 and *rde-1* viral infection induced DEGs), 197 have orthologs in *C. briggsae*. 59 of these had *C. briggsae* orthologs that were also differentially expressed following Santeuil infection (Fig. 3, Additional file 7). The majority (57 of 59) of the DEGs were up-regulated in both species. One gene, *hmit-1.1*, was repressed in both the Orsay virus [*rde-1*] and the Santeuil virus [JU1264] conditions while *clec-7* was repressed in Orsay virus [*rde-1*] and induced in Santeuil virus [JU1264]. In total, there were 58 DEGs in the conserved response to viral infection. 29 *C. elegans* genes were induced in both N2 and *rde-1* and had corresponding *C. briggsae* orthologs induced following Santeuil infection. These included 14 C17H1 family genes, four DUF713 domain genes, a gene in the RNAi pathway: C04F12.1, and a gene downstream of *daf-16*: *dod-23*. The remaining 9 genes have no known functions. There were two *C. elegans* DEGs in N2 (but not in *rde-1*) whose orthologs in *C. briggsae* were also DEGs. These were *F14F9.3*, a zinc finger (C6HC-type) domain gene and *ZK177.8*, the human ortholog of which is SAMHD1, an antiviral gene against human immunodeficiency virus 1 [35]. Finally, there were 27 *C. elegans* DEGs in *rde-1* (but not N2) with corresponding *C. briggsae* DEGs. Six were immune related genes, four were zinc finger (C6HC-type) domain\n\nTable 2 Gene Ontology (GO), InterPRO term enriched from *C. elegans* genes differentially expressed upon Orsay virus or *N. parisii* infection\n| Condition | GO term, InterPRO classification | Human ortholog | Functional annotations | Gene count | FDR |\n|---|---|---|---|---|---|\n| Orsay virus [N2] | IPR026674:ALS2CR12 protein (C17H1 family) | Yes | N/A | 24 | 6.9E-32 |\n| | IPR002900:DUF38 | No | F-box associated | 13 | 6.6E-09 |\n| | IPR007883:DUF713 | No | N/A | 5 | 1.4E-06 |\n| | IPR002083:MATH | Yes | MATH | 8 | 1.3E-06 |\n| Orsay virus [*rde-1*] | IPR026674:ALS2CR12 protein (C17H1 family) | Yes | N/A | 25 | 2.3E-25 |\n| | GO:0045087:Innate immune response | N/A | Innate immunity | 23 | 6.2E-13 |\n| | IPR002083:MATH | Yes | MATH | 14 | 3.1E-09 |"},"qwen3-235b-a22b":{"l5":"## Viral Susceptibility and Transcriptomic Response in *C. briggsae*\n\nSince the reference strain AF16 of *Caenorhabditis briggsae* does not support replication of the Santeuil virus under our experimental conditions, we turned to a wild isolate—JU1264—which we had previously shown to be susceptible to Santeuil virus infection [18]. This switch was essential to study the host response to the virus in a biologically relevant context. Using JU1264, we performed RNA sequencing (RNA-seq) to identify changes in gene expression following Santeuil virus infection.\n\nWe identified 258 differentially expressed genes (DEGs) in *C. briggsae* after Santeuil virus infection (using edgeR, with n = 3 biological replicates, and a false discovery rate [FDR] < 0.05; see Additional file 2). Of these, the vast majority—221 genes—were up-regulated, meaning their expression increased in response to the virus. Only 37 genes were down-regulated, indicating reduced expression. This strong bias toward up-regulation suggests that the host is mounting an active transcriptional response, likely involving defense mechanisms or stress pathways.\n\nNow, a quick but important technical note: when analyzing the RNA-seq data from JU1264, we mapped the sequence reads to the AF16 reference transcriptome. Why? Because AF16 is the best-annotated *C. briggsae* reference genome, even though JU1264 is a different wild strain. While AF16 and JU1264 are closely related, they still have genetic differences. Some sequence variants in JU1264 may not align perfectly to the AF16 reference, especially in regions with high divergence. This means that reads from certain genes in JU1264 might not map at all or might map poorly, leading to incomplete detection of expression changes. As a result, our list of DEGs could be an underestimate—some real changes in gene expression might have been missed due to this mapping limitation. It’s a common challenge in comparative genomics when working with non-reference isolates.\n\nTo validate our RNA-seq findings, we used an independent method: quantitative reverse transcription PCR (qRT-PCR). This technique allows us to measure the expression levels of specific genes with high sensitivity and accuracy. We selected two up-regulated genes for validation:\n\n- **CBG03198**: This gene has orthologs (evolutionarily related genes) in *C. elegans* that were also up-regulated during viral infection, suggesting a potentially conserved role in antiviral defense.\n- **CBG06596**: This is an ortholog of the *C17H1* gene family in *C. briggsae*, a group we’ll see again as a recurring player in antiviral responses.\n\nThe qRT-PCR results from an independent infection experiment matched the RNA-seq data closely—both genes showed increased expression, confirming the reliability of our transcriptomic profiling (see Additional file 6). This cross-validation strengthens our confidence that the observed changes are real and reproducible.\n\nNow, let’s zoom out and ask a bigger question: Are the host responses to viral infection similar across related species? To explore this, we compared the transcriptional response in *C. briggsae* to what we know from its well-studied cousin, *Caenorhabditis elegans*. About 60% of genes in *C. briggsae* have clear orthologs in *C. elegans* [34], making such comparisons meaningful.\n\nWe focused on the set of 320 genes in *C. elegans* that were differentially expressed upon Orsay virus infection—either in the wild-type N2 strain, the *rde-1* mutant strain, or both (this is called the \"union\" of DEGs from both conditions). From this list, 197 genes have identifiable orthologs in *C. briggsae*. Among these 197, we found that **59** had orthologs in *C. briggsae* that were also differentially expressed after Santeuil virus infection (see Fig. 3 and Additional file 7). This overlap suggests a core, evolutionarily conserved transcriptional response to viral infection.\n\nLet’s unpack that number: of these 59 shared DEGs, **57 were up-regulated in both species**. This striking consistency implies that many aspects of the antiviral response have been preserved through evolution. Only two genes showed divergent regulation:\n\n- **hmit-1.1**: This gene was *repressed* (down-regulated) in both contexts—during Orsay virus infection in *C. elegans* (*rde-1* background) and during Santeuil virus infection in *C. briggsae* (JU1264). Its consistent down-regulation might indicate a role that viruses exploit, or perhaps it’s part of a metabolic shift during infection.\n- **clec-7**: This gene showed opposite responses. It was repressed during Orsay virus infection in *C. elegans* but *induced* (up-regulated) during Santeuil virus infection in *C. briggsae*. This kind of divergence can happen when genes evolve new regulatory roles in different species or in response to different viruses.\n\nIn total, we define **58 genes** as part of a **conserved transcriptional response to viral infection**—those that are differentially expressed in both species in the same direction (mostly up-regulated). Let’s look more closely at the subgroups within this conserved set.\n\nFirst, there are **29 genes** in *C. elegans* that were induced (up-regulated) in *both* N2 and *rde-1* mutants upon Orsay virus infection—meaning their induction doesn’t depend on the RNA interference (RNAi) pathway, since *rde-1* is essential for RNAi. These 29 genes have orthologs in *C. briggsae* that were also up-regulated after Santeuil infection. This independence from RNAi suggests these genes are part of a broader, perhaps more ancient, antiviral defense system.\n\nAmong these 29 are several notable gene families and individual genes:\n\n- **14 members of the C17H1 family**: These are highlighted in our data as strongly induced across conditions. We’ll see shortly that they are enriched in functional analyses, suggesting a central role in antiviral defense.\n- **Four genes with DUF713 domains**: DUF stands for \"Domain of Unknown Function,\" but their consistent up-regulation hints at an important, yet still mysterious, role in infection response.\n- **C04F12.1**: This gene is part of the RNAi pathway itself, which is fascinating—it’s induced even in an *rde-1* mutant, suggesting feedback or compensatory regulation within the pathway.\n- **dod-23**: This gene lies downstream of *daf-16*, a key transcription factor in stress response and longevity. Its induction links viral infection to broader stress and survival pathways.\n\nThe remaining 9 of these 29 genes currently have no known function—black boxes in our understanding. Their conservation and strong induction make them compelling candidates for future study; they might represent novel antiviral effectors.\n\nNext, we found **2 genes** that were induced in *C. elegans* N2 (wild-type) but *not* in the *rde-1* mutant—meaning their induction depends on a functional RNAi pathway. Their orthologs in *C. briggsae* were also differentially expressed after Santeuil infection. These are:\n\n- **F14F9.3**: A gene containing a zinc finger domain of the C6HC type. Zinc finger domains often bind RNA or DNA and are involved in gene regulation. Their involvement here suggests a role in orchestrating the transcriptional response.\n- **ZK177.8**: This gene has a human ortholog called **SAMHD1**, which is a well-known antiviral protein that inhibits replication of HIV-1 by depleting cellular nucleotide pools [35]. Finding this gene in our list is exciting—it suggests that even in nematodes, some antiviral mechanisms are shared with mammals, pointing to deeply conserved defense strategies.\n\nFinally, there were **27 genes** in *C. elegans* that were differentially expressed only in the *rde-1* mutant (not in N2), and whose orthologs in *C. briggsae* were also DEGs. This set may represent genes that are normally suppressed by the RNAi pathway or are part of a compensatory response when RNAi is defective. Among these:\n\n- **6 are immune-related genes**\n- **4 contain zinc finger (C6HC-type) domains**\n\nThese findings suggest that when the primary RNAi defense is compromised, the host activates alternative immune mechanisms, some of which are conserved in *C. briggsae*.\n\n---\n\n### Table 2: Gene Ontology (GO) and InterPRO Term Enrichment in *C. elegans* Genes Differentially Expressed Upon Orsay Virus or *N. parisii* Infection\n\n| Condition | GO Term / InterPRO Classification | Human Ortholog | Functional Annotations | Gene Count | FDR |\n|---------|-----------------------------------|---------------|------------------------|------------|-----|\n| Orsay virus [N2] | IPR026674: ALS2CR12 protein (C17H1 family) | Yes | N/A | 24 | 6.9E-32 |\n|  | IPR002900: DUF38 | No | F-box associated | 13 | 6.6E-09 |\n|  | IPR007883: DUF713 | No | N/A | 5 | 1.4E-06 |\n|  | IPR002083: MATH | Yes | MATH | 8 | 1.3E-06 |\n| Orsay virus [rde-1] | IPR026674: ALS2CR12 protein (C17H1 family) | Yes | N/A | 25 | 2.3E-25 |\n|  | GO:0045087: Innate immune response | N/A | Innate immunity | 23 | 6.2E-13 |\n|  | IPR002083: MATH | Yes | MATH | 14 | 3."}},"metadata":{"paper_id":"002c7fef26c0a4f0c9969641fbafdb16","csv_row":34096,"doi":"10.1186/s12864-017-3689-3","openalex_id":"https://openalex.org/W2607105604","pdf_url":"https://bmcgenomics.biomedcentral.com/track/pdf/10.1186/s12864-017-3689-3","page_count":10,"text_chars":50008,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2384,"total_tokens":3375,"completion_tokens":991,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2245,"total_tokens":3296,"completion_tokens":1051,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":4.382439374923706,"l5_seconds":5.260527610778809}},{"idx":2,"domain":"Academic paper","source":"CSV row 36961 · 2019 · 10.1186/s12909-019-1482-5","title":"A randomized controlled trial of suicide prevention training for primary care providers: a study protocol","seg":"interactions are the same and no more than one hour in\nduration, including: orientation to the procedures and the\nSP scenario backstory, up to 30 min for the SP interaction,\n8 min for SP feedback for the participant, and 5 to 10 min\nfor debrief procedures. Upon arrival to the interaction, par-\nticipants are introduced to the procedures and are given a\nbrief written backstory about the SP scenario. Backstories\nprovide context for the provider and include details about\nthe patient’s name, age, the nature of the patient-provider\nrelationship, some medical and social history and the rea-\nson for this visit (“trouble sleeping”). Telehealth participants\nalso receive instructions abou t remote access. Participants\nare instructed to assess the patient ’s risk for suicidality and\nprovide appropriate interventions within a 30-min time-\nframe (a timer signals the appointment end). After the\ninteraction, participants exit the room for 10 min during\nwhich time the SP prepares immediate feedback (positive\nand constructive) for the patient. SPs are highly trained to\nprepare and deliver tailored feedback using a 15-item“feed-\nback matrix” template of criteria for identifying appropriate\nfeedback items. Feedback includes specific competency\nitems with explanations and rationale for the importance of\nthe skill. The participant joins the SP for 8 min to receive\nfeedback, discuss the interaction and ask questions. After-\nwards, the participant returns to the facilitator for 5 to 10\nmin of debrief procedures. Dur ing this time, participants\nare provided the opportunity t o speak with a psychologist\nfor further debriefing if needed.\nAll interactions are recorded, securely stored and sub-\nsequently coded for observed suicide prevention skills. A\nportion (at least 20%) of recorded interactions are\ndouble coded for inter-rater reliability. Consensus\nmeetings are conducted and discrepancies are resolved\nthrough discussion. Additionally, the videos are coded\nfor SPs fidelity to the scenario and feedback procedures.\nTo avoid drift in standardized procedures, SPs receive\nwritten feedback on fidelity to the character and feed-\nback delivery.\nAfter the SP test case at approximately 6-month\nfollow-up, all participants complete a final survey includ-\ning: knowledge and self-efficacy measures, retrospective\nself-report of transfer of training, intentions to use the\nsuicide prevention training in future practice,\nself-reported use of suicide prevention skills since the\nonline teaching program, and satisfaction with various\naspects of the training.\nMeasures\nSelf-report measures\nDemographics All participants complete a survey of\nindividual characteristics and demographics, including\ntraining program (residency, NP), gender, age, previous\nsuicide prevention training, previous experience with SP\nprocedures, and prior experience (professionally and\npersonally) with suicide. These data will be examined to\ndetermine any differences between those who consent\nfor study participation and those who do not, and be\nused for analytic purposes.\nKnowledge of suicide and suicide prevention Partici-\npants complete a 17-item multiple choice knowledge as-\nsessment before and after viewing online teaching videos\nand again at 6-month follow-up. The measure assesses\nknowledge of suicide risk assessment and management\nas covered in the online teaching program (e.g., “Which\nof the following best describes risk for suicide? ”). A\nmeasure of knowledge has been used in published\nassessments of the CTL training curriculum [ 27] with\ngood internal consistency (Cronbach ’s α =.81–.87) and\nsensitivity to change (Cohen ’s d =.90 – 1.35). For the pur-\nposes of the current study modifications will be made to\nthe measure.\nSuicide prevention self-efficacy Participants complete\na 20-item measure of self-efficacy at pre- and\npost-online teaching and again at 6-month follow-up.\nThe measure uses an 8-point Likert scale (ranging from\n“strongly disagree ” to “strongly agree ”) to assess trainees ’\nself-efficacy regarding suicide risk assessment, treatment,\nand documentation (e.g., “I feel confident that I can ask\ndirectly about suicide, ”“ I feel confident in my know-\nledge about the key elements of a safety plan. ”) The ori-\nginal CTL self-efficacy measure [ 27] has acceptable\ninternal consistency (Cronbach ’s α =.95–.96) and suffi-\ncient sensitivity to change over time (Cohen ’s d = 1.05 –\n1.15); modifications will be made for the current study.\nTransfer of training We also assess participants ’ per-\nception that they will transfer what they learned in the\nonline program into clinical practice using an 8-item\nmeasure modified from three subscales (transfer design,\nperceived content validity, opportunity to use) of the\nLearning Transfer System Inventory [ 28]. The","models":{"dsv4-flash":{"l5":"interactions are the same and no more than one hour in\nduration, including: orientation to the procedures and the\nSP scenario backstory, up to 30 min for the SP interaction,\n8 min for SP feedback for the participant, and 5 to 10 min\nfor debrief procedures. \n\nLet’s pause and unpack that timeline, because it’s the backbone of the entire study design. The researchers have carefully budgeted every minute of the encounter. Why? Because they want to ensure that every participant—whether they are in the telehealth or in-person condition—has exactly the same experience. This is what scientists call *standardization*: if you want to compare two groups fairly, you must hold everything constant except the one thing you’re testing (in this case, the delivery mode). So, the total interaction is capped at one hour, and within that hour, the structure is fixed: a brief orientation to get the participant comfortable and informed, a 30-minute window for the actual clinical interaction (the heart of the exercise), an 8-minute feedback session where the standardized patient (SP) shares their observations, and a final 5–10 minute debrief with the facilitator. \n\nUpon arrival to the interaction, participants are introduced to the procedures and are given a brief written backstory about the SP scenario. Backstories provide context for the provider and include details about the patient’s name, age, the nature of the patient-provider relationship, some medical and social history and the reason for this visit (“trouble sleeping”). \n\nHere, the backstory is not just a nice-to-have; it’s a deliberate tool. Think of it as a script for the opening scene of a play. The participant (the provider) needs to know who they are walking in to see, what the patient’s history is, and why the patient is here. The reason for the visit is given as “trouble sleeping,” which is a classic presenting complaint that can mask a deeper issue—like suicidality. This is a clever design choice: it forces the participant to look beyond the surface and practice their clinical interviewing skills to uncover what’s really going on.\n\nTelehealth participants also receive instructions about remote access. \n\nThis is a small but vital detail. If you’re doing the interaction over video, you need to know how to log in, how to adjust your camera, and how to troubleshoot technical issues. The researchers are making sure that the technology doesn’t become a confounding variable—that is, they don’t want a participant’s performance to be affected by a bad internet connection or confusion about the software. They want the only difference between groups to be the *mode* of interaction, not the *quality* of the experience.\n\nParticipants are instructed to assess the patient’s risk for suicidality and provide appropriate interventions within a 30-minute timeframe (a timer signals the appointment end). \n\nThis is the heart of the test. The participant is given a clear, measurable goal: assess the risk, and then act on that assessment. The 30-minute limit is a pressure test. In real clinical practice, you don’t have unlimited time with a patient, so this constraint mimics the real-world urgency. The timer is a silent but powerful presence—it forces the participant to prioritize, to be efficient, and to make sure they hit the key points of a suicide risk assessment (e.g., asking directly about suicidal thoughts, assessing intent and plan, and creating a safety plan if needed).\n\nAfter the interaction, participants exit the room for 10 min during which time the SP prepares immediate feedback (positive and constructive) for the patient. \n\nNotice the careful choreography here. The participant leaves, giving the SP a quiet, uninterrupted window to collect their thoughts. This is not a casual chat; it’s a structured feedback session. The SP is not just an actor; they are also an evaluator, trained to observe specific behaviors and to report back on them.\n\nSPs are highly trained to prepare and deliver tailored feedback using a 15-item “feedback matrix” template of criteria for identifying appropriate feedback items. \n\nThis matrix is a checklist of competencies. It’s like a rubric for a performance review. The SP uses it to ensure that their feedback is not vague (“you did well”) but specific and tied to the skills that the training program is designed to teach. For example, the matrix might include items like “asked about suicidal ideation directly” or “provided a safety plan.” This ensures that the feedback is consistent across all participants, regardless of which SP they interacted with.\n\nFeedback includes specific competency items with explanations and rationale for the importance of the skill. \n\nThis is a key pedagogical point: feedback is not just about *what* you did, but *why* it matters. The SP explains, for instance, “You asked if the patient had a plan, which is crucial because it helps you gauge the immediacy of the risk.” This helps the participant understand the underlying clinical reasoning, not just memorize a checklist.\n\nThe participant joins the SP for 8 min to receive feedback, discuss the interaction and ask questions. This is a two-way conversation. The participant can ask, “Why did you respond that way when I asked about your sleep?” This is a powerful learning moment, because it allows the participant to see the interaction from the patient’s perspective.\n\nAfterwards, the participant returns to the facilitator for 5 to 10 min of debrief procedures. During this time, participants are provided the opportunity to speak with a psychologist for further debriefing if needed. \n\nThis is a safety net. The study deals with a heavy topic—suicide—and the researchers are ethically obligated to ensure that participants are not emotionally distressed by the experience. The debrief is a chance to process the experience, and the offer of a psychologist is a proactive measure to support the participant’s well-being.\n\nAll interactions are recorded, securely stored and subsequently coded for observed suicide prevention skills. \n\nThis is where the data comes from. The recordings are not just for the participants’ benefit; they are the raw material for the study’s analysis. “Coding” means that trained raters will watch the videos and systematically score the participants’ performance against a predefined set of criteria. This is how the researchers can objectively measure whether the training worked.\n\nA portion (at least 20%) of recorded interactions are double coded for inter-rater reliability. \n\nWhy double code? Because coding is subjective. Two different raters might see the same interaction and score it differently. By having two raters independently code the same video, the researchers can measure how much agreement there is. If they agree highly, they can be confident that the coding scheme is reliable and that the results are not just a product of one person’s opinion.\n\nConsensus meetings are conducted and discrepancies are resolved through discussion. When the two raters disagree, they don’t just flip a coin. They meet, discuss their reasoning, and come to a consensus. This is a quality-control step that ensures the final data is as accurate and fair as possible.\n\nAdditionally, the videos are coded for SPs fidelity to the scenario and feedback procedures. \n\nThis is a check on the SPs themselves. The researchers need to make sure that the SPs are consistently playing their role and delivering feedback in the same way. If one SP is more aggressive or more lenient, it could skew the results. This fidelity check ensures that the SPs are performing their roles as intended.\n\nTo avoid drift in standardized procedures, SPs receive written feedback on fidelity to the character and feedback delivery. \n\n“Drift” is a subtle but real problem. Over time, even the best SPs might start to improvise or change their performance. The written feedback is a corrective measure, a reminder of the standards they need to maintain.\n\nAfter the SP test case at approximately 6-month follow-up, all participants complete a final survey including: knowledge and self-efficacy measures, retrospective self-report of transfer of training, intentions to use the suicide prevention training in future practice, self-reported use of suicide prevention skills since the online teaching program, and satisfaction with various aspects of the training.\n\nThis is the long-term measurement. The researchers aren’t just interested in whether the training works immediately; they want to know if it sticks. The 6-month follow-up is a critical time point to see if the skills have been retained and, more importantly, if they have been applied in real clinical practice. The “retrospective self-report of transfer of training” is a clever way to ask, “Looking back, do you think you used what you learned?” This is a measure of the training’s real-world impact.\n\nMeasures\n\nNow we move from the study design to the specific tools used to measure the outcomes. This is the “how” of the data collection.\n\nSelf-report measures\n\nDemographics: All participants complete a survey of individual characteristics and demographics, including training program (residency, NP), gender, age, previous suicide prevention training, previous experience with SP procedures, and prior experience (professionally and personally) with suicide. \n\nWhy collect all this? Because these are potential “confounding variables.” For example, if a participant has had a personal experience with suicide, they might be more sensitive to the topic and perform differently on the assessment. By collecting this data, the researchers can statistically control for these differences, or they can check to see if their groups are balanced on these characteristics.\n\nThese data will be examined to determine any differences between those who consent for study participation and those who do not, and be used for analytic purposes. This is a check on selection bias. If the people who agree to participate are different from those who don’t, the results might not be generalizable to the entire population of trainees.\n\nKnowledge of suicide and suicide prevention: Participants complete a 17-item multiple choice knowledge assessment before and after viewing online teaching videos and again at 6-month follow-up. \n\nThis is a classic pre-test/post-test design. By measuring knowledge at three time points, the researchers can see the immediate effect of the training (comparing pre- and post-video scores) and the long-term retention (comparing post-video and 6-month scores).\n\nThe measure assesses knowledge of suicide risk assessment and management as covered in the online teaching program (e.g., “Which of the following best describes risk for suicide?”). \n\nThis is a direct test of the content taught in the videos. The question is designed to be a straightforward check of factual recall.\n\nA measure of knowledge has been used in published assessments of the CTL training curriculum [27] with good internal consistency (Cronbach’s α = .81–.87) and sensitivity to change (Cohen’s d = .90–1.35). \n\nLet’s decode these statistics. Cronbach’s α is a measure of internal consistency—how well the items on the test hang together. A value above .80 is generally considered good. Cohen’s d is a measure of effect size—how much the scores change. A d of .90–1.35 is a very large effect, meaning the training has a substantial impact on knowledge. This tells us that the measure is a reliable and sensitive tool.\n\nFor the purposes of the current study, modifications will be made to the measure. This is a common practice. The researchers are adapting a validated tool to fit their specific context, which is more rigorous than creating a new measure from scratch.\n\nSuicide prevention self-efficacy: Participants complete a 20-item measure of self-efficacy at pre- and post-online teaching and again at 6-month follow-up. \n\nSelf-efficacy is a person’s belief in their own ability to perform a task. It’s a powerful predictor of whether they will actually do the task in the real world. This measure is assessing the participants’ confidence in their clinical skills.\n\nThe measure uses an 8-point Likert scale (ranging from “strongly disagree” to “strongly agree”) to assess trainees’ self-efficacy regarding suicide risk assessment, treatment, and documentation (e.g., “I feel confident that I can ask directly about suicide,” “I feel confident in my knowledge about the key elements of a safety plan.”). \n\nThe Likert scale is a common survey format. The 8-point scale is a bit unusual—many scales use 5 or 7 points—but it forces the respondent to take a side, as there is no neutral “middle” option. The examples given are excellent: they are specific, actionable skills, not vague statements.\n\nThe original CTL self-efficacy measure [27] has acceptable internal consistency (Cronbach’s α = .95–.96) and sufficient sensitivity to change over time (Cohen’s d = 1.05–1.15); modifications will be made for the current study. \n\nAgain, we see the same pattern: a validated measure with excellent psychometric properties, which will be adapted for this study.\n\nTransfer of training: We also assess participants’ perception that they will transfer what they learned in the online program into clinical practice using an 8-item measure modified from three subscales (transfer design, perceived content validity, opportunity to use) of the Learning Transfer System Inventory [28]. The"},"qwen3-235b-a22b":{"l5":"interactions are the same and no more than one hour in duration, including: orientation to the procedures and the SP scenario backstory, up to 30 minutes for the SP interaction, 8 minutes for SP feedback for the participant, and 5 to 10 minutes for debrief procedures.  \n\nUpon arrival, participants are guided through the session structure and given a brief written backstory about the standardized patient (SP) scenario. Think of this backstory like a script for a short play—each participant is stepping into the role of a clinician meeting a patient for the first time, and the backstory sets the stage. It includes key details such as the patient’s name, age, medical and social history, the nature of the patient-provider relationship, and the reason for the visit—in this case, “trouble sleeping.” This context is essential because it helps the participant approach the interaction realistically, just as they would in a real clinical setting. For those participating via telehealth, additional instructions are provided on how to access the session remotely, ensuring the technology doesn’t become a barrier to engagement.\n\nThe core task for the participant is clear: assess the patient’s risk for suicidality and provide appropriate interventions—all within a strict 30-minute window. A timer is used to signal the end of the appointment, simulating the time pressures often present in real-world clinical environments. This time limit isn’t arbitrary; it’s designed to train clinicians to gather critical information efficiently and make sound clinical judgments under realistic constraints.\n\nAfter the interaction, the participant leaves the room for about 10 minutes. During this time, the SP—highly trained in both acting and clinical feedback—prepares personalized, immediate feedback. This isn’t generic praise or criticism; it’s structured and targeted. The SP uses a 15-item “feedback matrix” template, which serves as a checklist of key competencies related to suicide risk assessment and communication skills. For example, did the participant ask directly about suicidal thoughts? Did they respond with empathy when the patient expressed distress? Each item on the matrix helps the SP identify specific strengths and areas for improvement.\n\nWhen the participant returns, they spend 8 minutes receiving this feedback directly from the SP. This is a powerful learning moment. Because the SP has just experienced the interaction from the patient’s perspective, they can offer unique insights: not just *what* the participant did, but *how it felt* to receive it. The feedback includes clear explanations and the rationale behind each skill—why, for instance, directly asking about suicide doesn’t increase risk but actually builds trust. Participants are encouraged to ask questions, reflect on their performance, and discuss alternative approaches.\n\nFollowing the feedback session, the participant meets with a facilitator for a 5- to 10-minute debrief. This step ensures psychological safety. While the SP provides clinical and communication feedback, the facilitator offers a supportive space to process the emotional weight of the interaction. Participants are given the opportunity to speak with a psychologist during this time if they feel distressed—a crucial safeguard, especially when dealing with emotionally intense scenarios like suicide risk assessment.\n\nAll interactions are recorded and stored securely. Later, trained coders review the videos to objectively assess the participant’s use of suicide prevention skills. This isn’t just about checking boxes; it’s about measuring real behavioral change. To ensure accuracy and consistency in coding, at least 20% of the videos are double-coded by independent raters. If there’s a disagreement between coders, a consensus meeting is held to resolve the discrepancy through discussion. This process strengthens the reliability of the data and ensures that the evaluation of skills is as fair and objective as possible.\n\nIn addition to assessing participants, the videos are also used to monitor the SPs themselves. Coders evaluate how faithfully each SP adhered to the scenario script and feedback procedures. This quality control step is vital—over time, even well-trained SPs might unintentionally drift from the intended portrayal or feedback style. To prevent this, SPs receive written feedback on their performance, helping them stay aligned with the training standards. It’s a feedback loop for the feedback providers, ensuring consistency across all interactions.\n\nAfter the SP test case—typically around the 6-month follow-up—participants complete a final survey. This survey captures several important outcomes: their retained knowledge and self-efficacy, their retrospective self-report of whether they’ve transferred the training to real practice, their intentions to use these skills in the future, their actual self-reported use of suicide prevention techniques since the training, and their overall satisfaction with different aspects of the program. This long-term follow-up helps answer the critical question: Did this training make a lasting difference in how clinicians approach suicide prevention?\n\n### Measures\n\n#### Self-report measures\n\n**Demographics**  \nAll participants complete a survey collecting basic individual characteristics and demographic information. This includes their training program (e.g., residency or nurse practitioner), gender, age, prior suicide prevention training, previous experience with SP encounters, and any professional or personal history with suicide. Why collect this? First, researchers need to know if the people who choose to join the study differ in meaningful ways from those who don’t—this helps assess potential selection bias. Second, these variables might influence how participants respond to training, so they’re included in analyses to better understand the results. For example, someone with prior suicide training might show less improvement simply because they started at a higher level.\n\n**Knowledge of suicide and suicide prevention**  \nParticipants take a 17-item multiple-choice assessment before and after viewing the online teaching videos, and again at the 6-month follow-up. This test measures their understanding of key concepts in suicide risk assessment and management—exactly the content covered in the training. One sample question might be: “Which of the following best describes risk for suicide?” The goal is to see not just whether people *remember* facts, but whether they’ve internalized core principles that guide clinical decision-making.\n\nThis knowledge measure isn’t new—it’s been used in previous evaluations of the CTL (Columbia Training in Leadership) curriculum and has strong psychometric properties. That means it’s both reliable (Cronbach’s α = .81–.87, indicating good internal consistency—the items hang together well) and sensitive to change (Cohen’s d = .90–1.35, a large effect size showing it can detect real learning). For this study, some modifications will be made to better align the questions with the updated training content, ensuring the test remains accurate and relevant.\n\n**Suicide prevention self-efficacy**  \nSelf-efficacy is a powerful psychological concept—it’s not about what you *can* do, but what you *believe* you can do. Participants complete a 20-item scale at pre-training, post-training, and 6-month follow-up to measure their confidence in performing suicide prevention tasks. The scale uses an 8-point Likert format, ranging from “strongly disagree” to “strongly agree,” allowing for nuanced responses.\n\nSample items include: “I feel confident that I can ask directly about suicide,” and “I feel confident in my knowledge about the key elements of a safety plan.” These aren’t abstract statements—they reflect real clinical behaviors that can save lives. The original CTL self-efficacy measure has demonstrated excellent reliability (Cronbach’s α = .95–.96) and strong sensitivity to change over time (Cohen’s d = 1.05–1.15), meaning it effectively captures growth in confidence as a result of training. For this study, the measure will be adapted slightly to ensure it fits the current program’s goals and content.\n\n**Transfer of training**  \nFinally, researchers want to know: Will participants actually *use* what they’ve learned in real clinical settings? To assess this, they use an 8-item measure adapted from three subscales of the *Learning Transfer System Inventory* [28]: transfer design, perceived content validity, and opportunity to use."}},"metadata":{"paper_id":"002fbf9b8eb99dc4c81451e839845c63","csv_row":36961,"doi":"10.1186/s12909-019-1482-5","openalex_id":"https://openalex.org/W2936605467","pdf_url":"https://bmcmededuc.biomedcentral.com/track/pdf/10.1186/s12909-019-1482-5","page_count":9,"text_chars":51035,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2410,"total_tokens":3329,"completion_tokens":919,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2271,"total_tokens":4991,"completion_tokens":2720,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":4.4208984375,"l5_seconds":18.797653913497925}},{"idx":3,"domain":"Academic paper","source":"CSV row 36162 · 2018 · 10.1371/journal.pone.0204032","title":"Severity and properties of cardiac damage caused by Streptococcus pneumoniae are strain dependent","seg":"alternating between detectable and undetectable counts in successive time points. Finally,\nCDC7F:2617–97 was initially capable of mid-grade bacteremia but was cleared from the\nbloodstream by 16 hours post-infection. Note, that our threshold for detection in this instance\nwas 10\n3\nCFU/mL of blood. Critically, the number of pneumococci present in the blood of mice\nat 30 hours post-infection was strongly and positively correlated (R\n2\n= 0.852; P < 0.0001) with\nthe number of pneumococci recovered from perfused and homogenized heart samples from\nthe same animals (Fig 1B). In turn, there was a weaker but still positive correlation between\nlevels of bacteria in the heart and serum levels of troponin-I (Fig 1C). Thus, the ability of S.\npneumoniae to invade the heart and trigger the release of troponin seemed to be dependent\nupon the number of bacteria in the bloodstream. To validate this, hearts from infected mice\nFig 1. High-grade bacteremia is prerequisite to myocar dial invasion and myocar dial damage. A) Bacterial burden of different strains of pneum ococci circulating in\nthe blood at designate d time points following i.p. challeng e of mice (n = 6 mice per strain). Points represent the average titer for the mice infected with each strain.\nDashed line indicates limit of detection. B) Linear Regression analysis of pneumococc al burden recovered from the heart versus the pneumococca l burden in the blood\nof the same mice (n = 6 mice per strain). C) Linear Regression analysis of detectab le troponin-I (cTn-I) in the blood of infected mice correlated versus pneumoc occal\nburden recovered from the heart of the same mice (n = 3 mice per strain). Note, the limit of detection for the cTn-I ELISA is 0.156 ng/mL. Data are represente d as\nmean ± SEM.\nhttps://do i.org/10.1371/j ournal.pone.0204032.g00 1\nProperties of cardiac damage caused by Strept ococcus pneumon iae differ by strain\nPLOS ONE | https://doi.or g/10.137 1/journal.po ne.02040 32 September 14, 2018 6 / 15\n\nwere sectioned and invaded pneumococci visualized by immunofluorescence against capsule\n(S1 Fig). Only mice with high-levels of bacteremia showed bacteria in the heart.\nWe sought to assess if increased bacteremia alone would enhance the capacity of\nCDC7F:2617–97 to cause cardiac damage. Mice infected with a 100-fold higher dose (10\n5\nCFU) of CDC7F:2617–97 also developed bacteremia, however it was not more severe than\nmice that had been challenged with 10\n3\nCFU (P = 0.2251). The average blood titer at euthana-\nsia was 2.48x10\n3\nCFU/mL (S2 Fig). Whereas only two of six (33.3%) mice challenged with\nCDC7F:2617–97 at 10\n3\nCFU had bacteria in the heart at time of euthanasia, three of five (60%)\nmice challenged with 10\n5\nCFU had detectable bacteria in the heart. Thus, there was a modest\nincrease in cardiac involvement. However, the difference in bacterial burden in heart was not\nsignificant (P = 0.8701). Pre-treatment of mice with antibody against Ly6G, which depletes\nneutrophils, and to lesser extent monocytes and macrophages [35], did not enhance disease\nseverity for CDC7F:2617–97 when mice were challenged with 10\n3\nCFU (P = 0.8485). In this\ninstance only one of five mice had pneumococci detectable in the blood 26 hours post infection\n(2.1x10\n4\nCFU/mL) and none had detectable levels of troponin-I. Note that none of the strains\ntested showed susceptibility to complement-mediated killing in vitro after incubation in whole\nunfixed human serum for two hours (S3 Fig), suggesting CDC7F:2617–97 was attenuated in\nsome other manner.\nMyocardial damage varies in a strain specific manner\nWe next examined H&E and Trichrome stained cardiac sections from D39, WU2, TIGR4, and\n6A-10 infected mice for histopathologica l changes such as presence of bacteria within cardiac\ntissue, hydropic degeneration of myocytes, and myoc","models":{"dsv4-flash":{"l5":"alternating between detectable and undetectable counts in successive time points. Finally,  \nCDC7F:2617–97 was initially capable of mid-grade bacteremia but was cleared from the  \nbloodstream by 16 hours post-infection.  \n\nBefore we go further, let’s pause to make sure we’re on the same page about what “cleared from the bloodstream” means. In this experiment, the researchers were measuring the number of live pneumococci (the bacteria that cause pneumonia and other infections) circulating in the blood of mice at various time points after infection. The “limit of detection” here was **10³ CFU/mL of blood**—that is, if there were fewer than 1,000 bacterial colonies per milliliter of blood, the assay couldn’t reliably detect them. So when we say a strain was “cleared,” we mean that the bacterial count dropped below this threshold, not necessarily that every single bacterium was eliminated. It’s a practical, measurable definition of clearance.  \n\nNow, here’s the key insight that ties all these observations together: **the number of pneumococci in the blood at 30 hours post-infection was strongly and positively correlated with the number of pneumococci recovered from the heart** of the same mice (R² = 0.852; P < 0.0001). Let’s unpack that.  \n\n- **R² = 0.852** means that 85.2% of the variation in heart bacterial counts can be explained by the variation in blood bacterial counts. In plain terms, if you know how many bacteria are in the blood, you can predict with high confidence how many will be in the heart.  \n- **P < 0.0001** means the probability that this correlation happened by random chance is less than 1 in 10,000. This is a very strong statistical signal.  \n\nSo, what does this tell us? It suggests that the bacteria don’t just magically appear in the heart—they need to be present in the bloodstream in large numbers first. The bloodstream is like a highway, and the heart is a destination. If the highway is empty, few cars (bacteria) reach the destination.  \n\nBut the story doesn’t stop there. There was also a **weaker but still positive correlation** between the number of bacteria in the heart and the serum levels of **troponin-I** (Fig 1C). Troponin-I is a protein that is normally found inside heart muscle cells. When heart muscle cells are damaged or die, they release troponin into the blood. So measuring troponin-I in the blood is like listening for a distress signal from the heart. The more bacteria in the heart, the more damage, and the louder the distress signal.  \n\nThus, the ability of *S. pneumoniae* to invade the heart and trigger the release of troponin seemed to be **dependent upon the number of bacteria in the bloodstream**. This is a classic “dose-response” relationship: more bacteria in the blood → more bacteria in the heart → more heart damage.  \n\nTo validate this, hearts from infected mice were sectioned and invaded pneumococci were visualized by immunofluorescence against capsule (S1 Fig). Only mice with high-levels of bacteremia showed bacteria in the heart. This is a direct visual confirmation of the statistical correlation: if you look at the heart tissue, you only see bacteria in the mice that had high blood counts.  \n\n---\n\nNow, the researchers asked a natural follow-up question: **If we artificially increase the bacteremia, will we see more cardiac damage?** This is a classic experimental strategy—take a variable you think is important (blood bacterial load) and manipulate it directly to see if it causes the predicted effect.  \n\nThey chose the strain **CDC7F:2617–97**, which had shown only mid-grade bacteremia and was cleared by 16 hours. They infected mice with a **100-fold higher dose** (10⁵ CFU instead of 10³ CFU). The logic: if the strain’s low cardiac invasion was simply due to low blood counts, then giving a higher dose should produce higher blood counts, and thus more heart damage.  \n\nBut here’s the surprise: **the bacteremia was not more severe**. The average blood titer at euthanasia was 2.48 × 10³ CFU/mL, which is essentially the same as the lower-dose group (P = 0.2251). This is a crucial negative result. It tells us that simply giving more bacteria doesn’t necessarily lead to higher blood counts—the host’s immune system, or the bacteria’s own growth characteristics, may limit the peak bacteremia.  \n\nWhat about cardiac involvement?  \n- With the low dose (10³ CFU), only **2 of 6 mice (33.3%)** had bacteria in the heart.  \n- With the high dose (10⁵ CFU), **3 of 5 mice (60%)** had detectable bacteria in the heart.  \n\nSo there was a **modest increase** in the proportion of mice with cardiac involvement. However, when they compared the actual bacterial burden in the heart between the two groups, the difference was **not statistically significant** (P = 0.8701). This means that while more mice had bacteria in the heart, the amount of bacteria in those hearts was not higher.  \n\nThis is a subtle but important distinction. It’s like saying: “More people visited the store, but they didn’t buy more items.” The invasion of the heart is not simply a linear function of the dose.  \n\nNext, they tried another approach to boost disease severity: **depleting neutrophils**. Neutrophils are a type of white blood cell that are often the first responders to bacterial infections. They are like the emergency medical team that rushes to the site of an injury. The researchers used an antibody against **Ly6G**, a protein on the surface of neutrophils, to remove them from the mice. This also depletes, to a lesser extent, monocytes and macrophages (other immune cells).  \n\nThe idea was: if the immune system is holding CDC7F:2617–97 in check, removing the neutrophils should allow the bacteria to flourish and cause more damage. But again, the result was negative: there was no enhancement of disease severity (P = 0.8485). In fact, only **1 of 5 mice** had pneumococci detectable in the blood at 26 hours post-infection (2.1 × 10⁴ CFU/mL), and **none** had detectable levels of troponin-I.  \n\nSo even without neutrophils, this strain still didn’t cause significant heart damage. This suggests that CDC7F:2617–97 is attenuated in some other way—it’s not just being held back by the immune system.  \n\nTo rule out one possible mechanism, they tested whether the strains were susceptible to **complement-mediated killing**. Complement is a set of proteins in the blood that can punch holes in bacteria and mark them for destruction. If CDC7F:2617–97 were highly susceptible to complement, that would explain why it’s cleared so quickly. But the results (S3 Fig) showed that **none of the strains tested were susceptible** to complement-mediated killing after incubation in whole unfixed human serum for two hours. This means the attenuation of CDC7F:2617–97 is due to something else—perhaps a metabolic deficiency, a lack of certain surface proteins, or an inability to survive in the heart tissue itself.  \n\n---\n\n### Myocardial damage varies in a strain specific manner  \n\nWe next examined H&E and Trichrome stained cardiac sections from D39, WU2, TIGR4, and 6A-10 infected mice for histopathological changes such as presence of bacteria within cardiac tissue, hydropic degeneration of myocytes, and myoc"},"qwen3-235b-a22b":{"l5":"alternating between detectable and undetectable counts in successive time points. Finally,  \nCDC7F:2617–97 was initially capable of mid-grade bacteremia but was cleared from the  \nbloodstream by 16 hours post-infection. Note that our threshold for detection in this instance  \nwas 10³ CFU/mL of blood—meaning any bacterial concentration below this level would register as “undetectable” in our assays. This cutoff is important because it defines the sensitivity of our measurements; just because bacteria aren’t detected doesn’t necessarily mean they’re completely absent, only that their numbers are too low for our tools to reliably pick up.\n\nCritically, the number of *S. pneumoniae* (pneumococci) present in the blood of mice at 30 hours post-infection showed a strong, positive correlation (R² = 0.852; *P* < 0.0001) with the number recovered from perfused and homogenized heart tissue from the same animals (Fig 1B). Let’s unpack what this means. The R² value—called the coefficient of determination—tells us how well the variation in one variable (here, heart bacterial load) can be explained by variation in another (blood bacterial load). An R² of 0.852 is quite high, suggesting that about 85% of the differences in heart infection levels across mice can be directly linked to how many bacteria were circulating in their blood. The extremely low *P*-value (*P* < 0.0001) indicates this relationship is highly unlikely to be due to random chance—it’s a real, statistically significant trend.\n\nIn turn, there was a weaker but still positive correlation between the levels of bacteria found in the heart and the serum levels of troponin-I (Fig 1C). Troponin-I is a protein normally found inside heart muscle cells (cardiomyocytes); when these cells are damaged, troponin leaks into the bloodstream. Clinically, elevated troponin-I is a key biomarker used to diagnose heart injury, such as during a heart attack. So, detecting higher troponin-I in infected mice suggests that the presence of bacteria in the heart is causing actual structural damage to cardiac tissue.\n\nThus, the ability of *S. pneumoniae* to invade the heart and trigger the release of troponin appears to depend on the number of bacteria in the bloodstream. In other words, more bacteria in the blood → greater chance of heart invasion → more heart cell damage → higher troponin-I levels. This paints a clear picture of a dose-dependent process: the severity of cardiac involvement escalates with the intensity of bacteremia.\n\nTo validate this idea, hearts from infected mice were sectioned and examined using immunofluorescence staining targeting the bacterial capsule—a sugar-coated outer layer unique to *S. pneumoniae*. This technique allows us to literally *see* where the bacteria are located within the heart tissue. Importantly, only mice that had high levels of bacteremia (i.e., lots of bacteria in the blood) showed visible pneumococci in their heart tissue. Mice with low or undetectable bacteremia had no bacteria in the heart. This visual confirmation strengthens the statistical findings: bloodstream infection must reach a certain threshold before the bacteria can breach the heart.\n\nWe then asked: Could simply increasing the initial infectious dose allow the otherwise weakly invasive strain CDC7F:2617–97 to cause more severe cardiac damage? To test this, we infected mice with a 100-fold higher dose—10⁵ CFU instead of 10³ CFU—and monitored bacteremia. Surprisingly, even with this much larger starting inoculum, the resulting bloodstream infection was not significantly more severe (*P* = 0.2251). The average blood titer at euthanasia was only 2.48 × 10³ CFU/mL (S2 Fig), which is still relatively low. This suggests that CDC7F:2617–97 may have intrinsic limitations—perhaps due to immune recognition or poor survival in blood—that prevent it from establishing high-grade bacteremia regardless of initial dose.\n\nHowever, when we looked at heart invasion, we did observe a modest increase: whereas only 2 out of 6 mice (33.3%) infected with the lower dose (10³ CFU) had detectable bacteria in the heart, 3 out of 5 mice (60%) infected with the higher dose (10⁵ CFU) showed cardiac bacterial presence. So, while more bacteria reached the heart with a higher starting dose, the difference in bacterial burden within the heart tissue itself was not statistically significant (*P* = 0.8701). This hints that increasing the inoculum gives the bacteria a slightly better chance to invade the heart, but it doesn’t guarantee widespread or severe colonization.\n\nNext, we explored whether the host immune response—specifically neutrophils, which are frontline defenders against bacterial infections—might be limiting CDC7F:2617–97’s ability to cause disease. We pre-treated mice with an antibody against Ly6G, a surface marker on neutrophils, which effectively depletes these cells (and to a lesser extent, monocytes and macrophages [35]). If neutrophils were successfully controlling the infection, removing them should make the disease worse. But in mice challenged with 10³ CFU of CDC7F:2617–97, this depletion did *not* enhance disease severity (*P* = 0.8485). In fact, only 1 out of 5 mice had detectable bacteria in the blood at 26 hours post-infection (at a level of 2.1 × 10⁴ CFU/mL), and none showed elevated troponin-I. This suggests that even without neutrophils, this strain struggles to sustain bacteremia or cause heart damage—further evidence that its attenuation isn’t just due to immune clearance.\n\nNotably, none of the strains tested—including CDC7F:2617–97—showed susceptibility to complement-mediated killing in vitro after incubation in whole unfixed human serum for two hours (S3 Fig). The complement system is a major arm of innate immunity that can directly punch holes in bacterial membranes. Resistance to complement is typically a hallmark of invasive, virulent pneumococcal strains. The fact that CDC7F:2617–97 survives this assault implies its attenuation must stem from some other defect—perhaps in metabolic fitness, stress resistance, or the ability to adhere to or invade host tissues—rather than vulnerability to immune destruction.\n\nMyocardial damage varies in a strain-specific manner  \nWe next examined H&E and Trichrome stained cardiac sections from D39, WU2, TIGR4, and  \n6A-10 infected mice for histopathological changes such as presence of bacteria within cardiac  \ntissue, hydropic degeneration of myocytes, and myoc"}},"metadata":{"paper_id":"002ed13a5a8096e68c20a9b979464b81","csv_row":36162,"doi":"10.1371/journal.pone.0204032","openalex_id":"https://openalex.org/W2892170356","pdf_url":"https://journals.plos.org/plosone/article/file?id=10.1371/journal.pone.0204032&type=printable","page_count":15,"text_chars":49469,"segment_tokens":1024,"l4_usage":{"prompt_tokens":2370,"total_tokens":3256,"completion_tokens":886,"prompt_tokens_details":null,"reasoning_tokens":0},"l5_usage":{"prompt_tokens":2231,"total_tokens":3859,"completion_tokens":1628,"prompt_tokens_details":null,"reasoning_tokens":0},"l4_seconds":4.224454402923584,"l5_seconds":10.189196825027466}},{"idx":4,"domain":"Academic paper","source":"CSV row 86882 · 2019 · 10.3389/fgene.2019.00544","title":"Germline BRCA1 Mutation Detected in a Multiple Endocrine Neoplasia Type 2 Case With RET Codon 634 Mutation","seg":"Sarkadi et al. Coincidence of a BRCA1 and RET Mutations\nFrontiers in Genetics | www.frontiersin.org 3 June 2019 | Volume 10 | Article 544\nmetanephrines in the 24  hour urine revealed no sign of \ncatecholamine or metanephrine secreting tumor. Serum intact \nparathormone was within the normal range, and no sign of \nparathyroid malfunction was detected. During the last 6-year \nfollow-up, the proband is still fr
